<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>주간 시간표</title>
<style>
/* Pretendard Variable — 저장소에 포함된 파일 우선, 실패 시 CDN */
@font-face {
  font-family: "Pretendard Variable";
  font-weight: 45 920;
  font-style: normal;
  font-display: swap;
  src: local("Pretendard Variable"),
       url("fonts/PretendardVariable.woff2") format("woff2-variations"),
       url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/woff2/PretendardVariable.woff2") format("woff2-variations");
}

/* 색은 의미가 있을 때만 쓴다 — 파랑: 오늘·진행 중 / 주황: 공휴일 전 조정 시간 / 빨강: 공휴일 */
:root {
  --bg: #f5f5f7;
  --surface: #ffffff;
  --tile: #f2f2f7;
  --tile-hover: #e8e8ed;
  --text: #1d1d1f;
  --text-2: #6e6e73;
  --text-3: #86868b;
  --line: rgba(60, 60, 67, .11);
  --accent: #0071e3;
  --accent-soft: rgba(0, 113, 227, .1);
  --accent-tint: rgba(0, 113, 227, .05);
  --orange: #ff9500;
  --warn: #c2410c;
  --warn-soft: rgba(255, 149, 0, .16);
  --warn-tint: rgba(255, 149, 0, .07);
  --warn-tile: #ffefd9;
  --warn-tile-hover: #ffe5c2;
  --red: #ff3b30;
  --holi: #d70015;
  --holi-soft: rgba(255, 59, 48, .12);
  --holi-tint: rgba(255, 59, 48, .045);
  --glass: rgba(245, 245, 247, .76);
  --platter-shadow: 0 0 0 .5px rgba(0, 0, 0, .05), 0 2px 6px rgba(0, 0, 0, .03), 0 24px 60px rgba(0, 0, 0, .06);
  --sheet-shadow: 0 0 0 .5px rgba(0, 0, 0, .06), 0 30px 80px rgba(0, 0, 0, .22);
  --ease: cubic-bezier(.2, .8, .2, 1);           /* 임계 감쇠 — 기본 */
  --ease-spring: cubic-bezier(.3, 1.25, .45, 1);  /* 관성이 실린 동작에만 살짝 오버슛 */
  --axis: 108px;
  --rail: 56px;
  --row: 80px;
  --gap: 6px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --surface: #1c1c1e;
    --tile: #2c2c2e;
    --tile-hover: #3a3a3c;
    --text: #f5f5f7;
    --text-2: #aeaeb2;
    --text-3: #8e8e93;
    --line: rgba(235, 235, 245, .12);
    --accent: #2997ff;
    --accent-soft: rgba(41, 151, 255, .18);
    --accent-tint: rgba(41, 151, 255, .08);
    --orange: #ff9f0a;
    --warn: #ffb340;
    --warn-soft: rgba(255, 159, 10, .2);
    --warn-tint: rgba(255, 159, 10, .08);
    --warn-tile: #3b2a14;
    --warn-tile-hover: #4a341a;
    --red: #ff453a;
    --holi: #ff6961;
    --holi-soft: rgba(255, 69, 58, .2);
    --holi-tint: rgba(255, 69, 58, .07);
    --glass: rgba(22, 22, 24, .76);
    --platter-shadow: 0 0 0 .5px rgba(255, 255, 255, .08);
    --sheet-shadow: 0 0 0 .5px rgba(255, 255, 255, .1), 0 30px 80px rgba(0, 0, 0, .6);
  }
}

* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  letter-spacing: -.011em;
  word-break: keep-all; /* 한글은 어절 단위로 줄바꿈 */
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  min-height: 100vh;
  padding-bottom: env(safe-area-inset-bottom);
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ───────── 상단 바: 큰 제목이 사라지면 나타난다 ───────── */
.nav {
  position: fixed; inset: 0 0 auto 0; z-index: 30;
  height: calc(52px + env(safe-area-inset-top)); padding-top: env(safe-area-inset-top);
  display: flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 16px; font-weight: 650; letter-spacing: -.02em;
  background: var(--glass);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  backdrop-filter: blur(24px) saturate(180%);
  box-shadow: 0 .5px 0 var(--line);
  opacity: 0; transform: translateY(-6px); pointer-events: none;
  transition: opacity .3s var(--ease), transform .3s var(--ease);
}
.nav.on { opacity: 1; transform: none; }
.nav small { font-size: 13px; font-weight: 500; color: var(--text-2); }

/* ───────── 페이지 · 머리말 ───────── */
.page { max-width: 1180px; margin: 0 auto; padding: 0 24px 72px; }
.hero {
  padding: 64px 4px 28px;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap;
}
.eyebrow { font-size: 17px; font-weight: 600; color: var(--text-2); letter-spacing: -.015em; }
.hero h1 {
  margin-top: 2px;
  font-size: clamp(2.25rem, 5vw, 3.25rem);
  line-height: 1.06;
  font-weight: 700;
  letter-spacing: -.035em;
}
.notice { margin-top: 14px; display: grid; gap: 4px; }
.notice:empty { display: none; }
.nl { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--text-2); }
.nl i { flex: none; width: 8px; height: 8px; border-radius: 50%; }
.nl i.o { background: var(--orange); }
.nl i.r { background: var(--red); }
.nl b { font-weight: 650; color: var(--warn); }
.nl b.r { color: var(--holi); }
.pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 16px 9px 14px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent);
  font-size: 15px; font-weight: 600; letter-spacing: -.01em;
  transition: transform .12s ease-out, opacity .12s ease-out;
}
.pill:active { transform: scale(.95); opacity: .7; }

/* ───────── 주간 표 ───────── */
.board {
  display: grid;
  grid-template-rows: auto repeat(7, var(--row));
  gap: var(--gap);
  padding: 8px 10px 10px;
  background: var(--surface);
  border-radius: 28px;
  box-shadow: var(--platter-shadow);
}
.colbg { grid-row: 1 / -1; border-radius: 18px; }
.colbg.today { background: var(--accent-tint); }
.colbg.eve { background: var(--warn-tint); }
.colbg.holi { background: var(--holi-tint); }
.rowline {
  grid-column: 1 / -1; align-self: end; height: 1px;
  background: var(--line);
  transform: translateY(calc(var(--gap) / 2 + .5px));
  pointer-events: none;
}

/* 요일 머리 */
.ah { position: relative; grid-row: 1; grid-column: 1; align-self: end; padding: 0 0 13px 14px; font-size: 12px; font-weight: 600; color: var(--text-3); }
.dh { position: relative; grid-row: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; padding: 12px 4px 12px; }
.dh .wd { font-size: 13px; font-weight: 600; color: var(--text-2); line-height: 1.3; }
.dh .dn {
  margin-top: 3px; min-width: 36px; height: 36px; padding: 0 7px; border-radius: 18px;
  display: grid; place-items: center;
  font-size: 22px; font-weight: 650; letter-spacing: -.02em; line-height: 1;
}
.dh.today .wd { color: var(--accent); }
.dh.today .dn { background: var(--accent); color: #fff; }
.dh.eve .wd { color: var(--warn); }
.dh.holi .wd, .dh.holi .dn { color: var(--holi); }
.dh.holi.today .dn { background: var(--holi); color: #fff; }
.cap {
  margin-top: 8px; padding: 4px 10px; border-radius: 999px;
  font-size: 12.5px; font-weight: 700; letter-spacing: -.005em; white-space: nowrap;
}
.cap.eve { background: var(--warn-soft); color: var(--warn); }
.cap.holi { background: var(--holi-soft); color: var(--holi); }

/* 왼쪽 축: 교시 + 시간 */
.ax {
  position: relative; grid-column: 1;
  display: flex; flex-direction: column; justify-content: center;
  padding: 0 8px 0 14px; border-radius: 12px;
  transition: background-color .2s ease;
}
.ax b { font-size: 15px; font-weight: 650; letter-spacing: -.02em; line-height: 1.3; transition: color .2s ease; }
.ax span { font-size: 12.5px; font-weight: 500; color: var(--text-2); line-height: 1.4; white-space: nowrap; }
.ax.eve span { color: var(--warn); font-weight: 600; }
.ax.hl { background: var(--accent-tint); }
.ax.hl b { color: var(--accent); }

/* 공휴일 전날 전용 시간 축 — 그날 바로 옆, 같은 줄에 실제 시간 */
.rl {
  position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  border-radius: 12px; color: var(--warn); line-height: 1.3;
  transition: background-color .2s ease;
}
.rl b { font-size: 13px; font-weight: 700; }
.rl span { font-size: 11.5px; font-weight: 500; opacity: .75; }
.rl.hl { background: var(--warn-soft); }

/* 수업 칸: 과목 / 교수님 / 강의실 */
.tile {
  position: relative; min-width: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  padding: 8px 10px; text-align: center;
  border-radius: 16px;
  background: var(--tile);
  transition: transform .16s var(--ease), background-color .2s ease, box-shadow .2s ease;
  touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
}
@supports (corner-shape: squircle) {
  .tile, .board, .mgrid, .card, .colbg { corner-shape: squircle; }
  .tile { border-radius: 24px; } .colbg { border-radius: 26px; }
  .board, .mgrid { border-radius: 40px; } .card { border-radius: 44px; }
}
.tile.eve { background: var(--warn-tile); }
.tile.free { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.tt {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 19px; font-weight: 650; letter-spacing: -.025em; line-height: 1.25; word-break: keep-all;
}
.free .tt { font-size: 16px; font-weight: 600; color: var(--text-2); }
.tp { font-size: 13px; color: var(--text-2); line-height: 1.35; word-break: keep-all; }
.tr { margin-top: 4px; display: inline-flex; align-items: center; gap: 3px; font-size: 12.5px; font-weight: 600; color: var(--text-2); }
.tr svg { flex: none; }
.tile:active { transform: scale(.97); transition-duration: .08s; }
@media (hover: hover) {
  .tile:hover { background: var(--tile-hover); }
  .tile.eve:hover { background: var(--warn-tile-hover); }
  .tile.free:hover { background: var(--tile); }
}
.tile.live { box-shadow: 0 0 0 2px var(--accent); }
.tile.live .tt::before {
  content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
  animation: pulse 1.6s ease-in-out infinite;
}
.holi-msg { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; }
.holi-msg b { font-size: 17px; font-weight: 650; color: var(--holi); }
.holi-msg span { font-size: 13px; color: var(--text-2); }

.board.enter .tile, .board.enter .holi-msg { animation: tileIn .55s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 45ms + 60ms); }
@keyframes tileIn { from { opacity: 0; transform: scale(.96); } }
@keyframes pulse { 50% { opacity: .3; } }

/* ───────── 모바일: 하루씩, 같은 구조 ───────── */
.mobile { display: none; }
.seg {
  position: sticky; top: calc(60px + env(safe-area-inset-top)); z-index: 12;
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 4px; border-radius: 22px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  backdrop-filter: blur(24px) saturate(180%);
  box-shadow: 0 0 0 .5px var(--line), 0 8px 24px rgba(0, 0, 0, .06);
}
.seg .thumb {
  position: absolute; top: 4px; bottom: 4px; left: 4px;
  width: calc((100% - 8px) / 5); border-radius: 18px;
  background: var(--surface);
  box-shadow: 0 0 0 .5px rgba(0, 0, 0, .06), 0 2px 8px rgba(0, 0, 0, .12);
  transform: translateX(calc(var(--idx, 0) * 100%));
  transition: transform .5s var(--ease-spring);
}
.seg button {
  position: relative; z-index: 1; padding: 8px 0 6px;
  display: flex; flex-direction: column; align-items: center; line-height: 1.15;
  transition: transform .12s ease-out;
}
.seg button:active { transform: scale(.93); }
.seg .d { font-size: 12.5px; font-weight: 600; color: var(--text-2); }
.seg .m { margin-top: 2px; font-size: 21px; font-weight: 650; letter-spacing: -.03em; }
.seg .dots { height: 5px; margin-top: 4px; display: flex; gap: 3px; }
.seg .dots i { width: 5px; height: 5px; border-radius: 50%; }
.seg .dots .t { background: var(--accent); }
.seg .dots .e { background: var(--orange); }
.seg .dots .h { background: var(--red); }
.seg button.today .d { color: var(--accent); }
.seg button.holi .d, .seg button.holi .m { color: var(--holi); }

#mday.slide { animation: slide .45s var(--ease) both; }
@keyframes slide { from { opacity: 0; transform: translateX(calc(var(--dir, 1) * 22px)); } }
.mbanner {
  margin-top: 14px; padding: 14px 18px; border-radius: 20px;
  background: var(--warn-soft); color: var(--warn);
  display: flex; flex-direction: column; gap: 1px;
}
.mbanner span { font-size: 13px; font-weight: 600; }
.mbanner b { font-size: 22px; font-weight: 700; letter-spacing: -.03em; }
.mgrid {
  margin-top: 14px;
  display: grid; grid-template-columns: 96px minmax(0, 1fr); grid-template-rows: repeat(7, 74px);
  gap: var(--gap); padding: 10px;
  background: var(--surface); border-radius: 26px; box-shadow: var(--platter-shadow);
}
.mempty {
  margin-top: 14px; padding: 56px 20px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
  background: var(--surface); border-radius: 26px; box-shadow: var(--platter-shadow);
}
.mempty b { font-size: 22px; font-weight: 700; color: var(--holi); letter-spacing: -.02em; }
.mempty span { font-size: 15px; color: var(--text-2); }

/* ───────── 시트 (상세 · 공휴일 지정) ───────── */
dialog.sheet {
  border: 0; padding: 0; background: transparent; color: var(--text);
  width: min(420px, calc(100% - 24px)); max-width: none; margin: auto; overflow: visible;
}
dialog.sheet::backdrop { background: rgba(0, 0, 0, .3); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
dialog.sheet[open] { animation: sheetIn .45s var(--ease) both; }
dialog.sheet[open]::backdrop { animation: fade .3s ease both; }
@keyframes sheetIn { from { opacity: 0; transform: translateY(28px) scale(.98); } }
@keyframes fade { from { opacity: 0; } }
.card { background: var(--surface); border-radius: 30px; box-shadow: var(--sheet-shadow); overflow: hidden; }
.grab { display: none; width: 36px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 0; }
.card .top { padding: 24px 26px 4px; }
.card .cap2 { font-size: 14px; font-weight: 600; color: var(--text-2); }
.card .cap2 em { font-style: normal; color: var(--warn); }
.card h2 { margin-top: 4px; font-size: 30px; font-weight: 700; letter-spacing: -.035em; line-height: 1.12; word-break: keep-all; }
.card .lead { margin-top: 8px; font-size: 15px; color: var(--text-2); line-height: 1.5; }
.card .lead b { color: var(--warn); font-weight: 650; }
.card dl { margin: 14px 26px 0; padding: 2px 16px; background: var(--tile); border-radius: 16px; }
.card .r { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 12px 0; font-size: 15px; }
.card .r + .r { border-top: .5px solid var(--line); }
.card dt { color: var(--text-2); flex: none; }
.card dd { font-weight: 600; text-align: right; }
.card dd.warn { color: var(--warn); }
.card dd.pl { font-weight: 500; line-height: 1.7; }
.card dd.pl b { font-weight: 600; color: var(--text-3); margin-right: 10px; }
.close {
  display: block; width: calc(100% - 52px); margin: 18px 26px 26px; padding: 14px;
  border-radius: 14px; text-align: center;
  background: var(--accent); color: #fff; font-size: 16px; font-weight: 650;
  transition: transform .1s ease-out, opacity .1s ease-out;
}
.close:active { transform: scale(.97); opacity: .85; }

.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 14px 18px 2px; }
.wday { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 0 6px; }
.wday .w { font-size: 12.5px; font-weight: 600; color: var(--text-3); transition: color .2s ease; }
.wday .n {
  width: 40px; height: 40px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 18px; font-weight: 600;
  transition: background-color .25s var(--ease), color .25s var(--ease), transform .35s var(--ease-spring);
}
.wday:active .n { transform: scale(.86); transition-duration: .1s; }
.wday.on .n { background: var(--red); color: #fff; }
.wday.on .w { color: var(--holi); }
.derived { margin: 12px 26px 0; padding: 2px 16px; border-radius: 16px; background: var(--tile); }
.drow { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; font-size: 15px; }
.drow + .drow { border-top: .5px solid var(--line); }
.drow .dl { font-weight: 600; }
.drow .dv { font-weight: 600; }
.drow .dv.eve { color: var(--warn); }
.drow .dv.holi { color: var(--holi); }
.dnone { padding: 12px 0; font-size: 14px; color: var(--text-2); }

/* ───────── 반응형 ───────── */
@media (max-width: 1080px) {
  :root { --axis: 96px; --rail: 50px; }
  .ax { padding-left: 10px; }
  .ax span { font-size: 11.5px; }
  .tt { font-size: 17px; }
  .tp { font-size: 12px; }
  .cap { font-size: 12px; padding: 3px 8px; }
}
@media (max-width: 820px) {
  .page { padding: 0 16px 56px; }
  .hero { padding: 40px 2px 18px; }
  .desktop { display: none; }
  .mobile { display: block; }
  .tt { font-size: 19px; }
  .tp { font-size: 13px; }
  .ax span { font-size: 12.5px; }
  dialog.sheet { margin: auto auto 10px; }
  .card { touch-action: none; }
  .grab { display: block; }
}

/* ───────── 접근성 · 인쇄 ───────── */
@media (prefers-reduced-motion: reduce) {
  .board.enter .tile, .board.enter .holi-msg, #mday.slide, dialog.sheet[open], dialog.sheet[open]::backdrop { animation: none; }
  .seg .thumb, .wday .n { transition: none; }
  .tile.live .tt::before { animation: none; }
}
@media (prefers-reduced-transparency: reduce) {
  .nav, .seg { background: var(--surface); -webkit-backdrop-filter: none; backdrop-filter: none; }
}
@media (prefers-contrast: more) {
  .tile { box-shadow: inset 0 0 0 1.5px currentColor; }
  :root { --line: rgba(60, 60, 67, .35); }
}
@media print {
  body { background: #fff; }
  .nav, .pill, .mobile { display: none !important; }
  .desktop { display: block !important; }
  .page { max-width: none; padding: 0; }
  .hero { padding-top: 0; }
  .board { box-shadow: 0 0 0 1px #d2d2d7; }
}
</style>
</head>
<body>
<div class="nav" id="nav" aria-hidden="true">주간 시간표<small id="navRange"></small></div>

<main class="page">
  <header class="hero">
    <div>
      <p class="eyebrow" id="weekLabel"></p>
      <h1>주간 시간표</h1>
      <div class="notice" id="notice"></div>
    </div>
    <button class="pill" id="openSettings">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="4"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/><circle cx="15.5" cy="15" r="1.6" fill="currentColor" stroke="none"/></svg>
      공휴일 지정
    </button>
  </header>

  <section class="desktop" aria-label="주간 시간표">
    <div class="board" id="board"></div>
  </section>

  <section class="mobile" aria-label="요일별 시간표">
    <div class="seg" id="seg" role="tablist"><div class="thumb"></div></div>
    <div id="mday"></div>
  </section>
</main>

<dialog class="sheet" id="sheet" aria-label="수업 상세"><div class="card" id="card"></div></dialog>
<dialog class="sheet" id="settings" aria-label="공휴일 지정"><div class="card" id="setcard"></div></dialog>

<script>
/* ── 이번 주 ── */
const WEEK_START = [2026, 9, 28]; // 월요일 (년, 월, 일)
const pad = (n) => String(n).padStart(2, '0');
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const WEEK = Array.from({ length: 7 }, (_, i) => {
  const d = new Date(WEEK_START[0], WEEK_START[1] - 1, WEEK_START[2] + i);
  return { date: iso(d), m: d.getMonth() + 1, n: d.getDate(), md: `${d.getMonth() + 1}/${d.getDate()}`, dow: '월화수목금토일'[i] };
});
const DAYS = WEEK.slice(0, 5); // 수업은 월–금
const nextDate = (date) => { const [y, m, d] = date.split('-').map(Number); return iso(new Date(y, m - 1, d + 1)); };

/* ── 교시 시간: 평소 / 공휴일 전날 ── */
const NORMAL = [['09:00','09:50'],['10:00','10:50'],['11:00','11:50'],['14:00','14:50'],['15:00','15:50'],['16:00','16:50'],['17:00','17:50']];
const EVE    = [['08:00','08:50'],['09:00','09:50'],['10:00','10:50'],['11:00','11:50'],['13:00','13:50'],['14:00','14:50'],['15:00','15:50']];

/* ── 수업: [요일, 시작교시, 끝교시, 과목, 교수(들), 강의실] ── */
const FREE = new Set(['자기주도학습']);
const RAW = [
  [0,1,3,'민생',['이혜환'],'A206'],
  [0,4,6,'죄종별',['김재용'],'A206'],
  [0,7,7,'자기주도학습',[],'A206'],
  [1,1,3,'체포술',['강경덕','전민주'],'유도장'],
  [1,4,6,'사격',['장영광'],'A206'],
  [1,7,7,'자기주도학습',[],'A206'],
  [2,1,3,'112초동',['최문영'],'A206'],
  [2,4,6,'관계성',['차서호'],'A206'],
  [2,7,7,'자기주도학습',[],'A206'],
  [3,1,3,'민감',['신수안'],'A206'],
  [3,4,6,'풍속',['서증원'],'A206'],
  [3,7,7,'팀빌딩',[],'미정'],
  [4,1,1,'팀빌딩',[],'미정'],
  [4,2,4,'사격',['장영광'],'A206'],
  [4,5,7,'체포술',['강경덕','전민주'],'유도장'],
];

/* ── 공휴일: 날짜로 직접 지정 → 그 전날은 자동으로 조정 시간표 (브라우저에 저장) ── */
const KEY = 'timetable.holidays.v1';
let holidays = (() => {
  try { const v = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(v)) return new Set(v); } catch (e) {}
  return new Set(['2026-10-03']); // 개천절
})();
const saveHolidays = () => { try { localStorage.setItem(KEY, JSON.stringify([...holidays])); } catch (e) {} };
const isHoli = (i) => holidays.has(DAYS[i].date);
const isEve = (i) => !isHoli(i) && holidays.has(nextDate(DAYS[i].date));
const slotsFor = (i) => (isEve(i) ? EVE : NORMAL);
const dayRange = (i) => { const s = slotsFor(i); return `${s[0][0]} – ${s[s.length - 1][1]}`; };
const dayNames = (list) => list.map((i) => DAYS[i].dow).join('·') + '요일';
const idx = (pred) => DAYS.map((_, i) => i).filter(pred);

let BLOCKS = [];
function computeBlocks() {
  BLOCKS = RAW.map(([day, from, to, subject, profs, room]) => {
    const s = slotsFor(day);
    const periods = [];
    for (let p = from; p <= to; p++) periods.push({ p, s: s[p - 1][0], e: s[p - 1][1] });
    return {
      day, from, to, subject, room, periods, free: FREE.has(subject),
      prof: profs.length ? `${profs.join(' · ')} 교수님` : '',
      start: s[from - 1][0], end: s[to - 1][1],
    };
  });
}

const $ = (s) => document.querySelector(s);
const PIN = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 6.2 12.2 6.5 12.5a.7.7 0 0 0 1 0C12.8 21.2 19 14.2 19 9a7 7 0 0 0-7-7Zm0 9.6A2.6 2.6 0 1 1 12 6.4a2.6 2.6 0 0 1 0 5.2Z"/></svg>';
const roomLabel = (r) => (r === '미정' ? '장소 미정' : r);

function tileHTML(b, n, place) {
  const cls = ['tile', b.free && 'free', isEve(b.day) && 'eve'].filter(Boolean).join(' ');
  return `<button class="${cls}" data-i="${n}" style="${place};--i:${b.day}"
      aria-label="${b.subject}, ${b.start}부터 ${b.end}까지${b.prof ? ', ' + b.prof : ''}, ${roomLabel(b.room)}">
    <span class="tt">${b.subject}</span>
    ${b.prof ? `<span class="tp">${b.prof}</span>` : ''}
    <span class="tr">${PIN}${roomLabel(b.room)}</span>
  </button>`;
}

/* ── 지금 (테스트: ?now=2026-09-29T10:30) ── */
const nowParam = new URLSearchParams(location.search).get('now');
const getNow = () => (nowParam ? new Date(nowParam) : new Date());
const stamp = (date, hm) => new Date(`${date}T${hm}:00`);
const isLive = (b, now) => !isHoli(b.day) && now >= stamp(DAYS[b.day].date, b.start) && now <= stamp(DAYS[b.day].date, b.end);
const todayIdx = () => DAYS.findIndex((d) => d.date === iso(getNow()));

/* ── 데스크톱 표 ── */
function layout() {
  const normalExists = DAYS.some((_, i) => !isHoli(i) && !isEve(i));
  const cols = ['var(--axis)'];
  const map = DAYS.map((_, i) => {
    let rail = null;
    if (isEve(i) && normalExists) { cols.push('var(--rail)'); rail = cols.length; }
    cols.push('minmax(0, 1fr)');
    return { rail, col: cols.length, start: rail || cols.length };
  });
  // 모든 수업일이 공휴일 전날이면 왼쪽 축 자체를 조정 시간으로
  return { template: cols.join(' '), map, axisEve: !normalExists && DAYS.some((_, i) => isEve(i)) };
}

let firstRender = true;
function buildBoard() {
  const { template, map, axisEve } = layout();
  const t = todayIdx();
  const axis = axisEve ? EVE : NORMAL;
  let h = '';

  DAYS.forEach((_, i) => {
    const kind = isHoli(i) ? 'holi' : isEve(i) ? 'eve' : i === t ? 'today' : '';
    if (kind) h += `<div class="colbg ${kind}" style="grid-column:${map[i].start} / ${map[i].col + 1}" aria-hidden="true"></div>`;
  });
  for (let r = 1; r <= 7; r++) h += `<div class="rowline" style="grid-row:${r}" aria-hidden="true"></div>`;

  h += `<div class="ah">${map.some((m) => m.rail) ? '기본 시간' : ''}</div>`;
  DAYS.forEach((d, i) => {
    const cls = [i === t && 'today', isEve(i) && 'eve', isHoli(i) && 'holi'].filter(Boolean).join(' ');
    h += `<div class="dh ${cls}" style="grid-column:${map[i].start} / ${map[i].col + 1}">
      <span class="wd">${d.dow}</span><span class="dn num">${d.n}</span>
      ${isEve(i) ? `<span class="cap eve num">공휴일 전 · ${dayRange(i)}</span>` : ''}
      ${isHoli(i) ? '<span class="cap holi">공휴일</span>' : ''}
    </div>`;
  });

  axis.forEach(([s, e], k) => {
    h += `<div class="ax${axisEve ? ' eve' : ''}" data-r="${k + 1}" style="grid-row:${k + 2}"><b>${k + 1}교시</b><span class="num">${s} – ${e}</span></div>`;
  });
  DAYS.forEach((_, i) => {
    const m = map[i];
    if (m.rail) EVE.forEach(([s, e], k) => {
      h += `<div class="rl num" data-d="${i}" data-r="${k + 1}" style="grid-column:${m.rail};grid-row:${k + 2}"><b>${s}</b><span>${e}</span></div>`;
    });
    if (isHoli(i)) h += `<div class="holi-msg" style="grid-column:${m.col};grid-row:2 / 9;--i:${i}"><b>공휴일</b><span>수업 없음</span></div>`;
  });

  BLOCKS.forEach((b, n) => {
    if (!isHoli(b.day)) h += tileHTML(b, n, `grid-column:${map[b.day].col};grid-row:${b.from + 1} / ${b.to + 2}`);
  });

  const el = $('#board');
  el.style.gridTemplateColumns = template;
  el.innerHTML = h;
  el.classList.toggle('enter', firstRender);
}

/* 수업 칸에 손을 올리면 그 수업의 교시가 시간 축에서 함께 켜진다 */
function highlight(tile, on) {
  const b = BLOCKS[+tile.dataset.i], scope = tile.parentElement;
  const rail = scope.querySelector(`.rl[data-d="${b.day}"]`);
  scope.querySelectorAll(rail ? `.rl[data-d="${b.day}"]` : '.ax').forEach((c) => {
    const r = +c.dataset.r; c.classList.toggle('hl', on && r >= b.from && r <= b.to);
  });
}
['pointerover', 'focusin'].forEach((ev) => document.addEventListener(ev, (e) => { const t = e.target.closest('.tile'); if (t) highlight(t, true); }));
['pointerout', 'focusout'].forEach((ev) => document.addEventListener(ev, (e) => {
  const t = e.target.closest('.tile'); if (t && !t.contains(e.relatedTarget)) highlight(t, false);
}));

/* ── 모바일: 하루씩 ── */
let cur = Math.max(0, todayIdx());
function buildSeg() {
  const t = todayIdx();
  $('#seg').querySelectorAll('button').forEach((b) => b.remove());
  $('#seg').insertAdjacentHTML('beforeend', DAYS.map((d, i) => `
    <button role="tab" data-d="${i}" class="${[i === t && 'today', isHoli(i) && 'holi'].filter(Boolean).join(' ')}"
        aria-selected="${i === cur}" aria-label="${d.dow}요일 ${d.md}">
      <span class="d">${d.dow}</span><span class="m num">${d.n}</span>
      <span class="dots">${i === t ? '<i class="t"></i>' : ''}${isEve(i) ? '<i class="e"></i>' : ''}${isHoli(i) ? '<i class="h"></i>' : ''}</span>
    </button>`).join(''));
  $('#seg').style.setProperty('--idx', cur);
}
function buildDay(dir) {
  const i = cur, d = DAYS[i], el = $('#mday');
  if (isHoli(i)) {
    el.innerHTML = `<div class="mempty"><b>공휴일</b><span>${d.dow}요일 ${d.md}은 수업이 없어요.</span></div>`;
  } else {
    const s = slotsFor(i), ev = isEve(i);
    let g = '';
    for (let r = 1; r <= 6; r++) g += `<div class="rowline" style="grid-row:${r}" aria-hidden="true"></div>`;
    s.forEach(([a, z], k) => { g += `<div class="ax${ev ? ' eve' : ''}" data-r="${k + 1}" style="grid-row:${k + 1}"><b>${k + 1}교시</b><span class="num">${a} – ${z}</span></div>`; });
    BLOCKS.forEach((b, n) => { if (b.day === i) g += tileHTML(b, n, `grid-column:2;grid-row:${b.from} / ${b.to + 1}`); });
    el.innerHTML = (ev ? `<div class="mbanner"><span>${d.dow}요일 ${d.md} · 공휴일 전</span><b class="num">${s[0][0]} 시작 · ${s[s.length - 1][1]} 종료</b></div>` : '')
      + `<div class="mgrid">${g}</div>`;
  }
  if (dir) { el.style.setProperty('--dir', dir); el.classList.remove('slide'); void el.offsetWidth; el.classList.add('slide'); }
}
function select(i) {
  if (i === cur) return;
  const dir = i > cur ? 1 : -1;
  cur = i;
  $('#seg').style.setProperty('--idx', i);
  document.querySelectorAll('#seg button').forEach((b) => b.setAttribute('aria-selected', String(+b.dataset.d === i)));
  buildDay(dir);
  tick();
}
$('#seg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) select(+b.dataset.d); });
let sx = null, sy = null;
$('#mday').addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
$('#mday').addEventListener('touchend', (e) => {
  if (sx == null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) select(Math.min(4, Math.max(0, cur + (dx < 0 ? 1 : -1))));
  sx = null;
}, { passive: true });
document.addEventListener('touchstart', () => {}, { passive: true }); // iOS: 누르는 즉시 :active

/* ── 시트: 아래로 끌어서 닫기 (1:1 추적 · 속도 투영 · 고무줄 저항) ── */
function makeSheet(dlg, card) {
  const mobile = () => matchMedia('(max-width: 820px)').matches;
  const rubber = (o, dim = 320, c = .55) => (o * dim * c) / (dim + c * Math.abs(o));
  const project = (v, d = .998) => (v / 1000) * d / (1 - d); // Apple의 감속 투영식
  let drag = null;
  card.addEventListener('pointerdown', (e) => {
    if (!mobile() || e.target.closest('button')) return;
    card.getAnimations().forEach((a) => a.cancel()); // 움직이는 중에도 다시 잡을 수 있다
    card.setPointerCapture(e.pointerId);
    drag = { y0: e.clientY, y: 0, pts: [{ y: e.clientY, t: e.timeStamp }] };
  });
  card.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dy = e.clientY - drag.y0;
    drag.pts.push({ y: e.clientY, t: e.timeStamp }); if (drag.pts.length > 6) drag.pts.shift();
    drag.y = dy > 0 ? dy : rubber(dy);
    card.style.transform = `translateY(${drag.y}px)`;
  });
  const end = () => {
    if (!drag) return;
    const a = drag.pts[0], z = drag.pts[drag.pts.length - 1];
    const v = ((z.y - a.y) / Math.max(1, z.t - a.t)) * 1000;
    const y = drag.y, h = card.offsetHeight, from = `translateY(${y}px)`;
    drag = null;
    if (Math.max(0, y) + project(v) > h * .45) {
      card.animate([{ transform: from }, { transform: `translateY(${h + 80}px)` }], { duration: 280, easing: 'cubic-bezier(.3,.7,.2,1)', fill: 'forwards' })
        .finished.then(() => dlg.close()).catch(() => {});
    } else {
      card.style.transform = '';
      card.animate([{ transform: from }, { transform: 'none' }], { duration: 450, easing: 'cubic-bezier(.3,1.2,.4,1)' });
    }
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
  dlg.addEventListener('close', () => { card.getAnimations().forEach((a) => a.cancel()); card.style.transform = ''; });
  dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });
}
const sheet = $('#sheet'), settings = $('#settings');
makeSheet(sheet, $('#card'));
makeSheet(settings, $('#setcard'));

/* ── 수업 상세 ── */
function openDetail(n) {
  const b = BLOCKS[n], d = DAYS[b.day], ev = isEve(b.day);
  $('#card').innerHTML = `
    <div class="grab"></div>
    <div class="top"><p class="cap2">${d.dow}요일 · ${d.md}${ev ? ' · <em>공휴일 전</em>' : ''}</p><h2>${b.subject}</h2></div>
    <dl>
      <div class="r"><dt>시간</dt><dd class="num${ev ? ' warn' : ''}">${b.start} – ${b.end}</dd></div>
      <div class="r"><dt>교시</dt><dd class="pl num">${b.periods.map((x) => `<div><b>${x.p}교시</b>${x.s} – ${x.e}</div>`).join('')}</dd></div>
      ${b.prof ? `<div class="r"><dt>교수님</dt><dd>${b.prof.replace(' 교수님', '')}</dd></div>` : ''}
      <div class="r"><dt>강의실</dt><dd>${roomLabel(b.room)}</dd></div>
    </dl>
    <button class="close" id="closeBtn">닫기</button>`;
  $('#closeBtn').onclick = () => sheet.close();
  sheet.showModal();
}
document.addEventListener('click', (e) => { const t = e.target.closest('.tile'); if (t) openDetail(+t.dataset.i); });

/* ── 공휴일 지정 ── */
function buildSettings() {
  $('#setcard').innerHTML = `
    <div class="grab"></div>
    <div class="top">
      <h2>공휴일 지정</h2>
      <p class="lead">공휴일로 지정한 날의 <b>전날</b>은 ${EVE[0][0]} 시작 · ${EVE[6][1]} 종료로 앞당겨져요.</p>
    </div>
    <div class="week">${WEEK.map((d) => `
      <button class="wday" data-date="${d.date}" aria-label="${d.dow}요일 ${d.md} 공휴일">
        <span class="w">${d.dow}</span><span class="n num">${d.n}</span>
      </button>`).join('')}
    </div>
    <div class="derived" id="derived"></div>
    <button class="close" id="setDone">완료</button>`;
  $('#setDone').onclick = () => settings.close();
  syncSettings();
}
function syncSettings() {
  document.querySelectorAll('.wday').forEach((b) => {
    const on = holidays.has(b.dataset.date);
    b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on));
  });
  const rows = [];
  DAYS.forEach((d, i) => {
    if (isEve(i)) rows.push(`<div class="drow"><span class="dl">${d.dow}요일 ${d.md}</span><span class="dv eve num">공휴일 전 · ${dayRange(i)}</span></div>`);
    if (isHoli(i)) rows.push(`<div class="drow"><span class="dl">${d.dow}요일 ${d.md}</span><span class="dv holi">공휴일 · 수업 없음</span></div>`);
  });
  $('#derived').innerHTML = rows.join('') || '<p class="dnone">지정된 공휴일이 없어요. 모든 요일이 기본 시간표로 진행돼요.</p>';
}
$('#openSettings').addEventListener('click', () => { buildSettings(); settings.showModal(); });
settings.addEventListener('click', (e) => {
  const w = e.target.closest('.wday'); if (!w) return;
  const date = w.dataset.date;
  holidays.has(date) ? holidays.delete(date) : holidays.add(date);
  saveHolidays(); syncSettings(); render();
});

/* ── 공통 ── */
function updateTop() {
  $('#weekLabel').textContent = `${DAYS[0].m}월 ${DAYS[0].n}일 – ${DAYS[4].m}월 ${DAYS[4].n}일`;
  $('#navRange').textContent = `${DAYS[0].md} – ${DAYS[4].md}`;
  const ev = idx(isEve), ho = idx(isHoli), lines = [];
  if (ev.length) lines.push(`<p class="nl"><i class="o"></i><span>${dayNames(ev)}은 공휴일 전날이라 <b class="num">${EVE[0][0]} 시작 · ${EVE[6][1]} 종료</b>예요.</span></p>`);
  if (ho.length) lines.push(`<p class="nl"><i class="r"></i><span>${dayNames(ho)}은 <b class="r">공휴일</b>이라 수업이 없어요.</span></p>`);
  $('#notice').innerHTML = lines.join('');
}
function tick() {
  const now = getNow();
  document.querySelectorAll('.tile').forEach((el) => el.classList.toggle('live', isLive(BLOCKS[+el.dataset.i], now)));
}
function render() {
  computeBlocks(); buildBoard(); buildSeg(); buildDay(0); updateTop(); tick();
  firstRender = false;
}

new IntersectionObserver(([e]) => $('#nav').classList.toggle('on', !e.isIntersecting), { rootMargin: '-40px 0px 0px 0px' })
  .observe(document.querySelector('.hero h1'));

render();
setInterval(tick, 30000);
</script>
</body>
</html>
