<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>주간 시간표</title>
<style>
/* Pretendard Variable — 저장소에 포함된 파일 우선, 실패 시 CDN */
@font-face {
  font-family: "Pretendard Variable";
  font-weight: 45 920;
  font-style: normal;
  font-display: swap;
  src: local("Pretendard Variable"),
       url("fonts/PretendardVariable.woff2") format("woff2-variations"),
       url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/woff2/PretendardVariable.woff2") format("woff2-variations");
}

/* 색은 둘뿐: 파랑(오늘·진행 중) / 주황(공휴일 전). 나머지는 모두 흑백 위계로 만든다. */
:root {
  --bg: #f5f5f7;
  --surface: #ffffff;
  --text: #1d1d1f;
  --text-2: #6e6e73;
  --text-3: #8e8e93;
  --line: rgba(60, 60, 67, .14);
  --accent: #0071e3;
  --warn: #c24100;
  --warn-bg: rgba(255, 149, 0, .14);
  --glass: rgba(245, 245, 247, .74);
  --card-shadow: 0 0 0 .5px rgba(0, 0, 0, .06), 0 1px 3px rgba(0, 0, 0, .05), 0 12px 32px rgba(0, 0, 0, .04);
  --lift-shadow: 0 0 0 .5px rgba(0, 0, 0, .06), 0 2px 6px rgba(0, 0, 0, .06), 0 20px 44px rgba(0, 0, 0, .1);
  --ease: cubic-bezier(.2, .8, .2, 1);           /* 임계 감쇠: 기본 스프링 */
  --ease-spring: cubic-bezier(.3, 1.25, .45, 1);  /* 관성이 있는 동작에만 약간의 오버슛 */
  --cols: repeat(5, minmax(0, 1fr));
  --gap: 12px;
  --row: 132px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --surface: #1c1c1e;
    --text: #f5f5f7;
    --text-2: #a1a1a6;
    --text-3: #8e8e93;
    --line: rgba(235, 235, 245, .16);
    --accent: #2997ff;
    --warn: #ffb04f;
    --warn-bg: rgba(255, 159, 10, .18);
    --glass: rgba(28, 28, 30, .74);
    --card-shadow: 0 0 0 .5px rgba(255, 255, 255, .08);
    --lift-shadow: 0 0 0 .5px rgba(255, 255, 255, .1), 0 20px 44px rgba(0, 0, 0, .6);
  }
}

* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  letter-spacing: -.011em;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  min-height: 100vh;
  padding-bottom: env(safe-area-inset-bottom);
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: inherit; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

/* ───────── 상단 바: 스크롤하면 작은 제목으로 ───────── */
.nav {
  position: fixed; inset: 0 0 auto 0; z-index: 30;
  height: calc(52px + env(safe-area-inset-top)); padding-top: env(safe-area-inset-top);
  display: flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 16px; font-weight: 650; letter-spacing: -.02em;
  background: var(--glass);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  backdrop-filter: blur(24px) saturate(180%);
  box-shadow: 0 .5px 0 var(--line);
  opacity: 0; transform: translateY(-6px); pointer-events: none;
  transition: opacity .3s var(--ease), transform .3s var(--ease);
}
.nav.on { opacity: 1; transform: none; }
.nav small { font-size: 13px; font-weight: 500; color: var(--text-2); }

/* ───────── 페이지 ───────── */
.page { max-width: 1240px; margin: 0 auto; padding: 0 20px 64px; }
.hero { padding: 52px 2px 22px; }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.eyebrow { font-size: 15px; font-weight: 600; color: var(--text-2); }
.textbtn {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 15px; font-weight: 600; color: var(--accent);
  padding: 6px 4px; transition: opacity .12s ease-out, transform .12s ease-out;
}
.textbtn:active { opacity: .45; transform: scale(.96); }
.hero h1 {
  margin-top: 2px;
  font-size: clamp(2.5rem, 6vw, 3.5rem);
  line-height: 1.08;
  font-weight: 700;
  letter-spacing: -.035em;
}
.notice {
  margin-top: 14px;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 14px 7px 12px; border-radius: 999px;
  background: var(--warn-bg); color: var(--warn);
  font-size: 14px; font-weight: 600; letter-spacing: -.01em; line-height: 1.4;
}
.notice[hidden] { display: none; }
.notice svg { flex: none; }

/* ───────── 요일 헤더 (데스크톱) ───────── */
.heads {
  position: sticky; top: 52px; z-index: 10;
  margin: 0 -20px; padding: 12px 20px 12px;
  display: grid; grid-template-columns: var(--cols); gap: var(--gap);
  background: var(--glass);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  backdrop-filter: blur(24px) saturate(180%);
  box-shadow: 0 .5px 0 var(--line);
}
.dh { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 0 6px; min-width: 0; }
.dh .dow { font-size: 13px; font-weight: 600; color: var(--text-2); display: flex; gap: 6px; align-items: baseline; }
.dh .dow em { font-style: normal; font-weight: 500; color: var(--text-3); }
.dh .dn {
  min-width: 36px; height: 36px; padding: 0 2px; border-radius: 18px;
  display: grid; place-items: center; margin-left: -4px;
  font-size: 26px; font-weight: 650; letter-spacing: -.03em; line-height: 1;
}
.dh .rng { margin-top: 3px; font-size: 14px; font-weight: 600; color: var(--text-2); }
.dh.today .dow { color: var(--accent); }
.dh.today .dn { background: var(--accent); color: #fff; padding: 0 10px; }
.dh.eve .rng { color: var(--warn); font-weight: 700; }
.evetag {
  margin-top: 5px; font-size: 11.5px; font-weight: 700; letter-spacing: 0;
  padding: 2px 8px; border-radius: 999px; background: var(--warn-bg); color: var(--warn);
}

/* ───────── 시간표 보드 (데스크톱) ───────── */
.board {
  margin-top: var(--gap);
  display: grid; grid-template-columns: var(--cols);
  grid-template-rows: repeat(7, var(--row));
  gap: var(--gap);
}

/* ───────── 수업 카드: 교시마다 한 줄씩 (교시 · 시간) ───────── */
.blk {
  position: relative; min-width: 0;
  border-radius: 22px;
  background: var(--surface);
  box-shadow: var(--card-shadow);
  display: flex; flex-direction: column;
  overflow: hidden;
  transition: transform .4s var(--ease), box-shadow .4s var(--ease);
  animation: rise .55s var(--ease) both;
  animation-delay: calc(var(--i, 0) * 35ms);
  touch-action: manipulation;
}
@supports (corner-shape: squircle) {
  .blk, .group, .card { corner-shape: squircle; }
  .blk { border-radius: 34px; } .group { border-radius: 36px; } .card { border-radius: 48px; }
}
.blk.muted { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.blk.muted .sub { color: var(--text-2); }

.sec { flex: 1 1 0; padding: 14px 18px 12px; min-height: 0; display: flex; flex-direction: column; }
.sec + .sec { border-top: .5px solid var(--line); }
.pt { display: flex; align-items: baseline; gap: 8px; font-size: 13px; line-height: 1.3; white-space: nowrap; }
.pt .pn { font-weight: 600; color: var(--text-3); }
.pt .tm { font-size: 14px; font-weight: 650; letter-spacing: -.01em; color: var(--text); }
.eve .pt .tm { color: var(--warn); }
.pt .room { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--text-2); }
.sub { margin-top: 10px; font-size: 23px; font-weight: 700; line-height: 1.15; letter-spacing: -.035em; word-break: keep-all; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.prof { margin-top: 4px; font-size: 14px; color: var(--text-2); word-break: keep-all; }
.live-badge {
  display: none; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 700; letter-spacing: 0; color: var(--accent);
  padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 12%, transparent);
}
.live-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
.live .live-badge { display: inline-flex; }
.blk.live { box-shadow: 0 0 0 2px var(--accent), var(--lift-shadow); }

.blk:active { transform: scale(.975); transition-duration: .12s; }
@media (hover: hover) {
  .blk:hover { transform: translateY(-2px); box-shadow: var(--lift-shadow); }
  .blk.live:hover { box-shadow: 0 0 0 2px var(--accent), var(--lift-shadow); }
  .blk:active { transform: scale(.975); }
}
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes pulse { 50% { opacity: .3; } }

/* ───────── 모바일 ───────── */
.mobile { display: none; }
.seg {
  position: sticky; top: 8px; z-index: 12;
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 4px; border-radius: 22px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  backdrop-filter: blur(24px) saturate(180%);
  box-shadow: 0 0 0 .5px var(--line), 0 6px 20px rgba(0, 0, 0, .06);
}
.seg .thumb {
  position: absolute; top: 4px; bottom: 4px; left: 4px;
  width: calc((100% - 8px) / 5); border-radius: 18px;
  background: var(--surface);
  box-shadow: 0 0 0 .5px rgba(0, 0, 0, .06), 0 2px 8px rgba(0, 0, 0, .12);
  transform: translateX(calc(var(--idx, 0) * 100%));
  transition: transform .5s var(--ease-spring);
}
.seg button {
  position: relative; z-index: 1; padding: 8px 0 7px; text-align: center;
  display: flex; flex-direction: column; align-items: center; line-height: 1.15;
  transition: transform .12s ease-out;
}
.seg button:active { transform: scale(.93); }
.seg .d { font-size: 12.5px; font-weight: 600; color: var(--text-2); }
.seg .m { font-size: 22px; font-weight: 650; letter-spacing: -.03em; margin-top: 2px; }
.seg .dots { height: 6px; margin-top: 3px; display: flex; gap: 3px; }
.seg .dots i { width: 5px; height: 5px; border-radius: 50%; }
.seg .dots .t { background: var(--accent); }
.seg .dots .e { background: #ff9500; }
.seg button.today .d { color: var(--accent); }

.panel { margin-top: 18px; display: none; }
.panel.on { display: block; animation: slide .5s var(--ease) both; }
@keyframes slide { from { opacity: 0; transform: translateX(calc(var(--dir, 1) * 24px)); } to { opacity: 1; transform: none; } }
.banner {
  margin-bottom: 12px; padding: 14px 18px; border-radius: 20px;
  background: var(--warn-bg); color: var(--warn);
  display: flex; flex-direction: column; gap: 1px;
}
.banner small { font-size: 13px; font-weight: 600; opacity: .85; }
.banner b { font-size: 22px; font-weight: 700; letter-spacing: -.03em; }

/* 인셋 그룹 리스트: 수업 하나 = 카드 하나, 안에 교시별 줄 */
.stack { display: grid; gap: 12px; }
.item {
  width: 100%; display: block; position: relative;
  background: var(--surface); border-radius: 24px; box-shadow: var(--card-shadow); overflow: hidden;
  transition: transform .12s ease-out;
  animation: rise .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 40ms);
}
.item:active { transform: scale(.98); }
.item.muted { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.item.muted .sub { color: var(--text-2); }
.item.live { box-shadow: 0 0 0 2px var(--accent), var(--lift-shadow); }
.item .sec { padding: 14px 18px 13px; }
.item .sub { margin-top: 8px; font-size: 22px; }
.item .pt { font-size: 14px; }
.item .pt .tm { font-size: 16px; }

/* ───────── 시트 (상세 / 설정) ───────── */
dialog.sheet {
  border: 0; padding: 0; background: transparent; color: var(--text);
  width: min(440px, calc(100% - 24px)); max-width: none; margin: auto; overflow: visible;
}
dialog.sheet::backdrop { background: rgba(0, 0, 0, .32); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
dialog.sheet[open] { animation: sheet .5s var(--ease) both; }
dialog.sheet[open]::backdrop { animation: fade .3s ease both; }
@keyframes sheet { from { opacity: 0; transform: translateY(40px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } }
.card { border-radius: 32px; background: var(--surface); box-shadow: var(--lift-shadow); overflow: hidden; }
.grab { display: none; width: 36px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 0; }
.card .top { padding: 22px 26px 8px; }
.card .top .cap { font-size: 13px; font-weight: 600; color: var(--text-3); }
.card .top h2 { margin-top: 4px; font-size: 2rem; line-height: 1.1; font-weight: 700; letter-spacing: -.035em; word-break: keep-all; }
.card dl { padding: 8px 26px 4px; }
.card .r { display: flex; justify-content: space-between; gap: 16px; padding: 13px 0; border-top: .5px solid var(--line); font-size: 15.5px; }
.card .r:first-child { border-top: 0; }
.card dt { color: var(--text-2); }
.card dd { font-weight: 600; text-align: right; }
.card dd.warn { color: var(--warn); }
.card dd.pl { font-weight: 500; line-height: 1.75; }
.card dd.pl b { font-weight: 600; color: var(--text-3); margin-right: 10px; }
.card .hint { padding: 4px 26px 6px; font-size: 14.5px; color: var(--text-2); }
.card .hint b { color: var(--warn); font-weight: 650; }
.close {
  display: block; width: calc(100% - 52px); margin: 10px 26px 26px; padding: 14px;
  border-radius: 16px; text-align: center;
  background: var(--accent); color: #fff; font-weight: 650; font-size: 16px;
  transition: transform .12s ease-out, opacity .12s;
}
.close:active { transform: scale(.97); opacity: .85; }
.slist { padding: 4px 26px 0; }
.srow { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-top: .5px solid var(--line); }
.srow:first-child { border-top: 0; }
.srow b { font-size: 16.5px; font-weight: 600; letter-spacing: -.02em; }
.srow b .num { font-weight: 500; color: var(--text-3); margin-left: 4px; }
.srow small { display: block; font-size: 13px; color: var(--text-2); }
.sw { position: relative; flex: none; width: 51px; height: 31px; border-radius: 999px; background: rgba(120, 120, 128, .32); transition: background .3s var(--ease); }
.sw i { position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .28); transition: transform .4s var(--ease-spring), width .2s var(--ease); }
.sw:active i { width: 33px; }
.sw[aria-checked="true"] { background: #34c759; }
.sw[aria-checked="true"] i { transform: translateX(20px); }
.sw[aria-checked="true"]:active i { transform: translateX(14px); }

/* ───────── 반응형 ───────── */
@media (max-width: 860px) {
  .page { padding: 0 16px 48px; }
  .hero { padding: 36px 2px 16px; }
  .heads, .board { display: none; }
  .mobile { display: block; }
  dialog.sheet { margin: auto auto 10px; }
  .card { touch-action: none; }
  .grab { display: block; }
}
@media (min-width: 861px) and (max-width: 1060px) {
  :root { --gap: 8px; }
  .sec { padding: 12px 13px 10px; }
  .sub { font-size: 19px; }
  .pt .room { display: none; }
}

/* ───────── 접근성 ───────── */
@media (prefers-reduced-motion: reduce) {
  .blk, .item, .panel.on, dialog.sheet[open], dialog.sheet[open]::backdrop { animation: none; }
  .blk:hover { transform: none; }
  .seg .thumb, .sw i { transition: opacity .2s; }
  .live-badge::before { animation: none; }
}
@media (prefers-reduced-transparency: reduce) {
  .heads, .seg, .nav { background: var(--surface); -webkit-backdrop-filter: none; backdrop-filter: none; }
}
@media (prefers-contrast: more) {
  .blk, .item { box-shadow: 0 0 0 1.5px currentColor; }
}
</style>
</head>
<body>
<div class="nav" id="nav" aria-hidden="true">시간표<small id="navRange"></small></div>

<main class="page">
  <header class="hero">
    <div class="hero-top">
      <span class="eyebrow" id="weekLabel"></span>
      <button class="textbtn" id="openSettings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="4"/><path d="M8 2.5v4M16 2.5v4M3 10h18M9 15l2 2 4-4"/></svg>
        공휴일 설정
      </button>
    </div>
    <h1>시간표</h1>
    <div class="notice" id="notice">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 7v5.5l3.5 2"/></svg>
      <span id="noticeText"></span>
    </div>
  </header>

  <div class="heads" id="heads"></div>
  <section class="board" id="board" aria-label="주간 시간표"></section>

  <section class="mobile" id="mobile" aria-label="요일별 시간표">
    <div class="seg" id="seg" role="tablist"><div class="thumb"></div></div>
    <div id="panels"></div>
  </section>
</main>

<dialog class="sheet" id="sheet" aria-label="수업 상세"><div class="card" id="card"></div></dialog>
<dialog class="sheet" id="settings" aria-label="공휴일 설정"><div class="card" id="setcard"></div></dialog>

<script>
const DAYS = ['2026-09-28', '2026-09-29', '2026-09-30', '2026-10-01', '2026-10-02'].map((date, i) => {
  const [, m, n] = date.split('-').map(Number);
  return { dow: '월화수목금'[i], date, m, n, md: `${m}/${n}` };
});

// 평소 시간표 / 공휴일 전 시간표 (공휴일 전날로 지정한 요일에 적용)
const NORMAL = [['09:00','09:50'],['10:00','10:50'],['11:00','11:50'],['14:00','14:50'],['15:00','15:50'],['16:00','16:50'],['17:00','17:50']];
const EVE    = [['08:00','08:50'],['09:00','09:50'],['10:00','10:50'],['11:00','11:50'],['13:00','13:50'],['14:00','14:50'],['15:00','15:50']];

const MUTED = new Set(['자기주도학습']);

// [요일, 시작교시, 끝교시, 과목, 교수(들), 강의실]
const RAW = [
  [0,1,3,'민생',['이혜환'],'A206'],
  [0,4,6,'죄종별',['김재용'],'A206'],
  [0,7,7,'자기주도학습',[],'A206'],
  [1,1,3,'체포술',['강경덕','전민주'],'유도장'],
  [1,4,6,'사격',['장영광'],'A206'],
  [1,7,7,'자기주도학습',[],'A206'],
  [2,1,3,'112초동',['최문영'],'A206'],
  [2,4,6,'관계성',['차서호'],'A206'],
  [2,7,7,'자기주도학습',[],'A206'],
  [3,1,3,'민감',['신수안'],'A206'],
  [3,4,6,'풍속',['서증원'],'A206'],
  [3,7,7,'팀빌딩',[],'미정'],
  [4,1,1,'팀빌딩',[],'미정'],
  [4,2,4,'사격',['장영광'],'A206'],
  [4,5,7,'체포술',['강경덕','전민주'],'유도장'],
];

/* ── 공휴일 전날 지정 (브라우저에 저장) ── */
const KEY = 'timetable.holidayEve.v1';
const loadEve = () => {
  try { const v = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(v)) return new Set(v); } catch (e) {}
  return new Set([4]);
};
const saveEve = () => { try { localStorage.setItem(KEY, JSON.stringify([...eve])); } catch (e) {} };
let eve = loadEve();
const slotsFor = (day) => (eve.has(day) ? EVE : NORMAL);
const dayRange = (day) => { const s = slotsFor(day); return `${s[0][0]} – ${s[s.length - 1][1]}`; };

let BLOCKS = [];
function computeBlocks() {
  BLOCKS = RAW.map(([day, from, to, subject, profs, room]) => {
    const slots = slotsFor(day);
    const periods = [];
    for (let p = from; p <= to; p++) periods.push({ p, s: slots[p - 1][0], e: slots[p - 1][1] });
    return {
      day, from, to, subject, room, periods,
      prof: profs.length ? profs.join(' · ') + ' 교수님' : '',
      start: slots[from - 1][0], end: slots[to - 1][1],
      muted: MUTED.has(subject),
    };
  });
}

const $ = (s) => document.querySelector(s);
const roomLabel = (r) => (r === '미정' ? '장소 미정' : r);

/* 교시 한 줄: "1교시  09:00 – 09:50" (첫 줄에만 과목·교수님, 강의실은 오른쪽) */
function sectionsHTML(b) {
  return b.periods.map((x, k) => `
    <div class="sec">
      <div class="pt num"><span class="pn">${x.p}교시</span><span class="tm">${x.s} – ${x.e}</span>${k === 0 ? `<span class="room">${b.room}</span>` : ''}</div>
      ${k === 0 ? `<div class="sub">${b.subject}<span class="live-badge">진행 중</span></div>${b.prof ? `<div class="prof">${b.prof}</div>` : ''}` : ''}
    </div>`).join('');
}

/* ── now (테스트: ?now=2026-09-29T10:30) ── */
const nowParam = new URLSearchParams(location.search).get('now');
const getNow = () => (nowParam ? new Date(nowParam) : new Date());
const stamp = (date, hm) => new Date(`${date}T${hm}:00`);
const isLive = (b, now) => now >= stamp(DAYS[b.day].date, b.start) && now <= stamp(DAYS[b.day].date, b.end);
const todayIdx = () => {
  const d = getNow(), p = (n) => String(n).padStart(2, '0');
  const key = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  return DAYS.findIndex((x) => x.date === key);
};

/* ── 데스크톱 ── */
function buildHeads() {
  const t = todayIdx();
  $('#heads').innerHTML = DAYS.map((d, i) => `
    <div class="dh${i === t ? ' today' : ''}${eve.has(i) ? ' eve' : ''}">
      <span class="dow">${d.dow}${i === 0 || d.m !== DAYS[i - 1].m ? `<em>${d.m}월</em>` : ''}</span>
      <span class="dn num">${d.n}</span>
      <span class="rng num">${dayRange(i)}</span>
      ${eve.has(i) ? '<span class="evetag">공휴일 전</span>' : ''}
    </div>`).join('');
}
function buildBoard() {
  $('#board').innerHTML = BLOCKS.map((b, n) => `
    <button class="blk${b.muted ? ' muted' : ''}${eve.has(b.day) ? ' eve' : ''}" data-i="${n}"
      style="--i:${n};grid-column:${b.day + 1};grid-row:${b.from} / ${b.to + 1}"
      aria-label="${b.subject}, ${b.start}부터 ${b.end}까지, ${b.room}">${sectionsHTML(b)}</button>`).join('');
}

/* ── 모바일 ── */
let cur = Math.max(0, todayIdx()), prev = cur;
function buildMobile() {
  const t = todayIdx();
  $('#seg').querySelectorAll('button').forEach((b) => b.remove());
  $('#seg').insertAdjacentHTML('beforeend', DAYS.map((d, i) => `
    <button role="tab" data-d="${i}" class="${i === t ? 'today' : ''}" aria-selected="false" aria-label="${d.dow}요일 ${d.md}">
      <span class="d">${d.dow}</span><span class="m num">${d.n}</span>
      <span class="dots">${i === t ? '<i class="t"></i>' : ''}${eve.has(i) ? '<i class="e"></i>' : ''}</span>
    </button>`).join(''));

  $('#panels').innerHTML = DAYS.map((d, i) => `
    <div class="panel" data-p="${i}" role="tabpanel">
      ${eve.has(i) ? `<div class="banner"><small>${d.dow}요일 ${d.md} · 공휴일 전</small><b class="num">${EVE[0][0]} 시작 · ${EVE[6][1]} 종료</b></div>` : ''}
      <div class="stack">
        ${BLOCKS.map((b, n) => b.day !== i ? '' : `
          <button class="item${b.muted ? ' muted' : ''}${eve.has(i) ? ' eve' : ''}" data-i="${n}" style="--i:${n % 3}">${sectionsHTML(b)}</button>`).join('')}
      </div>
    </div>`).join('');
  select(cur, true);
}
function select(i, first) {
  prev = cur; cur = i;
  document.documentElement.style.setProperty('--dir', i >= prev ? 1 : -1);
  $('#seg').style.setProperty('--idx', i);
  document.querySelectorAll('#seg button').forEach((b) => b.setAttribute('aria-selected', String(+b.dataset.d === i)));
  document.querySelectorAll('.panel').forEach((p) => {
    const on = +p.dataset.p === i;
    p.classList.toggle('on', on);
    if (on && !first) { p.style.animation = 'none'; void p.offsetWidth; p.style.animation = ''; }
  });
}
$('#seg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) select(+b.dataset.d); });
let sx = null, sy = null;
$('#panels').addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
$('#panels').addEventListener('touchend', (e) => {
  if (sx == null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) select(Math.min(4, Math.max(0, cur + (dx < 0 ? 1 : -1))));
  sx = null;
}, { passive: true });
document.addEventListener('touchstart', () => {}, { passive: true }); // iOS: 터치 즉시 :active 반응

/* ── 시트: 아래로 끌어서 닫기 (1:1 추적 · 속도 투영 · 고무줄 저항) ── */
function makeSheet(dlg, card) {
  const mobile = () => matchMedia('(max-width: 860px)').matches;
  const rubber = (o, dim = 320, c = .55) => (o * dim * c) / (dim + c * Math.abs(o));
  const project = (v, d = .998) => (v / 1000) * d / (1 - d); // Apple의 감속 투영식
  let drag = null;

  card.addEventListener('pointerdown', (e) => {
    if (!mobile() || e.target.closest('button')) return;
    card.getAnimations().forEach((a) => a.cancel()); // 이동 중에도 붙잡을 수 있다
    card.setPointerCapture(e.pointerId);
    drag = { y0: e.clientY, y: 0, pts: [{ y: e.clientY, t: e.timeStamp }] };
  });
  card.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dy = e.clientY - drag.y0;
    drag.pts.push({ y: e.clientY, t: e.timeStamp }); if (drag.pts.length > 6) drag.pts.shift();
    drag.y = dy > 0 ? dy : rubber(dy);
    card.style.transform = `translateY(${drag.y}px)`;
  });
  const end = () => {
    if (!drag) return;
    const a = drag.pts[0], z = drag.pts[drag.pts.length - 1];
    const v = ((z.y - a.y) / Math.max(1, z.t - a.t)) * 1000;
    const y = drag.y, h = card.offsetHeight;
    const projected = Math.max(0, y) + project(v);
    drag = null;
    const from = `translateY(${y}px)`;
    if (projected > h * .45) {
      card.animate([{ transform: from }, { transform: `translateY(${h + 80}px)` }], { duration: 280, easing: 'cubic-bezier(.3,.7,.2,1)', fill: 'forwards' })
        .finished.then(() => dlg.close()).catch(() => {});
    } else {
      card.style.transform = '';
      card.animate([{ transform: from }, { transform: 'none' }], { duration: 450, easing: 'cubic-bezier(.3,1.2,.4,1)' });
    }
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
  dlg.addEventListener('close', () => { card.getAnimations().forEach((a) => a.cancel()); card.style.transform = ''; });
  dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });
}
const sheet = $('#sheet'), settings = $('#settings');
makeSheet(sheet, $('#card'));
makeSheet(settings, $('#setcard'));

/* ── 수업 상세 ── */
function openSheet(n) {
  const b = BLOCKS[n], d = DAYS[b.day];
  $('#card').innerHTML = `
    <div class="grab"></div>
    <div class="top"><div class="cap">${d.dow}요일 · ${d.md}</div><h2>${b.subject}</h2></div>
    <dl>
      <div class="r"><dt>시간</dt><dd class="num">${b.start} – ${b.end}</dd></div>
      ${b.periods.length > 1 ? `<div class="r"><dt>교시별</dt><dd class="pl num">${b.periods.map((x) => `<div><b>${x.p}교시</b>${x.s} – ${x.e}</div>`).join('')}</dd></div>` : ''}
      ${b.prof ? `<div class="r"><dt>교수님</dt><dd>${b.prof.replace(' 교수님', '')}</dd></div>` : ''}
      <div class="r"><dt>강의실</dt><dd>${roomLabel(b.room)}</dd></div>
      ${eve.has(b.day) ? '<div class="r"><dt>안내</dt><dd class="warn">공휴일 전 조정 시간</dd></div>' : ''}
    </dl>
    <button class="close" id="closeBtn">닫기</button>`;
  $('#closeBtn').onclick = () => sheet.close();
  sheet.showModal();
}
document.addEventListener('click', (e) => { const b = e.target.closest('.blk, .item'); if (b) openSheet(+b.dataset.i); });

/* ── 공휴일 설정 ── */
function buildSettings() {
  $('#setcard').innerHTML = `
    <div class="grab"></div>
    <div class="top"><h2>공휴일 설정</h2></div>
    <p class="hint">공휴일 전날로 켠 요일은 <b>${EVE[0][0]} 시작 · ${EVE[6][1]} 종료</b> 시간표로 바뀌어요.</p>
    <div class="slist">${DAYS.map((d, i) => `
      <div class="srow">
        <div><b>${d.dow}요일 <span class="num">${d.md}</span></b><small class="num" data-r="${i}"></small></div>
        <button class="sw" role="switch" data-d="${i}" aria-label="${d.dow}요일 공휴일 전날"><i></i></button>
      </div>`).join('')}
    </div>
    <button class="close" id="setDone">완료</button>`;
  $('#setDone').onclick = () => settings.close();
  syncSettings();
}
function syncSettings() {
  document.querySelectorAll('.sw').forEach((b) => b.setAttribute('aria-checked', String(eve.has(+b.dataset.d))));
  document.querySelectorAll('[data-r]').forEach((r) => { r.textContent = (eve.has(+r.dataset.r) ? '공휴일 전 · ' : '') + dayRange(+r.dataset.r); });
}
$('#openSettings').addEventListener('click', () => { buildSettings(); settings.showModal(); });
settings.addEventListener('click', (e) => {
  const sw = e.target.closest('.sw'); if (!sw) return;
  const i = +sw.dataset.d;
  eve.has(i) ? eve.delete(i) : eve.add(i);
  saveEve(); syncSettings(); render();
});

/* ── 공통 ── */
function updateTop() {
  $('#weekLabel').textContent = `${DAYS[0].m}월 ${DAYS[0].n}일 – ${DAYS[4].m}월 ${DAYS[4].n}일`;
  $('#navRange').textContent = `${DAYS[0].md} – ${DAYS[4].md}`;
  const days = [...eve].sort(), el = $('#notice');
  el.hidden = !days.length;
  if (!days.length) return;
  $('#noticeText').innerHTML = `${days.map((i) => DAYS[i].dow).join('·')}요일 공휴일 전 · <b>${EVE[0][0]} 시작 – ${EVE[6][1]} 종료</b>`;
}
function tick() {
  const now = getNow();
  document.querySelectorAll('.blk, .item').forEach((el) => el.classList.toggle('live', isLive(BLOCKS[+el.dataset.i], now)));
}
function render() { computeBlocks(); buildHeads(); buildBoard(); buildMobile(); updateTop(); tick(); }

new IntersectionObserver(([e]) => $('#nav').classList.toggle('on', !e.isIntersecting), { rootMargin: '-40px 0px 0px 0px' })
  .observe(document.querySelector('.hero h1'));

render();
setInterval(tick, 30000);
</script>
</body>
</html>
