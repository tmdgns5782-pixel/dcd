<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>주간 시간표</title>
<script>try { document.documentElement.dataset.mode = localStorage.getItem('timetable.mode') || 'light'; } catch (e) { document.documentElement.dataset.mode = 'light'; }</script>
<style>
/* Pretendard Variable — 저장소에 포함된 파일 우선, 실패 시 CDN */
@font-face {
  font-family: "Pretendard Variable";
  font-weight: 45 920;
  font-style: normal;
  font-display: swap;
  src: local("Pretendard Variable"),
       url("fonts/PretendardVariable.woff2") format("woff2-variations"),
       url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/woff2/PretendardVariable.woff2") format("woff2-variations");
}

/* 색은 의미가 있을 때만 쓴다 — 파랑: 오늘·진행 중 / 주황: 쉬는 날 전날(금요일·공휴일 전날)의 시간 / 빨강: 공휴일 */
:root {
  --bg: #f5f5f7;
  --surface: #ffffff;
  --tile: #f2f2f7;
  --tile-hover: #e8e8ed;
  --lesson: #ebf4fd;        /* 수업 칸: 포인트 색을 아주 옅게 */
  --lesson-hover: #deedfb;
  --text: #1d1d1f;
  --text-2: #6e6e73;
  --text-3: #86868b;
  --line: rgba(60, 60, 67, .11);
  --accent: #0071e3;
  --accent-soft: rgba(0, 113, 227, .1);
  --accent-tint: rgba(0, 113, 227, .05);
  --orange: #ff9500;
  --warn: #c2410c;
  --warn-soft: rgba(255, 149, 0, .16);
  --warn-tint: rgba(255, 149, 0, .07);
  --warn-tile: #ffefd9;
  --warn-tile-hover: #ffe5c2;
  --red: #ff3b30;
  --holi: #d70015;
  --holi-soft: rgba(255, 59, 48, .12);
  --holi-tint: rgba(255, 59, 48, .045); --vac-tint: rgba(120, 120, 128, .07);
  --glass: rgba(245, 245, 247, .76);
  --platter-shadow: 0 0 0 .5px rgba(0, 0, 0, .05), 0 2px 6px rgba(0, 0, 0, .03), 0 24px 60px rgba(0, 0, 0, .06);
  --sheet-shadow: 0 0 0 .5px rgba(0, 0, 0, .06), 0 30px 80px rgba(0, 0, 0, .22);
  --ease: cubic-bezier(.2, .8, .2, 1);           /* 임계 감쇠 — 기본 */
  --ease-spring: cubic-bezier(.3, 1.25, .45, 1);  /* 관성이 실린 동작에만 살짝 오버슛 */
  --axis: 138px;
  --rail: 72px;
  --row: 106px;
  --gap: 6px;
}
/* 화면 모드: 라이트(기본) · 다크 · 자동(기기 설정) — html[data-mode] */
@media (prefers-color-scheme: dark) {
  :root[data-mode="auto"] {
    --bg: #000000;
    --surface: #1c1c1e;
    --tile: #2c2c2e;
    --tile-hover: #3a3a3c;
    --lesson: #1e2d3e;
    --lesson-hover: #253850;
    --text: #f5f5f7;
    --text-2: #aeaeb2;
    --text-3: #8e8e93;
    --line: rgba(235, 235, 245, .12);
    --accent: #2997ff;
    --accent-soft: rgba(41, 151, 255, .18);
    --accent-tint: rgba(41, 151, 255, .08);
    --orange: #ff9f0a;
    --warn: #ffb340;
    --warn-soft: rgba(255, 159, 10, .2);
    --warn-tint: rgba(255, 159, 10, .08);
    --warn-tile: #2c2a27;
    --warn-tile-hover: #36332f;
    --red: #ff453a;
    --holi: #ff6961;
    --holi-soft: rgba(255, 69, 58, .2);
    --holi-tint: rgba(255, 69, 58, .07); --vac-tint: rgba(235, 235, 245, .05);
    --glass: rgba(22, 22, 24, .76);
    --platter-shadow: 0 0 0 .5px rgba(255, 255, 255, .08);
    --sheet-shadow: 0 0 0 .5px rgba(255, 255, 255, .1), 0 30px 80px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-mode="dark"] {
  --bg: #000000;
  --surface: #1c1c1e;
  --tile: #2c2c2e;
  --tile-hover: #3a3a3c;
  --lesson: #1e2d3e;
  --lesson-hover: #253850;
  --text: #f5f5f7;
  --text-2: #aeaeb2;
  --text-3: #8e8e93;
  --line: rgba(235, 235, 245, .12);
  --accent: #2997ff;
  --accent-soft: rgba(41, 151, 255, .18);
  --accent-tint: rgba(41, 151, 255, .08);
  --orange: #ff9f0a;
  --warn: #ffb340;
  --warn-soft: rgba(255, 159, 10, .2);
  --warn-tint: rgba(255, 159, 10, .08);
  --warn-tile: #2c2a27;
  --warn-tile-hover: #36332f;
  --red: #ff453a;
  --holi: #ff6961;
  --holi-soft: rgba(255, 69, 58, .2);
  --holi-tint: rgba(255, 69, 58, .07); --vac-tint: rgba(235, 235, 245, .05);
  --glass: rgba(22, 22, 24, .76);
  --platter-shadow: 0 0 0 .5px rgba(255, 255, 255, .08);
  --sheet-shadow: 0 0 0 .5px rgba(255, 255, 255, .1), 0 30px 80px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  letter-spacing: -.011em;
  word-break: keep-all; /* 한글은 어절 단위로 줄바꿈 */
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  min-height: 100vh;
  padding-bottom: env(safe-area-inset-bottom);
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ───────── 상단 바: 큰 제목이 사라지면 나타난다 ───────── */
.nav {
  position: fixed; inset: 0 0 auto 0; z-index: 30;
  height: calc(52px + env(safe-area-inset-top)); padding-top: env(safe-area-inset-top);
  display: flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 16px; font-weight: 650; letter-spacing: -.02em;
  background: var(--glass);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  backdrop-filter: blur(24px) saturate(180%);
  box-shadow: 0 .5px 0 var(--line);
  opacity: 0; transform: translateY(-6px); pointer-events: none;
  transition: opacity .3s var(--ease), transform .3s var(--ease);
}
.nav.on { opacity: 1; transform: none; }
.nav small { font-size: 13px; font-weight: 500; color: var(--text-2); }

/* ───────── 페이지 · 머리말 ───────── */
.page { max-width: 1180px; margin: 0 auto; padding: 0 24px 72px; }
.hero {
  padding: 40px 4px 22px;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap;
}
.eyebrow { font-size: 17px; font-weight: 600; color: var(--text-2); letter-spacing: -.015em; }
.hero h1 {
  margin-top: 2px;
  font-size: clamp(2rem, 4vw, 2.75rem);
  line-height: 1.06;
  font-weight: 700;
  letter-spacing: -.035em;
}
.notice { margin-top: 14px; display: grid; gap: 4px; }
.notice:empty { display: none; }
.nl { display: flex; align-items: center; gap: 8px; font-size: 17.5px; color: var(--text-2); }
.nl i { flex: none; width: 8px; height: 8px; border-radius: 50%; }
.nl i.o { background: var(--orange); }
.nl i.b { background: var(--accent); }
.nl b.b { color: var(--accent); }
.nl i.r { background: var(--red); }
.nl b { font-weight: 650; color: var(--warn); }
.nl b.r { color: var(--holi); }
.pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 16px 9px 14px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent);
  font-size: 15px; font-weight: 600; letter-spacing: -.01em;
  transition: transform .12s ease-out, opacity .12s ease-out;
}
.pill:active { transform: scale(.95); opacity: .7; }

/* ───────── 주간 표 ───────── */
.board {
  display: grid;
  grid-template-rows: auto repeat(7, var(--row));
  gap: var(--gap);
  padding: 8px 10px 10px;
  background: var(--surface);
  border-radius: 28px;
  box-shadow: var(--platter-shadow);
}
.colbg { grid-row: 1 / -1; border-radius: 18px; }
.colbg.today { background: var(--accent-tint); }
.colbg.eve { background: var(--warn-tint); }
.colbg.holi { background: var(--holi-tint); }
.colbg.vac { background: var(--vac-tint); }
.rowline {
  grid-column: 1 / -1; align-self: end; height: 1px;
  background: var(--line);
  transform: translateY(calc(var(--gap) / 2 + .5px));
  pointer-events: none;
}

/* 요일 머리 */
.ah { position: relative; grid-row: 1; grid-column: 1; align-self: end; padding: 0 0 13px 14px; font-size: 12px; font-weight: 600; color: var(--text-3); }
.dh { position: relative; grid-row: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; padding: 12px 4px 12px; }
.dh .wd { font-size: 16.5px; font-weight: 600; color: var(--text-2); line-height: 1.3; }
.dh .dn {
  margin-top: 3px; min-width: 36px; height: 36px; padding: 0 7px; border-radius: 18px;
  display: grid; place-items: center;
  font-size: 29px; font-weight: 650; letter-spacing: -.02em; line-height: 1;
}
.dh.today .wd { color: var(--accent); }
.dh.today .dn { background: var(--accent); color: #fff; }
.dh.eve .wd { color: var(--warn); }
.dh.holi .wd, .dh.holi .dn { color: var(--holi); }
.dh.holi.today .dn { background: var(--holi); color: #fff; }
.cap {
  margin-top: 8px; padding: 4px 10px; border-radius: 999px;
  font-size: 15px; font-weight: 700; letter-spacing: -.005em; white-space: nowrap;
}
.cap.eve { background: var(--warn-soft); color: var(--warn); }
.cap.holi { background: var(--holi-soft); color: var(--holi); }

/* 왼쪽 축: 교시 + 시간 */
.ax {
  position: relative; grid-column: 1;
  display: flex; flex-direction: column; justify-content: center;
  padding: 0 8px 0 14px; border-radius: 12px;
  transition: background-color .2s ease;
}
.ax b { font-size: 19px; font-weight: 650; letter-spacing: -.02em; line-height: 1.3; transition: color .2s ease; }
.ax span { font-size: 16px; font-weight: 500; color: var(--text-2); line-height: 1.4; white-space: nowrap; }
.ax.eve span { color: var(--warn); font-weight: 600; }
.ax.hl { background: var(--accent-tint); }
.ax.hl b { color: var(--accent); }
.ax.zero b { color: var(--text-2); }
#tmForm .hint { margin: 8px 26px 0; font-size: 13px; color: var(--text-3); }

/* 단축일(금요일·공휴일 전날) 전용 시간 축 — 그날 바로 옆, 같은 줄에 실제 시간 */
.rl {
  position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  border-radius: 12px; color: var(--warn); line-height: 1.3;
  transition: background-color .2s ease;
}
.rl b { font-size: 17px; font-weight: 700; }
.rl span { font-size: 14.5px; font-weight: 500; opacity: .75; }
.rl.hl { background: var(--warn-tint); }
.rl.hl b { text-decoration: underline; text-underline-offset: 3px; }

/* 수업 칸: 과목 / 교수님 / 강의실 */
.tile {
  position: relative; min-width: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  padding: 8px 10px; text-align: center;
  border-radius: 16px;
  background: var(--lesson);
  transition: transform .16s var(--ease), background-color .2s ease, box-shadow .2s ease;
  touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
}
@supports (corner-shape: squircle) {
  .tile, .board, .mgrid, .card, .colbg { corner-shape: squircle; }
  .tile { border-radius: 24px; } .colbg { border-radius: 26px; }
  .board, .mgrid { border-radius: 40px; } .card { border-radius: 44px; }
}
.tile.eve { background: var(--warn-tile); }
.tile.free { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.tt {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 26px; font-weight: 650; letter-spacing: -.025em; line-height: 1.25; word-break: keep-all;
}
.free .tt { font-size: 21px; font-weight: 600; color: var(--text-2); }
.tp { font-size: 17px; color: var(--text-2); line-height: 1.35; word-break: keep-all; }
.tr { margin-top: 4px; display: inline-flex; align-items: center; gap: 4px; font-size: 16px; font-weight: 600; color: var(--text-2); }
.tr svg { flex: none; }
.tile:active { transform: scale(.97); transition-duration: .08s; }
@media (hover: hover) {
  .tile:hover { background: var(--lesson-hover); }
  .tile.eve:hover { background: var(--warn-tile-hover); }
  .tile.free:hover { background: var(--tile); }
}
.tile.live { box-shadow: 0 0 0 2px var(--accent); }
.tile.live .tt::before {
  content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
  animation: pulse 1.6s ease-in-out infinite;
}
.dh.vac .wd, .dh.vac .dn { color: var(--text-3); }
.dh.today.vac .dn { color: #fff; }
.dh.today.vac .wd { color: var(--accent); }
.cap.vac { background: rgba(120, 120, 128, .14); color: var(--text-2); }
.vac-msg { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.vac-msg b { font-size: 22px; font-weight: 650; color: var(--text-3); }
.vac-msg.all b { font-size: 44px; font-weight: 700; letter-spacing: -.035em; color: var(--text); }
.vac-msg.all span { font-size: 18px; font-weight: 600; color: var(--text-2); }
.nl i.g { background: var(--text-3); }
.seg button.vac .d, .seg button.vac .m { color: var(--text-3); }
.mempty.vac b { color: var(--text); }
.holi-msg { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; }
.holi-msg b { font-size: 22px; font-weight: 650; color: var(--holi); }
.holi-msg span { font-size: 16.5px; color: var(--text-2); }

.board.enter .tile, .board.enter .holi-msg, .board.enter .vac-msg { animation: tileIn .55s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 45ms + 60ms); }
@keyframes tileIn { from { opacity: 0; transform: scale(.96); } }
@keyframes pulse { 50% { opacity: .3; } }

/* ───────── 모바일: 하루씩, 같은 구조 ───────── */
.mobile { display: none; }
.seg {
  position: sticky; top: calc(60px + env(safe-area-inset-top)); z-index: 12;
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 4px; border-radius: 22px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  backdrop-filter: blur(24px) saturate(180%);
  box-shadow: 0 0 0 .5px var(--line), 0 8px 24px rgba(0, 0, 0, .06);
}
.seg .thumb {
  position: absolute; top: 4px; bottom: 4px; left: 4px;
  width: calc((100% - 8px) / 5); border-radius: 18px;
  background: var(--surface);
  box-shadow: 0 0 0 .5px rgba(0, 0, 0, .06), 0 2px 8px rgba(0, 0, 0, .12);
  transform: translateX(calc(var(--idx, 0) * 100%));
  transition: transform .5s var(--ease-spring);
}
.seg button {
  position: relative; z-index: 1; padding: 8px 0 6px;
  display: flex; flex-direction: column; align-items: center; line-height: 1.15;
  transition: transform .12s ease-out;
}
.seg button:active { transform: scale(.93); }
.seg .d { font-size: 12.5px; font-weight: 600; color: var(--text-2); }
.seg .m { margin-top: 2px; font-size: 21px; font-weight: 650; letter-spacing: -.03em; }
.seg .dots { height: 5px; margin-top: 4px; display: flex; gap: 3px; }
.seg .dots i { width: 5px; height: 5px; border-radius: 50%; }
.seg .dots .t { background: var(--accent); }
.seg .dots .e { background: var(--orange); }
.seg .dots .h { background: var(--red); }
.seg button.today .d { color: var(--accent); }
.seg button.holi .d, .seg button.holi .m { color: var(--holi); }

#mday.slide { animation: slide .45s var(--ease) both; }
@keyframes slide { from { opacity: 0; transform: translateX(calc(var(--dir, 1) * 22px)); } }
.mgrid {
  margin-top: 14px;
  display: grid; grid-template-columns: 124px minmax(0, 1fr); grid-template-rows: repeat(7, 98px);
  gap: var(--gap); padding: 10px;
  background: var(--surface); border-radius: 26px; box-shadow: var(--platter-shadow);
}
.mempty {
  margin-top: 14px; padding: 56px 20px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
  background: var(--surface); border-radius: 26px; box-shadow: var(--platter-shadow);
}
.mempty b { font-size: 22px; font-weight: 700; color: var(--holi); letter-spacing: -.02em; }
.mempty span { font-size: 15px; color: var(--text-2); }

/* ───────── 시트 (상세 · 공휴일 지정) ───────── */
dialog.sheet {
  border: 0; padding: 0; background: transparent; color: var(--text);
  width: min(420px, calc(100% - 24px)); max-width: none; margin: auto; overflow: visible;
}
dialog.sheet::backdrop { background: rgba(0, 0, 0, .3); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
dialog.sheet[open] { animation: sheetIn .45s var(--ease) both; }
dialog.sheet[open]::backdrop { animation: fade .3s ease both; }
@keyframes sheetIn { from { opacity: 0; transform: translateY(28px) scale(.98); } }
@keyframes fade { from { opacity: 0; } }
.card { background: var(--surface); border-radius: 30px; box-shadow: var(--sheet-shadow); overflow: hidden; }
.grab { display: none; width: 36px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 0; }
.card .top { padding: 24px 26px 4px; }
.card .cap2 { font-size: 14px; font-weight: 600; color: var(--text-2); }
.card .cap2 em { font-style: normal; color: var(--warn); }
.card h2 { margin-top: 4px; font-size: 30px; font-weight: 700; letter-spacing: -.035em; line-height: 1.12; word-break: keep-all; }
.card .lead { margin-top: 8px; font-size: 15px; color: var(--text-2); line-height: 1.5; }
.card .lead b { color: var(--warn); font-weight: 650; }
.card dl { margin: 14px 26px 0; padding: 2px 16px; background: var(--tile); border-radius: 16px; }
.card .r { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 12px 0; font-size: 15px; }
.card .r + .r { border-top: .5px solid var(--line); }
.card dt { color: var(--text-2); flex: none; }
.card dd { font-weight: 600; text-align: right; }
.card dd.warn { color: var(--warn); }
.card dd.pl { font-weight: 500; line-height: 1.7; }
.card dd.pl b { font-weight: 600; color: var(--text-3); margin-right: 10px; }
.close {
  display: block; width: calc(100% - 52px); margin: 18px 26px 26px; padding: 14px;
  border-radius: 14px; text-align: center;
  background: var(--accent); color: #fff; font-size: 16px; font-weight: 650;
  transition: transform .1s ease-out, opacity .1s ease-out;
}
.close:active { transform: scale(.97); opacity: .85; }

.week { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding: 14px 18px 2px; }
.wday { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 0 6px; }
.wday .w { font-size: 12.5px; font-weight: 600; color: var(--text-3); transition: color .2s ease; }
.wday .n {
  width: 40px; height: 40px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 18px; font-weight: 600;
  transition: background-color .25s var(--ease), color .25s var(--ease), transform .35s var(--ease-spring);
}
.wday:active .n { transform: scale(.86); transition-duration: .1s; }
.wday.on .n { background: var(--red); color: #fff; }
.wday.on .w { color: var(--holi); }
.derived { margin: 12px 26px 0; padding: 2px 16px; border-radius: 16px; background: var(--tile); }
.drow { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; font-size: 15px; }
.drow + .drow { border-top: .5px solid var(--line); }
.drow .dl { font-weight: 600; }
.drow .dv { font-weight: 600; }
.drow .dv.eve { color: var(--warn); }
.drow .dv.holi { color: var(--holi); }
.dnone { padding: 12px 0; font-size: 14px; color: var(--text-2); }

/* ───────── 주 이동 ───────── */
.weeknav { position: relative; display: flex; align-items: center; gap: 2px; margin-left: -8px; }
.wn {
  width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--accent);
  transition: background-color .15s ease, transform .12s ease-out;
}
.wn:active { transform: scale(.88); background: var(--accent-soft); }
.wlabel { padding: 3px 8px; border-radius: 8px; transition: background-color .15s ease; }
.wlabel:active { background: rgba(120, 120, 128, .16); }
@media (hover: hover) { .wn:hover { background: var(--accent-tint); } .wlabel:hover { background: rgba(120, 120, 128, .1); } }
#weekPick { position: absolute; left: 40px; bottom: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.thisweek { margin-left: 8px; padding: 4px 11px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--accent); background: var(--accent-soft); }
.thisweek:active { transform: scale(.95); }

/* ───────── 편집 ───────── */
.hero-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.pill.alt { background: rgba(120, 120, 128, .12); color: var(--text); }
.editing #editToggle { background: var(--accent); color: #fff; }
.editing .tile { box-shadow: inset 0 0 0 1.5px var(--accent-soft); }
@media (hover: hover) { .editing .tile:hover { box-shadow: inset 0 0 0 2px var(--accent); } }
.tile.off { opacity: .45; }
.slot {
  position: relative; display: grid; place-items: center;
  border-radius: 16px; border: 1.5px dashed color-mix(in srgb, var(--accent) 45%, transparent);
  color: var(--accent); font-size: 20px;
  transition: background-color .2s ease, transform .12s ease-out;
}
.slot:active { transform: scale(.96); }
@media (hover: hover) { .slot:hover { background: var(--accent-tint); } }

.btnrow { display: flex; gap: 10px; margin: 18px 26px 26px; }
.btnrow .close { margin: 0; flex: 1; width: auto; }
.close.soft { background: var(--accent-soft); color: var(--accent); }
.fgroup { margin: 14px 26px 0; padding: 0 16px; background: var(--tile); border-radius: 16px; }
.field { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; padding: 6px 0; font-size: 15.5px; }
.field + .field { border-top: .5px solid var(--line); }
.field > span:first-child { flex: none; font-weight: 500; }
.field small { display: block; font-size: 12px; font-weight: 400; color: var(--text-3); }
.field input, .field select {
  flex: 1; min-width: 0; padding: 8px 0; border: 0; outline: none; background: transparent;
  font: inherit; color: var(--text); text-align: right;
}
.field input::placeholder { color: var(--text-3); }
.field input[aria-invalid="true"]::placeholder { color: var(--holi); }
.field select { -webkit-appearance: none; appearance: none; text-align-last: right; color: var(--accent); cursor: pointer; }
.field input[type="date"] { color: var(--accent); }
.segmini, .tabs { display: grid; gap: 2px; padding: 2px; border-radius: 9px; background: rgba(120, 120, 128, .12); }
.segmini { grid-template-columns: repeat(5, 1fr); flex: 0 1 230px; }
.tabs { grid-template-columns: 1fr 1fr; margin: 14px 26px 0; }
.segmini button, .tabs button { padding: 6px 0; border-radius: 7px; font-size: 14px; font-weight: 600; color: var(--text-2); transition: background-color .2s ease, color .2s ease; }
.segmini button[aria-pressed="true"], .tabs button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .12), 0 0 0 .5px rgba(0, 0, 0, .04); }
.tabs button[data-t="eve"][aria-selected="true"] { color: var(--warn); }
.sw { position: relative; flex: none; width: 51px; height: 31px; border-radius: 999px; background: rgba(120, 120, 128, .32); transition: background-color .3s var(--ease); }
.sw i { position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .28); transition: transform .4s var(--ease-spring), width .2s var(--ease); }
.sw:active i { width: 33px; }
.sw[aria-checked="true"] { background: #34c759; }
.sw[aria-checked="true"] i { transform: translateX(20px); }
.sw[aria-checked="true"]:active i { transform: translateX(14px); }
.tpair { display: flex; align-items: center; gap: 6px; }
.tpair i { font-style: normal; color: var(--text-3); }
.tpair input { flex: none; width: 66px; padding: 6px 0; border-radius: 8px; background: var(--surface); text-align: center; }
.impact { margin: 12px 26px 0; padding: 12px 14px; border-radius: 14px; background: var(--warn-soft); color: var(--warn); font-size: 14px; font-weight: 600; line-height: 1.55; }
.impact:empty { display: none; }
.impact small { display: block; margin-bottom: 2px; font-weight: 500; opacity: .85; }
.ferr { margin: 12px 26px 0; font-size: 14px; font-weight: 600; color: var(--holi); }
.ferr:empty { display: none; }
.danger { display: block; width: calc(100% - 52px); margin: -10px 26px 20px; padding: 12px; border-radius: 14px; text-align: center; font-size: 16px; font-weight: 600; color: var(--holi); }
.danger:active { background: var(--holi-soft); }

.editbar {
  position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 25;
  width: min(760px, calc(100% - 24px));
  display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap;
  padding: 12px 12px 12px 20px; border-radius: 24px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  backdrop-filter: blur(24px) saturate(180%);
  box-shadow: 0 0 0 .5px var(--line), 0 18px 48px rgba(0, 0, 0, .16);
  transform: translate(-50%, calc(100% + 40px)); opacity: 0; pointer-events: none;
  transition: transform .5s var(--ease-spring), opacity .3s var(--ease);
}
.editing .editbar { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.editbar p { font-size: 14px; color: var(--text-2); }
.editbar p b { color: var(--accent); }
.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.tools button { padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; background: rgba(120, 120, 128, .12); transition: transform .1s ease-out, opacity .1s ease-out; }
.tools button:active { transform: scale(.95); opacity: .7; }
.tools .red { color: var(--holi); }
.tools .done { background: var(--accent); color: #fff; }
.editing .page { padding-bottom: 200px; }
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 40;
  display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 18px; border-radius: 999px;
  background: rgba(29, 29, 31, .92); color: #fff; font-size: 14.5px; font-weight: 500; white-space: nowrap;
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  box-shadow: 0 12px 32px rgba(0, 0, 0, .25);
  transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
  transition: transform .45s var(--ease-spring), opacity .25s ease;
}
.toast.on { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.toast button { padding: 4px 8px; color: #64d2ff; font-weight: 650; }
.toast button[hidden] { display: none; }
.editing .toast { bottom: calc(130px + env(safe-area-inset-bottom)); }
@media (prefers-color-scheme: dark) { :root[data-mode="auto"] .toast { background: rgba(58, 58, 60, .95); } }
:root[data-mode="dark"] .toast { background: rgba(58, 58, 60, .95); }

/* ───────── 반응형 ───────── */
@media (max-width: 1080px) {
  :root { --axis: 124px; --rail: 64px; }
  .ax { padding-left: 10px; }
  .ax span { font-size: 14.5px; }
  .tt { font-size: 22px; }
  .tp { font-size: 15px; }
  .tr { font-size: 14.5px; }
  .cap { font-size: 12.5px; padding: 3px 8px; }
}
@media (max-width: 820px) {
  .page { padding: 0 16px 56px; }
  .hero { padding: 28px 2px 16px; }
  .pill { padding: 8px 12px; font-size: 14px; gap: 6px; }
  #modeBtn .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  #modeBtn { padding: 8px 10px; }
  .desktop { display: none; }
  .mobile { display: block; }
  .tt { font-size: 25px; }
  .tp { font-size: 17px; }
  .ax span { font-size: 15.5px; }
  dialog.sheet { margin: auto auto 10px; }
  .card { max-height: calc(100dvh - 20px); overflow-y: auto; }
  .card .grab, .card .top { touch-action: none; }
  .editbar p { display: none; }
  .editbar { padding: 8px; }
  .tools { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; width: 100%; }
  .tools::-webkit-scrollbar { display: none; }
  .tools button { flex: none; padding: 8px 12px; font-size: 13.5px; }
  .editing .toast { bottom: calc(80px + env(safe-area-inset-bottom)); }
  .grab { display: block; }
}

/* ───────── 접근성 · 인쇄 ───────── */
@media (prefers-reduced-motion: reduce) {
  .board.enter .tile, .board.enter .holi-msg, .board.enter .vac-msg, #mday.slide, dialog.sheet[open], dialog.sheet[open]::backdrop { animation: none; }
  .seg .thumb, .wday .n, .editbar, .toast, .sw i { transition: none; }
  .tile.live .tt::before { animation: none; }
}
@media (prefers-reduced-transparency: reduce) {
  .nav, .seg { background: var(--surface); -webkit-backdrop-filter: none; backdrop-filter: none; }
}
@media (prefers-contrast: more) {
  .tile { box-shadow: inset 0 0 0 1.5px currentColor; }
  :root { --line: rgba(60, 60, 67, .35); }
}
/* PDF 저장: A4 가로 한 장에 화면과 같은 디자인으로 */
@page { size: A4 landscape; margin: 10mm; }
@media print {
  :root {
    --bg: #fff; --surface: #fff; --tile: #f2f2f7; --lesson: #ebf4fd; --text: #1d1d1f; --text-2: #6e6e73; --text-3: #86868b;
    --line: rgba(60, 60, 67, .16); --accent: #0071e3; --accent-tint: rgba(0, 113, 227, .05);
    --warn: #c2410c; --warn-soft: rgba(255, 149, 0, .16); --warn-tint: rgba(255, 149, 0, .07); --warn-tile: #ffefd9;

    --axis: 112px; --rail: 58px; --row: 61px; --gap: 5px;
  }
  html, body { background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .num { font-variant-numeric: normal; } /* PDF에서 숫자도 복사·검색되도록 */
  .wn, .thisweek, .nav, .hero-actions, .mobile, .editbar, .toast, dialog, .slot { display: none !important; }
  .desktop { display: block !important; }
  .page { max-width: none; padding: 0; }
  .hero { padding: 0 2px 12px; }
  .eyebrow { font-size: 13px; }
  .hero h1 { font-size: 26px; }
  .notice { margin-top: 6px; }
  .nl { font-size: 12.5px; }
  .board { box-shadow: 0 0 0 1px #d2d2d7; padding: 6px 8px 8px; border-radius: 20px; }
  .board .tile, .board .holi-msg, .board .vac-msg { animation: none !important; }
  .tile { padding: 4px 8px; box-shadow: none; }
  .tile.live { box-shadow: none; }
  .tile.live .tt::before { display: none; }
  .tile.free { box-shadow: inset 0 0 0 1px var(--line); }
  .tt { font-size: 19px; }
  .free .tt { font-size: 16.5px; }
  .tp { font-size: 13.5px; }
  .tr { margin-top: 2px; font-size: 13px; }
  .dh { padding: 8px 4px; }
  .dh .dn { font-size: 19px; height: 30px; min-width: 30px; }

  .dh.today .dn { background: none; color: var(--text); }
  .colbg.today { background: none; }
  .cap { margin-top: 5px; font-size: 11px; }
  .ax b { font-size: 15.5px; }
  .ax span { font-size: 13px; }
}

/* 같은 모양을 페이지 안에서 PDF로 그릴 때 (claude.ai 링크) */
.pdf-mode { --bg: #fff; --surface: #fff; --tile: #f2f2f7; --lesson: #ebf4fd; --text: #1d1d1f; --text-2: #6e6e73; --text-3: #86868b;
    --line: rgba(60, 60, 67, .16); --accent: #0071e3; --accent-tint: rgba(0, 113, 227, .05);
    --warn: #c2410c; --warn-soft: rgba(255, 149, 0, .16); --warn-tint: rgba(255, 149, 0, .07); --warn-tile: #ffefd9;
    --holi: #d70015; --holi-soft: rgba(255, 59, 48, .12); --holi-tint: rgba(255, 59, 48, .045); --vac-tint: rgba(120, 120, 128, .07);
    --axis: 112px; --rail: 58px; --row: 61px; --gap: 5px; }
.pdf-mode { background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.pdf-mode .num { font-variant-numeric: normal; }
.pdf-mode .wn, .pdf-mode .thisweek, .pdf-mode .nav, .pdf-mode .hero-actions, .pdf-mode .mobile, .pdf-mode .editbar, .pdf-mode .toast, .pdf-mode dialog, .pdf-mode .slot { display: none !important; }
.pdf-mode .desktop { display: block !important; }
.pdf-mode .page { max-width: none; padding: 0; }
.pdf-mode .hero { padding: 0 2px 12px; }
.pdf-mode .eyebrow { font-size: 13px; }
.pdf-mode .hero h1 { font-size: 26px; }
.pdf-mode .notice { margin-top: 6px; }
.pdf-mode .nl { font-size: 12.5px; }
.pdf-mode .board { box-shadow: 0 0 0 1px #d2d2d7; padding: 6px 8px 8px; border-radius: 20px; }
.pdf-mode .board .tile, .pdf-mode .board .holi-msg, .pdf-mode .board .vac-msg { animation: none !important; }
.pdf-mode .tile { padding: 4px 8px; box-shadow: none; }
.pdf-mode .tile.live { box-shadow: none; }
.pdf-mode .tile.live .tt::before { display: none; }
.pdf-mode .tile.free { box-shadow: inset 0 0 0 1px var(--line); }
.pdf-mode .tt { font-size: 19px; }
.pdf-mode .free .tt { font-size: 16.5px; }
.pdf-mode .tp { font-size: 13.5px; }
.pdf-mode .tr { margin-top: 2px; font-size: 13px; }
.pdf-mode .dh { padding: 8px 4px; }
.pdf-mode .dh .dn { font-size: 19px; height: 30px; min-width: 30px; }
.pdf-mode .dh.today .wd { color: var(--text-2); }
.pdf-mode .dh.today .dn { background: none; color: var(--text); }

/* PDF에서 줄 높이가 넉넉해지면 글자도 키운다 */
.pdf-mode.pdf-roomy .tt { font-size: 22px; }
.pdf-mode.pdf-roomy .free .tt { font-size: 19px; }
.pdf-mode.pdf-roomy .tp { font-size: 15px; }

/* PDF 그리기 라이브러리는 안쪽 그림자를 못 그리므로 실제 테두리로 */

</style>

<body>
<div class="nav" id="nav" aria-hidden="true">주간 시간표<small id="navRange"></small></div>

<main class="page">
  <header class="hero">
    <div>
      <div class="weeknav">
        <button class="wn" id="prevWeek" aria-label="이전 주"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button class="wlabel eyebrow" id="weekLabel" aria-label="주 선택"></button>
        <input type="date" id="weekPick" tabindex="-1" aria-hidden="true">
        <button class="wn" id="nextWeek" aria-label="다음 주"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
        <button class="thisweek" id="thisWeek" hidden>이번 주</button>
      </div>
      <h1>주간 시간표</h1>
      <div class="notice" id="notice"></div>
    </div>
    <div class="hero-actions">
      <button class="pill" id="openSettings">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="4"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/><circle cx="15.5" cy="15" r="1.6" fill="currentColor" stroke="none"/></svg>
        공휴일 지정
      </button>
      <button class="pill alt" id="printPdf">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></svg>
        <span>PDF 저장</span>
      </button>
      <button class="pill alt" id="modeBtn"></button>
      <button class="pill alt" id="editToggle" aria-pressed="false">편집</button>
    </div>
  </header>

  <section class="desktop" aria-label="주간 시간표">
    <div class="board" id="board"></div>
  </section>

  <section class="mobile" aria-label="요일별 시간표">
    <div class="seg" id="seg" role="tablist"><div class="thumb"></div></div>
    <div id="mday"></div>
  </section>
</main>

<dialog class="sheet" id="sheet" aria-label="수업 상세"><div class="card" id="card"></div></dialog>
<dialog class="sheet" id="settings" aria-label="공휴일 지정"><div class="card" id="setcard"></div></dialog>
<dialog class="sheet" id="editor" aria-label="수업 편집"><div class="card" id="edcard"></div></dialog>
<dialog class="sheet" id="times" aria-label="교시 시간"><div class="card" id="tmcard"></div></dialog>
<dialog class="sheet" id="term" aria-label="학기 기간"><div class="card" id="trcard"></div></dialog>

<div class="editbar" id="editbar" aria-label="편집 도구">
  <p>칸을 눌러 수정하고, 빈 칸의 <b>＋</b>로 수업을 추가하세요. 0교시(08:00)는 수업이 있을 때만 표에 보여요.</p>
  <div class="tools">
    <button id="toolTimes">교시 시간</button>
    <button id="toolTerm">학기 기간</button>
    <button id="toolExport">내보내기</button>
    <button id="toolImport">불러오기</button>
    <button id="toolReset" class="red">초기화</button>
    <button id="toolDone" class="done">완료</button>
  </div>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastUndo" hidden>되돌리기</button></div>

<script>
/* ── 기본 데이터: 처음 상태이자 '초기화'의 기준 ── */
const PMAX = 7;                       // 0교시(팀빌딩 등, 있을 때만 표시) ~ 7교시
const ALL_P = [0, 1, 2, 3, 4, 5, 6, 7];
const DEFAULT = {
  weekStart: '2026-09-28', // 시간표 주의 월요일
  // [교시] = [시작, 끝]. 0교시는 수업이 있을 때만 표에 나타난다
  normal: [['08:00','08:50'],['09:00','09:50'],['10:00','10:50'],['11:00','11:50'],['14:00','14:50'],['15:00','15:50'],['16:00','16:50'],['17:00','17:50']],
  // 쉬는 날 전날(금요일·공휴일 전날): 오전 09:00–11:50, 오후 13:00–15:50, 7교시 없음 (팀빌딩이 있으면 0교시 08:00)
  eve:    [['08:00','08:50'],['09:00','09:50'],['10:00','10:50'],['11:00','11:50'],['13:00','13:50'],['14:00','14:50'],['15:00','15:50'], null],
  classes: [ // day: 0=월 … 4=금, from–to: 교시
    { day: 0, from: 1, to: 3, subject: '민생', profs: ['이혜환'], room: 'A206' },
    { day: 0, from: 4, to: 6, subject: '죄종별', profs: ['김재용'], room: 'A206' },
    { day: 0, from: 7, to: 7, subject: '자기주도학습', profs: [], room: 'A206', free: true },
    { day: 1, from: 1, to: 3, subject: '체포술', profs: ['강경덕', '전민주'], room: '유도장' },
    { day: 1, from: 4, to: 6, subject: '사격', profs: ['장영광'], room: 'A206' },
    { day: 1, from: 7, to: 7, subject: '자기주도학습', profs: [], room: 'A206', free: true },
    { day: 2, from: 1, to: 3, subject: '112초동', profs: ['최문영'], room: 'A206' },

    const dy = e.clientY - drag.y0;
    drag.pts.push({ y: e.clientY, t: e.timeStamp }); if (drag.pts.length > 6) drag.pts.shift();
    drag.y = dy > 0 ? dy : rubber(dy);
    card.style.transform = `translateY(${drag.y}px)`;
  });
  const end = () => {
    if (!drag) return;
    const a = drag.pts[0], z = drag.pts[drag.pts.length - 1];
    const v = ((z.y - a.y) / Math.max(1, z.t - a.t)) * 1000;
    const y = drag.y, h = card.offsetHeight, from = `translateY(${y}px)`;
    drag = null;
    if (Math.max(0, y) + project(v) > h * .45) {
      card.animate([{ transform: from }, { transform: `translateY(${h + 80}px)` }], { duration: 280, easing: 'cubic-bezier(.3,.7,.2,1)', fill: 'forwards' })
        .finished.then(() => dlg.close()).catch(() => {});
    } else {
      card.style.transform = '';
      card.animate([{ transform: from }, { transform: 'none' }], { duration: 450, easing: 'cubic-bezier(.3,1.2,.4,1)' });
    }
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
  dlg.addEventListener('close', () => { card.getAnimations().forEach((a) => a.cancel()); card.style.transform = ''; });
  dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });
}

let draft = null, editIndex = null;

function openEditor(i, preset) {

/* 겹치는 수업은 저장할 때 자동으로 줄이거나 뺀다 — 무엇이 바뀌는지는 저장 전에 미리 보여준다 */
function plan() {
  const d = { day: draft.day, from: draft.from, to: draft.to, subject: draft.subject.trim(), profs: draft.profs, room: draft.room.trim() || '미정' };
  if (draft.free) d.free = true;
  const out = [], notes = [];
  data.classes.forEach((c, i) => {
    if (i === editIndex) return;
    if (c.day !== d.day || c.to < d.from || c.from > d.to) { out.push(c); return; }
    const parts = [];
    if (c.from < d.from) parts.push({ ...c, to: d.from - 1 });
    if (c.to > d.to) parts.push({ ...c, from: d.to + 1 });
    out.push(...parts);
    notes.push(`‘${esc(c.subject)}’ ${perLabel(c)} → ${parts.length ? parts.map(perLabel).join(', ') + '로 줄어요' : '빠져요'}`);
  });
  out.push(d);
  out.sort((a, b) => a.day - b.day || a.from - b.from);
  return { classes: out, notes };
}

const normTime = (v) => {

  if (/^\d{3,4}$/.test(v)) v = v.padStart(4, '0').replace(/^(\d\d)(\d\d)$/, '$1:$2');

    inp.addEventListener('input', put);

  });
  f.querySelector('.tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { tmTab = b.dataset.t; renderTimes(); } });
  f.addEventListener('submit', (e) => { e.preventDefault(); saveTimes(); });

function timesError(list, name, allowEmpty) {
  let prev = null;
  for (let k = 0; k < list.length; k++) {
    if (list[k]) list[k] = list[k].map(normTime);
    if (!list[k] || (!list[k][0] && !list[k][1])) {
      if (allowEmpty && k > 0) { list[k] = null; continue; }
      return `${name} ${k}교시: 시간을 입력하세요.`;
    }
    const [s, e] = list[k];
    if (!isTime(s) || !isTime(e)) return `${name} ${k}교시: 시간을 09:00 형식으로 입력하세요.`;
    if (s >= e) return `${name} ${k}교시: 끝 시간이 시작보다 늦어야 해요.`;
    if (prev && s < prev[1][1]) return `${name} ${k}교시: ${prev[0]}교시가 끝나기 전에 시작해요.`;
    prev = [k, list[k]];
  }
  return '';
}
function saveTimes() {
  const err = timesError(tm.normal, '기본', false) || timesError(tm.eve, '금요일·공휴일 전날', true);
  if (err) { $('#tmErr').textContent = err; return; }
  const before = snapshot();
  data.normal = tm.normal; data.eve = tm.eve;

/* 파일 저장 — claude.ai 링크 안에서는 다운로드 기능으로, 일반 브라우저에서는 인쇄 창 · 링크로 */
let downloadsP = null;
const getDownloads = () => (downloadsP ??= window.claude?.use ? Promise.resolve(window.claude.use('downloads')).catch(() => null) : Promise.resolve(null));
async function saveFile(filename, data) {
  const dl = await getDownloads();
  if (dl) {
    try { await dl.save({ filename, data }); return true; }
    catch (e) { if (e?.code !== 'declined') toast('파일을 저장하지 못했어요'); return false; }
  }
  // 바탕화면에서 연 파일(file://)은 blob 링크의 파일 이름이 무시되므로 data: 링크를 쓴다
  const blob = data instanceof Blob ? data : new Blob([data]);
  const href = await new Promise((ok) => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(blob); });
  const a = document.createElement('a');
  a.href = href; a.download = filename; a.style.display = 'none';
  document.body.appendChild(a); a.click(); a.remove();
  return true;
}
const loadScript = (src) => new Promise((ok, no) => {
  const el = document.createElement('script'); el.src = src; el.onload = ok; el.onerror = no; document.head.appendChild(el);
});
async function makePdf() {
  const btn = $('#printPdf'), label = btn.querySelector('span');
  btn.disabled = true; label.textContent = 'PDF 만드는 중…';
  try {
    try {
      if (!window.html2canvas) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
      if (!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    } catch (e) {
      // 인터넷이 안 되면 PDF 도구를 못 불러온다 → 브라우저 인쇄 창으로 (claude 링크에서는 인쇄가 막혀 있음)
      if (!(await getDownloads())) { window.print(); return; }
      throw e;
    }
    if (editing) setEditing(false);
    document.querySelectorAll('.tile.live').forEach((el) => el.classList.remove('live')); // '진행 중' 표시는 PDF에 넣지 않는다
    const canvas = await window.html2canvas($('.page'), {
      scale: 2.5, backgroundColor: '#ffffff', windowWidth: 1240, logging: false,
      onclone: (doc) => {
        doc.body.classList.add('pdf-mode');
        // 줄 높이를 늘려 A4 가로(277×190mm) 비율에 맞춘다
        const page = doc.querySelector('.page'), n = doc.querySelectorAll('.board .ax').length || 7;
        const r0 = parseFloat(doc.defaultView.getComputedStyle(doc.body).getPropertyValue('--row')) || 61;
        const r = Math.max(r0, Math.min(120, r0 + (page.offsetWidth / (277 / 190) - page.offsetHeight) / n));
        doc.body.style.setProperty('--row', `${Math.floor(r)}px`);
        if (r >= 76) doc.body.classList.add('pdf-roomy');
      },
    });
    const pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    const mw = 277, mh = 190, r = Math.min(mw / canvas.width, mh / canvas.height);
    const w = canvas.width * r, h = canvas.height * r;
    pdf.addImage(canvas.toDataURL('image/jpeg', .92), 'JPEG', 10 + (mw - w) / 2, 10, w, h);
    if (await saveFile(`시간표_${data.weekStart}.pdf`, pdf.output('blob'))) toast('PDF를 저장했어요');
  } catch (e) {
    toast('PDF를 만들지 못했어요');
  } finally {
    tick();
    btn.disabled = false; label.textContent = 'PDF 저장';
  }
}
/* 인쇄 창을 거치지 않고 가로 A4 PDF를 직접 만든다 — PC의 프린터 기본 방향(세로)에 영향받지 않도록 */
$('#printPdf').addEventListener('click', makePdf);

});

/* ── 주 이동: 화살표 · 날짜 선택 · 이번 주 ── */
// 지금 봐야 할 주: 평일이면 이번 주, 주말이면 다음 주
const currentWeek = () => { const d = getNow(), g = d.getDay(); d.setDate(d.getDate() + (g === 6 ? 2 : g === 0 ? 1 : 0)); return mondayOf(iso(d)); };
function setWeek(date) {
  const m = mondayOf(date);
  if (m === data.weekStart) return;
  data.weekStart = m; applyData();
  cur = Math.max(0, todayIdx());
  render();
}
const shiftWeek = (n) => { const d = parseISO(data.weekStart); d.setDate(d.getDate() + 7 * n); setWeek(iso(d)); };
$('#prevWeek').addEventListener('click', () => shiftWeek(-1));
$('#nextWeek').addEventListener('click', () => shiftWeek(1));
$('#thisWeek').addEventListener('click', () => setWeek(currentWeek()));
$('#weekLabel').addEventListener('click', () => {
  const p = $('#weekPick'); p.value = data.weekStart;
  try { p.showPicker(); } catch (e) { p.focus(); p.click(); }
});
$('#weekPick').addEventListener('change', (e) => { if (isDate(e.target.value)) setWeek(e.target.value); });

/* ── 공휴일 지정 ── */
function buildSettings() {
  $('#setcard').innerHTML = `
    <div class="grab"></div>
    <div class="top">
      <h2>공휴일 지정</h2>
      <p class="lead">공휴일로 지정한 날은 수업이 없고, 그 전날은 금요일처럼 <b>${EVE[1][0]} – ${lastEnd(EVE)}</b> 시간표가 돼요.</p>
    </div>
    <div class="week">${DAYS.map((d) => `
      <button class="wday" data-date="${d.date}" aria-label="${d.dow}요일 ${d.md} 공휴일">
        <span class="w">${d.dow}</span><span class="n num">${d.n}</span>
      </button>`).join('')}
    </div>
    <div class="derived" id="derived"></div>
    <button class="close" id="setDone">완료</button>`;
  $('#setDone').onclick = () => settings.close();
  syncSettings();
}
function syncSettings() {
  document.querySelectorAll('.wday').forEach((b) => {
    const on = holidays.has(b.dataset.date);
    b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on));
  });
  const rows = [];
  DAYS.forEach((d, i) => {
    if (eveByHoliday(i)) rows.push(`<div class="drow"><span class="dl">${d.dow}요일 ${d.md}</span><span class="dv eve num">${dayRange(i)}</span></div>`);
    if (isHoli(i)) rows.push(`<div class="drow"><span class="dl">${d.dow}요일 ${d.md}</span><span class="dv holi">공휴일 · 수업 없음</span></div>`);
  });
  $('#derived').innerHTML = rows.join('') || '<p class="dnone">이번 주에 지정된 공휴일이 없어요.</p>';
}
$('#openSettings').addEventListener('click', () => { buildSettings(); settings.showModal(); });
settings.addEventListener('click', (e) => {
  const w = e.target.closest('.wday'); if (!w) return;
  const date = w.dataset.date;
  holidays.has(date) ? holidays.delete(date) : holidays.add(date);
  saveAll(); syncSettings(); render();
});

/* ── 화면 모드 ── */
const MODES = { light: ['라이트', '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/>'],
  dark: ['다크', '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/>'],
  auto: ['자동', '<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17Z" fill="currentColor"/>'] };
function paintMode() {
  const m = document.documentElement.dataset.mode in MODES ? document.documentElement.dataset.mode : 'light';
  $('#modeBtn').innerHTML = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${MODES[m][1]}</svg><span class="lbl">${MODES[m][0]}</span>`;
  $('#modeBtn').setAttribute('aria-label', `화면 모드: ${MODES[m][0]} (눌러서 바꾸기)`);
}
$('#modeBtn').addEventListener('click', () => {
  const order = ['light', 'dark', 'auto'], m = document.documentElement.dataset.mode;
  const next = order[(order.indexOf(m) + 1) % order.length];
  document.documentElement.dataset.mode = next;
  try { localStorage.setItem('timetable.mode', next); } catch (e) {}
  paintMode(); toast(`화면 모드: ${MODES[next][0]}`);
});
paintMode();

/* ── 공통 ── */
function updateTop() {
  $('#weekLabel').textContent = `${DAYS[0].m}월 ${DAYS[0].n}일 – ${DAYS[4].m}월 ${DAYS[4].n}일`;
  $('#thisWeek').hidden = currentWeek() === data.weekStart;
  $('#navRange').textContent = `${DAYS[0].md} – ${DAYS[4].md}`;
  const ho = idx((i) => isHoli(i) && !isVac(i)), va = idx(isVac), lines = [];
  if (va.length === 5) lines.push(`<p class="nl"><i class="g"></i><span>이번 주는 방학이에요 · ${vacText()}</span></p>`);
  else if (va.length) lines.push(`<p class="nl"><i class="g"></i><span>${dayNames(va)}은 방학이에요 · ${vacText()}</span></p>`);
  if (ho.length) lines.push(`<p class="nl"><i class="r"></i><span>${dayNames(ho)}은 <b class="r">공휴일</b>이라 수업이 없어요.</span></p>`);
  $('#notice').innerHTML = lines.join('');
}
function tick() {
  const now = getNow();
  document.querySelectorAll('.tile').forEach((el) => el.classList.toggle('live', isLive(BLOCKS[+el.dataset.i], now)));
}
function render() {
  computeBlocks(); buildBoard(); buildSeg(); buildDay(0); updateTop(); tick();
  firstRender = false;
}

new IntersectionObserver(([e]) => $('#nav').classList.toggle('on', !e.isIntersecting), { rootMargin: '-40px 0px 0px 0px' })
  .observe(document.querySelector('.hero h1'));

data.weekStart = currentWeek(); applyData();
cur = Math.max(0, todayIdx());
render();
setInterval(tick, 30000);
</script>
</body>
</html>
