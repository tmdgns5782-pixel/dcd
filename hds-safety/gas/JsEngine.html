<script>
/* ===== [engine-a] 시작 ===== */
(function () {
  "use strict";
  /* HDS 안전장부 — 양식 엔진(로직) + 편집기 화면 [engine-a]
     로직 함수는 DOM 없이도 돌아간다(Node 시험용). 저장소는 App.api 계약(SPEC §6), 상태는 App.S.
     기록 data 모양(engine-b 읽기 화면과 공유):
       필드            data[fieldId] = 값 (number 는 숫자, bool 은 true/false, multi·people 은 문자열 배열, photo 는 파일 id)
       표              data[sectionId] = [{ _k: 행키, <colId>: 값, … }]
       체크리스트      data[sectionId] = { <itemCode>: { r: '양호'|'주의'|'불량'|'해당없음', note, photo } }
       사진 묶음       data[sectionId] = [{ file: 파일id, label, at }]
       서명            data[sectionId] = { 'r:<역할>'|'p:<이름>': { img: 파일id, paper: true, at, by } } */
  var G = (typeof window !== 'undefined') ? window : globalThis;
  var App = G.App = G.App || {};
  var E = App.engine = App.engine || {};
  App.actions = App.actions || {};

  /* ───────── 기본 도구 ───────── */
  function pad(n, w) { n = String(n); w = w || 2; while (n.length < w) n = '0' + n; return n; }
  function dkey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function isoLocal(d) { return dkey(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
  function nowIso() { return isoLocal(new Date()); }
  function today() { return dkey(new Date()); }
  function hhmm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function parseD(s) {
    if (!s) return null;
    var p = String(s).slice(0, 10).split('-');
    var y = Number(p[0]), m = Number(p[1] || 1), d = Number(p[2] || 1);
    if (!y || isNaN(m) || isNaN(d)) return null;
    return new Date(y, m - 1, d);
  }
  function addDays(s, n) { var d = parseD(s) || new Date(); d.setDate(d.getDate() + n); return dkey(d); }
  function addMonths(s, n) {
    var d = parseD(s) || new Date(); var day = d.getDate();
    var t = new Date(d.getFullYear(), d.getMonth() + n, 1);
    var last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
    t.setDate(Math.min(day, last)); return dkey(t);
  }
  function daysDiff(a, b) { var x = parseD(a), y = parseD(b); if (!x || !y) return null; return Math.round((y - x) / 86400000); }
  function isEmpty(v) { return v === undefined || v === null || v === '' || (Array.isArray(v) && v.length === 0); }
  function clone(o) { return o === undefined || o === null ? o : JSON.parse(JSON.stringify(o)); }
  function uid() { return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4); }
  function round1(x) { return Math.round(x * 10) / 10; }
  function num(v) { return (v === '' || v === null || v === undefined || v === true || v === false || isNaN(Number(v))) ? null : Number(v); }
  function esc(v) {
    return String(v === undefined || v === null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function asArr(v) {
    if (Array.isArray(v)) return v;
    if (typeof v === 'string' && v.charAt(0) === '[') { try { return JSON.parse(v); } catch (e) { return []; } }
    return [];
  }
  function asObj(v) {
    if (v && typeof v === 'object') return v;
    if (typeof v === 'string' && v.charAt(0) === '{') { try { return JSON.parse(v); } catch (e) { return {}; } }
    return {};
  }
  function mmdd(s) { return s ? String(s).slice(5, 10) : ''; }
  function fmtDT(s) { return s ? String(s).replace('T', ' ').slice(0, 16) : ''; }
  function uniq(arr) { var o = []; arr.forEach(function (x) { if (o.indexOf(x) < 0) o.push(x); }); return o; }
  function hash(s) { var h = 0; s = String(s); for (var i = 0; i < s.length; i++) { h = ((h << 5) - h + s.charCodeAt(i)) | 0; } return Math.abs(h); }

  /* ───────── FD·상태 접근(JsCore 가 없을 때도 동작) ───────── */
  function FD() {
    if (App.FD) return App.FD;
    if (typeof document !== 'undefined') {
      var el = document.getElementById('forms-data');
      if (el) { try { App.FD = JSON.parse(el.textContent); } catch (e) { /* 아래 빈 값 */ } }
    }
    return App.FD || { forms: [] };
  }
  function formDef(code) {
    if (code && typeof code === 'object') return code;
    if (App.FORM && App.FORM[code]) return App.FORM[code];
    var fs = FD().forms || [];
    for (var i = 0; i < fs.length; i++) if (fs[i].code === code) return fs[i];
    return null;
  }
  function S() { return App.S || {}; }
  function mapVals(m) {
    if (!m) return [];
    if (typeof m.values === 'function' && typeof m.get === 'function') return Array.from(m.values());
    if (Array.isArray(m)) return m;
    return Object.keys(m).map(function (k) { return m[k]; });
  }
  /* 기록 색인(indexRow, data 없음). App.recs 가 있으면 그것을 쓰고, 없으면 App.S.index */
  function idx(fn) {
    var rows;
    if (typeof App.recs === 'function') { try { rows = App.recs(fn); } catch (e) { rows = null; } }
    if (!Array.isArray(rows)) rows = mapVals(S().index);
    return rows.filter(function (r) { return r && !r.deleted && (!fn || fn(r)); });
  }
  function actList(fn) {
    var rows;
    if (typeof App.acts === 'function') { try { rows = App.acts(fn); } catch (e) { rows = null; } }
    if (!Array.isArray(rows)) rows = mapVals(S().acts);
    return rows.filter(function (a) { return a && !a.deleted && (!fn || fn(a)); });
  }
  function siteOf(id) {
    if (id && typeof id === 'object') return id;
    if (!id) return null;
    if (typeof App.site === 'function') { try { var s = App.site(id); if (s) return s; } catch (e) { /* 아래 */ } }
    var list = S().sites || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function peopleOf(siteId) {
    if (typeof App.peopleOf === 'function') { try { return App.peopleOf(siteId) || []; } catch (e) { /* 아래 */ } }
    return (S().people || []).filter(function (p) { return p.site === siteId && p.active !== false; });
  }
  function cachedRecord(id) { var m = S().records; if (!m || !id) return null; return typeof m.get === 'function' ? m.get(id) : m[id]; }
  var DEF_SETTINGS = {
    dailyDue: '10:00', monthlyDueDay: 5,
    requiredForms: { default: ['F07', 'F09', 'F01', 'N1', 'N2', 'N4', 'F08B', 'F10B'], seasonal: { F06: [6, 7, 8, 9] } }
  };
  function setting(k) { var s = S().settings || {}; return s[k] !== undefined && s[k] !== null ? s[k] : DEF_SETTINGS[k]; }
  function isHQ() {
    if (typeof App.isHQ === 'function') { try { return !!App.isHQ(); } catch (e) { /* 아래 */ } }
    var me = S().me; return !!(me && me.kind === 'hq');
  }
  function factsOfRow(r) { return asObj(r && r.facts); }
  function isDone(r) { return !!r && (r.status === '제출' || r.status === '확인'); }
  function isReported(r) { return isDone(r) || (r && r.status === '반려') || asArr(r && r.stageDone).length > 0; }
  function isOpenAct(a) { return a && ['완료', '확인'].indexOf(a.status) < 0; }

  /* ───────── 기간·마감 (서버 periodOf 와 같은 규칙, SPEC §5) ───────── */
  function periodOf(type, date) {
    var ds = date ? String(date).slice(0, 10) : today();
    var d = parseD(ds) || new Date(); var y = d.getFullYear(), m = d.getMonth();
    if (type === 'monthly' || type === 'season') return { key: y + '-' + pad(m + 1), from: dkey(new Date(y, m, 1)), to: dkey(new Date(y, m + 1, 0)), label: y + '년 ' + (m + 1) + '월' };
    if (type === 'quarterly') { var q = Math.floor(m / 3); return { key: y + '-Q' + (q + 1), from: dkey(new Date(y, q * 3, 1)), to: dkey(new Date(y, q * 3 + 3, 0)), label: y + '년 ' + (q + 1) + '분기' }; }
    if (type === 'half') { var h = m < 6 ? 0 : 1; return { key: y + '-H' + (h + 1), from: dkey(new Date(y, h * 6, 1)), to: dkey(new Date(y, h * 6 + 6, 0)), label: y + '년 ' + (h ? '하' : '상') + '반기' }; }
    if (type === 'annual') return { key: String(y), from: y + '-01-01', to: y + '-12-31', label: y + '년' };
    if (type === 'daily') return { key: ds, from: ds, to: ds, label: (m + 1) + '월 ' + d.getDate() + '일' };
    return { key: '', from: ds, to: ds, label: '수시' };
  }
  /* 기간 키('2026-10', '2026-Q3', '2026-H2', '2026', '2026-10-31') → 그 기간 */
  function periodFromKey(type, key) {
    var k = String(key || ''), mm;
    if ((mm = k.match(/^(\d{4})-Q([1-4])$/))) return periodOf('quarterly', mm[1] + '-' + pad((Number(mm[2]) - 1) * 3 + 1) + '-01');
    if ((mm = k.match(/^(\d{4})-H([12])$/))) return periodOf('half', mm[1] + (mm[2] === '1' ? '-01-01' : '-07-01'));
    if ((mm = k.match(/^(\d{4})-(\d{2})$/))) return periodOf(type === 'season' ? 'season' : 'monthly', k + '-01');
    if ((mm = k.match(/^(\d{4})$/))) return periodOf('annual', k + '-01-01');
    if (/^\d{4}-\d{2}-\d{2}/.test(k)) return periodOf(type, k);
    return null;
  }
  function validPeriodKey(type, key) {
    var k = String(key || '');
    if (type === 'monthly' || type === 'season') return /^\d{4}-\d{2}$/.test(k);
    if (type === 'quarterly') return /^\d{4}-Q[1-4]$/.test(k);
    if (type === 'half') return /^\d{4}-H[12]$/.test(k);
    if (type === 'annual') return /^\d{4}$/.test(k);
    if (type === 'daily') return /^\d{4}-\d{2}-\d{2}$/.test(k);
    return k === '';
  }
  function dueOf(def, p) {
    var f = (def && def.frequency) || {}, r = f.dueRule || {};
    if (r.kind === 'nextDayTime') return addDays(p.to, 1);
    if (r.kind === 'monthDay') return addDays(p.to, Number(f.type === 'monthly' ? setting('monthlyDueDay') : r.day) || Number(r.day) || 5);
    if (r.kind === 'periodEndPlusDays') return addDays(p.to, Number(r.days) || 0);
    return p.to;
  }
  function seasonMonthsOf(def) {
    var rf = setting('requiredForms') || {}; var sm = (rf.seasonal || {})[def.code];
    if (Array.isArray(sm) && sm.length) return sm.map(Number);
    return ((def.frequency || {}).seasonMonths || []).map(Number);
  }
  function rowPeriod(r) { return r.period || r.date; }

  /* ───────── 조건 표시 ───────── */
  function showOk(cond, data, site) {
    if (!cond) return true;
    data = data || {};
    if (cond.siteTag) {
      var s = siteOf(site); var tags = (s && asArr(s.tags)) || [];
      if (!tags.length) return true;               /* 직무 태그를 정하지 않은 사업장은 모든 항목을 보인다 */
      return tags.indexOf(cond.siteTag) >= 0;
    }
    if (cond.field) {
      var v = data[cond.field];
      var alt = v === true ? '예' : v === false ? '아니오' : v === '예' ? true : v === '아니오' ? false : v;
      if (cond.in) {
        if (Array.isArray(v)) return v.some(function (x) { return cond.in.indexOf(x) >= 0; });
        return cond.in.indexOf(v) >= 0 || cond.in.indexOf(alt) >= 0;
      }
      if (cond.notIn) return Array.isArray(v) ? !v.some(function (x) { return cond.notIn.indexOf(x) >= 0; }) : (cond.notIn.indexOf(v) < 0 && !isEmpty(v));
      if (cond.gte !== undefined) return num(v) !== null && Number(v) >= cond.gte;
      if (cond.lte !== undefined) return num(v) !== null && Number(v) <= cond.lte;
      if (cond.eq !== undefined) return v === cond.eq || alt === cond.eq;
      if (cond.notEmpty) return !isEmpty(v);
    }
    return true;
  }

  /* ───────── 정의 탐색 ───────── */
  function sectionStage(def, secId) {
    if (!def.stages) return 0;
    for (var i = 0; i < def.stages.length; i++) if ((def.stages[i].sections || []).indexOf(secId) >= 0) return i;
    return 0;
  }
  function fieldList(def) {
    var out = [];
    (def.header || []).forEach(function (f) { out.push({ f: f, sec: '_head' }); });
    (def.sections || []).forEach(function (s) { if (s.type === 'fields') (s.fields || []).forEach(function (f) { out.push({ f: f, sec: s.id }); }); });
    return out;
  }
  var fmCache = {};
  function fieldMap(def) {
    var k = def.code + '@' + def.version;
    if (fmCache[k]) return fmCache[k];
    var m = {}; fieldList(def).forEach(function (x) { m[x.f.id] = x; });
    fmCache[k] = m; return m;
  }
  function secById(def, id) { var ss = def.sections || []; for (var i = 0; i < ss.length; i++) if (ss[i].id === id) return ss[i]; return null; }
  function checklistItems(s, rec) { return (s.items || []).filter(function (it) { return showOk(it.showIf, rec.data, rec.site); }); }
  function sigTargets(s, rec) {
    if (s.from) {
      var v = rec.data[s.from];
      var ppl = Array.isArray(v) ? v : (v ? [v] : []);
      return ppl.filter(Boolean).map(function (n) { return { key: 'p:' + n, label: n }; });
    }
    return (s.roles || []).map(function (r) { return { key: 'r:' + r, label: r }; });
  }

  /* ───────── 계산 ───────── */
  function timeToMin(v) {
    if (!v) return null; var s = String(v);
    if (s.indexOf('T') > 0 || s.length > 8) {
      var d = parseD(s); if (!d) return null;
      var tm = s.slice(11, 16).split(':');
      return d.getTime() / 60000 + (Number(tm[0]) || 0) * 60 + (Number(tm[1]) || 0);
    }
    var p = s.split(':').map(Number); return isNaN(p[0]) ? null : p[0] * 60 + (p[1] || 0);
  }
  function calcValue(calc, args, data, row, ctx) {
    args = args || {}; data = data || {};
    var g = function (id) { return (row && row[id] !== undefined) ? row[id] : data[id]; };
    switch (calc) {
      case 'riskScore': { var a = num(g(args.a)), b = num(g(args.b)); return a !== null && b !== null && a && b ? Math.round(a * b * 10) / 10 : ''; }
      case 'riskGrade': { var sc = num(g(args.score)); if (!sc) return ''; return sc <= 2 ? '낮음' : sc <= 4 ? '보통' : '높음'; }
      case 'sum': { var t = 0, any = false; (args.fields || []).forEach(function (f) { var v = num(g(f)); if (v !== null) { t += v; any = true; } }); return any ? t : ''; }
      case 'ratio': { var n = num(g(args.num)), d = num(g(args.den)); return n !== null && d ? round1(n / d * 100) : ''; }
      case 'minutesBetween': {
        var x = timeToMin(g(args.from)), y = timeToMin(g(args.to)); if (x === null || y === null) return '';
        var mi = Math.round(y - x); if (mi < 0 && String(g(args.from)).length <= 5) mi += 1440; return mi;
      }
      case 'hoursBetween': { var h1 = timeToMin(g(args.from)), h2 = timeToMin(g(args.to)); if (h1 === null || h2 === null) return ''; var dm = h2 - h1; if (dm < 0) dm += 1440; return Math.round(dm / 6) / 10; }
      case 'daysBetween': { var fa = g(args.from), fb = g(args.to); if (!fa || !fb) return ''; var dd = daysDiff(fa, fb); return dd === null ? '' : dd; }
      case 'countRows': { var tr = data[args.table]; return Array.isArray(tr) ? tr.length : 0; }
      case 'countWhere': { var tw = data[args.table]; return Array.isArray(tw) ? tw.filter(function (r) { return (args.values || []).indexOf(r[args.column]) >= 0; }).length : 0; }
      case 'countChecklist': { var c = asObj(data[args.section]); return Object.keys(c).filter(function (k) { return c[k] && (args.values || []).indexOf(c[k].r) >= 0; }).length; }
      case 'checklistRate': {
        var cc = asObj(data[args.section]); var vals = Object.keys(cc).map(function (k) { return cc[k]; }).filter(function (x) { return x && x.r; });
        var tot = vals.filter(function (x) { return (args.exclude || []).indexOf(x.r) < 0; }).length; if (!tot) return '';
        return round1(vals.filter(function (x) { return (args.good || []).indexOf(x.r) >= 0; }).length / tot * 100);
      }
      case 'countPeople': { var p = data[args.field]; return Array.isArray(p) ? p.length : (p ? 1 : 0); }
      case 'autoMonthly': return ctx ? autoMonthly(args.metric, ctx) : '';
      default: return '';
    }
  }
  /* F09 월간보고 자동 집계 — App.recs 색인(indexRow.facts)과 App.S.acts 로 계산.
     사용하는 facts 키:
       F04 재해·사고  facts.v.kind ('재해'|'아차사고'|'무상해'), 발생일 facts.v.occurredAt
       F02 소통센터   facts.v.kind ('아차사고'|…), 발견일 facts.v.foundAt
       F05 수칙위반   facts.v.occurredAt          F10 작업중지  facts.v.hazardAt
       N1 교육        facts.v.eduDate, 참석 facts.v.attendCount (없으면 facts.v['attendees#n'])
       N2 훈련        facts.v.drillDate           N3 허가서     facts.v.planStart
       F07 일일점검   색인 period(=점검일)·status 만 사용
     건수는 보고된 기록만(제출·확인·반려 또는 단계 보고). 일일점검 제출은 제출·확인만. */
  var EVENT_DATE_KEY = { F04: 'occurredAt', F02: 'foundAt', F05: 'occurredAt', F10: 'hazardAt', N1: 'eduDate', N2: 'drillDate', N3: 'planStart' };
  function eventDateOf(r) {
    var k = EVENT_DATE_KEY[r.form]; var v = k && (factsOfRow(r).v || {})[k];
    return v ? String(v).slice(0, 10) : String(r.date || '').slice(0, 10);
  }
  function monthRange(ctx) {
    var base = (ctx.data && ctx.data.reportMonth) || ctx.date || today();
    var p = periodOf('monthly', base); return [p.from, p.to];
  }
  function autoMonthly(metric, ctx) {
    var rg = monthRange(ctx), from = rg[0], to = rg[1], site = ctx.site, t = today();
    var R = idx(function (r) { return r.site === site && r.id !== ctx.id; });
    var inM = function (r) { var d = eventDateOf(r); return d >= from && d <= to; };
    var by = function (code) { return R.filter(function (r) { return r.form === code && isReported(r) && inM(r); }); };
    var kindOf = function (r) { return String((factsOfRow(r).v || {}).kind || ''); };
    var A = actList(function (a) { return a.site === site; });
    switch (metric) {
      case 'incidents': return by('F04').filter(function (r) { return !/아차|무상해/.test(kindOf(r)); }).length;
      case 'nearMiss': return by('F04').filter(function (r) { return /아차/.test(kindOf(r)); }).length + by('F02').filter(function (r) { return /아차/.test(kindOf(r)); }).length;
      case 'actsOpened': return A.filter(function (a) { var d = String(a.createdAt || '').slice(0, 10); return d >= from && d <= to; }).length;
      case 'actsClosed': return A.filter(function (a) { var d = String(a.doneAt || '').slice(0, 10); return d && d >= from && d <= to; }).length;
      case 'actsOverdue': return A.filter(function (a) { return isOpenAct(a) && a.status !== '보류' && a.due && a.due <= to && a.due < t; }).length;
      case 'dailySubmitted': return R.filter(function (r) { var d = rowPeriod(r); return r.form === 'F07' && isDone(r) && d >= from && d <= to; }).length;
      case 'dailyExpected': {
        var s = siteOf(site) || {}; var shifts = Math.max(1, asArr(s.shifts).length || 1);
        var end = to < t ? to : addDays(t, -1); var start = s.openDate && s.openDate > from ? s.openDate : from;
        var days = end >= start ? daysDiff(start, end) + 1 : 0; return days * shifts;
      }
      case 'eduSessions': return by('N1').length;
      case 'eduAttendees': return by('N1').reduce(function (n, r) { var v = factsOfRow(r).v || {}; return n + (Number(v.attendCount) || Number(v['attendees#n']) || 0); }, 0);
      case 'drills': return by('N2').length;
      case 'stopWork': return by('F10').length;
      case 'violations': return by('F05').length;
      case 'ptw': return by('N3').length;
      case 'voices': return by('F02').length;
      default: return '';
    }
  }
  function computeAll(def, rec) {
    if (!def || !rec) return rec;
    rec.data = rec.data || {};
    var ctx = { site: rec.site, date: rec.date, data: rec.data, id: rec.id };
    var d = rec.data;
    for (var pass = 0; pass < 2; pass++) {
      (def.header || []).forEach(function (f) { if (f.type === 'computed') d[f.id] = calcValue(f.calc, f.args, d, null, ctx); });
      (def.sections || []).forEach(function (s) {
        if (s.type === 'fields') (s.fields || []).forEach(function (f) { if (f.type === 'computed') d[f.id] = calcValue(f.calc, f.args, d, null, ctx); });
        if (s.type === 'table' && Array.isArray(d[s.id])) d[s.id].forEach(function (row) { (s.columns || []).forEach(function (c) { if (c.type === 'computed') row[c.id] = calcValue(c.calc, c.args, d, row, ctx); }); });
      });
    }
    return rec;
  }
