<script>
/* ===== [engine-a] 시작 ===== */
(function () {
  "use strict";
})();
/* ===== [engine-a] 끝 ===== */
/* ===== [engine-b] 시작 ===== */
(function () {
  "use strict";
  /* engine-b: 기록 읽기 화면(rec)·표준 양식 목록(forms)·A4 인쇄·엑셀(xlsx)·값 표시.
     App.engine 에 Object.assign 으로 붙인다. 다른 파일의 객체는 함수 안에서만 참조한다. */
  var App = window.App = window.App || {};
  var E = App.engine = App.engine || {};

  /* ───────── 작은 도구(외부 의존 없음) ───────── */
  var ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return ESC_MAP[c]; }); }
  function isEmpty(v) { return v === undefined || v === null || v === '' || (Array.isArray(v) && v.length === 0); }
  function pad(n) { n = String(n); return n.length < 2 ? '0' + n : n; }
  function dkey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function nowIso() { var d = new Date(); return dkey(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
  function today() { return dkey(new Date()); }
  function parseD(s) { var p = String(s || '').slice(0, 10).split('-').map(Number); return new Date(p[0] || 1970, (p[1] || 1) - 1, p[2] || 1); }
  function addDays(s, n) { var d = parseD(s); d.setDate(d.getDate() + n); return dkey(d); }
  function daysDiff(a, b) { return Math.round((parseD(b) - parseD(a)) / 86400000); }
  function fmtD(s) { return s ? String(s).slice(0, 10) : ''; }
  function fmtDT(s) { return s ? String(s).replace('T', ' ').slice(0, 16) : ''; }
  function fmtNum(v) {
    var n = Number(v);
    if (!isFinite(n)) return String(v);
    var a = Math.abs(n);
    var s = Number.isInteger(a) ? String(a) : String(Math.round(a * 100) / 100);
    var p = s.split('.');
    p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (n < 0 ? '-' : '') + p.join('.');
  }
  function isNumLike(v) { return typeof v === 'number' ? isFinite(v) : (typeof v === 'string' && /^-?\d+(\.\d+)?$/.test(v.trim())); }
  function icon(name, size) { try { return App.icon ? App.icon(name, size || 16) : ''; } catch (e) { return ''; } }
  function toast(msg, tone) { if (typeof App.toast === 'function') App.toast(msg, tone); }
  function pill(text, tone) { return '<span class="pill ' + (tone || 'neu') + '">' + esc(text) + '</span>'; }
  function uniq(arr) { var o = []; arr.forEach(function (x) { if (o.indexOf(x) < 0) o.push(x); }); return o; }
  function argOf(args, i) {
    var a = Array.isArray(args) ? args : (args == null ? [] : String(args).split('/'));
    var v = a[i] == null ? '' : String(a[i]);
    try { return decodeURIComponent(v); } catch (e) { return v; }
  }
  function qget(query, key) {
    if (!query) return '';
    if (typeof query.get === 'function') return query.get(key) || '';
    if (typeof query === 'string') { var m = new RegExp('(^|[?&])' + key + '=([^&]*)').exec(query); return m ? decodeURIComponent(m[2]) : ''; }
    return query[key] || '';
  }

  /* ───────── 앱 상태 접근(계약: App.S, App.FORM, App.site …) ───────── */
  function FDx() { return App.FD || {}; }
  function allForms() { return App.FORMS || FDx().forms || []; }
  function formOf(code) {
    if (App.FORM && App.FORM[code]) return App.FORM[code];
    var l = allForms();
    for (var i = 0; i < l.length; i++) if (l[i].code === code) return l[i];
    return null;
  }
  function S() { return App.S || {}; }
  function me() { return S().me || {}; }
  function isHQ() { try { return App.isHQ ? !!App.isHQ() : me().kind === 'hq'; } catch (e) { return false; } }
  function canWrite() { try { return App.canWrite ? !!App.canWrite() : (me().role && me().role !== 'viewer'); } catch (e) { return false; } }
  function isAdmin() { try { return App.isAdmin ? !!App.isAdmin() : me().role === 'admin'; } catch (e) { return false; } }
  function hqWrite() { return isHQ() && canWrite(); }
  function siteObj(id) { try { return (App.site && App.site(id)) || null; } catch (e) { return null; } }
  function siteLabel(id) { var s = siteObj(id); return id ? (id + (s && s.name ? ' ' + s.name : '')) : ''; }
  function company() { var st = S().settings || {}; return st.company || (window.BOOT && window.BOOT.company) || 'HDS(주) 안전경영지원실'; }
  function indexRows(fn) {
    try { if (App.recs) return App.recs(fn) || []; } catch (e) { /* 아래 대체 */ }
    var m = S().index; var out = [];
    if (m && m.forEach) m.forEach(function (r) { if (!r.deleted && (!fn || fn(r))) out.push(r); });
    return out;
  }
  function actsOf(fn) {
    try { if (App.acts) return App.acts(fn) || []; } catch (e) { /* 아래 대체 */ }
    var m = S().acts; var out = [];
    if (m && m.forEach) m.forEach(function (a) { if (!a.deleted && (!fn || fn(a))) out.push(a); });
    return out;
  }
  function indexGet(id) { var m = S().index; return m && m.get ? m.get(id) : null; }
  function storeRecord(r) {
    if (!r || !r.id) return;
    var m = S().records; if (m && m.set) m.set(r.id, r);
    try { if (App.putIndex) App.putIndex(r); } catch (e) { /* 색인 갱신 실패는 화면 갱신으로 보정 */ }
  }
  function userName(uid) {
    if (!uid) return '';
    if (/^site:/.test(uid)) return '사업장';
    var us = S().users || [];
    for (var i = 0; i < us.length; i++) if (us[i].id === uid) return us[i].name || uid;
    return uid;
  }
  function getFileUrl(id) {
    if (!id || !App.getFile) return Promise.reject(new Error('사진 없음'));
    return Promise.resolve(App.getFile(id)).then(function (r) {
      var url = typeof r === 'string' ? r : (r && (r.dataUrl || r.url)) || '';
      if (!url) throw new Error('사진 없음');
      return url;
    });
  }
  function apiCall(method, payload) {
    if (!App.api) return Promise.reject(new Error('서버에 연결되지 않았습니다.'));
    return Promise.resolve(App.api(method, payload));
  }

  /* 조건 표시(engine-a 의 showOk 우선) */
  function showOk(cond, data, site) {
    if (!cond) return true;
    if (typeof E.showOk === 'function') { try { return !!E.showOk(cond, data || {}, site); } catch (e) { /* 아래 대체 */ } }
    if (cond.siteTag) { var s = siteObj(site); return ((s && s.tags) || []).indexOf(cond.siteTag) >= 0; }
    if (cond.field) {
      var v = (data || {})[cond.field];
      if (cond.in) {
        if (Array.isArray(v)) return v.some(function (x) { return cond.in.indexOf(x) >= 0; });
        var vv = v === true ? '예' : v === false ? '아니오' : v;
        return cond.in.indexOf(v) >= 0 || cond.in.indexOf(vv) >= 0;
      }
      if (cond.gte !== undefined) return Number(v) >= cond.gte;
      if (cond.eq !== undefined) return v === cond.eq;
    }
    return true;
  }

  /* ───────── 값 표시 ───────── */
  var NUM_CALC = ['riskScore', 'sum', 'ratio', 'minutesBetween', 'hoursBetween', 'daysBetween', 'countRows', 'countWhere', 'countChecklist', 'checklistRate', 'countPeople', 'autoMonthly'];
  function isNumField(f) { return !!f && (f.type === 'number' || (f.type === 'computed' && NUM_CALC.indexOf(f.calc) >= 0)); }
  function nameOf(x) { return x && typeof x === 'object' ? (x.name || x.label || x.id || '') : String(x == null ? '' : x); }
  function vtext(f, v, empty) {
    if (empty === undefined) empty = '—';
    f = f || {};
    var t = f.type;
    if (isEmpty(v)) return empty;
    if (t === 'bool' || typeof v === 'boolean') {
      if (v === true || v === 'true' || v === '예') return '예';
      if (v === false || v === 'false' || v === '아니오') return '아니오';
    }
    if (Array.isArray(v)) {
      var a = v.map(nameOf).filter(function (x) { return x !== ''; });
      return a.length ? a.join(', ') : empty;
    }
    if (t === 'photo') return '사진 1장';
    if (v && typeof v === 'object') return nameOf(v) || empty;
    if (t === 'date') return fmtD(v);
    if (t === 'datetime') return fmtDT(v);
    if (t === 'time') { var s = String(v); if (s.indexOf('T') >= 0) s = s.split('T')[1]; return s.slice(0, 5); }
    if ((t === 'number' || t === 'computed') && isNumLike(v)) return fmtNum(v) + (f.unit || '');
    return String(v);
  }
  /** 필드 타입별 사람이 읽는 문자열. 빈 값은 '—'. */
  function valueText(f, v) { return vtext(f, v, '—'); }

  /* ───────── 단계 ───────── */
  function stageIndexOf(def, secId) {
    var st = def.stages || [];
    for (var i = 0; i < st.length; i++) if ((st[i].sections || []).indexOf(secId) >= 0) return i;
    return -1;
  }
  function stageState(def, rec) {
    var st = def.stages || []; var done = rec.stageDone || [];
    var full = !st.length || rec.status === '제출' || rec.status === '확인';
    var cur = -1;
    if (!full) { for (var i = 0; i < st.length; i++) if (done.indexOf(st[i].id) < 0) { cur = i; break; } }
    if (!full && cur < 0) full = true;
    return {
      stages: st, done: done, full: full, cur: cur,
      isDone: function (i) { return full || (i >= 0 && done.indexOf(st[i].id) >= 0); },
      visible: function (i) { return full || i < 0 || done.indexOf(st[i].id) >= 0; }
    };
  }

  /* ───────── 요약값 ───────── */
  function fieldById(def, id) {
    var lists = [def.header || []];
    (def.sections || []).forEach(function (s) { if (s.fields) lists.push(s.fields); });
    for (var i = 0; i < lists.length; i++) for (var j = 0; j < lists[i].length; j++) if (lists[i][j].id === id) return lists[i][j];
    return null;
  }
  function summaryUnit(def, sd) {
    var c = sd && sd.calc; var a = (sd && sd.args) || {};
    if (c === 'ratio' || c === 'checklistRate') return '%';
    if (c === 'countPeople') return '명';
    if (c === 'minutesBetween') return '분';
    if (c === 'hoursBetween') return '시간';
    if (c === 'daysBetween') return '일';
    if (c === 'sum') { var f = fieldById(def, (a.fields || [])[0]); return (f && f.unit) || ''; }
    if (c === 'countRows' || c === 'countWhere' || c === 'countChecklist') return '건';
    return '';
  }
  function summaryItems(def, rec) {
    var list = [];
    try { list = (typeof E.summaryOf === 'function' ? E.summaryOf(def, rec) : []) || []; } catch (e) { list = []; }
    return list.map(function (x, i) {
      var sd = (def.summary || [])[i] || {};
      var u = summaryUnit(def, sd);
      if (/\((분|일|h)\)$/.test(x.label || '')) u = '';
      return { label: x.label, value: x.value, unit: u };
    });
  }
  function kpiValue(k) {
    if (isEmpty(k.value)) return '<span class="faint">—</span>';
    if (isNumLike(k.value)) return esc(fmtNum(k.value)) + (k.unit ? '<span class="unit">' + esc(k.unit) + '</span>' : '');
    return esc(k.value);
  }
  function chunkBalanced(arr, max) {
    if (arr.length <= max) return [arr];
    var n = Math.ceil(arr.length / max); var size = Math.ceil(arr.length / n); var out = [];
    for (var i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
    return out;
  }
  function kpisHtml(items) {
    if (!items.length) return '';
    return chunkBalanced(items, 5).map(function (g) {
      return '<div class="kpis rv-kpis" style="--n:' + g.length + '">' + g.map(function (k) {
        return '<div class="kpi"><div class="kpi-label">' + esc(k.label) + '</div><div class="kpi-value num">' + kpiValue(k) + '</div></div>';
      }).join('') + '</div>';
    }).join('');
  }

  /* ───────── 기간 라벨 ───────── */
  function periodKeyLabel(k) {
    var m;
    k = String(k || '');
    if ((m = /^(\d{4})-(\d{2})$/.exec(k))) return m[1] + '년 ' + Number(m[2]) + '월';
    if ((m = /^(\d{4})-Q([1-4])$/.exec(k))) return m[1] + '년 ' + m[2] + '분기';
    if ((m = /^(\d{4})-H([12])$/.exec(k))) return m[1] + '년 ' + (m[2] === '1' ? '상' : '하') + '반기';
    if ((m = /^(\d{4})$/.exec(k))) return m[1] + '년';
    return k;
  }
  function periodLabel(def, rec) {
    var t = def && def.frequency && def.frequency.type;
    if (!t || t === 'event') return '';
    if (rec.period) return periodKeyLabel(rec.period);
    try { if (App.u && App.u.periodOf && rec.date) return App.u.periodOf(t, rec.date).label || ''; } catch (e) { /* 표시 생략 */ }
    return '';
  }
  var FREQ = { daily: '매일', monthly: '매월', quarterly: '분기', half: '반기', annual: '연 1회', season: '하절기', event: '수시' };
  function freqLabel(def) {
    var f = def.frequency || {};
    var s = FREQ[f.type] || '수시';
    if (f.type === 'daily' && f.shifts) s += '(근무조별)';
    if (f.type === 'season' && f.seasonMonths && f.seasonMonths.length) s += '(' + Math.min.apply(null, f.seasonMonths) + '~' + Math.max.apply(null, f.seasonMonths) + '월)';
    return s;
  }

  /* ───────── 사진 늦게 불러오기 ───────── */
  var HY = { q: [], running: 0, io: null, mo: null, t: 0 };
  function thumbHtml(id, cap, cls) {
    if (!id) return '<span class="faint">—</span>';
    return '<button type="button" class="rv-thumb' + (cls ? ' ' + cls : '') + '" data-act="fe.rv-photo" data-rv-file="' + esc(id) + '" data-cap="' + esc(cap || '') + '" aria-label="' + esc((cap || '사진') + ' 크게 보기') + '"><span class="rv-thumb-ph"></span></button>';
  }
  function fileIdOf(v) { if (!v) return ''; if (typeof v === 'string') return v; return v.file || v.id || v.img || v.paper || ''; }
  function pump() {
    while (HY.running < 4 && HY.q.length) {
      (function (el) {
        HY.running++;
        getFileUrl(el.getAttribute('data-rv-file')).then(function (url) {
          var img = document.createElement('img');
          img.alt = el.getAttribute('data-cap') || '';
          img.decoding = 'async';
          img.src = url;
          el.innerHTML = '';
          el.appendChild(img);
          el.classList.add('is-loaded');
        }).catch(function () {
          el.innerHTML = '<span class="rv-thumb-err">사진 없음</span>';
          el.classList.add('is-err');
        }).then(function () { HY.running--; pump(); });
      })(HY.q.shift());
    }
  }
  function enqueue(el) { HY.q.push(el); pump(); }
  /** root 안의 사진 자리([data-rv-file])를 보이는 순서대로 불러온다. */
  function hydrate(root) {
    root = root || document;
    if (!root.querySelectorAll) return;
    if (!HY.io && typeof IntersectionObserver === 'function') {
      HY.io = new IntersectionObserver(function (ents) {
        ents.forEach(function (en) { if (en.isIntersecting) { HY.io.unobserve(en.target); enqueue(en.target); } });
      }, { rootMargin: '240px' });
    }
    var els = root.querySelectorAll('[data-rv-file]:not([data-hyd])');
    for (var i = 0; i < els.length; i++) {
      els[i].setAttribute('data-hyd', '1');
      if (HY.io) HY.io.observe(els[i]); else enqueue(els[i]);
    }
  }
  function ensureObserver() {
    if (HY.mo || typeof MutationObserver !== 'function' || !document.body) return;
    HY.mo = new MutationObserver(function () {
      clearTimeout(HY.t);
      HY.t = setTimeout(function () { hydrate(document); }, 40);
    });
    HY.mo.observe(document.body, { childList: true, subtree: true });
  }
  function openPhoto(el) {
    var id = el.getAttribute('data-rv-file'); var cap = el.getAttribute('data-cap') || '사진';
    getFileUrl(id).then(function (url) {
      if (!App.dialog) { window.open(url, '_blank'); return; }
      var h = App.dialog({ title: cap, wide: true, body: '<div class="rv-photo-big"><img src="' + esc(url) + '" alt="' + esc(cap) + '"></div>', actions: [{ label: '닫기', onClick: function () { try { h.close(); } catch (e) { /* 이미 닫힘 */ } } }] });
    }).catch(function () { toast('사진을 불러오지 못했습니다.', 'neg'); });
  }

  /* ───────── 기록 본문(읽기) ───────── */
  function panel(title, sub, body, o) {
    o = o || {};
    return '<section class="panel rv-sec' + (o.cls ? ' ' + o.cls : '') + '"' + (o.id ? ' data-sec="' + esc(o.id) + '"' : '') + '>' +
      '<header class="panel-hd"><div><h2>' + esc(title) + '</h2>' + (sub ? '<p class="panel-sub">' + sub + '</p>' : '') + '</div>' +
      (o.actions ? '<div class="panel-actions">' + o.actions + '</div>' : '') + '</header>' +
      '<div class="panel-bd' + (o.flush ? ' flush' : '') + '">' + body + '</div></section>';
  }
  function refHtml(v) {
    var id = typeof v === 'object' ? (v && v.id) : v;
    if (!id) return '<span class="faint">—</span>';
    var row = indexGet(id); var d = row ? formOf(row.form) : null;
    return '<button type="button" class="rv-link mono" data-href="#/rec/' + esc(encodeURIComponent(id)) + '">' + esc(id) + '</button>' +
      (d ? ' <span class="muted">' + esc(d.short) + (row.date ? ' · ' + esc(row.date) : '') + '</span>' : '');
  }
  function valueHtml(f, v) {
    if (isEmpty(v)) return '<span class="faint">—</span>';
    if (f.type === 'photo') return thumbHtml(fileIdOf(v), f.label);
    if (f.type === 'ref') return refHtml(v);
    var t = vtext(f, v, '');
    if (t === '') return '<span class="faint">—</span>';
    if (f.type === 'textarea') return '<span class="rv-pre">' + esc(t) + '</span>';
    return esc(t);
  }
  function isWide(f) { return (f.width || 1) >= 3 || f.type === 'textarea'; }
  function kvHtml(cells) {
    return '<dl class="rv-kv">' + cells.map(function (c) {
      return '<div' + (c.wide ? ' class="rv-wide"' : '') + '><dt>' + esc(c.label) + '</dt><dd>' + c.html + '</dd></div>';
    }).join('') + '</dl>';
  }
  function headInfo(def, rec) {
    var d = rec.data || {};
    var cells = [
      { label: '사업장', html: esc(siteLabel(rec.site)) || '<span class="faint">—</span>' },
      { label: '작성일', html: esc(rec.date || '') + (rec.shift ? ' · ' + esc(rec.shift) : '') || '<span class="faint">—</span>' },
      { label: '작성자', html: esc(rec.author || '') || '<span class="faint">—</span>' }
    ];
    var pl = periodLabel(def, rec);
    cells.push(pl ? { label: '기간', html: esc(pl) } : { label: '기록번호', html: '<span class="mono">' + esc(rec.id || '') + '</span>' });
    (def.header || []).forEach(function (f) {
      if (!showOk(f.showIf, d, rec.site)) return;
      cells.push({ label: f.label, html: valueHtml(f, d[f.id]), wide: isWide(f) });
    });
    return panel('기본 정보', '', kvHtml(cells), { id: '_head' });
  }
  function secFields(def, rec, s) {
    var d = rec.data || {};
    var fs = (s.fields || []).filter(function (f) { return showOk(f.showIf, d, rec.site); });
    if (!fs.length) return '';
    var filled = fs.filter(function (f) { return !isEmpty(d[f.id]); }).length;
    return panel(s.title || '입력', filled < fs.length ? '<span class="num">' + filled + '/' + fs.length + '</span>칸 입력' : '',
      kvHtml(fs.map(function (f) { return { label: f.label, html: valueHtml(f, d[f.id]), wide: isWide(f) }; })), { id: s.id });
  }
  function judgeTone(s, r) {
    if (!r) return 'neu';
    var lv = s.act && s.act.on && s.act.on[r];
    if (lv === '높음') return 'neg';
    if (lv) return 'warn';
    if (r === '해당없음' || r === 'N/A') return 'neu';
    var i = (s.scale || []).indexOf(r);
    return i === 0 ? 'pos' : i === 1 ? 'warn' : i === 2 ? 'neg' : 'neu';
  }
  function isGoodJudge(s, r) { return !!r && (judgeTone(s, r) === 'pos' || r === '해당없음' || r === 'N/A'); }
  function scaleOf(s) { return s.scale || ((FDx().codes || {}).checkScale) || ['양호', '주의', '불량', '해당없음']; }
  function secChecklist(def, rec, s) {
    var d = rec.data || {}; var c = d[s.id] || {}; var scale = scaleOf(s);
    var items = (s.items || []).filter(function (it) { return showOk(it.showIf, d, rec.site); });
    var cnt = {}; var undecided = 0;
    items.forEach(function (it) { var r = (c[it.code] || {}).r; if (r) cnt[r] = (cnt[r] || 0) + 1; else undecided++; });
    var bad = items.filter(function (it) { var r = (c[it.code] || {}).r; return !isGoodJudge(s, r); }).length;
    var withPhoto = (s.photoOn && s.photoOn.length) || items.some(function (it) { return c[it.code] && c[it.code].photo; });
    var ncol = withPhoto ? 5 : 4;
