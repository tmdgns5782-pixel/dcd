<script>
/* ===== [analytics-a] 시작 ===== */
(function () {
  "use strict";
  /* 분석 공통(App.analytics: 범위·필터·탭·행 고르기·월별 묶기·인쇄) + 화면 hq:analytics(개요), hq:analytics/incidents(재해·사고),
     hq:analytics/risk(위험성평가). 모든 숫자는 App.S(index·acts·sites)와 FD 에서 서버 호출 없이 계산한다.
     파일 순서와 무관하게 동작하도록, 다른 파일의 객체(App.u, App.ui, App.engine, Charts)는 함수 안에서만 찾는다. */
  var App = window.App = window.App || {};
  var A = App.analytics = App.analytics || {};

  /* ---------- 작은 도구 ---------- */
  var ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  function esc(v) { return v == null ? '' : String(v).replace(/[&<>"']/g, function (c) { return ESC[c]; }); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function dkey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseD(s) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || '')); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
  function isDay(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s || '')); }
  function today() {
    try { if (App.u && typeof App.u.today === 'function') { var t = App.u.today(); if (isDay(t)) return t; } } catch (e) { /* 기본값 사용 */ }
    return dkey(new Date());
  }
  function addDays(s, n) { var d = parseD(s); if (!d) return ''; d.setDate(d.getDate() + n); return dkey(d); }
  function addMonths(s, n) {
    var d = parseD(s); if (!d) return '';
    var day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n);
    var last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, last));
    return dkey(d);
  }
  function monthStart(s, n) { var d = parseD(s); if (!d) return ''; d.setDate(1); d.setMonth(d.getMonth() + (n || 0)); return dkey(d); }
  function monthEnd(s) { var d = parseD(s); if (!d) return ''; return dkey(new Date(d.getFullYear(), d.getMonth() + 1, 0)); }
  function diffDays(a, b) { var x = parseD(a), y = parseD(b); return x && y ? Math.round((y - x) / 864e5) : null; }
  var NF = {};
  function nf(d) { var k = d || 0; return NF[k] || (NF[k] = new Intl.NumberFormat('ko-KR', { minimumFractionDigits: k, maximumFractionDigits: k })); }
  function num(v, d) { return v == null || v === '' || !isFinite(v) ? '—' : nf(d).format(+v); }
  function pctTxt(r, d) { return r == null || !isFinite(r) ? '—' : nf(d == null ? 1 : d).format(r * 100) + '%'; }
  function toSet(arr) { var o = {}; (arr || []).forEach(function (k) { o[k] = true; }); return o; }
  function sum(arr, fn) { return (arr || []).reduce(function (a, x) { var v = fn ? fn(x) : x; v = +v; return a + (isFinite(v) ? v : 0); }, 0); }
  function median(arr) { var a = arr.filter(function (v) { return v != null && isFinite(v); }).map(Number).sort(function (x, y) { return x - y; }); if (!a.length) return null; var m = Math.floor(a.length / 2); return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; }
  function icon(name) { try { return App.icon ? App.icon(name) : ''; } catch (e) { return ''; } }
  function minus(v) { return v < 0 ? '−' + Math.abs(v) : (v > 0 ? '+' : '') + v; }
  // 받침에 따라 이/가, 은/는, 을/를, 과/와, (으)로 — 한글이 아니면 앞의 것을 괄호로
  function josa(word, pair) {
    var w = String(word || ''), ch = w.charCodeAt(w.length - 1), p = pair.split('/');
    if (ch >= 0xAC00 && ch <= 0xD7A3) {
      var jong = (ch - 0xAC00) % 28;
      if (pair === '으로/로') return w + (jong === 0 || jong === 8 ? '로' : '으로');
      return w + (jong ? p[0] : p[1]);
    }
    if (/[0-9]$/.test(w)) return w + p[0];
    return w + p[0] + '(' + p[1] + ')';
  }
  // 선택지 이름에서 괄호 설명을 뗀 짧은 이름: '넘어짐(미끄러짐·걸림 포함)' → '넘어짐'
  function short(label) { var s = String(label == null ? '' : label); var i = s.indexOf('('); return i > 0 ? s.slice(0, i).trim() : s; }

  /* ---------- 데이터 접근(JsCore 가 채운 App.S, 없으면 빈 값) ---------- */
  function S() { return App.S || {}; }
  function listOf(x) {
    if (!x) return [];
    if (Array.isArray(x)) return x;
    if (typeof x.values === 'function') return Array.from(x.values());
    return Object.keys(x).map(function (k) { return x[k]; });
  }
  function FD() {
    if (App.FD) return App.FD;
    if (!A._fd) {
      try { A._fd = JSON.parse(document.getElementById('forms-data').textContent); }
      catch (e) { A._fd = { forms: [], kpiCodes: [], codes: {} }; }
    }
    return A._fd;
  }
  function formDef(code) {
    if (App.FORM && App.FORM[code]) return App.FORM[code];
    var f = (FD().forms || []).filter(function (x) { return x.code === code; })[0];
    return f || null;
  }
  function allSites() { return listOf(S().sites); }
  function siteOf(id) {
    try { if (typeof App.site === 'function') { var s = App.site(id); if (s) return s; } } catch (e) { /* 아래로 */ }
    return allSites().filter(function (s) { return s.id === id; })[0] || null;
  }
  function siteName(id) { var s = siteOf(id); return s && s.name ? s.name : (id || '—'); }
  function stageList(r) {
    var s = r && r.stageDone;
    if (typeof s === 'string') { try { s = JSON.parse(s); } catch (e) { s = s ? [s] : []; } }
    return Array.isArray(s) ? s : [];
  }
  function counted(r) {
    if (!r || r.deleted === true || r.deleted === 'TRUE') return false;
    if (r.status === '제출' || r.status === '확인') return true;
    return r.status === '작성중' && stageList(r).length > 0;
  }
  function allIndex() {
    try { if (typeof App.recs === 'function') { var a = App.recs(function () { return true; }); if (Array.isArray(a)) return a; } } catch (e) { /* 아래로 */ }
    return listOf(S().index).filter(function (r) { return r && r.deleted !== true; });
  }
  function allActs() {
    try { if (typeof App.acts === 'function') { var a = App.acts(function () { return true; }); if (Array.isArray(a)) return a; } } catch (e) { /* 아래로 */ }
    return listOf(S().acts).filter(function (x) { return x && x.deleted !== true; });
  }
  function settings() { return S().settings || {}; }
  // 사업장의 필수 양식(엔진이 있으면 엔진 규칙, 없으면 사업장 설정 → 기본값)
  function requiredForms(site, refDate) {
    try {
      if (App.engine && typeof App.engine.requiredForms === 'function') {
        var r = App.engine.requiredForms(site.id, refDate);
        if (!Array.isArray(r)) r = App.engine.requiredForms(site, refDate);
        if (Array.isArray(r)) return r.map(function (x) { return typeof x === 'string' ? x : x && (x.code || x.form); }).filter(Boolean);
      }
    } catch (e) { /* 아래로 */ }
    if (site && Array.isArray(site.forms) && site.forms.length) return site.forms;
    var rf = settings().requiredForms || {};
    return rf['default'] || ['F07', 'F09', 'F01', 'N1', 'N2', 'N4', 'F08B', 'F10B'];
  }

  /* ---------- facts 읽기 ---------- */
  function facts(r) { var f = r && r.facts; if (typeof f === 'string') { try { f = JSON.parse(f); } catch (e) { f = null; } } return f || {}; }
  A.facts = facts;
  A.fv = function (r, id) { var v = facts(r).v; return v ? v[id] : undefined; };
  A.fcount = function (r, id) {
    var v = facts(r).v || {}, n = v[id + '#n'];
    if (n != null && n !== '') return +n || 0;
    var x = v[id]; return Array.isArray(x) ? x.length : (x != null && x !== '' ? 1 : 0);
  };
  A.sm = function (r, id) {
    var def = formDef(r && r.form), sm = facts(r).sm;
    if (!def || !Array.isArray(def.summary) || !Array.isArray(sm)) return undefined;
    for (var i = 0; i < def.summary.length; i++) if (def.summary[i].id === id) return sm[i];
    return undefined;
  };
  A.minutes = function (v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    var s = String(v), h = /(\d+)\s*시간/.exec(s), m = /(\d+)\s*분/.exec(s);
    if (h || m) return (h ? +h[1] * 60 : 0) + (m ? +m[1] : 0);
    var n = parseFloat(s); return isFinite(n) ? n : null;
  };
  // 값 분포: select 는 값 하나, multi 는 배열의 값마다 1
  A.dist = function (rows, id, skip) {
    var out = {}, sk = toSet(skip || []);
    (rows || []).forEach(function (r) {
      var v = A.fv(r, id); if (v == null || v === '') return;
      [].concat(v).forEach(function (x) { if (x == null || x === '' || sk[x]) return; out[x] = (out[x] || 0) + 1; });
    });
    return out;
  };
  // 표 열 분포(facts.t.<table>.c.<col>)를 행들에 걸쳐 더함
  A.tdist = function (rows, table, col) {
    var out = {}, seen = false;
    (rows || []).forEach(function (r) {
      var t = (facts(r).t || {})[table], c = t && t.c && t.c[col];
      if (!c) return; seen = true;
      Object.keys(c).forEach(function (k) { if (k === '' || k == null) return; out[k] = (out[k] || 0) + (+c[k] || 0); });
    });
    return seen ? out : null;
  };
  A.tsum = function (rows, table, col) {
    var total = 0, seen = false;
    (rows || []).forEach(function (r) { var t = (facts(r).t || {})[table], s = t && t.s; if (s && s[col] != null && s[col] !== '') { seen = true; total += +s[col] || 0; } });
    return seen ? total : null;
  };
  A.tn = function (rows, table) { return sum(rows, function (r) { var t = (facts(r).t || {})[table]; return t ? t.n : 0; }); };
  // 분포 → 정렬된 [{label, value}] (0 건 제외)
  A.top = function (dist, n) {
    var arr = Object.keys(dist || {}).map(function (k) { return { label: k, value: +dist[k] || 0 }; }).filter(function (x) { return x.value > 0; });
    arr.sort(function (a, b) { return b.value - a.value || a.label.localeCompare(b.label, 'ko'); });
    return n ? arr.slice(0, n) : arr;
  };

  /* ---------- 기록의 사건 날짜 ---------- */
  var EVF = { F04: 'occurredAt', F02: 'foundAt', F05: 'occurredAt', F10: 'stopAt', F01: 'evalDate', F01B: 'meetDate' };
  A.dateOf = function (r) {
    if (!r) return '';
    if (r.form === 'F09' && /^\d{4}-\d{2}$/.test(r.period || '')) return r.period + '-01';
    var f = EVF[r.form], v = f ? A.fv(r, f) : null;
    if (r.form === 'F10' && !v) v = A.fv(r, 'hazardAt');
    if (v && /^\d{4}-\d{2}-\d{2}/.test(String(v))) return String(v).slice(0, 10);
    return String(r.date || '').slice(0, 10);
  };
  A.counted = counted;

  /* ---------- 범위(기간·사업장) — sessionStorage 'hds.an' ---------- */
  var KEY = 'hds.an';
  var RANGES = [{ v: '3m', label: '최근 3개월', n: 3 }, { v: '6m', label: '6개월', n: 6 }, { v: '12m', label: '12개월', n: 12 }, { v: 'ytd', label: '올해' }, { v: 'custom', label: '직접' }];
  function loadState() {
    var st = null;
    try { st = JSON.parse(window.sessionStorage.getItem(KEY) || 'null'); } catch (e) { st = null; }
    st = st && typeof st === 'object' ? st : {};
    if (!RANGES.some(function (r) { return r.v === st.range; })) st.range = '6m';
    if (!st.site) st.site = '*';
    return st;
  }
  function saveState(st) { try { window.sessionStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { /* 저장 못 해도 화면은 동작 */ } A._state = st; }
  function state() { return A._state || (A._state = loadState()); }
  function tagsOf(s) { var t = s && s.tags; if (typeof t === 'string') t = t.split(/[,\s]+/); return Array.isArray(t) ? t.filter(Boolean) : []; }
  function sitesFor(sel) {
    var all = allSites();
    if (!sel || sel === '*') return { ids: all.map(function (s) { return s.id; }), label: '전체 사업장', all: true };
    if (sel.indexOf('tag:') === 0) {
      var tag = sel.slice(4), ids = all.filter(function (s) { return tagsOf(s).indexOf(tag) >= 0; }).map(function (s) { return s.id; });
      return { ids: ids, label: '태그 ' + tag + ' (' + ids.length + '곳)', all: false };
    }
    var s = siteOf(sel);
    return s ? { ids: [s.id], label: s.name || s.id, all: false } : { ids: all.map(function (x) { return x.id; }), label: '전체 사업장', all: true };
  }
  function rangeOf(st, t) {
    var r = RANGES.filter(function (x) { return x.v === st.range; })[0] || RANGES[1];
    if (r.v === 'ytd') return { from: t.slice(0, 4) + '-01-01', to: t, label: '올해', months: null };
    if (r.v === 'custom') {
      var f = isDay(st.from) ? st.from : monthStart(t, -5), to = isDay(st.to) ? st.to : t;
      if (f > to) { var x = f; f = to; to = x; }
      return { from: f, to: to, label: f + ' ~ ' + to, months: null };
    }
    return { from: monthStart(t, -(r.n - 1)), to: t, label: r.v === '3m' ? '최근 3개월' : '최근 ' + r.n + '개월', months: r.n };
  }
  // scope() → { from, to, sites:[id], label, periodLabel, siteLabel, range, site, all, days }
  A.scope = function () {
    var st = state(), t = today(), rg = rangeOf(st, t), ss = sitesFor(st.site);
    return {
      from: rg.from, to: rg.to, sites: ss.ids, all: ss.all, range: st.range, site: st.site,
      periodLabel: rg.label, siteLabel: ss.label, months: rg.months,
      label: rg.label + ' · ' + ss.label, days: diffDays(rg.from, rg.to) + 1, today: t
    };
  };
  // 직전 비교 기간(개요·주제 화면·발견 문장이 모두 이 한 정의를 쓴다)
  //  달 단위 범위(최근 N개월): 현재 범위 시작 바로 앞의 N개 달력 달 전체(예: 9/1~11/1 → 6/1~8/31)
  //  올해: 작년 1월 1일 ~ 작년 같은 날짜 · 직접: 시작 바로 앞의 같은 일수
  A.prevScope = function (sc) {
    sc = sc || A.scope();
    var p = {}; Object.keys(sc).forEach(function (k) { p[k] = sc[k]; });
    var nm = sc.months || (A.months(sc) || []).length;
    if (sc.range === 'ytd') {
      p.from = (+sc.from.slice(0, 4) - 1) + sc.from.slice(4); p.to = addMonths(sc.to, -12);
      p.periodLabel = '작년 같은 기간';
    } else if (sc.range !== 'custom' && sc.from.slice(8) === '01') {
      p.from = monthStart(sc.from, -nm); p.to = addDays(sc.from, -1);
      p.periodLabel = '직전 ' + nm + '개월';
    } else {
      var len = diffDays(sc.from, sc.to) + 1; p.to = addDays(sc.from, -1); p.from = addDays(sc.from, -len);
      p.periodLabel = '직전 ' + len + '일';
    }
    p.months = null;
    p.dateLabel = p.from + ' ~ ' + p.to;
    p.label = p.periodLabel + ' · ' + sc.siteLabel;
    return p;
  };
  A.setScope = function (k, v) {
    var st = state(), cur = A.scope(), next = {};
    Object.keys(st).forEach(function (x) { next[x] = st[x]; });
    if (k === 'range') {
      if (!RANGES.some(function (r) { return r.v === v; })) return;
      next.range = v;
      if (v === 'custom' && !(isDay(st.from) && isDay(st.to))) { next.from = cur.from; next.to = cur.to; }
    } else if (k === 'site') next.site = v || '*';
    else if (k === 'from' || k === 'to') { if (!isDay(v)) return; next[k] = v; next.range = 'custom'; if (!isDay(next.from)) next.from = cur.from; if (!isDay(next.to)) next.to = cur.to; }
    else return;
    saveState(next);
    A.rerender();
  };

  /* ---------- 행 고르기·월별 묶기 ---------- */
  // rows(formCodes, scope) → 범위 안 색인 행(제출·확인·단계보고, 삭제·반려·작성중 제외). formCodes: 'F04' | ['F02','F04'] | null(전체)
  A.rows = function (forms, sc) {
    sc = sc || A.scope();
    var fset = forms == null ? null : toSet([].concat(forms)), sset = sc.all ? null : toSet(sc.sites || []);
    var from = sc.from || '0000-01-01', to = sc.to || '9999-12-31';
    return allIndex().filter(function (r) {
      if (!counted(r)) return false;
      if (fset && !fset[r.form]) return false;
      if (sset && !sset[r.site]) return false;
      var d = A.dateOf(r); return !!d && d >= from && d <= to;
    });
  };
  A.months = function (sc) {
    sc = sc || A.scope();
    var out = [], m = sc.from.slice(0, 7), end = sc.to.slice(0, 7), guard = 0;
    while (m <= end && guard++ < 240) { out.push(m); m = monthStart(m + '-01', 1).slice(0, 7); }
    return out;
  };
  // '2026-06' → '6월' (해가 바뀌는 1월과 첫 칸은 '26년 1월')
  A.monthLabel = function (m, i, list) {
    var y = m.slice(2, 4), mo = +m.slice(5, 7), multi = list && list.length && list[0].slice(0, 4) !== list[list.length - 1].slice(0, 4);
    return (multi && (mo === 1 || i === 0) ? y + '년 ' : '') + mo + '월';
  };
  // byMonth(rows, fn, scope) → [{month, label, rows, value}] (scope 의 달 순서, fn(행들, 달) 기본은 건수)
  A.byMonth = function (rows, fn, sc) {
    var months = A.months(sc), map = {};
    months.forEach(function (m) { map[m] = []; });
    (rows || []).forEach(function (r) { var m = A.dateOf(r).slice(0, 7); if (map[m]) map[m].push(r); });
    return months.map(function (m, i) {
      var rs = map[m]; return { month: m, label: A.monthLabel(m, i, months), rows: rs, value: fn ? fn(rs, m) : rs.length };
    });
  };
  // 범위가 오늘로 끝나고 이번 달이 다 안 지났으면 마지막 달은 '진행 중'
  A.partialIndex = function (sc) {
    sc = sc || A.scope(); var ms = A.months(sc);
    return sc.to === sc.today && sc.to !== monthEnd(sc.to) ? ms.length - 1 : null;
  };
  A.siteName = siteName;

  /* ---------- 공통 지표(개요와 각 주제 화면이 같은 값을 쓰도록 한 곳에서 계산) ---------- */
  // 재해·사고: F04 중 아차사고 제외(재해·무상해), 아차·제안: F02 전체 + F04 아차사고
  A.incidents = function (sc) {
    sc = sc || A.scope();
    var f04 = A.rows('F04', sc), f02 = A.rows('F02', sc), f05 = A.rows('F05', sc), f10 = A.rows('F10', sc);
    var acc = [], injury = [], noInj = [], nm04 = [];
    f04.forEach(function (r) {
      var k = A.fv(r, 'kind');
      if (k === '아차사고') nm04.push(r); else { acc.push(r); if (k === '재해') injury.push(r); else if (k === '무상해') noInj.push(r); }
    });
    var nmF02 = f02.filter(function (r) { return A.fv(r, 'kind') === '아차사고'; });
    return { sc: sc, f04: f04, f02: f02, f05: f05, f10: f10, acc: acc, injury: injury, noInj: noInj, nm04: nm04,
      near: f02.concat(nm04), nearMiss: nmF02.concat(nm04), proposals: f02.filter(function (r) { return A.fv(r, 'kind') !== '아차사고'; }) };
  };
  // 재해율·도수율(F09 제출·확인 기준). 도수율 = ΣA01 ÷ ΣH02 × 1,000,000 (FD R08), 재해율 = ΣA02 ÷ 평균 월말 재적인원(H01) × 100.
  // 분모가 0 이면 null(화면에는 '해당없음').
  A.rates = function (sc) {
    sc = sc || A.scope();
    var latest = {};
    A.rows('F09', sc).forEach(function (r) {
      if (r.status !== '제출' && r.status !== '확인') return;

      var hs = items.map(function (el) { return el.offsetHeight || 0; });
      g.style.alignItems = keep;
      var cols = [], span = 12 / n, gap = 24, pick = assign(hs.map(function (h) { return h + gap; }), n);
      for (var i = 0; i < n; i++) { var c = document.createElement('div'); c.className = 'span-' + span + ' an-stack'; cols.push(c); }
      items.forEach(function (el, k) {   // 칸 안에서는 원래 순서를 지킨다
        el.className = el.className.replace(/\bspan-\d+\b/g, '').replace(/\s+/g, ' ').trim();
        cols[pick[k]].appendChild(el);
      });
      cols.forEach(function (c) { if (c.children.length) g.appendChild(c); });
      g.classList.remove('an-pack');
    });
  };

  /* ---------- 보고서 인쇄(#print-root 에 A4) ---------- */
  // printReport(title, html): html 을 빼면 지금 화면의 분석 본문(.an-body, 차트 SVG 포함)을 옮겨 찍는다.
  A.printReport = function (title, html) {
    var root = document.getElementById('print-root'); if (!root) { window.print(); return; }
    var sc = A.scope(), st = settings();
    if (html == null) { var body = document.querySelector('.an-body'); html = body ? body.innerHTML : ''; }
    var now = new Date(), stamp = dkey(now) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
    root.innerHTML = '<article class="pdoc an-print">'
      + '<header class="an-print-hd"><div><div class="an-print-brand">' + esc(st.appName || 'HDS 안전장부') + '</div><div class="an-print-co">' + esc(st.company || 'HDS(주) 안전경영지원실') + '</div></div>'
      + '<div class="an-print-meta">' + esc(sc.from + ' ~ ' + sc.to) + '<br>' + esc(sc.siteLabel) + '<br>출력 ' + esc(stamp) + '</div></header>'
      + '<h1 class="an-print-title">' + esc(title || '분석 보고서') + '</h1>'
      + '<div class="an-print-body">' + html + '</div></article>';
    Array.prototype.forEach.call(root.querySelectorAll('button, select, input, a.btn, .chart-tip, .an-noprint, .seg'), function (n) { n.remove(); });
    Array.prototype.forEach.call(root.querySelectorAll('[data-href],[data-act]'), function (n) { n.removeAttribute('data-href'); n.removeAttribute('data-act'); });
    document.body.classList.add('an-printing');
    var done = function () { document.body.classList.remove('an-printing'); root.innerHTML = ''; window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    setTimeout(function () { window.print(); }, 60);
  };

  /* ---------- 마크업 조각(AGENT-BRIEF 마크업 계약) ---------- */
  function kpis(items) {
    return '<div class="kpis an-kpis" style="--n:' + items.length + '">' + items.map(function (k) {
      return '<div class="kpi' + (k.lead ? ' is-lead' : '') + (k.href ? ' click an-kpi-link' : '') + '"' + (k.href ? ' data-href="' + esc(k.href) + '" role="link" tabindex="0"' : '') + '>'
        + '<div class="kpi-label">' + esc(k.label) + '</div>'
        + '<div class="kpi-value num">' + (kpiMiss(k.value) ? '<span class="dash" aria-label="값 없음">—</span>' : k.value + (k.unit ? '<span class="unit">' + esc(k.unit) + '</span>' : '')) + '</div>'
        + (k.sub ? '<div class="kpi-sub">' + k.sub + '</div>' : '') + '</div>';
    }).join('') + '</div>';
  }
  /* 값 없는 KPI(null·빈 값·'—' 또는 '—' 한 글자만 감싼 조각): 모든 화면 같은 16px 회색 대시로 */
  function kpiMiss(v) { return v == null || v === '' || String(v).replace(/<[^>]*>/g, '').trim() === '—'; }
  function na(text) { return '<span class="an-na">' + esc(text || '해당없음') + '</span>'; }
  function panel(o) {
    return '<section class="panel ' + (o.span ? 'span-' + o.span : '') + (o.cls ? ' ' + o.cls : '') + '"' + (o.id ? ' id="' + o.id + '"' : '') + '>'
      + '<header class="panel-hd"><div><h2>' + esc(o.title) + '</h2>' + (o.sub ? '<p class="panel-sub">' + o.sub + '</p>' : '') + '</div>'
      + (o.actions ? '<div class="panel-actions">' + o.actions + '</div>' : '') + '</header>'
      + '<div class="panel-bd' + (o.flush ? ' flush' : '') + '">' + (o.body || '') + '</div>'
      + (o.foot ? '<footer class="panel-ft">' + o.foot + '</footer>' : '') + '</section>';
  }
  function empty(text, action) { return '<div class="empty">' + esc(text) + (action ? ' ' + action : '') + '</div>'; }
  function pill(text, tone) { return '<span class="pill ' + (tone || 'neu') + '">' + esc(text) + '</span>'; }
  // 직전 기간과의 차이: good 'down'(줄면 좋음) | 'up' | 'neutral'. 0 이나 직전 0 은 회색.
  function delta(cur, prev, prevLabel, unit, good) {
    unit = unit || '건';
    if (prev == null) return '<span class="muted">' + esc(prevLabel) + ' —</span>';
    var d = cur - prev;
    if (d === 0) return '<span class="muted">' + esc(prevLabel) + '과 같음(' + num(prev) + unit + ')</span>';
    var tone = good === 'neutral' ? '' : (d > 0) === (good === 'down') ? 't-neg' : 't-pos';
    if (prev === 0) return '<span class="muted">+' + num(cur) + unit + ' (새로 발생) · ' + esc(prevLabel) + ' 0' + unit + '</span>';
    return '<span class="' + tone + '">' + minus(d) + unit + '</span> <span class="muted">' + esc(prevLabel) + ' ' + num(prev) + unit + ' 대비</span>';
  }
  function chartBox(id, cls) { return '<div class="an-chart ' + (cls || '') + '" id="' + id + '"></div>'; }
  function legendBox(id) { return '<div class="an-legend" id="' + id + '"></div>'; }
  function C() { return window.Charts || null; }
  function byId(main, id) { return main.querySelector('#' + id); }
  function noCharts(el) { if (el) el.innerHTML = '<div class="err">차트를 불러오지 못했습니다.</div>'; }
  // 한 기록 줄 → #/rec/<id>
  function recHref(r) { return '#/rec/' + encodeURIComponent(r.id); }
  function timeOf(v) { var m = /[T ](\d{2}):(\d{2})/.exec(String(v || '')); return m ? { h: +m[1], m: +m[2] } : null; }
  function dowOf(day) { var d = parseD(day); return d ? (d.getDay() + 6) % 7 : null; } // 월=0 … 일=6
  var DOW = ['월', '화', '수', '목', '금', '토', '일'];
  function findings(items) {
    if (!items.length) return empty('이 범위에서 따로 짚을 변화가 없습니다.');
    return '<ul class="findings">' + items.map(function (f) {
      return '<li class="finding' + (f.tone ? ' ' + f.tone : '') + '">' + f.html + (f.href ? ' <a href="' + esc(f.href) + '">' + esc(f.link || '보기') + '</a>' : '') + '</li>';
    }).join('') + '</ul>';
  }
  function topText(arr, total) { return arr.map(function (x) { return esc(short(x.label)) + ' ' + num(x.value); }).join(' · ') + (total != null ? ' (' + num(total) + '건 중)' : ''); }

  /* ---------- F04 단계 진행 ---------- */
  var F04_STAGE_DAYS = { s2: 3, s3: 7 }; // 속보 후 조사·원인 3일, 재발방지 대책 7일(F04 frequency.due)
  function stageInfo(r) {
    var def = formDef(r.form) || {}, stages = def.stages || [], done = toSet(stageList(r));
    if (r.status === '제출' || r.status === '확인') return { closed: true, label: '종결', cur: stages.length ? stages[stages.length - 1] : null };
    var last = null, next = null;
    stages.forEach(function (s) { if (done[s.id]) last = s; else if (!next) next = s; });
    return { closed: false, last: last, next: next, label: last ? (last.label || last.title || last.id) : '작성 중', nextLabel: next ? (next.label || next.title || next.id) : '' };
  }

  /* ========== 화면: 분석 개요 ========== */
  function overviewBuild(sc) {
    var D = A.incidents(sc), P = A.incidents(A.prevScope(sc)), prevLabel = A.prevScope(sc).periodLabel;
    var R = A.rates(sc), dr = A.dailyRate(sc), ar = A.actRate(sc), hs = A.hecSummary(sc), act = A.activity(sc);
    var months = A.months(sc), part = A.partialIndex(sc);
    var accM = A.byMonth(D.acc, null, sc), nearM = A.byMonth(D.near, null, sc);

    // 사업장별 사고·아차와 직전 기간 대비 증가
    var bySite = {}, prevBySite = {};
    // 사고·아차 = 재해·사고(F04 재해·무상해) + 아차(F02 아차사고 + F04 아차사고). 제안·발굴·의견은 넣지 않는다(발견 문장과 같은 집합).
    D.acc.forEach(function (r) { (bySite[r.site] = bySite[r.site] || [0, 0])[0]++; });
    D.nearMiss.forEach(function (r) { (bySite[r.site] = bySite[r.site] || [0, 0])[1]++; });
    P.acc.concat(P.nearMiss).forEach(function (r) { prevBySite[r.site] = (prevBySite[r.site] || 0) + 1; });
    var siteRows = Object.keys(bySite).map(function (id) {
      var v = bySite[id], tot = v[0] + v[1], pv = prevBySite[id] || 0;
      return { id: id, label: siteName(id), parts: v, total: tot, prev: pv, rise: tot - pv,
        sub: '직전 ' + num(pv) + '건', href: '#/sites/' + encodeURIComponent(id) };
    });
    var rising = siteRows.filter(function (x) { return x.rise >= 2; }).sort(function (a, b) { return b.rise - a.rise || b.total - a.total; });
    var quiet = sc.sites.filter(function (id) { var s = siteOf(id); return A.siteInScope(s, sc) && !bySite[id]; }).length;

    // 사고 유형(F04 전체: 재해·무상해·아차)
    var accTypes = A.top(A.dist(D.f04, 'accType'), 6);
    var accTypeAcc = A.top(A.dist(D.acc, 'accType'), 1)[0];
    var topShare = accTypeAcc && accTypeAcc.value >= 2 && accTypeAcc.value / Math.max(1, D.acc.length) >= 0.3;

    // 가장 사고가 많은 달(주석)
    var peak = null;
    accM.forEach(function (m, i) { if (m.value > 0 && (!peak || m.value > peak.value)) peak = { i: i, value: m.value, label: m.label, rows: m.rows }; });
    var meanAcc = D.acc.length / Math.max(1, months.length);
    var notes = [];
    if (peak && peak.value >= 2 && peak.value >= meanAcc * 1.5) {
      var pt = A.top(A.dist(peak.rows, 'accType'), 1)[0];
      notes.push({ at: peak.i, label: peak.label + ' 재해·사고 ' + peak.value + '건' + (pt && pt.value > 1 ? ' · ' + short(pt.label) + ' ' + pt.value + '건' : ''), short: peak.value + '건' });
    }

    // 발견 문장: analytics-b 의 insights 가 있으면 그것, 없으면 이 화면의 규칙
    var fs = [];
    if (typeof A.insights === 'function') {
      try {
        (A.insights(sc) || []).slice(0, 5).forEach(function (x) {
          if (typeof x === 'string') fs.push({ html: /<(b|a|strong|span)\b/.test(x) ? x : esc(x) });
          else if (x) fs.push({ html: x.html || esc(x.text || ''), tone: x.tone, href: x.href, link: x.link });
        });
      } catch (e) { fs = []; }
    }
    if (!fs.length) {
      rising.slice(0, 2).forEach(function (x) {
        fs.push({ tone: 'neg', html: '<b>' + esc(x.label) + '</b> 사고·아차 ' + num(x.total) + '건 — ' + esc(prevLabel) + '(' + num(x.prev) + '건)보다 ' + num(x.rise) + '건 늘었습니다.', href: x.href, link: '사업장' });
      });
      if (topShare) {
        fs.push({ tone: accTypeAcc.value / D.acc.length >= 0.4 ? 'warn' : '', html: '재해·사고 ' + num(D.acc.length) + '건 중 <b>' + esc(short(accTypeAcc.label)) + ' ' + num(accTypeAcc.value) + '건</b>(' + pctTxt(accTypeAcc.value / D.acc.length, 0) + ')이 가장 많습니다.', href: '#/analytics/incidents', link: '재해·사고' });
      }
      if (ar.overdueHigh > 0) fs.push({ tone: 'neg', html: '기한이 지난 <b>높음 조치 ' + num(ar.overdueHigh) + '건</b>이 아직 끝나지 않았습니다.', href: '#/analytics/acts', link: '조치 이행' });
      var openF04 = D.f04.filter(function (r) { var si = stageInfo(r); return !si.closed && si.next && F04_STAGE_DAYS[si.next.id] != null && diffDays(A.dateOf(r), sc.today) > F04_STAGE_DAYS[si.next.id]; });
      if (openF04.length) fs.push({ tone: 'warn', html: '단계 보고 기한이 지난 재해·사고 보고 <b>' + num(openF04.length) + '건</b>이 있습니다.', href: '#/analytics/incidents', link: '단계 진행' });
      if (dr.rate != null && dr.rate < 0.9) fs.push({ tone: 'warn', html: '일일점검 제출률이 <b>' + pctTxt(dr.rate) + '</b>입니다(기대 ' + num(dr.expected) + '건 중 ' + num(dr.submitted) + '건).', href: '#/analytics/daily', link: '일일점검' });
      if (!D.acc.length && !D.near.length) fs.push({ html: '이 범위에는 재해·사고와 아차·제안 보고가 없습니다.' });
      fs = fs.slice(0, 5);
    }

    // 제목 줄 발견 문장
    var sub;
    if (rising.length) sub = esc(rising[0].label) + '에서 사고·아차가 ' + num(rising[0].total) + '건으로 ' + esc(prevLabel) + '(' + num(rising[0].prev) + '건)보다 ' + num(rising[0].rise) + '건 늘었습니다'
      + (rising.length > 1 ? ' · 늘어난 사업장 ' + num(rising.length) + '곳' : '') + (topShare ? ' · 재해·사고의 ' + pctTxt(accTypeAcc.value / D.acc.length, 0) + '가 ' + esc(short(accTypeAcc.label)) : '') + '.';
    else if (D.acc.length) sub = esc(sc.periodLabel) + ' 재해·사고 ' + num(D.acc.length) + '건, 아차·제안 ' + num(D.near.length) + '건 — 직전 기간보다 늘어난 사업장은 없습니다.';
    else sub = esc(sc.periodLabel) + ' 재해·사고 0건, 아차·제안 ' + num(D.near.length) + '건이 보고됐습니다.';

    var k = [
      { label: '재해·사고', value: num(D.acc.length), unit: '건', lead: true, href: '#/analytics/incidents',
        sub: '재해 ' + num(D.injury.length) + ' · 무상해 ' + num(D.noInj.length) + '<br>' + delta(D.acc.length, P.acc.length, prevLabel, '건', 'down') },
      { label: '아차·제안', value: num(D.near.length), unit: '건',
        sub: '아차 ' + num(D.nearMiss.length) + ' · 제안·발굴·의견 ' + num(D.proposals.length) + '<br>' + delta(D.near.length, P.near.length, prevLabel, '건', 'neutral') },
      { label: '작업중지', value: num(D.f10.length), unit: '건', sub: '많고 적음으로 평가하지 않는 지표<br>' + delta(D.f10.length, P.f10.length, prevLabel, '건', 'neutral') },
      { label: '안전수칙 위반', value: num(D.f05.length), unit: '건', sub: delta(D.f05.length, P.f05.length, prevLabel, '건', 'down') },
      R.freq == null
        ? { label: '도수율', value: na(), sub: R.reports ? 'F09 근로시간 합계 0' : 'F09 월간보고 없음' }
        : { label: '도수율', value: num(R.freq, 2), sub: 'F09 재해 ' + num(R.a01) + '건 ÷ 근로 ' + num(R.h02) + '시간 × 100만' + (R.note ? '<br><span class="muted">' + esc(R.note) + '</span>' : '') },
      R.rate == null
        ? { label: '재해율', value: na(), sub: R.reports ? 'F09 재적인원 0' : 'F09 월간보고 없음' }
        : { label: '재해율', value: num(R.rate, 2), unit: '%', sub: '재해자 ' + num(R.a02) + '명 ÷ 평균 재적 ' + num(R.avgHead, 0) + '명' + (R.note ? '<br><span class="muted">' + esc(R.note) + '</span>' : '') }
    ];

    var ops = kpis([
      { label: '일일점검 제출률', value: dr.rate == null ? na() : num(dr.rate * 100, 1), unit: dr.rate == null ? '' : '%', href: '#/analytics/daily',
        sub: dr.expected ? '기대 ' + num(dr.expected) + '건 중 ' + num(dr.submitted) + '건(어제까지)' : 'F07 필수 운영 사업장 없음' },
      { label: '조치 이행률', value: ar.rate == null ? na() : num(ar.rate * 100, 1), unit: ar.rate == null ? '' : '%', href: '#/analytics/acts',
        sub: (ar.due ? '기한 도래 ' + num(ar.due) + '건 중 완료 ' + num(ar.done) + '건' : '이 기간에 기한이 든 조치 없음') + '<br>' + (ar.overdue ? '<span class="t-neg">기한경과 ' + num(ar.overdue) + '건</span>' : '기한경과 0건') + (ar.parked ? ' · 보류·이관 ' + num(ar.parked) + '건 별도' : '') },
      { label: 'HEC 준비도', value: hs.avg == null ? (hs.sites ? '<span class="an-na">—</span>' : na()) : num(hs.avg * 100, 1), unit: hs.avg == null ? '' : '%', href: '#/analytics/hec',
        sub: !hs.sites ? 'HEC 대상 사업장 없음' : hs.avg == null ? 'HEC 사업장 ' + num(hs.sites) + '곳 · 준비도를 계산하지 못했습니다' : 'HEC 사업장 ' + num(hs.measured) + '곳 평균' + (hs.low ? ' · <span class="t-warn">80% 미만 ' + num(hs.low) + '곳</span>' : '') },
      { label: 'TBM 실시', value: num(act.tbm), unit: '회', href: '#/analytics/daily',
        sub: act.f07 ? '일일점검 ' + num(act.f07) + '건 중 · 참석 연인원 ' + num(act.tbmPeople) + '명' : '이 범위에 일일점검이 없습니다' },
      { label: '위험성평가', value: num(act.ra), unit: '건', href: '#/analytics/risk',
        sub: act.ra ? '위험요인 ' + num(act.hazards) + '개 평가(F01)' : '이 범위에 위험성평가서가 없습니다' },
      { label: '보호구 지급·교체', value: num(act.ppeLines), unit: '건', href: '#/analytics/form/F08A',
        sub: act.ppeRecs ? '지급·반납 기록 ' + num(act.ppeRecs) + '건' + (act.ppeQty ? ' · 지급 수량 ' + num(act.ppeQty) : '') : '이 범위에 지급·반납 기록이 없습니다' }
    ]);

    var html = kpis(k)
      + '<div class="grid an-grid">'
      + panel({ span: 8, title: '월별 재해·아차 추이', sub: '재해·사고(F04 재해·무상해)와 아차·제안(F02 전체·F04 아차) · ' + esc(sc.periodLabel) + (part != null ? ' · 이번 달은 진행 중' : ''),
        actions: legendBox('an-lg-trend'), body: chartBox('an-trend', 'an-chart-lg') })
      + panel({ span: 4, title: '발견', sub: '이 범위의 숫자로 계산한 문장', body: findings(fs), cls: 'an-findings' })
      + panel({ span: 6, title: '사고 유형 상위', sub: 'F04 ' + num(D.f04.length) + '건(아차 포함)의 재해형태',
        body: accTypes.length ? chartBox('an-acctype') : empty('이 범위에 재해·사고 보고가 없습니다.'), foot: '<a href="#/analytics/incidents">재해·사고 분석 보기</a>' })
      + panel({ span: 6, title: '사업장별 사고·아차', sub: '재해·사고와 아차(제안·발굴·의견 제외) · 많은 순 6곳 · 회색 글은 ' + esc(prevLabel),
        actions: legendBox('an-lg-sites'), body: siteRows.length ? chartBox('an-sites') : empty('이 범위에 사고·아차 보고가 없습니다.'),

  function printNow() {
    var body = document.querySelector('.anb-body'); if (!body) { window.print(); return; }
    var s = scope(), title = body.getAttribute('data-title') || '분석';
    var sub = document.querySelector('.anb .title-row .sub');
    var html = '<p class="anb-pmeta">' + esc(s.label) + ' (' + esc(s.from) + ' ~ ' + esc(s.to) + ') · 사업장 ' + s.siteObjs.length + '곳 · 출력 ' + esc(today()) + '</p>' +
      (sub ? '<p class="anb-pfind"><b>' + sub.innerHTML + '</b></p>' : '') + body.innerHTML;
    if (AN.printReport) AN.printReport(title, html); else window.print();
  }

  /* ================= 액션·이벤트 ================= */
  App.actions = App.actions || {};
  var acts = {
    'an.bPrint': function () { printNow(); },
    'an.bRetry': function () { rerender(); },
    'an.bSort': function (el) { var k = el.getAttribute('data-key'); if (sortSt.key === k) sortSt.desc = !sortSt.desc; else { sortSt.key = k; sortSt.desc = k === 'name' ? false : k === 'inc' || k === 'acts'; } rerender(); }
  };
  Object.keys(acts).forEach(function (k) { App.actions[k] = acts[k]; });
  document.addEventListener('change', function (ev) {
    var el = ev.target; if (!el || !el.getAttribute) return;
    var k = el.getAttribute('data-an');
    if (k === 'daily-site') { dailySite = el.value; rerender(); }
    else if (k === 'form') go('#/analytics/form/' + el.value);
  });

  /* ================= 화면 등록 ================= */
  view('daily', '분석 · 일일점검', renderDaily);
  view('edu', '분석 · 교육·훈련', renderEdu);
  view('acts', '분석 · 조치 이행', renderActs);
  view('hec', '분석 · HEC 준비도', renderHec);
  view('sites', '분석 · 사업장 비교', renderSites);
  view('form', '분석 · 양식별', renderForm);

  /* Node 자기 검사용(브라우저에선 쓰지 않음) */
  AN._b = { dailyStats: dailyStats, eduSite: eduSite, riskOf: riskOf, periodicStats: periodicStats, norm: norm, periodOf: periodOf, buckets: buckets };
})();
/* ===== [analytics-b] 끝 ===== */
</script>
