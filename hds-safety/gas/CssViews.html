<style>
/* ===== [hq-a] 시작 ===== */
/* 본사 화면(hq-a) 전용 — 코어 클래스로 안 되는 것만. 토큰은 SPEC §9 */
/* 종합 현황: 오늘의 예외 */
.hq-exc { align-items: flex-start; min-height: 56px; }
.hq-exc > .dot { flex: none; margin-top: 7px; }
.hq-exc .li-title a { color: var(--text); }
.hq-exc .li-title a:hover { text-decoration: underline; text-underline-offset: 3px; }
.hq-exc .li-title b { font-weight: 600; }
.hq-exc .li-side { width: 64px; justify-content: flex-end; align-self: center; }
/* 미니 현황판(이번 달 취합) */
.hq-mini-panel .mk-legend { margin-bottom: 8px; }
.hq-mini .matrix-wrap, .hq-mini { max-height: none; }
.hq-mini .mx-row { min-width: 0; max-width: 132px; padding: 0 8px 0 0; height: 30px; overflow: hidden; text-overflow: ellipsis; }
.hq-mini-panel .panel-ft a { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
.hq-mini .matrix thead th:first-child { padding-left: 0; }
.hq-mini .matrix thead th { height: 44px; }
.hq-mini .mx-col { min-width: 44px; }
.hq-mini .matrix tbody td { height: 30px; }
.hq-mini .mk { width: 26px; height: 26px; }
@media (max-width: 640px) { .hq-mini .matrix tbody td { height: 44px; } .hq-mini .mk { width: 44px; height: 44px; } }
/* 현황판 공통 덧붙임 */
.hq-mx-name { font-weight: 400; color: var(--muted); }
.hq-mx-per { display: block; font-style: normal; font-size: 11px; line-height: 14px; color: var(--muted); white-space: nowrap; }
.hq-mx-pct { display: inline-block; min-width: 3ch; margin-left: 1px; vertical-align: middle; text-align: left; font-size: 11px; line-height: 14px; color: var(--muted); }
.matrix td:has(.hq-mx-pct) { white-space: nowrap; padding-left: 6px; }
/* 취합 현황 도구 줄 */
.hq-pnav { display: inline-flex; align-items: center; gap: 2px; }
.hq-plabel { min-width: 112px; text-align: center; font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; }
.hq-col-sum { padding: 0 var(--card-pad) 8px; font-size: 13px; line-height: 18px; color: var(--muted); }
.hq-col-panel .panel-actions { max-width: 60%; }
/* 배포·요청 */
.hq-rate { display: flex; align-items: center; gap: 12px; min-width: 200px; }
.hq-rate .bar { flex: 1 1 auto; }
.hq-rate .num { flex: none; min-width: 88px; text-align: right; font-size: 13px; color: var(--text); }
.hq-rq-tbl .hq-rq-rate { width: 280px; }
.hq-rq-tbl .li-sub { font-weight: 400; }
.hq-reqrow .bar { margin-top: 8px; }
.hq-reqrow .li-side { width: 48px; justify-content: flex-end; }
.hq-msg { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--rule); white-space: pre-line; color: var(--text); }
/* 요청 작성 */
.hq-pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; max-height: 288px; overflow: auto; padding: 4px 12px; border: 1px solid var(--border); border-radius: var(--radius-control); }
.hq-pick .check { align-items: flex-start; padding: 6px 0; }
.hq-pick .check input { margin-top: 2px; }
.hq-pick-tags { grid-template-columns: repeat(3, minmax(0, 1fr)); max-height: none; }
.field .seg + .hq-pick, .field .seg + .empty { margin-top: 8px; }
.hq-pick + .cluster { margin-top: 8px; }
.hq-file { width: max-content; cursor: pointer; }
.hq-att .li { min-height: 44px; padding: 6px 0; }
.hq-rf-ft { padding-top: 16px; border-top: 1px solid var(--rule); }
/* 사업장이 받는 메일 미리보기 */
.hq-mail-panel { position: sticky; top: 16px; }
.hq-mail { margin-top: 12px; padding: 24px; border: 1px solid var(--border); border-radius: var(--radius-card); background: var(--surface); }
.hq-mail-mark { margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--rule); font-family: var(--font-brand); font-size: 15px; line-height: 20px; font-weight: 700; color: var(--brand); }
.hq-mail-to { color: var(--muted); }
.hq-mail-title { margin: 8px 0; font-size: 17px; line-height: 24px; font-weight: 600; color: var(--text); }
.hq-mail-msg { white-space: pre-line; color: var(--text); }
.hq-mail-forms { margin: 12px 0 0; padding-left: 18px; color: var(--text); }
.hq-mail-due, .hq-mail-att { margin-top: 12px; color: var(--text); }
.hq-mail-btn { display: inline-block; margin-top: 16px; padding: 10px 16px; border-radius: var(--radius-control); background: var(--primary); color: var(--primary-ink); font-size: 14px; line-height: 20px; font-weight: 600; }
.hq-mail-foot { margin-top: 16px; font-size: 12px; line-height: 16px; color: var(--faint); }
.hq-mail-rem { margin-top: 12px; }
/* 검토함 */
.hq-rv-left .panel-bd { max-height: calc(100vh - 248px); overflow: auto; }
.hq-rv-item { align-items: flex-start; }
.hq-rv-item > .dot { flex: none; margin-top: 7px; }
.hq-rv-right { position: sticky; top: 16px; max-height: calc(100vh - 96px); }
.hq-rv-body { overflow: auto; }
.hq-rv-ft { gap: 8px; background: var(--surface); border-radius: 0 0 var(--radius-card) var(--radius-card); }
.hq-rv-ft .muted { min-width: 0; }
.hq-keys { font-size: 12px; line-height: 16px; }
@media (max-width: 1100px) {
  .hq-mail-panel, .hq-rv-right { position: static; max-height: none; }
  /* 검토함 미리보기(태블릿·휴대폰): 긴 보고서도 끝까지 내리지 않고 바로 누르도록 동작 줄을 화면 아래에 붙인다.
     줄은 흐름 안에 자리를 차지하므로 끝까지 내리면 본문 마지막 줄이 그 위에 온다(가리지 않음) */
  .hq-rv-ft {
    position: sticky; bottom: 0; z-index: 5; flex-wrap: wrap;
    border-top: 1px solid var(--border); border-radius: 0 0 var(--radius-card) var(--radius-card);
    padding-bottom: calc(12px + var(--safe-b));
  }
  .hq-rv-ft .btn { min-height: 44px; }
  .hq-rv-ft .muted { flex: 1 1 100%; }
  .hq-rv-body { padding-bottom: 24px; }
}
@media (max-width: 640px) {
  .hq-pick, .hq-pick-tags { grid-template-columns: minmax(0, 1fr); }
  .hq-rate { min-width: 0; }
  .hq-rq-tbl .r-key .bar { display: none; }   /* 두 줄 행: 오른쪽엔 회수 숫자만, 제목 폭을 넓게 */
  .hq-rq-tbl .r-key .hq-rate .num { min-width: 0; }
  .hq-exc .li-side { width: auto; }
  .hq-exc .li-title, .hq-exc .li-sub, .hq-rv-item .li-title { white-space: normal; }
  .hq-mini .mx-row { max-width: 150px; }
  .hq-plabel { min-width: 0; }
  .hq-col-panel .panel-actions { max-width: 100%; }
  .hq-rv-left .panel-bd { max-height: none; }
  /* 취합 현황 휴대폰: 컨트롤 두 줄(범위+요청 열 / 기간 이동+업무구성), 기간 줄은 숨기고 범례는 줄바꿈해 기호 설명을 모두 보인다 */
  .hq-col-tools .seg { display: inline-flex; width: auto; flex: 1 1 auto; order: 0; }
  .hq-col-tools .seg button { flex: 1 1 0; }
  .hq-col-tools .check { order: 1; flex: none; }
  .hq-col-tools .hq-pnav { order: 2; flex: none; }
  .hq-col-tools .hq-col-tag { order: 3; }
  .hq-col-tools .spacer { display: none; }
  .hq-col-panel .panel-sub { display: none; }
  .hq-col-panel .mk-legend { flex-wrap: wrap; gap: 6px 12px; }
  /* 검토함 휴대폰: 기록을 고르면 목록 대신 미리보기(보고 확인·반려 버튼 포함)를 보인다 */
  .hq-rv.has-sel .hq-rv-left, .hq-rv:not(.has-sel) .hq-rv-right { display: none; }
}
/* ===== [hq-a] 끝 ===== */
/* ===== [hq-b] 시작 ===== */
/* 화면 뿌리 .hq-b 가 .page 의 자식 간격 규칙을 이어받게 (Css.html .page > * 규칙과 같은 값: 한 거터) */
.hq-b > * + * { margin-top: var(--gap); }
.hq-sets > .hq-set + .hq-set { margin-top: 0; }
/* 기록 조회·조치대장: 패널 머리 아래 탭 줄, 선택 칸, 둘째 줄 */
.hq-rec-tabs { padding: 0 var(--card-pad, 20px); border-bottom: 1px solid var(--rule); }
.hq-rec-tabs .tabs { border-bottom: 0; margin: 0; }
.hq-rec-tools .select { max-width: 220px; }
.hq-q { width: 260px; max-width: 100%; }
.hq-range { display: inline-flex; align-items: center; gap: 6px; }
.hq-range .input { width: 148px; }
.tbl td.hq-ck, .tbl th.hq-ck { width: 40px; padding-right: 0; }
.hq-ck label { display: flex; align-items: center; justify-content: center; min-height: 32px; cursor: pointer; }
.hq-ck input { width: 16px; height: 16px; margin: 0; accent-color: var(--primary); cursor: pointer; }
.hq-idc { white-space: nowrap; font-size: 13px; }
.hq-l2 { font-size: 12px; margin-top: 2px; }
.hq-act-title { min-width: 0; max-width: 340px; }
.hq-selcount { font-size: 13px; color: var(--text); margin-right: 4px; }
.hq-rec .panel-actions, .hq-acts .panel-actions { flex-wrap: wrap; }
.hq-b .panel-ft { justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.hq-linkpanel .panel-ft { justify-content: flex-start; }
.hq-b .li-side .t-neg, .hq-b .li-side .t-warn { color: inherit; }
.hq-b .li-side .t-neg { color: var(--negative); }
.hq-b .li-side .t-warn { color: var(--warning); }
.hq-sitec { max-width: 150px; }
/* 조치 목록: 표 폭이 카드를 넘지 않게 고정 배치. 내용 열이 나머지 폭을 모두 쓰고 말줄임 */
.hq-act-tbl { table-layout: fixed; }
.hq-act-tbl td, .hq-act-tbl th { padding-left: 10px; padding-right: 10px; }
.hq-act-tbl td:first-child, .hq-act-tbl th:first-child { padding-left: var(--card-pad, 20px); }
.hq-act-tbl td:last-child, .hq-act-tbl th:last-child { padding-right: var(--card-pad, 20px); }
.hq-act-tbl .hq-act-title { max-width: none; }
/* 조치 내용은 두 줄까지(넘치면 말줄임, 전체는 title), 담당은 보조줄 맨 앞이라 먼저 잘리지 않음 */
.hq-act-t { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; white-space: normal; overflow-wrap: anywhere; }
.hq-own { color: var(--text); }
.hq-act-tbl th.hq-sitec { width: 140px; }
.hq-act-tbl th.hq-c-lv { width: 72px; }
.hq-act-tbl th.hq-c-due { width: 104px; }
.hq-act-tbl th.hq-c-st { width: 112px; }
.hq-b .panel-ft[hidden] { display: none; }
.hq-off td { color: var(--faint); }

/* 조치: 경과 분포 막대, 상세 */
.hq-dist { display: grid; gap: 10px; }
.hq-dist-row { display: grid; grid-template-columns: 72px 1fr 40px; align-items: center; gap: 12px; min-height: 24px; }
.hq-dist-label { font-size: 13px; color: var(--muted); }
.hq-dist-n { text-align: right; font-size: 14px; }
.hq-act-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }
.hq-act-h { font-size: var(--fs-section, 16px); font-weight: 600; margin: 10px 0 6px; }
.hq-h4 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 20px 0 8px; }
.hq-pre { white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
.hq-photos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.hq-photos figure { margin: 0; }
.hq-photos img, .hq-nophoto > div { width: 100%; height: 180px; object-fit: cover; border-radius: var(--radius-card, 8px); border: 1px solid var(--border); background: var(--raised); display: block; }
.hq-nophoto > div { display: flex; align-items: center; justify-content: center; color: var(--faint); font-size: 13px; }
.hq-photos figcaption { font-size: 12px; color: var(--muted); margin-top: 6px; }
.hq-act-edit { margin-top: 16px; align-items: end; }
.hq-end { display: flex; align-items: flex-end; }
.hq-move { margin-top: 16px; padding: 16px; border: 1px solid var(--border); border-radius: var(--radius-card, 8px); background: var(--raised); }
.hq-move .hq-h4 { margin-top: 0; color: var(--text); }
.hq-move-ft { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
.hq-tl { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 1px solid var(--border); display: grid; gap: 10px; font-size: 13px; }
.hq-tl li { position: relative; }
.hq-tl li::before { content: ""; position: absolute; left: -18px; top: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--control); }
.hq-tl li:first-child::before { background: var(--accent); }
.hq-imgerr { visibility: hidden; }
.hq-full { grid-column: 1 / -1; }

/* 사업장 상세: 링크·QR */
.hq-link { display: flex; }
.hq-link .input { flex: 1 1 auto; min-width: 0; border-top-right-radius: 0; border-bottom-right-radius: 0; font-size: 12px; }
.hq-link .btn { border-top-left-radius: 0; border-bottom-left-radius: 0; margin-left: -1px; flex: none; }
.hq-linkbox { display: grid; gap: 12px; }
.hq-qr { width: 176px; padding: 8px; border: 1px solid var(--border); border-radius: var(--radius-card, 8px); background: #fff; }
.hq-qr svg { display: block; width: 100%; height: auto; }
.hq-small { font-size: 12px; }
.hq-mt { margin-top: 16px; }
.hq-checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 6px 16px; }
.hq-formchecks { margin: 8px 0 4px; }
.hq-months { gap: 6px 14px; }
.hq-hec .cluster { align-items: center; }
.hq-inl { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.hq-inl .input { width: 150px; }
.hq-t-neg, .hq-t-neg svg { color: var(--negative); }
.hq-paste { width: 100%; font-size: 13px; tab-size: 12; }

/* 설정: 왼쪽 라벨 열 + 오른쪽 패널 (taste §8.2) */
.hq-set-tabs { margin-bottom: 8px; }
.hq-set { display: grid; grid-template-columns: minmax(220px, 320px) minmax(0, 1fr); gap: 24px; padding: 32px 0; border-top: 1px solid var(--rule); }
.hq-sets > .hq-set:first-child { border-top: 0; padding-top: 16px; }
.hq-set-label h2 { font-size: var(--fs-section, 16px); font-weight: 600; margin: 6px 0 6px; }
.hq-set-label p { font-size: 14px; margin: 0; }
.hq-set-panel { background: var(--raised); border-radius: var(--radius-card, 8px); padding: 16px 20px; min-width: 0; }
.hq-set-ft { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.hq-saved { font-size: 12px; margin-right: auto; }
.hq-sw { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.hq-sw:first-child { padding-top: 0; }
.hq-sw-t { font-size: 14px; font-weight: 500; }
.hq-mailpv { margin-top: 16px; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-card, 8px); background: var(--surface); }
.hq-mailpv-subj { font-size: 13px; font-weight: 600; margin: 4px 0 2px; overflow-wrap: anywhere; }
.hq-maillog { max-height: 420px; overflow: auto; }
.hq-danger .hq-set-panel { background: var(--surface); border: 1px solid var(--pill-neg-bg); }
.hq-danger .hq-set-label h2 { color: var(--negative); }
.hq-set-panel .kv dd a { display: inline-flex; align-items: center; gap: 4px; }

/* 검색 */
.hq-searchbar .hq-q { width: 420px; }
.hq-exact { padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius-card, 8px); background: var(--raised); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }

/* QR 안내문 인쇄(A4 한 장) */
.hq-qrdoc { text-align: center; padding: 18mm 16mm; color: #14183c; font-family: var(--font); }
.hq-qrdoc-top { display: flex; justify-content: space-between; font-size: 12px; border-bottom: 1px solid #c9ccd8; padding-bottom: 6px; }
.hq-qrdoc-top b { color: #223189; font-family: var(--font-brand); }
.hq-qrdoc h1 { font-family: var(--font-brand); font-size: 30px; margin: 18mm 0 2mm; }
.hq-qrdoc-sub { font-size: 13px; color: #555a75; margin: 0; }
.hq-qrdoc-qr { width: 78mm; margin: 10mm auto 8mm; }
.hq-qrdoc-qr svg { width: 100%; height: auto; display: block; }
.hq-qrdoc .hq-qrdoc-steps { text-align: left; list-style: decimal outside; width: fit-content; max-width: 150mm; margin: 0 auto; padding-left: 7mm; font-size: 15px; line-height: 1.8; }
.hq-qrdoc .hq-qrdoc-steps li { display: list-item; }
.hq-qrdoc-link { font-size: 10px; color: #555a75; margin-top: 8mm; word-break: break-all; }
.hq-qrdoc-note { font-size: 11px; color: #676b84; margin-top: 4mm; }
@media print {
  body.hq-printing .shell, body.hq-printing #app, body.hq-printing #toasts { display: none !important; }
  body.hq-printing #print-root { display: block !important; }
  .hq-qrdoc { padding: 10mm 12mm; page-break-after: avoid; }
}

/* 태블릿·휴대폰 */
@media (max-width: 1100px) {
  .hq-site-grid > .span-4 { order: -1; }
  .hq-set { grid-template-columns: 1fr; gap: 12px; padding: 24px 0; }
  .hq-act-title { max-width: none; }
}
@media (max-width: 640px) {
  .hq-q, .hq-searchbar .hq-q, .hq-rec-tools .select { width: 100%; max-width: none; }
  .toolbar .hq-q { flex: 1 1 100%; }
  .hq-range { width: 100%; }
  .hq-range .input { flex: 1; width: auto; min-width: 0; }
  .hq-rec-tabs { overflow-x: auto; padding: 0 12px; }
  .hq-photos img, .hq-nophoto > div { height: 132px; }
  .hq-qr { width: 160px; }
  .hq-checks { grid-template-columns: 1fr 1fr; }
  .hq-dist-row { grid-template-columns: 64px 1fr 32px; }
  .hq-set-panel { padding: 14px 16px; }
  /* 조치 목록 휴대폰: 1줄 내용(말줄임) + 상태 알약, 2줄 사업장·담당 · 수준 · 기한 */
  .hq-act-tbl.tbl:not(.keep) tr { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 4px 10px; }
  .hq-act-tbl.tbl:not(.keep) td.hq-act-title { grid-column: 1 / 3; grid-row: 1; min-width: 0; font-weight: 600; }
  .hq-act-tbl.tbl:not(.keep) td.hq-c-st { grid-column: 3; grid-row: 1; justify-self: end; }
  .hq-act-tbl.tbl:not(.keep) td.hq-sitec { grid-column: 1; grid-row: 2; min-width: 0; display: block; }
  .hq-act-tbl.tbl:not(.keep) td.hq-c-lv { grid-column: 2; grid-row: 2; }
  .hq-act-tbl.tbl:not(.keep) td.hq-c-due { grid-column: 3; grid-row: 2; justify-self: end; }
  .hq-act-tbl .hq-l2 { display: none; }
  .hq-act-tbl .hq-act-t { -webkit-line-clamp: 1; line-clamp: 1; }   /* 휴대폰은 두 줄 행 규칙: 내용 한 줄 */
}
/* ===== [hq-b] 끝 ===== */
/* ===== [analytics-a] 시작 ===== */
/* 분석 공통(주제 탭·필터 줄·차트 상자·보고서 인쇄) + 개요·재해·사고·위험성평가 — 코어 클래스로 안 되는 것만. 토큰은 SPEC §9 */
.an-filter { flex-wrap: wrap; row-gap: 8px; }
.an-dates { display: inline-flex; align-items: center; gap: 6px; }
.an-dates .input { width: 150px; }
.an-site-sel { width: auto; min-width: 200px; max-width: 300px; }
.an-scope-note { font-size: var(--fs-small, 12px); line-height: 16px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.an-body { display: flex; flex-direction: column; gap: var(--gap, 24px); min-width: 0; }
.an-body > .grid, .an-body > .kpis { margin: 0; }
.an-chart { position: relative; min-width: 0; }
.an-chart-lg { min-height: 220px; }
.an-chart-sm { min-height: 150px; }
.an-legend { display: flex; justify-content: flex-end; min-width: 0; }
.an-legend:empty { display: none; }
.an-legend .chart-legend { justify-content: flex-end; }
.an-na { font-size: 16px; line-height: 34px; font-weight: 400; color: var(--faint, #676b84); letter-spacing: 0; }
.kpi.is-lead .an-na { line-height: 40px; }
.an-kpi-link { cursor: pointer; }
.an-kpi-link:hover .kpi-label { color: var(--text, #14183c); text-decoration: underline; text-underline-offset: 3px; }
.an-kpi-link:focus-visible { outline: 2px solid var(--brand, #223189); outline-offset: -2px; }
.an-h3 { margin: 20px 0 8px; font-size: 13px; line-height: 18px; font-weight: 600; color: var(--muted, #555a75); }
.an-chart + .an-h3, .an-kv + .an-h3 { margin-top: 20px; }
.an-note { margin: 12px 0 0; font-size: var(--fs-small, 12px); line-height: 18px; }
.an-note-top { margin: 0 0 12px; }
.an-kv { margin-top: 16px; }
.an-chart + .an-kv { margin-top: 16px; }
.an-strong { font-weight: 500; color: var(--text, #14183c); }
.an-tbl td { vertical-align: middle; }
.an-ops .kpis { border: 0; border-radius: 0; background: none; }
.an-findings .findings { margin-top: -8px; }
.an-findings .finding a { color: var(--brand, #223189); }
.panel-actions .seg.an-seg button { padding: 0 10px; }
@media (max-width: 1100px) {
  .an-scope-note { display: none; }
}
/* 태블릿 폭: 6칸 KPI 는 3×2 로(라벨이 잘리고 설명이 6줄로 접히지 않게) */
@media (min-width: 641px) and (max-width: 1100px) {
  .an-kpis[style*="--n:6"], .an-kpis[style*="--n:5"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .an-kpis[style*="--n:6"] > .kpi:nth-child(3n+1), .an-kpis[style*="--n:5"] > .kpi:nth-child(3n+1) { border-left: 0; }
  .an-kpis[style*="--n:6"] > .kpi:nth-child(n+4), .an-kpis[style*="--n:5"] > .kpi:nth-child(n+4) { border-top: 1px solid var(--border, #e4e6ee); }
}
@media (max-width: 640px) {
  .an-filter { flex-wrap: wrap; }
  .an-filter > .select { flex: 1 1 0; min-width: 0; max-width: none; }
  .an-dates { flex: 1 1 100%; order: 3; }
  .an-dates .input { flex: 1 1 0; width: auto; min-width: 0; }
  .an-chart-lg { min-height: 180px; }
  .panel-actions .seg.an-seg { width: 100%; overflow-x: auto; }
  .panel-actions .seg.an-seg button { flex: 1 0 auto; }
  .an-legend { justify-content: flex-start; }
  .an-legend .chart-legend { justify-content: flex-start; }
}
/* 긴 카드 옆 작은 카드 세로 쌓기 · 높이대로 나눠 담은 칸(App.analytics.pack) */
.an-stack { display: flex; flex-direction: column; gap: var(--gap, 24px); min-width: 0; }
.an-stack > .panel { min-width: 0; }
/* 분석 보고서 인쇄(#print-root, A4) */
.an-print { color: #14183c; font-size: 11px; line-height: 1.45; }
.an-print-hd { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; padding-bottom: 8px; border-bottom: 1.5px solid #14183c; }
.an-print-brand { font-family: var(--font-brand, sans-serif); font-weight: 700; font-size: 16px; color: #223189; }
.an-print-co { font-size: 11px; color: #555a75; }
.an-print-meta { text-align: right; font-size: 10px; color: #555a75; font-variant-numeric: tabular-nums; }
.an-print-title { margin: 12px 0 10px; font-family: var(--font-brand, sans-serif); font-size: 18px; line-height: 24px; font-weight: 700; }
.an-print-body { display: flex; flex-direction: column; gap: 10px; }
.an-print-body .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 10px; }
.an-print-body .grid > .span-8, .an-print-body .grid > .span-7, .an-print-body .grid > .span-12 { grid-column: span 12; }
.an-print-body .grid > .span-6, .an-print-body .grid > .span-5, .an-print-body .grid > .span-4 { grid-column: span 6; }
.an-print-body .panel { break-inside: avoid; border: 1px solid #e4e6ee; border-radius: 6px; box-shadow: none; }
.an-print-body .kpis { break-inside: avoid; }
.an-print-body .kpi { padding: 8px 10px; }
.an-print-body .kpi-value { font-size: 18px; line-height: 24px; }
.an-print-body .tbl-wrap { overflow: visible; }
.an-print-body .chart-tip { display: none; }
@media print {
  .an-print-body .tbl tr { break-inside: avoid; }
}
/* ===== [analytics-a] 끝 ===== */
/* ===== [analytics-b] 시작 ===== */
/* 분석(일일점검·교육·조치·HEC·사업장 비교·양식별) — 코어 클래스로 안 되는 것만 */
.anb-body { margin-top: 16px; }
/* 긴 표 옆에 작은 카드 둘을 세로로 쌓는 칸(격자 한 칸 안에서 카드끼리 같은 간격) */
.anb-stack { display: flex; flex-direction: column; gap: var(--gap, 24px); min-width: 0; }
.anb-stack > .panel { min-width: 0; }
.anb-body > .kpis { margin-bottom: var(--gap, 24px); }
.anb-chart { position: relative; min-height: 40px; }
.anb-legend:empty { display: none; }
.anb-topics { margin-bottom: 12px; }
.anb .small, .anb-body .small { font-size: var(--fs-small, 12px); }
.anb-note { margin: 12px 0 0; }
.anb-pad { min-height: 0; }

/* 표 안 비율: 숫자 + 얇은 막대 */
.anb-rate { display: grid; grid-template-columns: 44px minmax(40px, 1fr); align-items: center; gap: 8px; }
.anb-rate .num { text-align: right; }
.anb-rate .bar { min-width: 40px; }
.tbl tr.is-sel td { background: var(--raised, #f6f7fa); }

/* 정렬 머리글 */
.anb-sort { all: unset; cursor: pointer; color: inherit; font: inherit; white-space: nowrap; }
.anb-sort:hover, .anb-sort.on { color: var(--text, #14183c); }
.anb-sort:focus-visible { outline: 2px solid var(--accent, #223189); outline-offset: 2px; border-radius: 2px; }
.anb-score td { vertical-align: middle; }
.anb-wt td.muted { font-size: var(--fs-small, 12px); }

/* 일일 제출 칸: 모두 제출=네이비 채움, 일부=옅은 네이비, 미제출=회색 테두리, 대상 아님=짧은 대시 */
.anb-d { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: middle; box-sizing: border-box; }
.anb-d-full { background: var(--chart-1, #223189); }
.anb-d-part { background: var(--pill-acc-bg, #e8ebf8); border: 1px solid var(--chart-1, #223189); }
.anb-d-none { border: 1px solid var(--control, #cbcfdb); background: var(--surface, #fff); }
.anb-d-future { width: 8px; height: 2px; border-radius: 0; margin: 5px 2px; background: var(--chart-muted, #c9ccd8); }
.anb-d-blank { visibility: hidden; }
.anb-dmx td, .anb-dmx th.anb-dh { padding: 3px 1px; text-align: center; min-width: 16px; }
.anb-dmx th.anb-dh { font-weight: 400; font-size: 11px; color: var(--faint, #676b84); }
.anb-dmx th.anb-dh.we { color: var(--muted, #555a75); font-weight: 600; }
.anb-dmx th.mx-row { white-space: nowrap; }
.anb-cal { display: grid; grid-template-columns: repeat(7, 14px); gap: 4px; }
.anb-dleg { flex-wrap: wrap; }

/* HEC 격자 기호: 양호=네이비 채움 사각, 주의=네이비 테두리+아래 반 채움, 불량=빨강 테두리+X, 증빙 없음=빨강 점선 빈칸, 해당없음=회색 대시 */
.anb-hk { position: relative; display: inline-block; width: 12px; height: 12px; box-sizing: border-box; vertical-align: middle; border-radius: 2px; }
.anb-hk-g { background: var(--chart-1, #223189); }
.anb-hk-y { border: 1.5px solid var(--chart-1, #223189); overflow: hidden; }
.anb-hk-y::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 50%; background: var(--chart-1, #223189); }
.anb-hk-r { border: 1.5px solid var(--negative, #c8281d); }
.anb-hk-r::before, .anb-hk-r::after { content: ""; position: absolute; left: 50%; top: 50%; width: 11px; height: 1.5px; margin: -0.75px 0 0 -5.5px; background: var(--negative, #c8281d); transform: rotate(45deg); }
.anb-hk-r::after { transform: rotate(-45deg); }
.anb-hk-x { border: 1.5px dashed var(--negative, #c8281d); background: var(--surface, #fff); }
.anb-hk-n { width: 8px; height: 2px; border-radius: 0; margin: 0 2px; background: var(--chart-muted, #c9ccd8); }
.anb-hkb { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; min-height: 24px; border-radius: 4px; text-decoration: none; }
a.anb-hkb:hover { background: var(--active, #e7e9f1); }
a.anb-hkb:focus-visible { outline: 2px solid var(--accent, #223189); outline-offset: 1px; }
.anb-hecwrap { max-height: 640px; overflow: auto; }
.anb-hec td { text-align: center; padding: 2px 4px; }
.anb-hec th.mx-row { text-align: left; font-weight: 400; min-width: 240px; max-width: 320px; }
/* 항목 행: 출처 양식 태그를 오른쪽 절대 위치(공통 .mx-row small) 대신 항목명 아래 줄에 둔다 — 열 폭이 좁아도 글자가 겹치지 않게 */
.anb-hec tbody tr:not(.anb-hg) th.mx-row { height: auto; padding-top: 6px; padding-bottom: 6px; padding-right: 16px; white-space: normal; line-height: 18px; }
.anb-hec th.mx-row small { position: static; transform: none; display: block; margin-top: 1px; color: var(--faint, #676b84); font-size: 11px; line-height: 14px; white-space: normal; }
.anb-hec tr.anb-hg th { font-size: var(--fs-small, 12px); font-weight: 600; color: var(--muted, #555a75); padding-top: 12px; background: var(--surface, #fff); }
.anb-hec thead th { position: sticky; top: 0; background: var(--surface, #fff); z-index: 1; }

/* 체크리스트 판정 100% 막대(2px 이음매): 불량=네이비, 주의=옅은 네이비, 양호=회색 */
.anb-st { display: flex; gap: 2px; height: 10px; min-width: 80px; }
.anb-st i, .anb-sw { display: block; height: 100%; border-radius: 1px; }
.anb-st i.b, .anb-sw.b { background: var(--chart-1, #223189); }
.anb-st i.w, .anb-sw.w { background: #8f99cc; }
.anb-st i.g, .anb-sw.g { background: var(--chart-muted, #c9ccd8); }
.anb-sw { display: inline-block; width: 10px; height: 10px; vertical-align: middle; }

/* 표 열 분포 */
.anb-tcols { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px 24px; }
.anb-tcol h3 { margin: 0 0 8px; font-size: var(--fs-small, 12px); font-weight: 600; color: var(--muted, #555a75); }
.anb-kv { margin-top: 16px; }
.anb-formbar .select { max-width: 320px; }

/* Charts 가 없을 때의 대체 막대 */
.anb-hb { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.anb-hb li { display: grid; gap: 4px; }
.anb-hb-l { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
.anb-hb li > i { display: block; height: 4px; border-radius: 2px; background: var(--chart-1, #223189); }
.anb-hb small { color: var(--faint, #676b84); font-size: 12px; }
.anb-cols { display: flex; align-items: flex-end; gap: 4px; height: 160px; }
.anb-cols > div { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; min-width: 0; }
.anb-cols i { display: block; width: 62%; background: var(--chart-1, #223189); }
.anb-cols span { font-size: 11px; color: var(--axis-ink, #676b84); margin-top: 4px; white-space: nowrap; }

/* AI 요약 */
.anb-ai p { margin: 0 0 12px; line-height: 1.65; }

/* 인쇄용 머리 문장(보고서) */
.anb-pmeta { color: var(--muted, #555a75); font-size: 12px; margin: 0 0 6px; }
.anb-pfind { margin: 0 0 12px; }

@media (max-width: 640px) {
  .anb-rate { grid-template-columns: 40px minmax(48px, 1fr); }
  .anb-hec th.mx-row { min-width: 148px; width: 156px; max-width: 168px; }
  .anb-hec tbody tr:not(.anb-hg) th.mx-row { white-space: normal; text-overflow: clip; }
  /* 분석 표 두 줄 행(.tbl.rows2): 오른쪽 핵심 값 — 비율은 숫자 + 짧은 막대, 판정 분포는 고정 폭 막대 */
  .tbl.rows2 .r-key .anb-rate { grid-template-columns: auto 48px; gap: 6px; }
  .tbl.rows2 .r-key .anb-rate .bar { min-width: 48px; }
  .tbl.rows2 .r-key .anb-st { width: 72px; min-width: 72px; }
  .tbl.rows2 .r-key .anb-klab { color: var(--muted, #555a75); font-size: 13px; }
  .tbl.rows2 .r-key .anb-kunit { color: var(--muted, #555a75); font-size: 13px; margin-left: 1px; }
  .tbl.rows2 .r-key .t-neg { font-weight: 600; }
  /* 점수 계산 방법: 설명이 본문이므로 보조줄을 줄바꿈해 모두 보여 준다 */
  .anb-wt.rows2:not(.keep) td.r-main { white-space: normal; }
  .anb-wt.rows2:not(.keep) .r-l2 { white-space: normal; }
  .anb-hec th.mx-row small { display: block; font-size: var(--fs-small, 12px); line-height: 16px; margin-top: 2px; }
  .anb-formbar .select { max-width: none; width: 100%; }
  .anb-tcols { grid-template-columns: 1fr; }
  .anb-pad { display: none; }
}
@media print {
  .anb-hecwrap { max-height: none; overflow: visible; }
  .anb-sort { all: unset; }
}
/* ===== [analytics-b] 끝 ===== */
/* ===== [site] 시작 ===== */
/* 사업장 화면(JsSite). 코어 컴포넌트(.panel .list .li .pill .btn .tabs .kv .bar .dlg)를 그대로 쓰고,
   배치·큰 터치 버튼(장갑 낀 손 기준 64px 이상)·두 칸 나눔만 더한다. 색은 상태와 주 동작 하나에만. */
/* 사업장 화면은 모두 시트 폭을 그대로 쓴다(양식·받은 요청과 같은 폭, 오른쪽 빈 띠 없음) */
.st-page { min-width: 0; }
.st-page > * + * { margin-top: var(--gap); }
.st-page > .title-row + * { margin-top: 20px; }
.st-page > .st-tabrow + * { margin-top: 12px; }
.st-eyebrow { margin-bottom: 4px; font-size: 13px; line-height: 18px; color: var(--muted); }
.st-small { font-size: var(--fs-small); line-height: 16px; }
.st-h3 { font-size: 14px; line-height: 20px; font-weight: 600; color: var(--text); }

/* 오늘: 큰 두 버튼 */
.st-cta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.st-cta-cell { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.btn.st-cta-btn {
  width: 100%; height: auto; min-height: 68px; padding: 12px 16px; gap: 12px;
  justify-content: flex-start; text-align: left; white-space: normal; border-radius: var(--radius-card);
}
.btn.st-cta-btn svg { flex: none; width: 22px; height: 22px; }
.st-cta-text { display: flex; flex-direction: column; min-width: 0; }
.st-cta-label { font-size: 17px; line-height: 24px; font-weight: 600; }
.st-cta-sub { font-size: 13px; line-height: 18px; font-weight: 400; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn.primary.st-cta-btn .st-cta-sub { color: #d5d8e8; }
.btn.st-cta-btn.is-done svg { color: var(--positive); }
.btn.st-sos { color: var(--negative); border-color: var(--negative); background: var(--surface); }
.btn.st-sos:hover { background: var(--pill-neg-bg); border-color: var(--negative); }
.btn.st-sos .st-cta-sub { color: var(--pill-neg-ink); }
.st-cta-meta { padding: 0 2px; font-size: 13px; line-height: 18px; color: var(--muted); }
.st-cta-meta b { color: var(--text); font-weight: 600; }
/* 근무조 칩(조별 상태 · 직접 고르기) */
.st-shifts { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; }
.st-shift {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; min-width: 0; min-height: 44px; padding: 4px 8px;
  border: 1px solid var(--border); border-radius: var(--radius-control); background: var(--surface); color: var(--text);
  font: inherit; cursor: pointer; text-align: center;
}
.st-shift:hover { background: var(--raised); }
.st-shift:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.st-shift.on { border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
.st-shift-name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; line-height: 18px; font-weight: 600; }
.st-shift-st { font-size: var(--fs-small); line-height: 16px; color: var(--muted); }
.st-shift.is-done .st-shift-st { color: var(--positive); }
.st-shift.is-ret .st-shift-st { color: var(--negative); }
.st-shift.is-draft .st-shift-st { color: var(--warning); }
/* 전화 버튼 줄(119 · 사업장 담당자 · 본사) */
.st-calls { display: flex; flex-wrap: wrap; gap: 8px; }
.btn.st-call { flex: 1 1 0; min-width: 0; min-height: 44px; }
.btn.st-call span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn.st-call-119 { color: var(--negative); border-color: var(--negative); font-weight: 600; }
.btn.st-call-119:hover { background: var(--pill-neg-bg); }
/* 사업장 정보의 전화번호: 누르기 쉬운 44px 영역 */
.st-tel { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; margin: -12px 0; padding: 0 12px 0 0; font-weight: 500; }
.st-tel svg { flex: none; }

/* 목록 행: 한 행 한 동작, 끝 열(알약 · 동작 글)은 모든 행이 같은 자리 */
.st-li .li-side { display: grid; grid-auto-flow: column; align-items: center; justify-items: end; gap: 12px; }
.st-go { grid-column: 2; display: inline-flex; align-items: center; justify-content: flex-end; gap: 2px; min-width: 84px; color: var(--text); font-size: 13px; line-height: 18px; font-weight: 500; white-space: nowrap; }
.st-go svg { width: 16px; height: 16px; color: var(--faint); }
.st-li .li-side > .pill { grid-column: 1; }
.st-li .li-title .dot { margin: -2px 2px 0 0; }
.st-li .li-title .pill { margin-left: 4px; }
.st-unread .li-title { font-weight: 700; }
.st-todo-more .li-title { font-weight: 400; color: var(--muted); }
.st-alldone { gap: 8px; color: var(--text); }
.st-alldone svg { color: var(--positive); }
.st-mini-label { margin-top: 16px; font-size: var(--fs-small); line-height: 16px; color: var(--muted); }
