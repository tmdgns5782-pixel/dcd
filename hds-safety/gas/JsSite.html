<script>
/* ===== [site] 시작 ===== */
/* 사업장(휴대폰 우선) 화면: site:home · site:inbox · site:records · site:acts · site:site
   양식 작성·상세는 공용 화면(new/…, edit/…, rec/…)으로 보낸다. 액션 접두사 'st.' */
(function () {
  "use strict";
  var App = window.App = window.App || {};

  /* ───────────── 작은 도구 (순수 함수, 다른 파일에 기대지 않음) ───────────── */
  var WD = ['일', '월', '화', '수', '목', '금', '토'];
  var ROLES = ['근로자', '안전보건 담당자', '관리감독자', '소장', '근로자 대표'];
  var NO_PHOTO = ['보안구역이라 촬영 금지', '고객사가 촬영을 막음', '시설 철거·이전으로 대상 없음', '휴대폰 카메라 사용 불가', '기타(조치 내용에 적음)'];
  var OPEN_ACT = { '등록': 1, '조치중': 1 };
  var DONE_REC = { '제출': 1, '확인': 1 };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function dkey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseD(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ''));
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  function addDays(s, n) { var d = parseD(s); if (!d) return ''; d.setDate(d.getDate() + n); return dkey(d); }
  function daysDiff(a, b) { var x = parseD(a), y = parseD(b); return x && y ? Math.round((y - x) / 86400000) : 0; }
  function today() {
    try { if (App.u && App.u.today) { var t = App.u.today(); if (/^\d{4}-\d{2}-\d{2}$/.test(t)) return t; } } catch (e) { /* 로컬 시계 사용 */ }
    return dkey(new Date());
  }
  function nowHM() { var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function hmOf(s) { var m = /[T ](\d{2}:\d{2})/.exec(String(s || '')); return m ? m[1] : ''; }
  function fmtMD(s) { var d = parseD(s); return d ? (d.getMonth() + 1) + '월 ' + d.getDate() + '일(' + WD[d.getDay()] + ')' : '—'; }
  function fmtYMD(s) { var d = parseD(s); return d ? d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일' : '—'; }
  function fmtDue(s) { var t = hmOf(s); return fmtMD(s) + (t ? ' ' + t : ''); }
  function fmtWhen(s) {
    if (!s) return '—';
    var d = String(s).slice(0, 10), t = hmOf(s), diff = daysDiff(d, today());
    if (diff === 0) return '오늘' + (t ? ' ' + t : '');
    if (diff === 1) return '어제' + (t ? ' ' + t : '');
    return fmtMD(d) + (t ? ' ' + t : '');
  }
  function fmtSize(n) {
    n = Number(n) || 0;
    if (n >= 1048576) return (n / 1048576).toFixed(1) + 'MB';
    if (n >= 1024) return Math.round(n / 1024) + 'KB';
    return n + 'B';
  }
  function toArr(x) {
    if (!x) return [];
    if (Array.isArray(x)) return x;
    if (typeof x.values === 'function') return Array.from(x.values());
    return [];
  }
  function ic(name, size) { try { return App.icon ? App.icon(name, size || 16) : ''; } catch (e) { return ''; } }
  function pill(text, tone) { return '<span class="pill ' + (tone || 'neu') + '">' + esc(text) + '</span>'; }
  function toast(msg, tone) { if (App.toast) App.toast(msg, tone); else window.alert(msg); }
  function api(method, payload, opts) {
    if (!App.api) return Promise.reject(new Error('서버에 연결하지 못했습니다'));
    return App.api(method, payload || {}, opts);
  }
  function confirmAsk(msg, opts) {
    if (App.confirm) return App.confirm(msg, opts || {});
    return Promise.resolve(window.confirm(msg));
  }
  function errMsg(e) { return (e && e.message) || '처리하지 못했습니다'; }

  /* 해시 '#/inbox/REQ-1?x=1' → {parts:['inbox','REQ-1'], query:{x:'1'}} (라우터 인자 모양에 기대지 않으려고 직접 읽음) */
  function hashInfo() {
    var h = String(location.hash || '').replace(/^#\/?/, '');
    var qi = h.indexOf('?'), path = qi < 0 ? h : h.slice(0, qi), qs = qi < 0 ? '' : h.slice(qi + 1);
    var parts = path.split('/').filter(Boolean).map(function (x) { try { return decodeURIComponent(x); } catch (e) { return x; } });
    var query = {};
    qs.split('&').forEach(function (kv) {
      if (!kv) return;
      var i = kv.indexOf('='), k = i < 0 ? kv : kv.slice(0, i), v = i < 0 ? '' : kv.slice(i + 1);
      try { query[decodeURIComponent(k)] = decodeURIComponent(v.replace(/\+/g, ' ')); } catch (e) { query[k] = v; }
    });
    return { parts: parts, query: query };
  }
  function enc(s) { return encodeURIComponent(String(s == null ? '' : s)); }

  /* ───────────── 상태 접근 ───────────── */
  function S() { return App.S || {}; }
  function me() { return S().me || {}; }
  function sid() { return me().site || ''; }
  function settings() { return S().settings || {}; }
  function mySite() {
    var id = sid(), s = null;
    try { s = App.site ? App.site(id) : null; } catch (e) { s = null; }
    if (!s) s = toArr(S().sites).filter(function (x) { return x && x.id === id; })[0];
    return s || { id: id, name: me().siteName || id, shifts: [] };
  }
  var fdCache = null;
  function FD() {
    if (App.FD) return App.FD;
    if (fdCache) return fdCache;
    try { var el = document.getElementById('forms-data'); fdCache = el ? JSON.parse(el.textContent) : { forms: [], codes: {} }; }
    catch (e) { fdCache = { forms: [], codes: {} }; }
    return fdCache;
  }
  function formDef(code) {
    if (App.FORM && App.FORM[code]) return App.FORM[code];
    return toArr(FD().forms).filter(function (f) { return f.code === code; })[0] || null;
  }
  function formShort(code) { var d = formDef(code); return d ? (d.short || d.title) : (code || '양식'); }
  function jobs() { var c = FD().codes || {}; return c.jobs || ['보안', '안내', '주차', '미화', '시설', '사무']; }

  function allRecs() {
    var list;
    if (typeof App.recs === 'function') { try { list = toArr(App.recs(function () { return true; })); } catch (e) { list = null; } }
    if (!list) list = toArr(S().index);
    var id = sid();
    return list.filter(function (r) { return r && !r.deleted && (!id || r.site === id); });
  }
  function recs(fn) { var a = allRecs(); return fn ? a.filter(fn) : a; }
  function allActs() {
    var list;
    if (typeof App.acts === 'function') { try { list = toArr(App.acts(function () { return true; })); } catch (e) { list = null; } }
    if (!list) list = toArr(S().acts);
    var id = sid();
    return list.filter(function (a) { return a && !a.deleted && (!id || a.site === id); });
  }
  function actById(id) {
    var m = S().acts;
    if (m && typeof m.get === 'function' && m.get(id)) return m.get(id);
    return allActs().filter(function (a) { return a.id === id; })[0] || null;
  }
  function putAct(a) {
    if (!a || !a.id) return;
    if (App.putAct) { App.putAct(a); return; }
    var m = S().acts;
    if (m && typeof m.set === 'function') m.set(a.id, a);
  }
  function peopleAll() {
    var id = sid();
    return toArr(S().people).filter(function (p) { return p && p.site === id; });
  }
  function upsertPerson(p) {
    if (!p || !p.id) return;
    var st = S();
    if (!Array.isArray(st.people)) st.people = toArr(st.people);
    var i = st.people.findIndex(function (x) { return x.id === p.id; });
    if (i < 0) st.people.push(p); else st.people[i] = p;
  }
  function readOf(refId) {
    var id = sid();
    return toArr(S().reads).filter(function (r) { return r && r.refId === refId && (!r.site || !id || r.site === id); })[0] || null;
  }

  function isOverdueAct(a) { return !!(a && OPEN_ACT[a.status] && a.due && a.due.slice(0, 10) < today()); }
  function recRank(r) { return r.status === '확인' ? 4 : r.status === '제출' ? 3 : r.status === '반려' ? 2 : 1; }
  function pickRec(list) {
    return list.slice().sort(function (a, b) {
      return (recRank(b) - recRank(a)) || String(b.updatedAt || '').localeCompare(String(a.updatedAt || ''));
    })[0] || null;
  }
  function recHref(r) { return (r.status === '작성중' || r.status === '반려') ? '#/edit/' + enc(r.id) : '#/rec/' + enc(r.id); }
  function newHref(code, extra) {
    var q = [];
    Object.keys(extra || {}).forEach(function (k) { if (extra[k]) q.push(k + '=' + enc(extra[k])); });
    return '#/new/' + enc(code) + '/' + enc(sid()) + (q.length ? '?' + q.join('&') : '');
  }

  function recStatusPill(r) {
    try { if (App.ui && App.ui.recStatus) return App.ui.recStatus(r); } catch (e) { /* 아래 기본 표시 */ }
    var stages = (r.stageDone || []).length;
    if (r.status === '작성중' && stages) return pill(stages + '단계 보고', 'acc');
    return pill(r.status || '작성중', r.status === '확인' ? 'pos' : r.status === '반려' ? 'neg' : r.status === '제출' ? 'acc' : 'neu');
  }
  function actStatusPill(a) {
    try { if (App.ui && App.ui.actStatus) return App.ui.actStatus(a); } catch (e) { /* 아래 기본 표시 */ }
    var t = { '등록': 'neu', '조치중': 'warn', '완료': 'acc', '확인': 'pos', '보류': 'neu', '고객사 이관': 'neu' }[a.status] || 'neu';
    return pill(a.status || '등록', t);
  }
  /* 마감까지 남은 날 → {left, over, text, tone} */
  function dueInfo(due) {
    if (!due) return { left: 9999, over: false, text: '마감 없음', tone: 'neu' };
    var d = String(due).slice(0, 10), t = hmOf(due), left = daysDiff(today(), d);
    var over = left < 0 || (left === 0 && t && nowHM() > t);
    if (over) return { left: left, over: true, text: left < 0 ? '기한경과 ' + (-left) + '일' : '기한경과', tone: 'neg' };
    if (left === 0) return { left: 0, over: false, text: '오늘 마감', tone: 'warn' };
    return { left: left, over: false, text: 'D-' + left, tone: left <= 3 ? 'warn' : 'neu' };
  }
  function periodText(key) {
    var k = String(key || ''), m;
    if ((m = /^(\d{4})-(\d{2})$/.exec(k))) return (+m[2]) + '월분';
    if ((m = /^(\d{4})-Q(\d)$/.exec(k))) return m[2] + '분기';
    if ((m = /^(\d{4})-H([12])$/.exec(k))) return (m[2] === '1' ? '상' : '하') + '반기';
    if (/^\d{4}$/.test(k)) return k + '년';
    return '';
  }

  /* ───────────── 근무조·기간·마감 계산 ───────────── */
  function shiftsOf(site) { return (site && site.shifts && site.shifts.length) ? site.shifts.slice() : ['주간']; }
  /* 지금 근무 중인 조와 그 근무일(야간조는 근무 시작일 기준) */
  function currentShift(site) {
    var sh = shiftsOf(site), h = new Date().getHours(), t = today();
    if (sh.length === 1) return { shift: sh[0], date: t, idx: 0 };
    var nightI = sh.findIndex(function (x) { return /야간|심야|밤/.test(x); });
    var dayI = sh.findIndex(function (x) { return /주간|낮|일근|오전|오후/.test(x); });
    if (nightI >= 0 && dayI >= 0) {
      var amI = sh.findIndex(function (x) { return /오전/.test(x); }), pmI = sh.findIndex(function (x) { return /오후/.test(x); });
      if (h >= 7 && h < 19) {
        if (amI >= 0 && pmI >= 0) return h < 13 ? { shift: sh[amI], date: t, idx: amI } : { shift: sh[pmI], date: t, idx: pmI };
        return { shift: sh[dayI], date: t, idx: dayI };
      }
      return { shift: sh[nightI], date: h < 7 ? addDays(t, -1) : t, idx: nightI };
    }
    /* 이름으로 알 수 없는 조(A조·B조…)는 07시부터 하루를 똑같이 나눔 */
    var slot = Math.floor(((h + 24 - 7) % 24) / (24 / sh.length));
    slot = Math.min(sh.length - 1, Math.max(0, slot));
    return { shift: sh[slot], date: h < 7 ? addDays(t, -1) : t, idx: slot };
  }
  function dailyDueTime() { var v = String(settings().dailyDue || '10:00'); return /^\d{2}:\d{2}$/.test(v) ? v : '10:00'; }
  function dailyRecs(date, shift, site) {
    var first = shiftsOf(site)[0];
    return recs(function (r) { return r.form === 'F07' && r.date === date && (r.shift || first) === shift; });
  }

  function periodOf(type, date) {
    try { if (App.u && App.u.periodOf) { var p = App.u.periodOf(type, date); if (p && p.key && p.from && p.to) return p; } } catch (e) { /* 아래 계산 */ }
    var d = parseD(date), y = d.getFullYear(), m = d.getMonth();
    if (type === 'monthly' || type === 'season') return { key: y + '-' + pad(m + 1), from: dkey(new Date(y, m, 1)), to: dkey(new Date(y, m + 1, 0)), label: y + '년 ' + (m + 1) + '월' };
    if (type === 'quarterly') { var q = Math.floor(m / 3); return { key: y + '-Q' + (q + 1), from: dkey(new Date(y, q * 3, 1)), to: dkey(new Date(y, q * 3 + 3, 0)), label: y + '년 ' + (q + 1) + '분기' }; }
    if (type === 'half') { var hh = m < 6 ? 0 : 1; return { key: y + '-H' + (hh + 1), from: dkey(new Date(y, hh * 6, 1)), to: dkey(new Date(y, hh * 6 + 6, 0)), label: y + '년 ' + (hh ? '하' : '상') + '반기' }; }
    if (type === 'annual') return { key: String(y), from: y + '-01-01', to: y + '-12-31', label: y + '년' };
    return { key: date, from: date, to: date, label: fmtMD(date) };
  }
  function dueOfPeriod(def, p) {
    var r = (def.frequency && def.frequency.dueRule) || {};
    if (r.kind === 'nextDayTime') return addDays(p.to, 1) + ' ' + (r.time || dailyDueTime());
    if (r.kind === 'monthDay') return addDays(p.to, Number(settings().monthlyDueDay) || Number(r.day) || 5);
    if (r.kind === 'periodEndPlusDays') return addDays(p.to, Number(r.days) || 0);
    return p.to;
  }
  /* 이 사업장의 필수 양식 코드 */
  function requiredCodes(site) {
    if (site && site.forms && site.forms.length) return site.forms.slice();
    var E = App.engine;
    if (E && typeof E.requiredForms === 'function') {
      try {
        var r = E.requiredForms(site.id, today());
        if (Array.isArray(r) && r.length) return r.map(function (x) { return typeof x === 'string' ? x : x && (x.code || x.form); }).filter(Boolean);
      } catch (e) { /* 기본값 사용 */ }
    }
    var rf = settings().requiredForms || {};
    var list = (rf['default'] || ['F07', 'F09', 'F01', 'N1', 'N2', 'N4', 'F08B', 'F10B']).slice();
    Object.keys(rf.seasonal || {}).forEach(function (code) { if (list.indexOf(code) < 0) list.push(code); });
    return list;
  }
  function seasonMonthsOf(code, def) {
    var rf = settings().requiredForms || {};
    if (rf.seasonal && rf.seasonal[code]) return rf.seasonal[code];
    return (def.frequency && def.frequency.seasonMonths) || [];
  }

  /* 엔진 expectedFor 결과(모양이 달라도) → [{code, key, label, from, to, due}] */
  function normExpected(list) {
    var out = [];
    toArr(list).forEach(function (x) {
      if (!x) return;
      var code = x.form || x.code || (x.def && x.def.code);
      var p = x.period && typeof x.period === 'object' ? x.period : null;
      var key = (typeof x.period === 'string' ? x.period : '') || (p && p.key) || x.periodKey || x.key;
      var due = x.due || (p && p.due) || '';
      if (due && typeof due === 'object' && due.date) due = due.date + (due.time ? ' ' + due.time : '');
      if (!code || !key || !/^\d{4}-\d{2}-\d{2}/.test(String(due))) return;
      out.push({ code: code, key: String(key), label: (p && p.label) || x.periodLabel || x.label || '', from: (p && p.from) || x.from || '', to: (p && p.to) || x.to || '', due: String(due) });
    });
    return out;
  }
  /* 정기 양식(일일점검·수시 제외)의 직전·현재 기간 후보 */
  function periodicCandidates(site) {
    var t = today(), codes = requiredCodes(site), local = [], types = {};
    codes.forEach(function (code) {
      var def = formDef(code);
      if (!def || !def.frequency) return;
      var type = def.frequency.type;
      if (type === 'daily' || type === 'event') return;
      types[type] = 1;
      if (type === 'annual') {
        var last = recs(function (r) { return r.form === code && DONE_REC[r.status]; }).map(function (r) { return r.date; }).sort().pop();
        if (last) {
          var due = addDays(last, 365);
          local.push({ code: code, key: due.slice(0, 4), label: '연 1회 · 직전 ' + fmtMD(last), from: addDays(last, 1), to: due, due: due, after: last });
        } else {
          var od = site.openDate && /^\d{4}-\d{2}-\d{2}/.test(site.openDate) ? addDays(site.openDate, 30) : t;
          local.push({ code: code, key: t.slice(0, 4), label: '최초 실시', from: site.openDate || '0000-00-00', to: t, due: od, noRecord: true, after: '' });
        }
        return;
      }
      var p = periodOf(type, t), prev = periodOf(type, addDays(p.from, -1));
      [prev, p].forEach(function (pp) {
        if (type === 'season') {
          var mon = (parseD(pp.from) || new Date()).getMonth() + 1;
          if (seasonMonthsOf(code, def).indexOf(mon) < 0) return;
        }
        if (site.openDate && pp.to < site.openDate) return;
        local.push({ code: code, key: pp.key, label: pp.label, from: pp.from, to: pp.to, due: dueOfPeriod(def, pp) });
      });
    });
    /* 엔진이 기대치를 주면 그것을 정본으로(같은 양식은 엔진 것으로 교체) */
    var E = App.engine, eng = [];
    if (E && typeof E.expectedFor === 'function') {
      Object.keys(types).forEach(function (type) {
        if (type === 'annual') return;
        var p = periodOf(type, t);
        [t, addDays(p.from, -1)].forEach(function (ref) {
          try { eng = eng.concat(normExpected(E.expectedFor(site.id, type, ref))); } catch (e) { /* 로컬 계산 사용 */ }
        });
      });
    }
    var engCodes = {}, seen = {};
    eng = eng.filter(function (c) {
      var df = formDef(c.code), ty = df && df.frequency ? df.frequency.type : '';
      return codes.indexOf(c.code) >= 0 && ty && ty !== 'daily' && ty !== 'event' && ty !== 'annual';
    });
    eng.forEach(function (c) { engCodes[c.code] = 1; });
    var all = local.filter(function (c) { return !engCodes[c.code]; }).concat(eng.filter(function (c) { return engCodes[c.code]; }));
    return all.filter(function (c) { var k = c.code + '|' + c.key; if (seen[k]) return false; seen[k] = 1; return true; });
  }
  function candRecs(c) {
    if (c.after !== undefined) {
      return recs(function (r) { return r.form === c.code && (c.after ? r.date > c.after : true); });
    }
    return recs(function (r) {
      return r.form === c.code && (r.period === c.key || (!r.period && c.from && r.date >= c.from && r.date <= c.to));
    });
  }

  /* ───────────── 오늘 할 일 ───────────── */
  function myRequests() {
    var id = sid(), t = today();
    return toArr(S().requests).filter(function (q) {
      if (!q || q.status === '취소') return false;
      var ss = q.sites || [];
      if (ss.length && ss.indexOf('*') < 0 && ss.indexOf(id) < 0) return false;
      return !q.openAt || String(q.openAt).slice(0, 10) <= t;
    });
  }
  function reqState(q) {
    var forms = (q.kind === 'notice' ? [] : (q.forms || [])).map(function (code) {
      var list = recs(function (r) { return r.form === code && (r.requestId === q.id || (q.periodKey && r.period === q.periodKey)); });
      var rec = pickRec(list);
      return { code: code, rec: rec, done: !!(rec && DONE_REC[rec.status]) };
    });
    var left = forms.filter(function (f) { return !f.done; });
    var read = readOf(q.id);
    var done = forms.length ? !left.length : !!read;
    return { forms: forms, left: left, read: read, done: done };
  }
  function unreadCount() {
    return myRequests().filter(function (q) { return q.status === '진행' && !readOf(q.id); }).length;
  }

  function buildTodos(site) {
    var t = today(), todos = [];
    var cur = currentShift(site), shifts = shiftsOf(site);

    /* 1) 지난 근무조 일일점검(오늘 근무조는 큰 버튼이 맡음) */
    if (requiredCodes(site).indexOf('F07') >= 0) {
      [addDays(t, -1), t].forEach(function (d) {
        if (site.openDate && d < site.openDate) return;
        shifts.forEach(function (sh, i) {
          if (d === cur.date && sh === cur.shift) return;
          if (d === t && (cur.date !== t || i >= cur.idx)) return;      /* 아직 시작 안 한 조 */
          if (d > cur.date) return;
          var rec = pickRec(dailyRecs(d, sh, site));
          if (rec && (DONE_REC[rec.status] || rec.status === '반려')) return;
          var due = addDays(d, 1) + ' ' + dailyDueTime(), di = dueInfo(due);
          var when = d === t ? '오늘' : '어제';
          todos.push({
            kind: 'daily', sort: due, due: due, info: di,
            title: when + ' ' + sh + ' 일일점검',
            sub: rec ? '작성중 · 마감 ' + fmtDue(due) : '아직 없음 · 마감 ' + fmtDue(due),
            href: rec ? recHref(rec) : newHref('F07', { date: d, shift: sh }),
            go: rec ? '이어서 쓰기' : '작성하기',
            say: when + ' ' + sh + ' 일일점검이 ' + (rec ? '작성중입니다' : '아직 없습니다') + ' (' + (di.over ? '기한이 지났습니다' : fmtDue(due) + ' 마감') + ')'
          });
        });
      });
    }

    /* 2) 받은 요청(미제출) · 확인이 필요한 공지 */
    myRequests().forEach(function (q) {
      if (q.status !== '진행') return;
      var st = reqState(q);
      if (st.done) return;
      if (q.kind === 'notice' && !q.ackRequired) return;
      var todoForms = st.left.filter(function (f) { return !(f.rec && f.rec.status === '반려'); });
      if (q.kind !== 'notice' && !todoForms.length) return;            /* 반려 기록 줄이 대신 보여 줌 */
      var di = dueInfo(q.due), one = todoForms.length === 1 ? todoForms[0] : null;
      var href = '#/inbox/' + enc(q.id), go = '보기';
      if (q.kind !== 'notice' && one) {
        href = one.rec && (one.rec.status === '작성중' || one.rec.status === '반려') ? recHref(one.rec) : newHref(one.code, { req: q.id });
        go = one.rec ? '이어서 쓰기' : '작성하기';
      } else if (q.kind === 'notice') go = '확인하기';
      var sub = q.kind === 'notice' ? '공지 · 확인 필요' :
        '본사 요청 · ' + (one ? formShort(one.code) : todoForms.length + '종 남음 (' + st.forms.length + '종 중)');
      if (q.due) sub += ' · 마감 ' + fmtDue(q.due);
      todos.push({
        kind: 'req', sort: q.due ? String(q.due) : t + ' 23:59', due: q.due,
        info: q.due ? di : (q.kind === 'notice' ? { text: '확인 필요', tone: 'warn', left: 99 } : { text: '새 요청', tone: 'acc', left: 99 }),
        title: q.title || '본사 요청', sub: sub, href: href, go: go, unread: !st.read,
        say: '본사 요청 ‘' + (q.title || '') + '’ ' + (q.due ? (di.over ? '마감이 지났습니다' : '마감이 ' + (di.left === 0 ? '오늘입니다' : di.left + '일 남았습니다')) : '을 처리해 주세요')
      });
    });

    /* 3) 정기 양식 마감(미제출·임박 14일 이내, 기한경과는 45일까지 — 더 오래된 것은 본사 독촉으로) */
    var reqCover = {};
    myRequests().forEach(function (q) {
      if (q.status !== '진행' || !q.periodKey) return;
      (q.forms || []).forEach(function (code) { reqCover[code + '|' + q.periodKey] = 1; });
    });
    periodicCandidates(site).forEach(function (c) {
      if (reqCover[c.code + '|' + c.key]) return;                       /* 같은 기간 본사 요청 줄이 대신 보여 줌 */
      var list = candRecs(c), rec = pickRec(list);
      if (rec && (DONE_REC[rec.status] || rec.status === '반려')) return;
      var di = dueInfo(c.due);
      if (!di.over && di.left > 14) return;
      if (di.over && di.left < -45 && !c.noRecord) return;
      var def = formDef(c.code) || {}, short = def.short || c.code;
      var plabel = periodText(c.key) && !c.noRecord && c.after === undefined ? periodText(c.key) : (c.label || '');
      if (c.noRecord) di = { left: di.left, over: di.over, text: '기록 없음', tone: di.over ? 'neg' : 'warn' };
      todos.push({
        kind: 'form', sort: c.due, due: c.due, info: di,
        title: short + (plabel ? ' · ' + plabel : ''),
        sub: (rec ? (rec.stageDone && rec.stageDone.length ? rec.stageDone.length + '단계 보고 · ' : '작성중 · ') : '미제출 · ') + '마감 ' + fmtDue(c.due),
        href: rec ? recHref(rec) : newHref(c.code, {}), go: rec ? '이어서 쓰기' : '작성하기',
        say: short + (plabel ? ' ' + plabel : '') + ' ' + (di.over ? '마감이 지났습니다' : di.left === 0 ? '오늘 마감입니다' : '마감이 ' + di.left + '일 남았습니다')
      });
    });

    /* 4) 반려된 기록 */
    recs(function (r) { return r.status === '반려'; }).forEach(function (r) {
      todos.push({
        kind: 'ret', sort: t + ' 00:00', due: '', info: { text: '반려', tone: 'neg', left: 0 },
        title: formShort(r.form) + ' · ' + fmtMD(r.date) + (r.shift ? ' ' + r.shift : ''),
        sub: '사유: ' + (r.returnNote || '본사가 사유를 적지 않았습니다'), href: recHref(r), go: '고치기',
        say: formShort(r.form) + ' 기록이 반려되었습니다' + (r.returnNote ? ' — ' + r.returnNote : '')
      });
    });

    /* 5) 미결 조치: 기한경과·7일 안·높음만 목록에, 나머지는 한 줄로 */
    var open = allActs().filter(function (a) { return OPEN_ACT[a.status]; });
    var rest = 0;
    open.forEach(function (a) {
      var di = a.due ? dueInfo(a.due) : { left: 99, over: false, text: '기한 없음', tone: 'neu' };
      if (!di.over && di.left > 7 && a.level !== '높음') { rest++; return; }
      todos.push({
        kind: 'act', sort: a.due || t + ' 23:59', due: a.due, info: di,
        title: a.title || '조치', sub: (a.status === '조치중' ? '조치중' : '조치 전') + ' · ' + (a.level ? '등급 ' + a.level + ' · ' : '') + (a.due ? '기한 ' + fmtMD(a.due) : '기한 없음'),
        href: '#/acts/' + enc(a.id), go: a.status === '조치중' ? '완료 보고' : '처리하기',
        say: '조치 ‘' + (a.title || '') + '’ ' + (di.over ? '기한이 ' + (-di.left || 0) + '일 지났습니다' : di.left === 0 ? '오늘이 기한입니다' : '기한이 ' + di.left + '일 남았습니다')
      });
    });
    todos.sort(function (a, b) { return String(a.sort).localeCompare(String(b.sort)); });
    return { list: todos, restActs: rest, openActs: open.length };
  }

  /* 이번 달 제출 현황 */
  function monthStats(site) {
    var t = today(), mFrom = t.slice(0, 8) + '01', shifts = shiftsOf(site), dDone = 0, dAll = 0;
    for (var d = mFrom; d <= t; d = addDays(d, 1)) {
      if (site.openDate && d < site.openDate) continue;
      var ok = shifts.every(function (sh) { var r = pickRec(dailyRecs(d, sh, site)); return r && DONE_REC[r.status]; });
      if (d === t && !ok) continue;                                    /* 오늘은 다 냈을 때만 셈 */
      dAll++;
      if (ok) dDone++;
    }
    var cands = periodicCandidates(site).filter(function (c) { return String(c.due).slice(0, 7) === t.slice(0, 7); });
    var pDone = cands.filter(function (c) { var r = pickRec(candRecs(c)); return r && DONE_REC[r.status]; }).length;
    var todayIn = shifts.every(function (sh) { var r = pickRec(dailyRecs(t, sh, site)); return r && DONE_REC[r.status]; });
    return { dDone: dDone, dAll: dAll, todayIn: todayIn, pDone: pDone, pAll: cands.length, month: +t.slice(5, 7), cands: cands, hasDaily: requiredCodes(site).indexOf('F07') >= 0 };
  }

  /* ───────────── 공통 조각 ───────────── */
  function skeleton(rows) {
    var h = '<div class="st-page"><div class="title-row"><div class="title-main"><div class="skel" style="height:14px;width:30%"></div>' +
      '<div class="skel" style="height:26px;width:55%;margin-top:8px"></div></div></div><div class="stack">';
    for (var i = 0; i < (rows || 4); i++) h += '<div class="skel" style="height:56px"></div>';
    return h + '</div></div>';
  }
  function errBlock(e, act) {
    return '<div class="err">불러오지 못했습니다. ' + esc(errMsg(e)) + ' <button type="button" class="btn ghost sm" data-act="' + (act || 'st.reload') + '">다시 시도</button></div>';
  }
  function titleRow(title, sub, eyebrow, actions) {
    return '<div class="title-row"><div class="title-main">' + (eyebrow ? '<p class="st-eyebrow">' + eyebrow + '</p>' : '') +
      '<h1>' + esc(title) + '</h1>' + (sub ? '<p class="sub">' + sub + '</p>' : '') + '</div>' +
      (actions ? '<div class="actions">' + actions + '</div>' : '') + '</div>';
  }
  function panel(o) {
    return '<section class="panel' + (o.cls ? ' ' + o.cls : '') + '"><header class="panel-hd"><div><h2>' + o.title + '</h2>' +
      (o.sub ? '<p class="panel-sub">' + o.sub + '</p>' : '') + '</div>' + (o.actions ? '<div class="panel-actions">' + o.actions + '</div>' : '') + '</header>' +
      '<div class="panel-bd' + (o.flush ? ' flush' : '') + '">' + o.body + '</div>' + (o.foot ? '<footer class="panel-ft">' + o.foot + '</footer>' : '') + '</section>';
  }
  function tabsHtml(act, items, value) {
    return '<div class="tabs st-tabs" role="tablist">' + items.map(function (it) {
      var on = it.value === value;
      return '<button type="button" role="tab" aria-selected="' + on + '" class="' + (on ? 'on' : '') + '" data-act="' + act + '" data-value="' + esc(it.value) + '">' +
        esc(it.label) + (it.count != null ? '<span class="tab-count">' + it.count + '</span>' : '') + '</button>';
    }).join('') + '</div>';
  }
  function liHtml(o) {
    return '<li class="li click st-li' + (o.cls ? ' ' + o.cls : '') + '"' + (o.href ? ' data-href="' + esc(o.href) + '"' : '') +
      (o.act ? ' data-act="' + o.act + '"' : '') + (o.id ? ' data-id="' + esc(o.id) + '"' : '') + ' tabindex="0" role="link">' +
      '<div class="li-main"><div class="li-title">' + o.title + '</div>' + (o.sub ? '<div class="li-sub">' + o.sub + '</div>' : '') + '</div>' +
      '<div class="li-side">' + (o.side || '') + (o.go ? '<span class="st-go">' + esc(o.go) + ic('chevron-right', 16) + '</span>' : '') + '</div></li>';
  }

  /* 화면 등록·다시 그리기 */
  var VIEWS = {}, last = { name: '', main: null };
  function reg(name, def) {
    var wrapped = {
      title: def.title, nav: def.nav,
      render: function (main) {
        last = { name: name, main: main };
        if (!main) return;
        if (!S().me) { main.innerHTML = skeleton(5); return; }
        try { def.render(main, hashInfo()); }
        catch (e) {
          if (window.console) console.error(e);
          main.innerHTML = '<div class="st-page">' + titleRow(def.title, '', '', '') + errBlock(e, 'st.reload') + '</div>';
        }
      }
    };
    VIEWS[name] = wrapped;
    if (typeof App.view === 'function') App.view(name, wrapped);
    else { App.views = App.views || {}; App.views[name] = wrapped; }
  }
  function rerender() {
    var v = VIEWS[last.name];
    if (v && last.main && document.body.contains(last.main)) v.render(last.main);
    else if (App.route) App.route();
  }
  function go(hash) { if (App.go) App.go(hash); else location.hash = hash; }

  /* 대화상자(휴대폰은 아래에서 올라오는 시트) — 계약 마크업 그대로, 이벤트는 data-act 로 */
  function sheet(o) {
    var d = document.createElement('dialog');
    d.className = 'dlg st-sheet' + (o.wide ? ' wide' : '') + (o.cls ? ' ' + o.cls : '');
    d.setAttribute('aria-label', o.title || '');
    function fill(title, body, foot) {
      d.innerHTML = '<header class="dlg-hd"><h2>' + esc(title) + '</h2><button type="button" class="icon-btn" data-close aria-label="닫기">' + (ic('x', 16) || '×') + '</button></header>' +
        '<div class="dlg-bd">' + body + '</div>' + (foot ? '<footer class="dlg-ft">' + foot + '</footer>' : '');
    }
    fill(o.title, o.body, o.foot);
    var closed = false;
    function close() { if (closed) return; closed = true; try { if (d.open && d.close) d.close(); } catch (e) { /* 이미 닫힘 */ } d.remove(); if (o.onClose) o.onClose(); }
    d.addEventListener('click', function (ev) {
      var c = ev.target.closest && ev.target.closest('[data-close]');
      if (c && d.contains(c)) { if (c.tagName !== 'A') ev.preventDefault(); close(); }
    });
    d.addEventListener('close', close);
    d.addEventListener('cancel', function () { setTimeout(close, 0); });
    document.body.appendChild(d);
    try { if (d.showModal) d.showModal(); else d.setAttribute('open', ''); } catch (e) { d.setAttribute('open', ''); }
    d.setAttribute('tabindex', '-1');
    try { d.focus({ preventScroll: true }); } catch (e) { /* 초점 이동 실패는 무시 */ }
    return { el: d, close: close, fill: fill };
  }
  function sheetOf(el) { return el && el.closest ? el.closest('dialog') : null; }
  function setBusy(btn, on, label) {
    if (!btn) return;
    if (on) { btn.dataset.label = btn.innerHTML; btn.disabled = true; btn.innerHTML = esc(label || '보내는 중…'); }
    else { btn.disabled = false; if (btn.dataset.label) btn.innerHTML = btn.dataset.label; }
  }
  function fieldErr(root, name, msg) {
    var f = root.querySelector('[data-field="' + name + '"]');
    if (!f) return;
    f.classList.toggle('has-err', !!msg);
    var e = f.querySelector('.field-err');
    if (e) e.textContent = msg || '';
  }

  /* ════════════════ site:home 오늘 ════════════════ */
  function renderHome(main) {
    var site = mySite(), t = today(), cur = currentShift(site), shifts = shiftsOf(site);
    var T = buildTodos(site), todos = T.list, ms = monthStats(site);
    var d = parseD(t);

    /* 오늘 근무조 일일점검 상태 */
    var curRec = pickRec(dailyRecs(cur.date, cur.shift, site));
    var cta, ctaSub, ctaHref, ctaCls = 'btn primary lg st-cta-btn', ctaIcon = 'clipboard';
    if (!curRec) { cta = '오늘 일일점검 쓰기'; ctaSub = cur.shift + ' 근무 · 아직 쓰지 않았습니다'; ctaHref = newHref('F07', { date: cur.date, shift: cur.shift }); }
    else if (curRec.status === '작성중') { cta = '일일점검 이어서 쓰기'; ctaSub = cur.shift + ' 근무 · 작성중 ' + (hmOf(curRec.updatedAt) ? '(' + hmOf(curRec.updatedAt) + ' 저장)' : ''); ctaHref = recHref(curRec); ctaIcon = 'edit'; }
    else if (curRec.status === '반려') { cta = '반려된 일일점검 고치기'; ctaSub = cur.shift + ' 근무 · ' + (curRec.returnNote || '사유는 기록에서 확인'); ctaHref = recHref(curRec); ctaIcon = 'edit'; }
    else { cta = '오늘 일일점검 제출함'; ctaSub = cur.shift + ' 근무 · ' + (hmOf(curRec.submittedAt) ? hmOf(curRec.submittedAt) + ' 제출' : '제출') + (curRec.status === '확인' ? ' · 본사 확인' : ''); ctaHref = recHref(curRec); ctaCls = 'btn lg st-cta-btn is-done'; ctaIcon = 'check'; }
    var shiftLine = shifts.length > 1 ? shifts.map(function (sh) {
      var r = pickRec(dailyRecs(cur.date, sh, site));
      var s = !r ? '아직' : DONE_REC[r.status] ? '제출' : r.status === '반려' ? '반려' : '작성중';
      return '<span class="nowrap">' + esc(sh) + ' <b>' + s + '</b></span>';
    }).join('<span class="faint"> · </span>') : '';

    var first = todos[0];
    var overN = todos.filter(function (x) { return x.info && x.info.over; }).length;
    var sub;
    var moreOver = overN - (first && first.info.over ? 1 : 0);
    if (first) sub = esc(first.say) + '.' + (moreOver > 0 ? ' 이 밖에 기한이 지난 일이 ' + moreOver + '건 있습니다.' : '');
    else sub = ms.hasDaily && ms.dAll ? '이번 달 일일점검 ' + ms.dDone + '/' + ms.dAll + '일 제출, 밀린 양식과 미결 조치가 없습니다.' : '밀린 양식과 미결 조치가 없습니다.';

    var eyebrow = esc((d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + WD[d.getDay()] + '요일') + ' · ' + esc(cur.shift) + ' 근무' +
      (cur.date !== t ? ' <span class="faint">(' + esc(fmtMD(cur.date)) + ' 시작)</span>' : '');

    var html = '<div class="st-page st-home">' + titleRow(site.name || site.id || '우리 사업장', sub, eyebrow, '');

    html += '<div class="st-cta">' +
      '<div class="st-cta-cell"><button type="button" class="' + ctaCls + '" data-href="' + esc(ctaHref) + '">' + ic(ctaIcon, 20) +
      '<span class="st-cta-text"><span class="st-cta-label">' + esc(cta) + '</span><span class="st-cta-sub">' + esc(ctaSub) + '</span></span></button>' +
      (shiftLine ? '<p class="st-cta-meta">' + shiftLine + '</p>' : '') + '</div>' +
      '<div class="st-cta-cell"><button type="button" class="btn lg st-cta-btn st-sos" data-href="' + esc(newHref('F04', {})) + '">' + ic('siren', 20) +
      '<span class="st-cta-text"><span class="st-cta-label">사고·아차 보고</span><span class="st-cta-sub">재해·무상해·아차사고 속보</span></span></button>' +
      '<p class="st-cta-meta">응급 상황은 먼저 <a class="st-119" target="_top" href="tel:119">119</a>에 신고하고 소장·본사에 전화하세요.</p></div>' +
      '</div>';

    /* 할 일 목록 */
    var body;
    if (todos.length) {
      body = '<ul class="list st-todo">' + todos.map(function (x) {
        return liHtml({
          href: x.href, title: (x.unread ? '<span class="dot acc" aria-label="안 읽음"></span> ' : '') + esc(x.title), sub: esc(x.sub),
          side: pill(x.info.text, x.info.tone), go: x.go, cls: 'st-todo-' + x.kind
        });
      }).join('') + (T.restActs ? liHtml({ href: '#/acts', title: '다른 미결 조치 ' + T.restActs + '건', sub: '기한이 7일 넘게 남은 조치', side: '', go: '조치 보기', cls: 'st-todo-more' }) : '') + '</ul>';
    } else {
      var recent = recs(function (r) { return DONE_REC[r.status]; }).sort(function (a, b) {
        return String(b.submittedAt || b.updatedAt || '').localeCompare(String(a.submittedAt || a.updatedAt || ''));
      }).slice(0, 3);
      body = '<div class="empty st-alldone">' + ic('check', 16) + ' 오늘 할 일을 모두 마쳤습니다.' +
        (T.restActs ? ' <a href="#/acts">기한이 남은 조치 ' + T.restActs + '건</a>' : '') + '</div>' +
        (recent.length ? '<p class="st-mini-label">최근 제출</p><ul class="list">' + recent.map(function (r) {
          return liHtml({ href: '#/rec/' + enc(r.id), title: esc(formShort(r.form)) + (r.shift ? ' <span class="muted">· ' + esc(r.shift) + '</span>' : ''), sub: esc(fmtWhen(r.submittedAt || r.updatedAt) + ' · ' + (r.author || '')), side: recStatusPill(r) });
        }).join('') + '</ul>' : '');
    }
    var overTxt = overN ? '<span class="t-neg">기한경과 ' + overN + '건</span> · ' : '';

  var ACTIONS = {
    'st.reload': function () { if (App.refresh) App.refresh(); else rerender(); },
    'st.inboxTab': function (el) { inboxState.tab = el.getAttribute('data-value') || 'all'; rerender(); },
    'st.recTab': function (el) { recState.tab = el.getAttribute('data-value') || 'all'; recState.limit = 40; rerender(); },
    'st.recMore': function () { recState.limit += 40; rerender(); },
    'st.actTab': function (el) { actState.tab = el.getAttribute('data-value') || 'open'; rerender(); },
    'st.ack': function (el) { markRead(el.getAttribute('data-id'), true, el); },
    'st.attach': function (el) {
      var id = el.getAttribute('data-id'), name = el.getAttribute('data-name') || '첨부', mime = el.getAttribute('data-mime') || '';
      if (el.dataset.busy) return;
      el.dataset.busy = '1';
      var side = el.querySelector('.st-go'), old = side ? side.innerHTML : '';
      if (side) side.textContent = '받는 중…';
      var get = App.getFile ? App.getFile(id) : api('files.get', { id: id }).then(function (r) { return r && r.dataUrl; });
      Promise.resolve(get).then(function (u) {
        var blob = dataUrlToBlob(u && (u.dataUrl || u));
        if (!blob) throw new Error('파일을 받지 못했습니다');
        saveBlob(name, blob, mime);
      }).catch(function (e) { toast(errMsg(e), 'neg'); }).then(function () { delete el.dataset.busy; if (side) side.innerHTML = old; });
    },
    'st.actOpen': function (el) { openAct(el.getAttribute('data-id'), false); },
    'st.actStart': function (el) {
      var stt = actSheetState; if (!stt) return;
      var a = actById(stt.id) || {};
      transition(stt, '조치중', { note: a.status === '등록' ? '조치 시작' : '다시 조치 시작', owner: a.owner || me().name || '' }, el).then(function () {
        toast('조치중으로 바꿨습니다', 'pos'); refillAct(stt); if (last.name === 'site:acts' || last.name === 'site:home') rerender();
      }).catch(function () { /* 토스트로 알림 */ });
    },
    'st.actDoneForm': function () { var stt = actSheetState; if (!stt) return; stt.mode = 'done'; refillAct(stt); var t = stt.dlg.el.querySelector('textarea'); if (t) t.focus(); },
    'st.actBack': function () { var stt = actSheetState; if (!stt) return; stt.mode = 'view'; refillAct(stt); },
    'st.actDone': function (el) {
      var stt = actSheetState; if (!stt) return;
      var root = stt.dlg.el, note = String(stt.note || '').trim(), ok = true;
      fieldErr(root, 'note', ''); fieldErr(root, 'nophoto', '');
      if (note.length < 2) { fieldErr(root, 'note', '무엇을 조치했는지 적어 주세요'); ok = false; }
      if (!stt.photo && !stt.nophoto) { fieldErr(root, 'nophoto', '고친 뒤 사진을 넣거나 사진이 없는 이유를 고르세요'); ok = false; }
      if (!ok) return;
      var a = actById(stt.id) || {};
      var p = { note: note + (stt.photo ? '' : ' [사진 없음: ' + stt.nophoto + ']'), owner: a.owner || me().name || '' };
      if (stt.photo) p.photo = stt.photo; else p.noPhotoReason = stt.nophoto;
      var go = a.status === '조치중' ? Promise.resolve() : transition(stt, '조치중', { note: '조치 시작', owner: p.owner }, null);
      setBusy(el, true, '보내는 중…');
      go.then(function () { return transition(stt, '완료', p, el); }).then(function () {
        toast('완료 보고를 보냈습니다. 본사 확인을 기다립니다.', 'pos');
        stt.dlg.close(); rerender();
      }).catch(function () { setBusy(el, false); });
    },
    'st.toggleInactive': function () { siteState.showInactive = !siteState.showInactive; rerender(); },
    'st.personNew': function (el, ev) { if (ev && ev.preventDefault) ev.preventDefault(); personSheet(null); },
    'st.personEdit': function (el) { var id = el.getAttribute('data-id'); var p = peopleAll().filter(function (x) { return x.id === id; })[0]; if (p) personSheet(p); },
    'st.personSave': function (el) {
      var root = sheetOf(el); if (!root) return;
      var id = el.getAttribute('data-id') || '', v = readPerson(root);
      fieldErr(root, 'name', ''); fieldErr(root, 'phone4', '');
      if (!v.name) { fieldErr(root, 'name', '이름을 넣으세요'); return; }
      var raw = (root.querySelector('[name="phone4"]') || {}).value || '';
      if (raw && !/^\d{4}$/.test(String(raw).trim())) { fieldErr(root, 'phone4', '숫자 4자리로 넣으세요'); return; }
      var dupe = peopleAll().filter(function (x) { return x.id !== id && x.active !== false && x.name === v.name && (x.phone4 || '') === v.phone4; })[0];
      if (dupe) { fieldErr(root, 'name', '같은 이름·끝번호가 이미 있습니다'); return; }
      var base = id ? (peopleAll().filter(function (x) { return x.id === id; })[0] || {}) : { site: sid(), active: true };
      var person = Object.assign({}, base, v, { site: sid() });
      setBusy(el, true, '저장 중…');
      api('people.save', { person: person }).then(function (res) {
        upsertPerson((res && (res.person || res)) || person);
        root.close ? root.close() : root.remove();
        toast(id ? '저장했습니다' : v.name + ' 님을 명부에 넣었습니다', 'pos'); rerender();
      }).catch(function (e) { setBusy(el, false); toast(errMsg(e), 'neg'); });
    },
    'st.personOff': function (el) {
      var root = sheetOf(el), id = el.getAttribute('data-id'), p = peopleAll().filter(function (x) { return x.id === id; })[0];
      if (!p) return;
      confirmAsk(p.name + ' 님을 비활성으로 바꿀까요? 지난 기록에는 이름이 그대로 남고, 새 기록에서만 고를 수 없게 됩니다.', { ok: '비활성으로', danger: true }).then(function (yes) {
        if (!yes) return;
        setBusy(el, true, '바꾸는 중…');
        return api('people.delete', { id: id }).then(function () {
          upsertPerson(Object.assign({}, p, { active: false }));
          if (root && root.close) root.close();
          toast(p.name + ' 님을 비활성으로 바꿨습니다', 'pos'); rerender();
        });
      }).catch(function (e) { setBusy(el, false); toast(errMsg(e), 'neg'); });
    },
    'st.personActive': function (el) {
      var root = sheetOf(el), id = el.getAttribute('data-id'), p = peopleAll().filter(function (x) { return x.id === id; })[0];
      if (!p) return;
      setBusy(el, true, '바꾸는 중…');
      api('people.save', { person: Object.assign({}, p, { active: true }) }).then(function (res) {
        upsertPerson((res && (res.person || res)) || Object.assign({}, p, { active: true }));
        if (root && root.close) root.close();
        toast(p.name + ' 님을 다시 활성으로 바꿨습니다', 'pos'); rerender();
      }).catch(function (e) { setBusy(el, false); toast(errMsg(e), 'neg'); });
    },
    'st.personPaste': function () { pasteSheet(); },
    'st.pasteSave': function (el) {
      var root = sheetOf(el); if (!root) return;
      var r = parsePaste((root.querySelector('[name="paste"]') || {}).value);
      if (!r.rows.length) { fieldErr(root, 'paste', '넣을 이름이 없습니다'); return; }
      setBusy(el, true, '넣는 중…');
      api('people.bulk', { site: sid(), rows: r.rows }).then(function (res) {
        var added = res && res.added != null ? res.added : r.rows.length, skipped = res && res.skipped ? res.skipped : 0;
        if (root.close) root.close();
        toast(added + '명을 명부에 넣었습니다' + (skipped ? ' (' + skipped + '명 건너뜀)' : ''), 'pos');
        if (App.refresh) App.refresh(); else rerender();
      }).catch(function (e) { setBusy(el, false); toast(errMsg(e), 'neg'); });
    },
    'st.nameSave': function (el) {
      var form = el.closest('form') || document; var inp = form.querySelector('[name="name"]');
      var v = String((inp && inp.value) || '').replace(/\s+/g, ' ').trim();
      fieldErr(form, 'name', '');
      if (!v) { fieldErr(form, 'name', '이름을 넣으세요'); return; }
      if (v.length > 30) { fieldErr(form, 'name', '30자까지 적을 수 있습니다'); return; }
      if (App.store) App.store.set('hds.name', v);
      toast(App.store && !App.store.persistent() ? '이 창에서 다음 로그인부터 ‘' + v + '’(으)로 기록됩니다(이 브라우저는 이름을 오래 저장하지 못합니다)' : '다음 로그인부터 ‘' + v + '’(으)로 기록됩니다', 'pos');
    },
    'st.logout': function (el, ev) {
      confirmAsk('이 기기에서 로그아웃할까요?', { ok: '로그아웃' }).then(function (yes) {
        if (!yes) return;
        if (App.actions && App.actions['core.logout']) { App.actions['core.logout'](el, ev); return; }
        api('auth.logout', {}, { silent: true }).catch(function () { return null; }).then(function () {
          if (App.store) App.store.del('hds.token');
          if (typeof App.restartApp === 'function') App.restartApp(); else if (typeof App.begin === 'function') App.begin();
        });
      });
    }
  };
  App.actions = App.actions || {};
  Object.assign(App.actions, ACTIONS);

  /* select 변경(우리 기록 양식 고르기) — data-act 는 click 만 위임되므로 change 를 직접 받음 */
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (!t || !t.getAttribute) return;
    if (t.getAttribute('data-st-change') === 'recForm') { recState.form = t.value; recState.limit = 40; rerender(); }
  });
  /* 뒤로 가기 등으로 화면이 바뀌면 열린 시트를 닫음(지금 해시가 가리키는 조치 시트는 유지) */
  window.addEventListener('hashchange', function () {
    var keep = actSheetState && location.hash === '#/acts/' + enc(actSheetState.id) ? actSheetState.dlg.el : null;
    document.querySelectorAll('dialog.st-sheet').forEach(function (d) {
      if (d === keep) return;
      try { if (d.open) d.close(); else d.remove(); } catch (e) { d.remove(); }
    });
  });
  /* 작성자 이름 칸에서 Enter */
  document.addEventListener('submit', function (ev) {
    var f = ev.target;
    if (!f || !f.classList || !f.classList.contains('st-nameform')) return;
    ev.preventDefault();
    ACTIONS['st.nameSave'](f.querySelector('[data-act="st.nameSave"]') || f, ev);
  });
  /* 목록 행(tabindex) 키보드: Enter/Space 로 열기 */
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    var t = ev.target;
    if (!t || !t.classList || !t.classList.contains('st-li')) return;
    ev.preventDefault();
    t.click();
  });

  /* ───────────── 화면 등록 ───────────── */
  reg('site:home', { title: '오늘', nav: 'home', render: function (main) { renderHome(main); } });
  reg('site:inbox', { title: '받은 요청', nav: 'inbox', render: function (main, h) { renderInbox(main, h); } });
  reg('site:records', { title: '우리 기록', nav: 'records', render: function (main) { renderRecords(main); } });
  reg('site:acts', { title: '조치', nav: 'acts', render: function (main, h) { renderActs(main, h); } });
  reg('site:site', { title: '사업장 정보', nav: 'site', render: function (main) { renderSite(main); } });

  /* 다른 모듈(셸 내비 숫자 등)이 쓸 수 있는 요약 */
  App.siteViews = {
    todos: function () { return S().me ? buildTodos(mySite()).list : []; },
    todoCount: function () { return S().me ? buildTodos(mySite()).list.length : 0; },
    unreadCount: function () { return S().me ? unreadCount() : 0; },
    overdueActs: function () { return S().me ? allActs().filter(isOverdueAct).length : 0; },
    openAct: function (id) { openAct(id, false); }
  };
})();
/* ===== [site] 끝 ===== */
</script>
