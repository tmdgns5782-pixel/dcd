<script>
/* ===== [hq-a] 시작 ===== */
(function () {
  "use strict";
  /* 본사 화면 (hq-a): 종합 현황 · 취합 현황판 · 배포·요청(목록/작성/상세) · 검토함
     계약: SPEC §7.3, 마크업은 dev/AGENT-BRIEF.md. 데이터는 App.S(boot) 색인만 사용, 전체 기록은 App.getRecord. */
  var App = window.App = window.App || {};
  App.actions = App.actions || {};

  /* ───────── 기본 도구 ───────── */
  var ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ESC[c]; }); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function dkey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseD(s) { var m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(NaN); }
  function addDays(s, n) { var d = parseD(s); d.setDate(d.getDate() + n); return dkey(d); }
  function daysDiff(a, b) { return Math.round((parseD(b) - parseD(a)) / 86400000); }
  function nowIso() { var d = new Date(); return dkey(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
  function today() {
    try { if (App.u && typeof App.u.today === 'function') { var t = App.u.today(); if (/^\d{4}-\d{2}-\d{2}$/.test(t)) return t; } } catch (e) { /* 코어 없으면 로컬 */ }
    return nowIso().slice(0, 10);
  }
  function ic(name, size) { try { return App.icon ? App.icon(name, size || 16) : ''; } catch (e) { return ''; } }
  function pctText(x) { return x == null || isNaN(x) ? '—' : Math.round(x * 100) + '%'; }
  function md(ds) { var d = parseD(ds); return isNaN(d) ? '—' : (d.getMonth() + 1) + '월 ' + d.getDate() + '일'; }
  function wday(ds) { var d = parseD(ds); return isNaN(d) ? '' : '일월화수목금토'.charAt(d.getDay()); }
  function relTime(iso) {
    if (!iso) return '—';
    var s = String(iso), t = new Date(s.replace(' ', 'T')), n = new Date();
    if (isNaN(t)) return s.slice(0, 10);
    var min = Math.floor((n - t) / 60000);
    if (min < 1) return '방금';
    if (min < 60) return min + '분 전';
    var h = Math.floor(min / 60);
    if (h < 24) return h + '시간 전';
    var d = daysDiff(s.slice(0, 10), today());
    if (d === 1) return '어제';
    if (d < 31) return d + '일 전';
    return s.slice(0, 10);
  }
  function hoursAgo(iso) { var t = new Date(String(iso || '').replace(' ', 'T')); return isNaN(t) ? 0 : (new Date() - t) / 3600000; }
  function uniq(arr) { var o = {}, out = []; (arr || []).forEach(function (x) { if (x != null && x !== '' && !o[x]) { o[x] = 1; out.push(x); } }); return out; }
  function isPhone() { try { return window.matchMedia('(max-width: 640px)').matches; } catch (e) { return false; } }
  function canWrite() { try { return App.canWrite ? !!App.canWrite() : true; } catch (e) { return false; } }
  function toast(msg, tone) { if (App.toast) App.toast(msg, tone); }
  function go(h) { if (App.go) App.go(h); else location.hash = h; }
  function qs(obj) {
    return Object.keys(obj).filter(function (k) { return obj[k] != null && obj[k] !== ''; })
      .map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(obj[k]); }).join('&');
  }
  function errText(e) { return (e && e.message) ? e.message : String(e || '알 수 없는 오류'); }

  /* ───────── 데이터 접근 (App.S) ───────── */
  function S() { return App.S || {}; }
  function ready() { var s = S(); return !!(s && Array.isArray(s.sites) && (s.index || s.boot)); }
  var DEFAULT_REQ = ['F07', 'F09', 'F01', 'N1', 'N2', 'N4', 'F08B', 'F10B'];
  function settings() { return S().settings || {}; }
  function FORM(code) { return (App.FORM && App.FORM[code]) || null; }
  function FORMS() { return App.FORMS || []; }
  function fshort(code) { var f = FORM(code); return f ? (f.short || f.title) : code; }
  function ftype(def) { return (def && def.frequency && def.frequency.type) || 'event'; }
  function allSites() { return S().sites || []; }
  function activeSites() {
    try { if (App.activeSites) return App.activeSites() || []; } catch (e) { /* 아래로 */ }
    return allSites().filter(function (s) { return s.status !== '종료'; });
  }
  function siteById(id) {
    try { if (App.site) { var s = App.site(id); if (s) return s; } } catch (e) { /* 아래로 */ }
    for (var i = 0, a = allSites(); i < a.length; i++) if (a[i].id === id) return a[i];
    return null;
  }
  function siteLabel(id) { var s = siteById(id); return s ? s.id + ' ' + s.name : id; }
  function recs() {
    try { if (App.recs) return App.recs() || []; } catch (e) { /* 아래로 */ }
    var ix = S().index, out = [];
    if (ix && ix.forEach) ix.forEach(function (r) { if (!r.deleted) out.push(r); });
    return out;
  }
  function acts() {
    try { if (App.acts) return App.acts() || []; } catch (e) { /* 아래로 */ }
    var m = S().acts, out = [];
    if (m && m.forEach) m.forEach(function (a) { if (!a.deleted) out.push(a); });
    return out;
  }
  function requests() { return (S().requests || []).filter(function (r) { return r && r.status !== '취소'; }); }
  function reqById(id) { return (S().requests || []).filter(function (r) { return r.id === id; })[0] || null; }
  function reads() { return S().reads || []; }
  function putIndex(rec) {
    if (!rec) return;
    if (App.putIndex) { App.putIndex(rec); return; }
    var ix = S().index; if (!ix || !ix.set) return;
    var row = {}; Object.keys(rec).forEach(function (k) { if (k !== 'data') row[k] = rec[k]; });
    ix.set(rec.id, row);
  }
  function putRequest(req) {
    if (!req) return;
    var list = S().requests || (S().requests = []);
    for (var i = 0; i < list.length; i++) if (list[i].id === req.id) { list[i] = req; return; }
    list.unshift(req);
  }
  function bumpNav() { try { if (App.updateCounts) App.updateCounts(); } catch (e) { /* 내비 숫자는 다음 새로 고침에 */ } }

  /* ───────── 기간·마감 (SPEC §5 기간 키와 같은 규칙) ───────── */
  var TYPE_RANK = { daily: 0, monthly: 1, season: 1, quarterly: 2, half: 3, annual: 4 };
  var UNIT_TYPE = { month: 'monthly', quarter: 'quarterly', half: 'half', year: 'annual' };
  var UNITS = [{ value: 'month', label: '월' }, { value: 'quarter', label: '분기' }, { value: 'half', label: '반기' }, { value: 'year', label: '연' }];
  var FREQ_LABEL = { daily: '매일', monthly: '매월', season: '하절기 매월', quarterly: '분기', half: '반기', annual: '연 1회', event: '수시' };
  function periodOf(type, ds) {
    var d = parseD(ds), y = d.getFullYear(), m = d.getMonth();
    if (type === 'monthly' || type === 'season') return { type: type, key: y + '-' + pad(m + 1), from: dkey(new Date(y, m, 1)), to: dkey(new Date(y, m + 1, 0)), label: y + '년 ' + (m + 1) + '월', short: (m + 1) + '월' };
    if (type === 'quarterly') { var q = Math.floor(m / 3); return { type: type, key: y + '-Q' + (q + 1), from: dkey(new Date(y, q * 3, 1)), to: dkey(new Date(y, q * 3 + 3, 0)), label: y + '년 ' + (q + 1) + '분기', short: (q + 1) + '분기' }; }
    if (type === 'half') { var h = m < 6 ? 0 : 1; return { type: type, key: y + '-H' + (h + 1), from: dkey(new Date(y, h * 6, 1)), to: dkey(new Date(y, h * 6 + 6, 0)), label: y + '년 ' + (h ? '하' : '상') + '반기', short: (h ? '하' : '상') + '반기' }; }
    if (type === 'annual') return { type: type, key: String(y), from: y + '-01-01', to: y + '-12-31', label: y + '년', short: y + '년' };
    return { type: 'daily', key: ds, from: ds, to: ds, label: md(ds), short: md(ds) };
  }
  function periodFromKey(key) {
    var m;
    key = String(key || '');
    if ((m = key.match(/^(\d{4})-(\d{2})$/))) return periodOf('monthly', m[1] + '-' + m[2] + '-01');
    if ((m = key.match(/^(\d{4})-Q([1-4])$/))) return periodOf('quarterly', m[1] + '-' + pad((+m[2] - 1) * 3 + 1) + '-01');
    if ((m = key.match(/^(\d{4})-H([12])$/))) return periodOf('half', m[1] + '-' + (m[2] === '1' ? '01' : '07') + '-01');
    if ((m = key.match(/^(\d{4})$/))) return periodOf('annual', m[1] + '-01-01');
    return null;
  }
  function stepPeriod(p, dir) { return dir < 0 ? periodOf(p.type, addDays(p.from, -1)) : periodOf(p.type, addDays(p.to, 1)); }
  function subPeriods(type, P) {
    var out = [], p = periodOf(type, P.from), guard = 0;
    while (p.from <= P.to && guard++ < 60) { out.push(p); p = periodOf(type, addDays(p.to, 1)); }
    return out;
  }
  function seasonMonths(def) {
    var seas = ((settings().requiredForms || {}).seasonal) || {};
    if (seas[def.code] && seas[def.code].length) return seas[def.code].map(Number);
    if (ftype(def) === 'season') return (def.frequency.seasonMonths || []).map(Number);
    return null;
  }
  function inSeason(def, p) {
    var months = seasonMonths(def); if (!months) return true;
    var a = parseD(p.from), b = parseD(p.to);
    for (var d = new Date(a.getFullYear(), a.getMonth(), 1); d <= b; d.setMonth(d.getMonth() + 1)) if (months.indexOf(d.getMonth() + 1) >= 0) return true;
    return false;
  }
  function dailyDue() { return String(settings().dailyDue || '10:00'); }
  function dueOf(def, p) {
    var r = (def.frequency && def.frequency.dueRule) || {};
    if (r.kind === 'nextDayTime') return addDays(p.to, 1);
    if (r.kind === 'monthDay') return addDays(p.to, Number(settings().monthlyDueDay || r.day) || 5);
    if (r.kind === 'periodEndPlusDays') return addDays(p.to, Number(r.days) || 0);
    return p.to;
  }
  /* 일일점검: 마감(다음 날 10:00)이 지난 마지막 날 */
  function lastDailyDay() { var n = nowIso(); return n.slice(11, 16) >= dailyDue() ? addDays(n.slice(0, 10), -1) : addDays(n.slice(0, 10), -2); }
  /* 지금 걷고 있는 기간: 직전 기간 마감 전이면 직전 기간 */
  /* chase: 직전 기간 마감 뒤 며칠까지 계속 직전 기간을 보여 줄지(미제출 독촉 기간) */
  function collectingPeriod(def, chase) {
    var type = ftype(def), t = today();
    if (type === 'daily') return periodOf('monthly', lastDailyDay());
    var p = periodOf(type, t), prev = periodOf(type, addDays(p.from, -1));
    if (t <= addDays(dueOf(def, prev), chase || 0) && inSeason(def, prev)) return prev;
    return p;
  }
  function defaultPeriod(unit) {
    var grace = { month: Number(settings().monthlyDueDay || 5) + 1, quarter: 11, half: 8, year: 11 }[unit] || 0;
    return periodOf(UNIT_TYPE[unit] || 'monthly', addDays(today(), -grace));
  }
  /* 사업장의 정기 필수 양식(기간 P 와 겹치는 계절 양식 포함) */
  function requiredCodes(site, P) {
    var base = null;
    if (App.engine && typeof App.engine.requiredForms === 'function') {
      try {
        var r = App.engine.requiredForms(site.id, P ? P.to : today());
        if (Array.isArray(r)) base = r.map(function (x) { return typeof x === 'string' ? x : (x && (x.code || (x.def && x.def.code))); }).filter(Boolean);
      } catch (e) { base = null; }
    }
    if (!base || !base.length) base = (site.forms && site.forms.length) ? site.forms.slice() : (((settings().requiredForms || {})['default']) || DEFAULT_REQ).slice();
    var seas = ((settings().requiredForms || {}).seasonal) || {};
    Object.keys(seas).forEach(function (code) {
      if (base.indexOf(code) < 0 && (!site.forms || !site.forms.length || site.forms.indexOf(code) >= 0)) base.push(code);
    });
    return uniq(base).filter(function (code) {
      var def = FORM(code); if (!def || ftype(def) === 'event') return false;
      return P ? inSeason(def, P) : true;
    });
  }
  function formOrder(code) { var a = FORMS(); for (var i = 0; i < a.length; i++) if (a[i].code === code) return i; return 999; }

  /* ───────── 상태 기호 ───────── */
  var MK = {
    'mk-ok': { label: '제출', tone: 'acc' },
    'mk-late': { label: '지연 제출', tone: 'warn' },
    'mk-confirmed': { label: '확인', tone: 'pos' },
    'mk-draft': { label: '작성중·단계보고', tone: 'neu' },
    'mk-returned': { label: '반려', tone: 'neg' },
    'mk-miss': { label: '기한경과 미제출', tone: 'neg' },
    'mk-wait': { label: '마감 전', tone: 'neu' },
    'mk-na': { label: '해당 없음', tone: 'neu' }
  };
  var MK_ORDER = ['mk-ok', 'mk-late', 'mk-confirmed', 'mk-draft', 'mk-returned', 'mk-miss', 'mk-wait', 'mk-na'];
  var DONE = { 'mk-ok': 1, 'mk-late': 1, 'mk-confirmed': 1 };
  var RANK = { '확인': 4, '제출': 3, '반려': 2, '작성중': 1 };
  function isSubmitted(r) { return r && (r.status === '제출' || r.status === '확인'); }
  function bestRec(list) {
    var b = null;
    (list || []).forEach(function (r) {
      var a = RANK[r.status] || 0, c = b ? (RANK[b.status] || 0) : -1;
      if (!b || a > c || (a === c && String(r.updatedAt || '') > String(b.updatedAt || ''))) b = r;
    });
    return b;
  }
  function recCls(r, due) {
    if (r.status === '확인') return 'mk-confirmed';
    if (r.status === '반려') return 'mk-returned';
    if (r.status === '제출') return (due && String(r.submittedAt || r.updatedAt || '').slice(0, 10) > due) ? 'mk-late' : 'mk-ok';
    return 'mk-draft';
  }
  function legendHtml(kinds) {
    var on = {}; (kinds || MK_ORDER).forEach(function (k) { on[k] = 1; });
    return '<div class="mk-legend">' + MK_ORDER.filter(function (k) { return on[k]; }).map(function (k) {
      return '<span><i class="mk ' + k + '"></i>' + esc(MK[k].label) + '</span>';
    }).join('') + '</div>';
  }
  function stageLabel(r) {
    var def = FORM(r.form), done = r.stageDone || [];
    if (!def || !def.stages || !done.length) return '';
    var last = done[done.length - 1], idx = -1;
    def.stages.forEach(function (s, i) { if (s.id === last) idx = i; });
    return (idx >= 0 ? (idx + 1) + '단계 보고' : done.length + '단계 보고') + (idx >= 0 && def.stages[idx].label ? '(' + def.stages[idx].label + ')' : '');
  }
  function recPill(r) {
    try { if (App.ui && App.ui.recStatus) return App.ui.recStatus(r); } catch (e) { /* 아래로 */ }
    if (r.status === '확인') return pill('확인', 'pos');
    if (r.status === '제출') return pill('제출', 'acc');
    if (r.status === '반려') return pill('반려', 'neg');
    if ((r.stageDone || []).length) return pill(stageLabel(r).replace(/\(.*$/, ''), 'warn');
    return pill('작성중', 'neu');
  }

  /* ───────── 마크업 조각 (마크업 계약) ───────── */
  function pill(text, tone) { return '<span class="pill ' + (tone || 'neu') + '">' + esc(text) + '</span>'; }
  function dot(tone) { return '<span class="dot ' + (tone || 'neu') + '"></span>'; }
  function titleRow(title, sub, actions) {
    return '<div class="title-row"><div class="title-main"><h1>' + esc(title) + '</h1>' + (sub ? '<p class="sub">' + sub + '</p>' : '') + '</div>' +
      (actions ? '<div class="actions">' + actions + '</div>' : '') + '</div>';
  }
  function panel(o) {
    return '<section class="panel' + (o.cls ? ' ' + o.cls : '') + '"' + (o.id ? ' id="' + o.id + '"' : '') + '><header class="panel-hd"><div><h2>' + esc(o.title) + '</h2>' +
      (o.sub ? '<p class="panel-sub">' + o.sub + '</p>' : '') + '</div>' + (o.actions ? '<div class="panel-actions">' + o.actions + '</div>' : '') + '</header>' +
      '<div class="panel-bd' + (o.flush ? ' flush' : '') + '">' + (o.body || '') + '</div>' + (o.foot ? '<footer class="panel-ft">' + o.foot + '</footer>' : '') + '</section>';
  }
  function empty(text, action) { return '<div class="empty">' + esc(text) + (action ? ' ' + action : '') + '</div>'; }
  function errBox(e, act) { return '<div class="err">' + esc(errText(e) || '불러오지 못했습니다.') + ' <button class="btn ghost sm" data-act="' + (act || 'hq.retry') + '">다시 시도</button></div>'; }
  function skel(h, w) { return '<div class="skel" style="height:' + h + 'px;width:' + w + '"></div>'; }
  function kpis(items, lead) {
    return '<div class="kpis" style="--n:' + items.length + '">' + items.map(function (k, i) {
      return '<div class="kpi' + (lead === i ? ' is-lead' : '') + '"><div class="kpi-label">' + esc(k.label) + '</div><div class="kpi-value num">' + k.value +
        (k.unit ? '<span class="unit">' + esc(k.unit) + '</span>' : '') + '</div><div class="kpi-sub">' + (k.sub || '') + '</div></div>';
    }).join('') + '</div>';
  }
  function bar(ratio, tone) {
    var w = ratio == null || isNaN(ratio) ? 0 : Math.max(0, Math.min(1, ratio)) * 100;
    return '<div class="bar' + (tone ? ' ' + tone : '') + '"><i style="width:' + w.toFixed(1) + '%"></i></div>';
  }
  function seg(name, opts, value, act) {
    return '<div class="seg" data-seg="' + name + '">' + opts.map(function (o) {
      return '<button type="button" data-value="' + esc(o.value) + '" data-act="' + act + '"' + (o.value === value ? ' class="on" aria-pressed="true"' : ' aria-pressed="false"') + '>' + esc(o.label) + '</button>';
    }).join('') + '</div>';
  }
  function tabs(name, items, value, act) {
    return '<div class="tabs" data-tab="' + name + '">' + items.map(function (o) {
      return '<button type="button" data-value="' + esc(o.value) + '" data-act="' + act + '"' + (o.value === value ? ' class="on" aria-selected="true"' : ' aria-selected="false"') + '>' + esc(o.label) +
        (o.count != null ? '<span class="tab-count">' + o.count + '</span>' : '') + '</button>';
    }).join('') + '</div>';
  }
  function dueText(due, closed) {
    if (!due) return '<span class="faint">—</span>';
    var d = daysDiff(today(), due);
    if (closed) return '<span class="muted">' + esc(due) + '</span>';
    if (d > 0) return '<span class="num">D-' + d + '</span>';
    if (d === 0) return '<span class="t-warn">오늘 마감</span>';
    return '<span class="t-neg">기한경과 ' + (-d) + '일</span>';
  }

  /* ───────── 화면 틀: 등록·오류·로딩 ───────── */
  var CUR = null;
  function frame(main, html) {
    var isPage = main.classList && main.classList.contains('page');
    main.innerHTML = isPage ? html : '<div class="page">' + html + '</div>';
  }
  function scroller() { return document.getElementById('main') || document.scrollingElement || document.documentElement; }
  function loadingHtml(title) {
    return titleRow(title, skel(14, '320px')) +
      '<div class="kpis" style="--n:4">' + [0, 1, 2, 3].map(function () { return '<div class="kpi"><div class="kpi-label">' + skel(12, '60%') + '</div><div class="kpi-value">' + skel(28, '40%') + '</div></div>'; }).join('') + '</div>' +
      '<div class="grid"><section class="panel span-8"><div class="panel-bd">' + [0, 1, 2, 3, 4].map(function () { return skel(24, '100%'); }).join('<div style="height:16px"></div>') + '</div></section>' +
      '<section class="panel span-4"><div class="panel-bd">' + [0, 1, 2, 3].map(function () { return skel(24, '100%'); }).join('<div style="height:16px"></div>') + '</div></section></div>';
  }
  /* 코어 라우터는 query 를 URLSearchParams 로 준다 → 평범한 객체로 */
  function qobj(q) {
    var o = {};
    if (!q) return o;
    if (typeof q.forEach === 'function' && typeof q.get === 'function') { q.forEach(function (v, k) { o[k] = v; }); return o; }
    Object.keys(q).forEach(function (k) { o[k] = q[k]; });
    return o;
  }
  function guard(title, fn) {
    return function (main, args, query) {
      query = qobj(query);
      CUR = { title: title, fn: fn, main: main, args: args || [], query: query, base: hashBase() };
      if (!ready()) { frame(main, loadingHtml(title)); return; }
      try { fn(main, args || [], query || {}); }
      catch (e) {
        if (window.console) console.error(e);
        frame(main, titleRow(title, '') + '<section class="panel"><div class="panel-bd">' + errBox(new Error('화면을 그리지 못했습니다. ' + errText(e))) + '</div></section>');
      }
    };
  }
  function hashBase() { return String(location.hash || '').split('?')[0]; }
