      var r = { id: reqId(o.openAt), kind: o.kind, title: o.title, message: o.message, forms: o.forms || [], sites: o.sites, periodKey: o.periodKey || '',
        openAt: o.openAt, due: o.due || '', attachments: [], ackRequired: !!o.ack, remind: o.kind === 'form' ? { beforeDays: [3, 1], overdue: true } : {},
        status: o.status || '진행', createdBy: 'admin', createdAt: ts(o.openAt, 9, R.i(0, 40)), updatedAt: ts(o.openAt, 9, R.i(41, 59)), lastRemindAt: o.lastRemindAt || '' };
      if (r.updatedAt > NOW) r.updatedAt = NOW;
      REQS.push(r);
      return r;
    }
    var out = {};
    var aug = y + '-08-01';
    if (aug >= START) out.f06 = rq({ kind: 'form', title: '8월 폭염 대응 점검 제출', forms: ['F06'], sites: ['*'], periodKey: y + '-08', openAt: aug, due: y + '-08-31', status: '마감',
      message: '폭염 대응 체계 점검(F06)을 8월 말까지 제출해 주세요. 휴식 부여·식수·그늘 확보 사진을 함께 올려 주세요.' });
    out.f08b = rq({ kind: 'form', title: '3분기 보호구 보유 실사 제출', forms: ['F08B'], sites: ['*'], periodKey: y + '-Q3', openAt: y + '-09-22', due: y + '-10-10', status: '마감',
      lastRemindAt: ts(y + '-10-11', 8, 0), message: '분기 말 보호구 보유 수량과 상태를 실사해 10월 10일까지 제출해 주세요.' });
    out.n2 = rq({ kind: 'form', title: y + ' 하반기 비상대응훈련 결과 제출', forms: ['N2'], sites: ['*'], periodKey: y + '-H2', openAt: y + '-09-01', due: add(TODAY, 6),
      lastRemindAt: ts(add(TODAY, -1), 8, 0), message: '하반기 비상대응훈련을 실시하고 결과(사진 2장 이상·참여자 서명)를 제출해 주세요. 아직 계획 단계면 실시일을 먼저 등록해 주세요.' });
    out.n4 = rq({ kind: 'form', title: '동절기 대비 분기 점검', forms: ['N4'], sites: hecSites.length ? hecSites : ['*'], periodKey: y + '-Q4', openAt: add(TODAY, -21), due: add(TODAY, -1),
      lastRemindAt: ts(TODAY, 8, 0), message: 'HEC 대상 사업장은 동절기 대비 분기 점검표(N4)를 작성해 제출해 주세요. 결빙·화재·전열기구 항목을 꼭 확인해 주세요.' });
    out.notice1 = rq({ kind: 'notice', title: '동절기 한파·대설 대비 안전수칙 안내', sites: ['*'], openAt: add(TODAY, -5), ack: true,
      message: '한파특보 시 옥외 근무 시간 단축, 방한 보호구 착용, 결빙 구간 제설을 지켜 주세요. TBM 때 전 근무자에게 전파하고 확인을 눌러 주세요.' });
    out.notice2 = rq({ kind: 'notice', title: '작업중지권 안내문 재게시 요청', sites: ['*'], openAt: add(TODAY, -17), ack: true,
      message: '초소·휴게실에 작업중지권 안내문(최신본)을 다시 게시하고 확인을 눌러 주세요. 하반기 이행점검(F10B) 때 게시 사진을 확인합니다.' });
    return out;
  }
  function makeReads() {
    REQS.forEach(function (r) {
      var targets = r.sites[0] === '*' ? SITES : SITES.filter(function (s) { return r.sites.indexOf(s.id) >= 0; });
      targets.forEach(function (site) {
        var p = r.kind === 'notice' ? (site._d.prof === 'weak' ? 0.4 : site._d.prof === 'normal' ? 0.75 : 0.95) : 0.9;
        if (!R.chance(p)) return;
        var at = tsAdd(r.createdAt, R.i(30, 60 * 24 * 3));
        if (at > NOW) at = tsAdd(NOW, -R.i(10, 300));
        READS.push({ id: 'RD-' + R.hex(8), refId: r.id, site: site.id, by: R.chance(0.6) ? site._officer : site._chief, at: at });
      });
    });
  }

  /* ───────── 조치 ID 정리·마무리 ───────── */
  function finalizeActs() {
    ACTS.sort(function (a, b) { return a.createdAt < b.createdAt ? -1 : a.createdAt > b.createdAt ? 1 : (a.key < b.key ? -1 : 1); });
    var n = {};
    ACTS.forEach(function (a) {
      var head = 'ACT-' + a.site + '-' + yymm(a._d || a.createdAt) + '-';
      n[head] = (n[head] || 0) + 1;
      a.id = head + pad(n[head], 3);
      delete a._d;
    });
  }

  /* ───────── 문맥 바꿔 끼우기(엔진이 예시 데이터를 보도록) ───────── */
  function swapIn() {
    var St = App.S = App.S || {};
    var saved = { S: { sites: St.sites, people: St.people, index: St.index, acts: St.acts, records: St.records },
      fn: { site: App.site, siteName: App.siteName, peopleOf: App.peopleOf, recs: App.recs, acts: App.acts, activeSites: App.activeSites } };
    St.sites = SITES; St.people = PEOPLE; St.index = IDX; St.records = FULL; St.acts = ACTMAP;
    App.site = function (id) { return siteById(id); };
    App.siteName = function (id) { var s = siteById(id); return s ? s.name : id; };
    App.activeSites = function () { return SITES.slice(); };
    App.peopleOf = function (id) { return PEOPLE.filter(function (p) { return p.site === id && p.active !== false; }); };
    App.recs = function (fn) { var a = []; IDX.forEach(function (r) { if (!r.deleted) a.push(r); }); return fn ? a.filter(fn) : a; };
    App.acts = function (fn) { var a = ACTS.filter(function (x) { return !x.deleted; }); return fn ? a.filter(fn) : a; };
    return saved;
  }
  function swapOut(saved) {
    var St = App.S;
    Object.keys(saved.S).forEach(function (k) { St[k] = saved.S[k]; });
    Object.keys(saved.fn).forEach(function (k) { if (saved.fn[k] === undefined) delete App[k]; else App[k] = saved.fn[k]; });
  }

  /* ───────── build ───────── */
  function build(o) {
    o = o || {};
    var seed = o.seed == null ? 7 : Number(o.seed);
    var days = Math.max(14, Math.min(400, Number(o.days) || 120));
    E = App.engine || {};
    ['newRecord', 'autofill', 'computeAll', 'factsOf', 'periodKeyOf', 'actsFromRecord'].forEach(function (k) {
      if (typeof E[k] !== 'function') throw new Error('양식 엔진(App.engine.' + k + ')을 불러오지 못해 예시 데이터를 만들 수 없습니다.');
    });
    FORM = forms(); FMC = {};
    R = Rng(seed);
    TODAY = o.today || (App.u && App.u.today ? App.u.today() : dk(new Date()));
    NOW = ts(TODAY, 8, 50);
    START = add(TODAY, -days);
    if (+START.slice(8, 10) <= 10) START = monthStart(START);   // 월 집계가 맞도록 그 달 1일부터
    SITES = []; PEOPLE = []; RECS = []; ACTS = []; REQS = []; READS = []; IDX = new Map(); RECMAP = {}; ACTMAP = new Map(); FULL = new Map(); RECN = {}; EVT = {}; usedNames = {}; warned = {};
    WX = makeWeather(seed);
    SITES = makeSites(o.sites == null ? 12 : Number(o.sites));
    SITES.forEach(function (s) { PEOPLE = PEOPLE.concat(makePeople(s)); });
    var saved = swapIn();
    try {
      var reqs = makeRequests();
      var vplan = planVoices();
      genF04();
      genN3();
      genF05();
      genF10();
      var f03 = genF03(reqs);
      SITES.forEach(function (s, i) { genF01(s, i, f03); });
      genF07();
      genF02(vplan);
      genN1();
      genN2(reqs.n2);
      genN4(reqs.n4);
      genF06(reqs.f06);
      genF08(reqs.f08b);
      genF10B();
      genF09();
      makeReads();
      finalizeActs();
    } finally {
      swapOut(saved);
    }
    // 내부 보조 필드 지우기
    var sites = SITES.map(function (s) {
      var c = {};
      Object.keys(s).forEach(function (k) { if (k.charAt(0) !== '_' && k !== 'places') c[k] = s[k]; });
      return c;
    });
    RECS.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.id < b.id ? -1 : 1); });
    return { sites: sites, people: PEOPLE, records: RECS, acts: ACTS, requests: REQS, reads: READS };
  }

  /* ───────── 올리기 ───────── */
  function payloads(b, maxBytes) {
    maxBytes = maxBytes || 1500000;
    var MAXN = 500;
    var first = { sites: b.sites, people: b.people, requests: b.requests, reads: b.reads, acts: [], records: [], replace: true };
    var out = [first], cur = first;
    var size = JSON.stringify({ sites: b.sites, people: b.people, requests: b.requests, reads: b.reads }).length;
    function push(table, item) {
      var n = JSON.stringify(item).length + 1;
      if (cur[table].length >= MAXN || (size + n > maxBytes && (cur.acts.length + cur.records.length) > 0)) {
        cur = { acts: [], records: [], replace: false };
        out.push(cur);
        size = 64;
      }
      cur[table].push(item);
      size += n;
    }
    // 첫 호출에 두 표가 모두 들어가도록 앞부분을 섞어 넣는다
    var ai = 0, ri = 0;
    while (ai < b.acts.length || ri < b.records.length) {
      if (ai < b.acts.length && (ri >= b.records.length || ai * 4 <= ri)) push('acts', b.acts[ai++]);
      else push('records', b.records[ri++]);
    }
    out.forEach(function (p, i) { if (i > 0) { if (!p.acts.length) delete p.acts; if (!p.records.length) delete p.records; } });
    return out;
  }
  function stats(b) {
    var byForm = {}, byStatus = {}, actStatus = {};
    b.records.forEach(function (r) { byForm[r.form] = (byForm[r.form] || 0) + 1; byStatus[r.status] = (byStatus[r.status] || 0) + 1; });
    b.acts.forEach(function (a) { actStatus[a.status] = (actStatus[a.status] || 0) + 1; });
    return { sites: b.sites.length, people: b.people.length, records: b.records.length, acts: b.acts.length, requests: b.requests.length, reads: b.reads.length,
      byForm: byForm, byStatus: byStatus, actStatus: actStatus };
  }
  var busy = false;
  function say(msg, tone) { try { if (App.toast) App.toast(msg, tone); } catch (e) { /* 토스트 실패는 무시 */ } }
  function load(o) {
    if (busy) return Promise.reject(new Error('예시 데이터를 이미 올리는 중입니다.'));
    busy = true;
    o = o || {};
    say('예시 데이터를 만드는 중입니다…');
    var bundle;
    return new Promise(function (res) { setTimeout(res, 30); }).then(function () {
      bundle = build(o);
      var parts = payloads(bundle, o.maxBytes);
      var i = 0;
      function next() {
        if (i >= parts.length) return Promise.resolve();
        var p = parts[i++];
        if (parts.length > 1) say('예시 데이터를 올리는 중입니다 (' + i + '/' + parts.length + ')');
        return App.api('admin.importBulk', p, { silent: true }).then(next);
      }
      return next();
    }).then(function () {
      return App.refresh ? App.refresh() : null;
    }).then(function () {
      busy = false;
      var st = stats(bundle);
      say('예시 데이터를 불러왔습니다 · 사업장 ' + st.sites + '곳, 기록 ' + st.records.toLocaleString('ko-KR') + '건, 조치 ' + st.acts.toLocaleString('ko-KR') + '건', 'pos');
      return st;
    }, function (err) {
      busy = false;
      say('예시 데이터를 올리지 못했습니다. ' + (err && err.message ? err.message : ''), 'neg');
      throw err;
    });
  }

  App.demo = { build: build, load: load, payloads: payloads, stats: stats };
})();

</script>
