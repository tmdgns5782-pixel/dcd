      toast('분석 시트를 다시 만드는 중입니다. 기록이 많으면 1분쯤 걸립니다.');
      api('admin.rebuildViews', {}).then(function (res) {
        toast('분석 시트 ' + num(res && res.sheets ? res.sheets.length : 0) + '개, ' + num(res && res.rows || 0) + '행을 다시 만들었습니다.', 'pos');
      }).catch(function (er) { toast(errMsg(er), 'neg'); }).then(function () { busy(el, false); });
    },
    'hq.set.pw': function (el) {
      var root = SETS.root;
      if (!alive(root)) return;
      clearErrs(root);
      var o = val(root, '#pw-old'), n = root.querySelector('#pw-new').value, n2 = root.querySelector('#pw-new2').value;
      if (!o) { setErr(root, '#pw-old', '지금 비밀번호를 넣어 주세요.'); return; }
      if (n.length < 8 || !/[A-Za-z]/.test(n) || !/\d/.test(n)) { setErr(root, '#pw-new', '8자 이상, 영문과 숫자를 섞어 주세요.'); return; }
      if (n === o) { setErr(root, '#pw-new', '지금 비밀번호와 다르게 정해 주세요.'); return; }
      if (n !== n2) { setErr(root, '#pw-new2', '두 번 넣은 새 비밀번호가 다릅니다.'); return; }
      busy(el, true);
      api('auth.changePassword', { old: o, 'new': n }).then(function () {
        ['#pw-old', '#pw-new', '#pw-new2'].forEach(function (k) { var x = root.querySelector(k); if (x) x.value = ''; });
        toast('비밀번호를 바꿨습니다. 다음 로그인부터 새 비밀번호를 쓰세요.', 'pos');
      }).catch(function (er) { toast(errMsg(er), 'neg'); }).then(function () { busy(el, false); });
    },
    'hq.set.demo': function (el) {
      if (!(App.demo && typeof App.demo.load === 'function')) { toast('예시 데이터 생성기를 불러오지 못했습니다.', 'neg'); return; }
      var n = sitesAll().length, r = recsAll().length;
      confirmP((n || r ? '지금 있는 사업장 ' + num(n) + '곳과 기록 ' + num(r) + '건이 모두 지워지고 ' : '') + '예시 데이터(사업장 12곳·최근 90일)로 바뀝니다. 계속할까요?', { ok: '예시 데이터로 바꾸기', danger: n > 0 || r > 0 })
        .then(function (ok) {
          if (!ok) return;
          busy(el, true);
          toast('예시 데이터를 만드는 중입니다…');
          return Promise.resolve(App.demo.load()).then(function () { toast('예시 데이터를 불러왔습니다.', 'pos'); go('#/home'); });
        }).catch(function (er) { toast(errMsg(er), 'neg'); }).then(function () { busy(el, false); });
    },
    'hq.set.wipe': function (el) {
      promptP({ title: '전체 삭제', label: '사업장·기록·조치·요청을 모두 지웁니다. 확인하려면 ‘삭제’라고 입력하세요.', value: '', placeholder: '삭제' }).then(function (t) {
        if (t == null) return;
        if (String(t).trim() !== '삭제') { toast('‘삭제’라고 정확히 입력해야 지웁니다.', 'neg'); return; }
        busy(el, true);
        return api('admin.wipe', { confirm: '삭제' }).then(function () {
          toast('모든 데이터를 지웠습니다.', 'pos');
          if (App.refresh) return App.refresh();
        });
      }).catch(function (er) { toast(errMsg(er), 'neg'); }).then(function () { busy(el, false); });
    }
  });

  /* ======================= 통합 검색 #/search?q= ======================= */
  function viewSearch(main, args, query) {
    var q = String(parseQuery(query).q || argsArr(args).join('/') || '').trim();
    var form = '<form class="toolbar hq-searchbar" data-hq="search"><input class="input hq-q" type="search" name="q" value="' + esc(q) + '" placeholder="기록번호·사업장·조치·요청 검색" aria-label="검색어" autofocus>' +
      '<button class="btn" type="submit">' + icon('search') + '<span>검색</span></button></form>';
    if (!q) {
      var r0 = mount(main, 'search', titleRow('검색', '기록번호·작성자·입력값, 조치 내용, 사업장 이름, 요청 제목을 한 번에 찾습니다.') + form +
        panel({ title: '최근에 들어온 기록', body: '<div data-slot="recent"></div>', flush: true }));
      var rec = sortRecs(recsAll()).slice(0, 5);
      slot(r0, 'recent').innerHTML = rec.length ? '<ul class="list">' + rec.map(searchRecLi).join('') + '</ul>' : empty('아직 들어온 기록이 없습니다.');
      bindSearchForm(r0);
      return;
    }
    var words = q.toLowerCase().split(/\s+/).filter(Boolean);
    function hit(t) { t = String(t || '').toLowerCase(); return words.every(function (w) { return t.indexOf(w) >= 0; }); }
    var sites = sitesAll().filter(function (s) { return hit([s.id, s.name, s.client, s.region, s.address, s.type, s.managerName].join(' ')); });
    var recs = sortRecs(recsAll(function (r) { return hit(recText(r)); }));
    var acts = actSort(actsAll(function (a) { return hit([a.id, a.title, a.detail, a.owner, a.srcItem, a.srcId, a.site, siteName(a.site)].join(' ')); }), 'all');
    var reqs = (S().requests || []).filter(function (r) { return hit([r.id, r.title, r.message].join(' ')); })
      .sort(function (a, b) { return cmpDesc(a.createdAt || '', b.createdAt || ''); });
    var exact = recs.filter(function (r) { return r.id.toLowerCase() === q.toLowerCase(); })[0] || acts.filter(function (a) { return a.id.toLowerCase() === q.toLowerCase(); })[0];
    var total = sites.length + recs.length + acts.length + reqs.length;
    var sub = '‘' + esc(q) + '’ — 사업장 ' + num(sites.length) + '곳 · 기록 ' + num(recs.length) + '건 · 조치 ' + num(acts.length) + '건 · 요청 ' + num(reqs.length) + '건';
    var blocks = [];
    if (exact) {
      var isRec = !!exact.form;
      blocks.push('<div class="hq-exact">' + icon('chevron-right') + ' 번호가 정확히 맞는 ' + (isRec ? '기록' : '조치') + ': ' +
        (isRec ? '<a class="mono" href="#/rec/' + encodeURIComponent(exact.id) + '">' + esc(exact.id) + '</a> ' + esc(formShort(exact.form)) + ' · ' + esc(siteName(exact.site)) :
          '<a class="mono" href="#/acts/' + encodeURIComponent(exact.id) + '">' + esc(exact.id) + '</a> ' + esc(exact.title)) + '</div>');
    }
    if (sites.length) blocks.push(panel({ title: '사업장', sub: num(sites.length) + '곳', flush: true, body: '<ul class="list">' + sites.slice(0, 10).map(function (s) {
      return '<li class="li click" data-href="#/sites/' + encodeURIComponent(s.id) + '"><div class="li-main"><div class="li-title"><span class="mono faint">' + esc(s.id) + '</span> ' + esc(s.name) + '</div>' +
        '<div class="li-sub">' + esc([s.client, s.type, s.region].filter(Boolean).join(' · ') || '—') + '</div></div><div class="li-side">' + pill(s.status || '운영', s.status === '종료' ? 'neu' : 'pos') + '</div></li>';
    }).join('') + '</ul>' }));
    if (recs.length) blocks.push(panel({ title: '기록', sub: num(recs.length) + '건' + (recs.length > 20 ? ' 중 20건' : ''), flush: true,
      actions: recs.length > 20 ? '<a class="btn ghost sm" href="#/records?q=' + encodeURIComponent(q) + '">기록 조회에서 모두 보기</a>' : '',
      body: '<ul class="list">' + recs.slice(0, 20).map(searchRecLi).join('') + '</ul>' }));
    if (acts.length) blocks.push(panel({ title: '조치', sub: num(acts.length) + '건' + (acts.length > 20 ? ' 중 20건' : ''), flush: true,
      actions: acts.length > 20 ? '<a class="btn ghost sm" href="#/acts?tab=all&q=' + encodeURIComponent(q) + '">조치대장에서 모두 보기</a>' : '',
      body: '<ul class="list">' + acts.slice(0, 20).map(function (a) {
        return '<li class="li click" data-href="#/acts/' + encodeURIComponent(a.id) + '"><div class="li-main"><div class="li-title ellipsis">' + esc(a.title) + '</div>' +
          '<div class="li-sub"><span class="mono">' + esc(a.id) + '</span> · ' + esc(siteName(a.site)) + ' · ' + actSrcText(a) + '</div></div><div class="li-side">' + dueHtml(a) + ' ' + actPill(a) + '</div></li>';
      }).join('') + '</ul>' }));
    if (reqs.length) blocks.push(panel({ title: '요청', sub: num(reqs.length) + '건', flush: true, body: '<ul class="list">' + reqs.slice(0, 10).map(function (r) {
      return '<li class="li click" data-href="#/requests/' + encodeURIComponent(r.id) + '"><div class="li-main"><div class="li-title ellipsis">' + esc(r.title) + '</div>' +
        '<div class="li-sub"><span class="mono">' + esc(r.id) + '</span> · ' + (r.kind === 'notice' ? '공지' : '양식 요청') + (r.due ? ' · 기한 <span class="num">' + esc(r.due) + '</span>' : '') + '</div></div>' +
        '<div class="li-side">' + pill(r.status || '진행', r.status === '진행' ? 'acc' : 'neu') + '</div></li>';
    }).join('') + '</ul>' }));
    var none = [['사업장', sites], ['기록', recs], ['조치', acts], ['요청', reqs]].filter(function (x) { return !x[1].length; }).map(function (x) { return x[0]; });
    var html = titleRow('검색', sub) + form +
      (total ? '<div class="stack-16">' + blocks.join('') + '</div>' + (none.length ? '<p class="muted">' + esc(none.join('·')) + '에서는 찾지 못했습니다.</p>' : '') :
        (exact ? blocks.join('') : '') + panel({ title: '결과', body: empty('‘' + esc(q) + '’ 에 맞는 결과가 없습니다. 기록번호 일부(예: 261031)나 사업장 이름으로 찾아 보세요.') }));
    bindSearchForm(mount(main, 'search', html));
  }
  function searchRecLi(r) {
    return '<li class="li click" data-href="#/rec/' + encodeURIComponent(r.id) + '"><div class="li-main"><div class="li-title">' + esc(formShort(r.form)) + ' <span class="faint">' + esc(siteName(r.site)) + '</span></div>' +
      '<div class="li-sub"><span class="mono">' + esc(r.id) + '</span> · <span class="num">' + esc(r.date || '') + '</span>' + (r.author ? ' · ' + esc(r.author) : '') + '</div></div><div class="li-side">' + recPill(r) + '</div></li>';
  }
  function bindSearchForm(root) {
    var f = root.querySelector('form[data-hq="search"]');
    if (!f) return;
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      e.stopPropagation();
      var v = (f.querySelector('input[name="q"]').value || '').trim();
      go('#/search' + (v ? '?q=' + encodeURIComponent(v) : ''));
    });
  }

  /* ======================= 등록 ======================= */
  App.qr = function (text, opts) { return qrSvg(text, opts); };
  App.qr.encode = qrEncode;
  var VIEWS = {
    'hq:records': { title: '기록 조회', nav: 'records', render: viewRecords },
    'hq:acts': { title: '조치대장', nav: 'acts', render: viewActs },
    'hq:sites': { title: '사업장', nav: 'sites', render: viewSites },
    'hq:users': { title: '사용자', nav: 'users', render: viewUsers },
    'hq:settings': { title: '설정', nav: 'settings', render: viewSettings },
    'hq:search': { title: '검색', nav: '', render: viewSearch }
  };
  function guard(fn, name) {
    return function (main, args, query) {
      try {
        if (!App.S || !App.S.me) { main.innerHTML = '<div class="hq-b">' + skel(6, 22) + '</div>'; return; }
        return fn(main, args, query);
      } catch (e) {
        if (window.console) console.error('[hq-b] ' + name, e);
        main.innerHTML = '<div class="hq-b">' + titleRow(VIEWS[name].title) + '<div class="err">화면을 그리지 못했습니다(' + esc(errMsg(e)) + '). <button class="btn ghost sm" type="button" data-act="hq.b.retry">다시 시도</button></div></div>';
      }
    };
  }
  App.actions['hq.b.retry'] = function () { if (App.refresh) App.refresh(); else if (App.route) App.route(); };
  function register() {
    if (typeof App.view !== 'function') return false;
    Object.keys(VIEWS).forEach(function (k) {
      var v = VIEWS[k];
      App.view(k, { title: v.title, nav: v.nav, render: guard(v.render, k) });
    });
    return true;
  }
  if (!register()) document.addEventListener('DOMContentLoaded', register);
})();
/* ===== [hq-b] 끝 ===== */
</script>
