  // Stacked columns: per period, the parts of a whole (재해와 아차). 2px seams between segments, five series at most,

  //   Charts.stack(el, { labels: ['6월', …], series: [{ name: '재해·사고', values: [...] }, { name: '아차·제안', values: [...] }], format })
  function stack(el, { labels, series, format = fmt.int, tickFormat = null, height = null, annotations, reference, xAt = null, legend = null, percent = false, unit = '', partial = null }) {
    el._fmt = format;
    series = (series || []).slice(0, 5);
    const cols = () => series.map((sr, k) => colourOf(el, sr.colour, k));
    const totals = labels.map((_, i) => series.reduce((a, sr) => a + (+sr.values[i] || 0), 0));
    const draw = () => {
      const { s, w, h } = frame(el, heightOf(height == null ? respH(el, 220) : height));
      const C = cols();
      const yt = percent ? [0, 0.25, 0.5, 0.75, 1] : ticks(0, Math.max(1, ...totals, ...[].concat(reference || []).map((r) => r.value)), 4, totals.every((v) => Number.isInteger(v)));
      const tick = percent ? fmt.pct(0) : tickFormat || format, top = yt[yt.length - 1];
      const padL = 12 + Math.max(...yt.map((v) => measure(s, tick(v), 12))), padB = 26;
      const band = (w - padL) / Math.max(1, labels.length), bw = Math.max(2, Math.min(band * 0.62, 64));
      const x = (i) => padL + band * i + band / 2;
      const N = prepNotes(s, annotations, x, w), padT = LANE(N.rows);
      const y = (v) => padT + (h - padT - padB) * (1 - v / top);
      const g = svg('g', {}, s);
      axes(g, el, { w, h, padL, padB, yt, y, labels, x, band: true, at: xAt, tick });
      notesUnder(g, el, N, { padT, h, padB });
      for (const it of N.items) if (it.at != null) it.end = y(percent ? (totals[it.at] ? 1 : 0) : totals[it.at] || 0) - 4;
      const boxes = [];
      labels.forEach((lab, i) => {
        let acc = 0; const tot = totals[i];
        series.forEach((sr, k) => {
          const v = +sr.values[i] || 0; if (v <= 0) return;
          const vv = percent ? (tot ? v / tot : 0) : v, seam = acc > 0 ? 2 : 0;
          const y1 = y(acc), y0 = y(acc + vv); acc += vv;
          const r = svg('rect', { x: x(i) - bw / 2, y: y0, width: bw, height: Math.max(1, y1 - y0 - seam), fill: C[k], opacity: partial === i ? 0.5 : null, 'shape-rendering': 'crispEdges' }, g);
          titled(r, `${lab}${partial === i ? '(진행 중)' : ''} · ${sr.name}: ${format(v)}${unit}`);
        });
        boxes.push({ x0: x(i) - bw / 2, x1: x(i) + bw / 2, y0: y(percent ? (tot ? 1 : 0) : tot), y1: y(0) });
      });
      references(g, el, reference, { y, padL, w, boxes });
      notesOver(g, el, N, { padT, h, padB });
      // hover: the band under the pointer and a bare tooltip with each series and the total
      const tip = tooltip(el), hl = svg('rect', { x: 0, y: padT, width: band, height: h - padT - padB, fill: css(el, '--axis-ink', '#676b84'), opacity: 0 }, g);
      g.insertBefore(hl, g.firstChild);
      const hit = svg('rect', { x: padL, y: padT, width: w - padL, height: h - padT - padB, fill: 'transparent' }, s);
      const move = (ev) => {
        const r = s.getBoundingClientRect(), px = ((ev.clientX - r.left) / r.width) * w;
        const i = Math.max(0, Math.min(labels.length - 1, Math.floor((px - padL) / band)));
        hl.setAttribute('x', padL + band * i); hl.setAttribute('opacity', 0.06);
        tip.innerHTML = `<div style="opacity:.7">${esc(labels[i])}${partial === i ? ' · 진행 중' : ''}</div>` + series.map((sr, k) => `<div><span style="display:inline-block;width:8px;height:8px;margin-right:6px;background:${C[k]}"></span>${esc(sr.name)} <b style="font-weight:600">${esc(format(+sr.values[i] || 0))}${esc(unit)}</b></div>`).join('') + (series.length > 1 ? `<div style="opacity:.7">합계 ${esc(format(totals[i]))}${esc(unit)}</div>` : '');
        const left = Math.min((x(i) / w) * r.width + 12, r.width - tip.offsetWidth - 4);
        tip.style.left = `${Math.max(0, left)}px`; tip.style.top = '0px'; tip.style.opacity = 1;
      };
      hit.addEventListener('pointermove', move);
      hit.addEventListener('pointerleave', () => { tip.style.opacity = 0; hl.setAttribute('opacity', 0); });
      const sum = totals.reduce((a, b) => a + b, 0);
      s.setAttribute('aria-label', `${series.map((sr) => sr.name).join('·')} 누적 막대, ${labels[0] || ''}부터 ${labels[labels.length - 1] || ''}까지, 합계 ${format(sum)}${unit}`);
    };
    draw(); watch(el, draw); settle(draw);
    const C0 = cols();
    const items = series.map((sr, k) => ({ sr, k })).filter(({ sr }) => sr.values.some((v) => +v > 0)).map(({ sr, k }) => ({ label: sr.name, w: 12, draw: rectSwatch({ fill: C0[k] }, 10, 10, 0) }));
    return { get svg() { return el.querySelector(':scope > svg'); }, legend: series.length > 1 ? legendEl(items, legend) : null };
  }

  // A sorted horizontal bar list: label line (with a grey sub), then a 10px bar with the value just after its end;
  // the longest bar about 88% of the width. highlight: index, [indices], a label or a function — those bars take
  // --chart-1 and the rest --chart-muted; without it every bar is --chart-1. parts: ['재해', '아차'] makes each row's
  // `parts: [a, b]` a stacked bar (2px seams) and returns the legend. A row with href becomes a link (data-href).
  //   Charts.hbars(el, [{ label: 'S001 강남오피스', value: 4, sub: '아차 6' }, …], { format, highlight: 0, limit: 8 })
  function hbars(el, rows, { format = fmt.int, highlight = null, sort = true, limit = null, parts = null, colours = null, unit = '', legend = null, max = null } = {}) {
    useCss(); el.innerHTML = '';
    let list = (rows || []).map((r, i) => ({ ...r, i, value: parts ? (r.parts || []).reduce((a, v) => a + (+v || 0), 0) : +r.value || 0 }));
    if (sort) list.sort((a, b) => b.value - a.value || String(a.label).localeCompare(String(b.label), 'ko'));
    if (limit) list = list.slice(0, limit);
    const top = max || Math.max(1, ...list.map((r) => r.value));
    const C = (parts || [0]).map((_, k) => colourOf(el, colours && colours[k], k));
    const main = colourOf(el, null, 0), muted = colourOf(el, null, 1);
    const lit = (r, k) => highlight == null || (typeof highlight === 'function' ? highlight(r) : Array.isArray(highlight) ? highlight.includes(k) : typeof highlight === 'number' ? highlight === k : highlight === r.label);
    const ol = document.createElement('ol'); ol.className = 'ch-hbars';

      if (r.href) { li.setAttribute('data-href', r.href); li.setAttribute('role', 'link'); li.tabIndex = 0; }
      const share = (r.value / top) * 88;
      let segs = '';
      if (r.value > 0) {
        if (parts) segs = (r.parts || []).map((v, j) => (+v > 0 ? `<i style="width:${((+v / r.value) * 100).toFixed(3)}%;background:${C[j]}" title="${esc(parts[j])} ${esc(format(+v))}${esc(unit)}"></i>` : '')).join('');
        else segs = `<i style="width:100%;background:${lit(r, k) ? main : muted}"></i>`;
      }
      // the bar's width is a share of the row; segments are shares of the bar (their 2px seams come out of the bar)
      li.innerHTML = `<div class="ch-hb-top"><span class="ch-hb-name">${esc(r.label)}</span>${r.sub ? `<span class="ch-hb-sub">${esc(r.sub)}</span>` : ''}</div>`
        + `<div class="ch-hb-row">${r.value > 0 ? `<span class="ch-hb-bar" style="width:${share.toFixed(3)}%">${segs}</span>` : ''}<span class="ch-hb-val">${esc(format(r.value))}${unit ? `<span style="color:var(--muted,#555a75);font-weight:400">${esc(unit)}</span>` : ''}</span></div>`;
      li.setAttribute('aria-label', `${r.label}: ${format(r.value)}${unit}${r.sub ? ', ' + r.sub : ''}`);
      ol.appendChild(li);
    });
    el.appendChild(ol);
    if (!parts) return { legend: null };
    const items = parts.map((p, j) => ({ p, j })).filter(({ j }) => list.some((r) => +(r.parts || [])[j] > 0)).map(({ p, j }) => ({ label: p, w: 12, draw: rectSwatch({ fill: C[j] }, 10, 10, 0) }));
    return { legend: legendEl(items, legend) };
  }

  // Parts of a whole, row against row (감소 전 → 감소 후): one 100% bar per row, 2px seams, the count inside a
  // segment when it fits, the row total at the right. names: the parts in order; colours: tokens or colours.
  //   Charts.split(el, [{ label: '감소 전', values: [12, 30, 20] }, { label: '감소 후', values: [2, 18, 42] }], { names: ['높음', '보통', '낮음'] })
  function split(el, rows, { names = [], colours = null, format = fmt.int, unit = '', legend = null } = {}) {

      const vals = names.map((_, k) => +(r.values || [])[k] || 0), tot = vals.reduce((a, b) => a + b, 0);
      const li = document.createElement('li');
      const segs = tot ? vals.map((v, k) => (v > 0 ? `<i style="flex:${v} ${v} 0;background:${C[k]};color:${inkOn(el, C[k])}" title="${esc(r.label)} · ${esc(names[k])} ${esc(format(v))}${esc(unit)}">${(v / tot) >= 0.09 ? esc(format(v)) : ''}</i>` : '')).join('') : '';
      li.innerHTML = `<span>${esc(r.label)}${r.sub ? `<span style="display:block;font-size:12px;color:var(--muted,#555a75)">${esc(r.sub)}</span>` : ''}</span>`
        + (tot ? `<span class="ch-split-bar">${segs}</span>` : '<span class="ch-split-empty"></span>')
        + `<span class="ch-split-tot">${esc(format(tot))}${unit ? `<span style="color:var(--muted,#555a75);font-weight:400">${esc(unit)}</span>` : ''}</span>`;
      li.setAttribute('role', 'img');
      li.setAttribute('aria-label', `${r.label}: ` + names.map((n, k) => `${n} ${format(vals[k])}${unit}`).join(', '));
      ul.appendChild(li);
    }
    el.appendChild(ul);
    const items = names.map((n, k) => ({ n, k })).filter(({ k }) => rows.some((r) => +(r.values || [])[k] > 0)).map(({ n, k }) => ({ label: n, w: 12, draw: rectSwatch({ fill: C[k] }, 10, 10, 0) }));
    return { legend: legendEl(items, legend) };
  }

  // When does it happen? A rows-by-columns count grid (시간대 × 요일) in the one hue: an empty cell is a pale outline,
  // a count is the hue at a strength that grows with it, the count printed inside. null is a dash (해당없음).
  //   Charts.heat(el, { rows: ['00–04시', …], cols: ['월', …, '일'], values: [[0, 1, …], …], unit: '건' })
  function heat(el, { rows = [], cols = [], values = [], format = fmt.int, unit = '', labelWidth = null, rowHeight = null, legend = null, titles = null }) {
    const flat = values.flat().filter((v) => v != null), top = Math.max(1, ...flat);
    const strength = (v) => 0.14 + 0.86 * (v / top);
    const draw = () => {
      const narrow = (el.clientWidth || 600) < 480, pitch = rowHeight || (narrow ? 26 : 30), head = 22;
      const { s, w, h } = frame(el, head + rows.length * pitch);
      const lw = labelWidth || Math.round(Math.max(...rows.map((r) => measure(s, r, 12)), 40) + 10);
      const cw = (w - lw) / Math.max(1, cols.length), ch = pitch - 4;
      const hue = css(el, '--chart-1', '#223189'), surface = css(el, '--surface', '#fff'), grid = css(el, '--grid', '#e6e8ef'), muted = css(el, '--axis-ink', '#676b84');
      const g = svg('g', {}, s);
      cols.forEach((c, j) => text(g, c, { x: lw + j * cw + cw / 2, y: head - 8, 'text-anchor': 'middle', 'font-size': 12, fill: muted }));
      rows.forEach((r, i) => {
        const y0 = head + i * pitch;
        text(g, r, { x: 0, y: y0 + pitch / 2 + 4, 'font-size': 12, fill: muted });
        cols.forEach((c, j) => {
          const v = (values[i] || [])[j], cx = lw + j * cw + 1, cy = y0 + 2;
          if (v == null) { svg('rect', { x: cx + cw / 2 - 4, y: cy + ch / 2 - 1, width: 6, height: 2, fill: muted }, g); return; }

          const cell = paintRect(g, v > 0 ? { fill } : { fill, stroke: grid, width: 1 }, cx, cy, cw - 2, ch, 3);
          if (v > 0 && cw >= 18) text(g, format(v), { x: cx + (cw - 2) / 2, y: cy + ch / 2 + 4, 'text-anchor': 'middle', 'font-size': 12, 'font-weight': strength(v) > 0.55 ? 600 : 400, fill: inkOn(el, fill) });
          titled(cell, (titles && titles[i] && titles[i][j]) || `${r} · ${c}: ${format(v)}${unit}`);
        });
      });
      s.setAttribute('aria-label', `${rows.length}행 ${cols.length}열 격자, 합계 ${format(flat.reduce((a, b) => a + b, 0))}${unit}, 가장 많은 칸 ${format(Math.max(0, ...flat))}${unit}`);
    };
    draw(); watch(el, draw); settle(draw);
    const hue = css(el, '--chart-1', '#223189'), surface = css(el, '--surface', '#fff');
    const items = [{ label: `0${unit}`, w: 14, draw: rectSwatch({ fill: surface, stroke: css(el, '--grid', '#e6e8ef'), width: 1 }, 14, 12, 3) }];
    if (flat.some((v) => v > 0)) items.push({ label: `1${unit}`, w: 14, draw: rectSwatch({ fill: mix(el, hue, surface, strength(1)) }, 14, 12, 3) });
    if (top > 1) items.push({ label: `${format(top)}${unit}`, w: 14, draw: rectSwatch({ fill: mix(el, hue, surface, 1) }, 14, 12, 3) });
    return { get svg() { return el.querySelector(':scope > svg'); }, legend: legendEl(items, legend) };
  }

  // A daily calendar grid: one column per week (월요일 시작), one row per weekday, each day marked by its state —
  // 제출 = navy fill, 일부 = pale navy, 없음(미제출) = grey outline, 해당없음 = a short dash, 미래 = nothing.
  // Too many weeks for the width wraps into blocks. Today gets an ink outline.
  //   Charts.heatCal(el, { days: [{ date: '2026-10-01', value: '2/2', state: 'ok' }, …], from: '2026-08-01', to: '2026-10-31' })
  const DOW = ['일', '월', '화', '수', '목', '금', '토'];
  const STATE_LABEL = { ok: '제출', part: '일부 제출', none: '미제출', na: '해당없음' };
  const pd = (n) => String(n).padStart(2, '0');
  const dkey = (d) => `${d.getFullYear()}-${pd(d.getMonth() + 1)}-${pd(d.getDate())}`;
  const dparse = (s) => { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
  function heatCal(el, { days = [], from, to, today = null, labels = {}, onSelect = null, legend = null }) {
    const L = { ...STATE_LABEL, ...labels }, by = {};
    for (const d of days) if (d && d.date) by[String(d.date).slice(0, 10)] = d;
    const f = dparse(from) || dparse(days[0] && days[0].date) || new Date(), t = dparse(to) || f;
    const todayKey = today || dkey(new Date());
    // the grid starts on the Monday on or before `from` and ends on the Sunday on or after `to`
    const start = new Date(f); start.setDate(start.getDate() - ((start.getDay() + 6) % 7));
    const end = new Date(t); end.setDate(end.getDate() + (6 - ((end.getDay() + 6) % 7)));
    const weeks = Math.max(1, Math.round((end - start) / 864e5 / 7 + 0.01));
    const stateOf = (key) => { const d = by[key]; if (key < dkey(f) || key > dkey(t)) return null; if (d && d.state) return d.state; return key > todayKey ? 'future' : null; };
    const styles = () => { const hue = css(el, '--chart-1', '#223189'), surface = css(el, '--surface', '#fff'); return { ok: { fill: hue }, part: { fill: mix(el, hue, surface, 0.32) }, none: { fill: surface, stroke: css(el, '--control', '#cbcfdb'), width: 1 } }; };
    const draw = () => {
      const w0 = Math.max(240, el.clientWidth || 600), lw = 22, gapB = 14, head = 18;

      const ST = styles(), muted = css(el, '--axis-ink', '#676b84'), ink = css(el, '--text', '#14183c');
      const g = svg('g', {}, s);
      for (let b = 0; b < blocks; b++) {
        const oy = b * (blockH + gapB);
        [1, 3, 5].forEach((r) => text(g, DOW[(r + 1) % 7], { x: 0, y: oy + head + r * pitch + cell / 2 + 4, 'font-size': 11, fill: muted }));
        // month labels: over the first week whose Monday falls in the month (or the block's first week), never touching
        let lastMonth = -1, labelEnd = -1;
        for (let c = 0; c < cols; c++) {
          const wk = b * cols + c; if (wk >= weeks) break;
          for (let r = 0; r < 7; r++) {
            const d = new Date(start); d.setDate(start.getDate() + wk * 7 + r);
            const key = dkey(d), st = stateOf(key);
            if (r === 0) {
              const ref = c === 0 && d < f ? new Date(f) : d;
              if (ref.getMonth() !== lastMonth && dkey(ref) <= dkey(t)) {
                lastMonth = ref.getMonth();
                const lab = `${ref.getMonth() + 1}월`, lx = lw + c * pitch, tw = measure(s, lab, 11);
                if (lx > labelEnd + 6 && lx + tw <= w0) { text(g, lab, { x: lx, y: oy + 11, 'font-size': 11, fill: muted }); labelEnd = lx + tw; }
              }
            }
            if (st == null || st === 'future') continue;
            const x = lw + c * pitch, y = oy + head + r * pitch, item = by[key] || {};
            let node;
            if (st === 'na') node = svg('rect', { x: x + cell / 2 - 3, y: y + cell / 2 - 1, width: 6, height: 2, fill: muted }, g);
            else node = paintRect(g, ST[st] || ST.none, x, y, cell, cell, 2);
            if (key === todayKey) svg('rect', { x: x - 1.5, y: y - 1.5, width: cell + 3, height: cell + 3, rx: 3, fill: 'none', stroke: ink, 'stroke-width': 1.5 }, g);
            titled(node, item.title || `${key} (${DOW[d.getDay()]}) · ${L[st] || st}${item.value != null && item.value !== '' ? ' ' + item.value : ''}`);
            if (onSelect && st !== 'na') { node.style.cursor = 'pointer'; node.addEventListener('click', () => onSelect(item.date ? item : { date: key, state: st })); }
          }
        }
      }
      const cnt = { ok: 0, part: 0, none: 0 };
      Object.keys(by).forEach((k) => { const st = stateOf(k); if (cnt[st] != null) cnt[st]++; });
      s.setAttribute('aria-label', `${dkey(f)}부터 ${dkey(t)}까지 일별 현황: ${L.ok} ${cnt.ok}일, ${L.part} ${cnt.part}일, ${L.none} ${cnt.none}일`);
    };
    draw(); watch(el, draw); settle(draw);
    const seen = new Set(Object.keys(by).map(stateOf).filter(Boolean)), ST = styles();
    const items = ['ok', 'part', 'none'].filter((k) => seen.has(k)).map((k) => ({ label: L[k], w: 12, draw: rectSwatch(ST[k], 11, 11, 2) }));
    if (seen.has('na')) items.push({ label: L.na, w: 12, draw: (sw) => svg('rect', { x: 3, y: 5, width: 6, height: 2, fill: css(el, '--axis-ink', '#676b84') }, sw) });
    return { get svg() { return el.querySelector(':scope > svg'); }, legend: legendEl(items, legend) };
  }

  function watch(el, draw) { if (!('ResizeObserver' in window)) return; let w = el.clientWidth; new ResizeObserver(() => { if (Math.abs(el.clientWidth - w) > 4) { w = el.clientWidth; draw(); } }).observe(el); }
  window.Charts = { line, bars, diverging, ring, barList, plan, bullet, timeline, matrix, timeStrip, stack, hbars, split, heat, heatCal, ticks, fmt, esc };
})();
</script>

<script>
/* ===== [ui-core] 시작 ===== */
/*
 * HDS 안전장부 — App 코어 (SPEC §7.1)
 * util(App.u) · api · 상태(App.S) · 라우터 · 셸 · 로그인 · UI 컴포넌트(App.ui) · 아이콘(App.icon) · 이벤트 위임.
 * 다른 모듈(JsEngine/JsHq/JsAnalytics/JsSite/JsDemo)은 여기서 내놓는 App.* 공개 함수만 쓴다.
 * 구글 앱스 스크립트 복붙 배포(SPEC §12): import/export·require 없음, 이 파일 안 문자열에 스크립틀릿 표식 없음.
 */
(function () {
  'use strict';

  var App = window.App = window.App || {};
  App.actions = App.actions || {};
  App.views = App.views || {};
  App.ui = App.ui || {};
  var BOOT = {};

  /* =====================================================================
   * 0. 브라우저 저장소(localStorage) — 막힌 환경(사생활 보호 창 등)에서도 죽지 않게
   * ===================================================================== */
  var K = { token: 'hds.token', siteToken: 'hds.siteToken', name: 'hds.name', lastName: 'hds.lastName', kind: 'hds.kind' };
  var store = {
    get: function (k) { try { return window.localStorage.getItem(k) || ''; } catch (e) { return ''; } },
    set: function (k, v) { try { window.localStorage.setItem(k, String(v)); } catch (e) { /* 저장 불가 환경 */ } },
    del: function (k) { try { window.localStorage.removeItem(k); } catch (e) { /* 저장 불가 환경 */ } }
  };

    if (typeof fn !== 'function') { console.warn('[App] 등록되지 않은 동작: ' + name); return; }
    try {
      var r = fn(el, ev);
      if (r && typeof r.then === 'function') r.catch(actFail);
    } catch (err) { actFail(err); }
  }
  App.runAct = runAct;
  function closeDialogOf(el) {
    var d = el.closest('dialog');
    if (d) { try { d.close(); } catch (e) { d.removeAttribute('open'); } }
  }
  function onClick(ev) {
    if (ev.defaultPrevented || (ev.button != null && ev.button > 0)) return;
    var t = ev.target;
    if (t && t.nodeType !== 1) t = t.parentElement;
    if (!t || !t.closest) return;

    var segBtn = t.closest('[data-seg] button[data-value], [data-tab] button[data-value]');
    if (segBtn && !segBtn.disabled) {
      var group = segBtn.closest('[data-seg], [data-tab]');
      var isSeg = group.hasAttribute('data-seg');
      var name = group.getAttribute(isSeg ? 'data-seg' : 'data-tab');
      var value = segBtn.getAttribute('data-value');
      $$('button[data-value]', group).forEach(function (b) {
        if (b.closest('[data-seg], [data-tab]') !== group) return;
        var on = b === segBtn;
        b.classList.toggle('on', on);
        b.setAttribute(isSeg ? 'aria-pressed' : 'aria-selected', on ? 'true' : 'false');
      });
      group.dispatchEvent(new CustomEvent(isSeg ? 'seg' : 'tab', { bubbles: true, detail: { name: name, value: value } }));
      if (!segBtn.hasAttribute('data-act')) return;
    }

    var actEl = t.closest('[data-act]');
    if (actEl && actEl.tagName === 'FORM') actEl = null;
    var hrefEl = t.closest('[data-href]');
    var closeEl = t.closest('[data-close]');
    if (actEl && (!hrefEl || hrefEl.contains(actEl))) {
      if (actEl.disabled || actEl.getAttribute('aria-disabled') === 'true') return;
      if (actEl.tagName === 'A' || actEl.getAttribute('type') === 'submit') ev.preventDefault();
      runAct(actEl.getAttribute('data-act'), actEl, ev);
      if (actEl.hasAttribute('data-close')) closeDialogOf(actEl);
      return;
    }
    if (closeEl) { ev.preventDefault(); closeDialogOf(closeEl); return; }
    if (hrefEl) {
      var inter = t.closest('a[href], button, input, select, textarea, label, summary, [contenteditable]');
      if (inter && inter !== hrefEl && hrefEl.contains(inter)) return;
      ev.preventDefault();
      App.go(hrefEl.getAttribute('data-href'));
      return;
    }
    var a = t.closest('a[href^="#/"]');
    if (a && a.getAttribute('href') === location.hash) { ev.preventDefault(); App.route(); }
  }
  function onSubmit(ev) {
    var f = ev.target;
    if (!f || !f.matches || !f.matches('form[data-act]')) return;
    ev.preventDefault();
    runAct(f.getAttribute('data-act'), f, ev);
  }
  function onKey(ev) {
    if (ev.key === 'Escape') {
      var ns = document.getElementById('navsheet');
      if (ns && !ns.hidden) { closeNavsheet(); return; }
    }
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target && ev.target.matches && ev.target.matches('[data-href][tabindex]')) {
      ev.preventDefault();
      App.go(ev.target.getAttribute('data-href'));
    }
  }
  var bound = false;
  function bindOnce() {
    if (bound) return;
    bound = true;
    document.addEventListener('click', onClick);
    document.addEventListener('submit', onSubmit);
    document.addEventListener('keydown', onKey);
    window.addEventListener('hashchange', function () { App.route(); });
    setInterval(updateStamp, 30000);
  }

  /* =====================================================================
   * 11. 로그인 · 부팅 흐름
   * ===================================================================== */
  function brandPanel() {
    return '<section class="login-brand">' +
      '<div class="mark">' + markSvg({ white: true, tagline: true, stripes: true }) + '</div>' +
      '<div class="login-word"><h1 class="login-title">HDS 안전장부</h1><p class="login-lead">표준 양식을 보내고, 모으고, 읽습니다.</p></div>' +
      arcSvg() +
      '<div class="login-foot"><b>안전경영지원실</b>&nbsp;&nbsp;|&nbsp;&nbsp;HDS CORPORATION</div>' +
      '</section>';
  }
  function loginShell(panelHtml) {
    closeOverlays();
    shellOn = false;
    var root = document.getElementById('app');
    if (root) root.innerHTML = '<div class="login">' + brandPanel() + '<section class="login-panel">' + panelHtml + '</section></div>';
    document.title = appName();
  }
  function fieldErr(form, name, msg) {
    $$('.field', form).forEach(function (f) { f.classList.remove('has-err'); var e = f.querySelector('.field-err'); if (e) e.textContent = ''; });
    if (!msg) return;
    var el = form.querySelector('[name="' + name + '"]');
    var f = el && el.closest('.field');
    if (f) {
      f.classList.add('has-err');
      f.querySelector('.field-err').textContent = msg;
    }
    if (el) el.focus();
  }

  function renderLogin(o) {
    o = o || {};
    loginShell('<form class="login-form" data-act="core.login" novalidate autocomplete="on">' +
      '<h2>본사 로그인</h2><p class="login-sub">안전경영지원실 계정으로 들어갑니다.</p>' +
      App.ui.field({ label: '아이디', html: App.ui.input('login-uid', o.id || '', { name: 'uid', autocomplete: 'username', autocapitalize: 'none', spellcheck: 'false', required: true }) }) +
      App.ui.field({ label: '비밀번호', html: App.ui.input('login-pw', '', { name: 'pw', type: 'password', autocomplete: 'current-password', required: true }), err: o.msg || '' }) +
      '<button type="submit" class="btn primary lg">로그인</button>' +
      '<div class="login-sep">또는</div>' +
      '<button type="button" class="btn lg" data-act="core.google">' + App.icon('user') + '<span>구글 계정으로 로그인</span></button>' +
      '<p class="login-note">사업장 담당자는 본사에서 받은 사업장 링크로 들어오세요.</p>' +
      '</form>');
    var f = document.getElementById(o.msg ? 'login-pw' : 'login-uid');
    if (f) f.focus();
  }
  function siteTokenNow() { return BOOT.s || (store.get(K.kind) === 'site' ? store.get(K.siteToken) : ''); }
  function renderSiteLogin(o) {
    o = o || {};
    var info = BOOT.s ? BOOT.site : undefined; // undefined: 서버가 알려 주지 않음, null: 맞지 않는 링크
    var needPin = info && info.needPin;
    var showPin = needPin || info === undefined;
    var name = store.get(K.name) || store.get(K.lastName);
    var bad = info === null;
    loginShell('<form class="login-form" data-act="core.siteLogin" novalidate autocomplete="on">' +
      '<h2>사업장 링크로 들어왔습니다</h2><p class="login-sub">작성자 이름을 적으면 이 기기에서 30일 동안 로그인이 유지됩니다.</p>' +
      (info ? '<div class="login-site">' + App.icon('building', 20) + '<div><b>' + esc(info.name || info.id) + '</b><span>' + esc(info.id) + (needPin ? ' · PIN 사용' : '') + '</span></div></div>' : '') +
      (bad ? '<div class="err"><span style="flex:1 1 220px;min-width:0">이 사업장 링크는 쓸 수 없습니다. 링크가 바뀌었거나 운영이 끝났습니다 — 본사 안전경영지원실에 새 링크를 요청하세요.</span></div>' : '') +
      App.ui.field({ label: '작성자 이름', required: true, html: App.ui.input('site-name', name, { name: 'name', autocomplete: 'name', maxlength: 30, placeholder: '예: 홍길동' }), err: o.nameMsg || '' }) +
      (showPin ? App.ui.field({
        label: needPin ? 'PIN' : 'PIN (선택)', required: !!needPin,
        html: App.ui.input('site-pin', '', { name: 'pin', type: 'password', inputmode: 'numeric', autocomplete: 'off', maxlength: 12 }),
        hint: needPin ? '본사가 정한 사업장 PIN 을 입력하세요.' : '본사가 PIN 을 정한 사업장만 입력합니다.',
        err: o.msg || ''
      }) : '') +
      (!showPin && o.msg ? '<div class="err"><span style="flex:1 1 220px;min-width:0">' + esc(o.msg) + '</span></div>' : '') +
      '<button type="submit" class="btn primary lg"' + (bad ? ' disabled' : '') + '>들어가기</button>' +
      '<button type="button" class="btn ghost" data-act="core.hqLogin">본사 직원 로그인</button>' +
      '</form>');
    var f = document.getElementById(name ? (showPin ? 'site-pin' : 'site-name') : 'site-name');
    if (f && !bad) f.focus();
  }
  function renderSetup() {
    loginShell('<div class="login-form">' +
      '<h2>설치가 끝나지 않았습니다</h2><p class="login-sub">Apps Script 편집기에서 setup 을 실행하세요.</p>' +
      '<ol class="stack" style="padding-left:20px;list-style:decimal;color:var(--muted)">' +
        '<li>script.google.com 에서 이 프로젝트를 엽니다.</li>' +
        '<li>위쪽 함수 목록에서 <b>setup</b> 을 고르고 <b>실행</b>을 누릅니다(처음엔 권한을 허용).</li>' +
        '<li>실행 로그에 나온 관리자 <b>admin</b> 비밀번호를 적어 둡니다.</li>' +
        '<li>이 화면을 새로 고칩니다.</li>' +
      '</ol>' +
      '<button type="button" class="btn primary lg" data-act="core.reload">다시 확인</button></div>');
  }
  function renderFatal(msg) {
    loginShell('<div class="login-form"><h2>열 수 없습니다</h2><div class="err"><span style="flex:1 1 220px;min-width:0">' + esc(msg) + '</span></div>' +
      '<button type="button" class="btn lg" data-act="core.reload">다시 열기</button></div>');
  }
  function renderLoading(kind, msg) {
    var root = document.getElementById('app');
    shellOn = false;
    if (root) root.innerHTML = shellHtml(kind || 'hq', { loading: true, page: pageSkeleton(msg) });
  }
  function bootFail(err) {
    if (err && err.code === 'AUTH') { store.del(K.token); return afterNoToken(true); }
    console.error('[App] 시작 실패', err);
    renderLoading(store.get(K.kind) === 'site' ? 'site' : 'hq');
    var page = document.getElementById('page');
    if (page) page.innerHTML = App.ui.titleRow({ title: appName() }) + App.ui.error(err, 'core.restart');
  }
  function saveAuth(d, siteToken, name) {
    if (!d || !d.token) throw apiError('로그인 응답이 비었습니다', 'SERVER');
    store.set(K.token, d.token);
    if (d.me) { store.set(K.kind, d.me.kind); App.S.me = d.me; }
    if (siteToken) store.set(K.siteToken, siteToken);
    if (name) { store.set(K.name, name); store.set(K.lastName, name); }
  }
  /** boot → 셸 → (미리보기 예시 데이터) → 화면 */
  function enter() {
    renderLoading(store.get(K.kind) === 'site' ? 'site' : 'hq');
    return App.load({ silent: true, noAuthRedirect: true }).then(function () {
      App.renderShell();
      return maybeDemo();
    }).then(function () { return App.route(); });
  }
  function maybeDemo() {
    if (!BOOT.demo || App.S.index.size || !App.demo || typeof App.demo.load !== 'function' || !App.isHQ()) return null;
    var page = document.getElementById('page');
    if (page) page.innerHTML = pageSkeleton('예시 데이터를 만드는 중…');
    return Promise.resolve().then(function () { return App.demo.load(); }).catch(function (err) {
      console.error('[App] 예시 데이터 실패', err);
      App.toast('예시 데이터를 만들지 못했습니다 — ' + ((err && err.message) || ''), 'neg');
    });
  }
  function silentSiteLogin() {
    var tok = siteTokenNow();
    var name = store.get(K.name);
    if (!tok || !name) return Promise.reject(apiError('', 'AUTH'));
    if (BOOT.s && BOOT.site && BOOT.site.needPin) return Promise.reject(apiError('', 'AUTH'));
    return App.api('auth.siteLogin', { siteToken: tok, name: name, pin: '' }, { silent: true }).then(function (d) {
      saveAuth(d, tok, name);
    });
  }
  function afterNoToken(expired) {
    var siteMode = !!BOOT.s || (store.get(K.kind) === 'site' && !!store.get(K.siteToken));
    if (siteMode) {
      if (store.get(K.name) && !(BOOT.s && BOOT.site && BOOT.site.needPin) && BOOT.site !== null) {
        renderLoading('site');
        return silentSiteLogin().then(function () { return enter().catch(bootFail); }, function (err) {
          var m = err && err.message && !/PIN/.test(err.message) ? err.message : '';
          renderSiteLogin({ msg: m });
        });
      }
      renderSiteLogin({ msg: expired ? '로그인이 만료되었습니다. 다시 들어와 주세요' : '' });
      return null;
    }
    if (BOOT.demo) {
      renderLoading('hq');
      return App.api('auth.login', { id: 'admin', password: 'hds1234' }, { silent: true }).then(function (d) {
        saveAuth(d);
        return enter().catch(bootFail);
      }, function () { renderLogin({}); });
    }
    renderLogin({ msg: expired ? '로그인이 만료되었습니다. 다시 로그인하세요' : '' });
    return null;
  }
  function begin() {
    var tok = store.get(K.token);
    if (BOOT.s) {
      // 사업장 링크로 들어옴: 같은 사업장의 사업장 세션만 이어 씀
      if (store.get(K.kind) !== 'site' || store.get(K.siteToken) !== BOOT.s) tok = '';
    }
    if (tok) {
      return enter().catch(function (err) {
        if (err && err.code === 'AUTH') { store.del(K.token); return afterNoToken(true); }
        return bootFail(err);
      });
    }
    return afterNoToken(false);
  }
  App.begin = begin;

  /** 쓰는 도중 세션이 끊김(AUTH) — 사업장은 조용히 다시 로그인, 본사는 로그인 화면 */
  var relogging = null;
  function authLost() {
    if (relogging || !shellOn) return;
    store.del(K.token);
    var wasSite = App.isSite();
    var hash = location.hash;
    relogging = (wasSite ? silentSiteLogin() : Promise.reject(apiError('', 'AUTH')))
      .then(function () {
        return App.load({ silent: true, noAuthRedirect: true }).then(function () {
          App.renderShell();
          if (location.hash !== hash) location.hash = hash;
          App.toast('로그인을 다시 이었습니다. 방금 한 작업을 한 번 더 해 주세요');
          return App.route();
        });
      })
      .catch(function () {
        resetState();
        if (wasSite) renderSiteLogin({ msg: '로그인이 만료되었습니다. 다시 들어와 주세요' });
        else renderLogin({ msg: '로그인이 만료되었습니다. 다시 로그인하세요' });
      })
      .then(function () { relogging = null; });
  }
  App.toLogin = function (msg) {
    store.del(K.token);
    resetState();
    if (siteTokenNow()) renderSiteLogin({ msg: msg || '' }); else renderLogin({ msg: msg || '' });
  };

  App.start = function () {
    if (App.started) return;
    App.started = true;
    BOOT = App.BOOT = window.BOOT || {};
    bindOnce();
    if (BOOT.view && !location.hash) {
      try { history.replaceState(null, '', '#/' + String(BOOT.view).replace(/^[#/]+/, '')); } catch (e) { /* 무시 */ }
    }
    if (BOOT.ready === false) { renderSetup(); return; }
    if (!runner()) { renderFatal('서버에 연결할 수 없습니다. 웹앱 주소(script.google.com/macros/s/…/exec)로 열어 주세요.'); return; }
    // GAS /exec 는 iframe 안에서 돌아 메일 링크의 '#/rec/<id>' 가 location.hash 에 없다 → 바깥 주소의 해시를 첫 경로로
    var gurl = window.google && google.script && google.script.url;
    if (!location.hash && gurl && typeof gurl.getLocation === 'function') {
      var started = false;
      var go = function () { if (started) return; started = true; begin(); };
      try {
        gurl.getLocation(function (loc) {
          var h = loc && loc.hash ? String(loc.hash).replace(/^#/, '') : '';
          if (h && !started && !location.hash) {
            try { history.replaceState(null, '', '#' + (h.charAt(0) === '/' ? h : '/' + h)); } catch (e) { /* 무시 */ }
          }
          go();
        });
      } catch (e) { go(); return; }
      setTimeout(go, 1500);
      return;
    }
    begin();
  };

  /* =====================================================================
   * 12. core.* 동작
   * ===================================================================== */
  Object.assign(App.actions, {
    'core.login': function (form) {
      var id = String((form.elements.uid || {}).value || '').trim();
      var pw = String((form.elements.pw || {}).value || '');
      if (!id) { fieldErr(form, 'uid', '아이디를 입력하세요'); return; }
      if (!pw) { fieldErr(form, 'pw', '비밀번호를 입력하세요'); return; }
      fieldErr(form, '', '');
      var btn = form.querySelector('[type="submit"]');
      setBusy(btn, true);
      return App.api('auth.login', { id: id, password: pw }, { silent: true }).then(function (d) {
        saveAuth(d);
        return enter().catch(bootFail);
      }, function (err) {
        setBusy(btn, false);
        fieldErr(form, 'pw', err.message || '로그인하지 못했습니다');
        var p = form.elements.pw;
        if (p) { p.value = ''; p.focus(); }
      });
    },
    'core.google': function (btn) {
      var form = btn.closest('form');
      setBusy(btn, true);
      return App.api('auth.google', {}, { silent: true }).then(function (d) {
        saveAuth(d);
        return enter().catch(bootFail);
      }, function (err) {
        setBusy(btn, false);
        var m = err.message || '구글 계정으로 로그인하지 못했습니다';
        if (form) fieldErr(form, 'pw', m); else App.toast(m, 'neg');
      });
    },
    'core.siteLogin': function (form) {
      var name = String((form.elements.name || {}).value || '').replace(/\s+/g, ' ').trim();
      var pinEl = form.elements.pin;
      var pin = pinEl ? String(pinEl.value || '').trim() : '';
      var tok = siteTokenNow();
      if (!name) { fieldErr(form, 'name', '작성자 이름을 입력하세요'); return; }
      if (pinEl && pinEl.required && !pin) { fieldErr(form, 'pin', 'PIN 을 입력하세요'); return; }
      if (!tok) { fieldErr(form, 'name', '사업장 링크 정보가 없습니다. 본사에서 받은 링크로 다시 열어 주세요'); return; }
      fieldErr(form, '', '');
      var btn = form.querySelector('[type="submit"]');
      setBusy(btn, true);
      return App.api('auth.siteLogin', { siteToken: tok, pin: pin, name: name }, { silent: true }).then(function (d) {
        saveAuth(d, tok, name);
        return enter().catch(bootFail);
      }, function (err) {
        setBusy(btn, false);
        var m = err.message || '들어가지 못했습니다';
        if (pinEl && /PIN/.test(m)) { fieldErr(form, 'pin', m); pinEl.value = ''; }
        else fieldErr(form, 'name', m);
      });
    },
    'core.hqLogin': function () { renderLogin({}); },
    'core.siteForm': function () { renderSiteLogin({}); },
    'core.logout': function () {
      var wasSite = App.isSite();
      var token = store.get(K.token);
      if (token) App.api('auth.logout', {}, { silent: true, noAuthRedirect: true }).catch(function () { /* 이미 끊긴 세션 */ });
      store.del(K.token);
      if (wasSite) store.del(K.name);
      resetState();
      if (wasSite && siteTokenNow()) renderSiteLogin({}); else renderLogin({});
    },
    'core.menu': function () { openNavsheet(); },
    'core.menuClose': function () { closeNavsheet(); },
    'core.refresh': function () { return App.refresh(); },
    'core.search': function (form) {
      var q = String((form.elements.q || {}).value || '').trim();
      closeNavsheet();
      App.go('#/search' + (q ? '?q=' + encodeURIComponent(q) : ''));
    },
    'core.copy': function (el) { return App.copy(el.getAttribute('data-copy') || ''); },
    'core.retry': function () { return App.route({ keep: true }); },
    'core.restart': function () { return begin(); },
    'core.reload': function () { location.reload(); },
    'core.back': function () { if (history.length > 1) history.back(); else App.go('#/home'); }
  });
})();
/* ===== [ui-core] 끝 ===== */
</script>

<script>
/* ===== [engine-a] 시작 ===== */
(function () {
  "use strict";
  /* HDS 안전장부 — 양식 엔진(로직) + 편집기 화면 [engine-a]
     로직 함수는 DOM 없이도 돌아간다(Node 시험용). 저장소는 App.api 계약(SPEC §6), 상태는 App.S.
     기록 data 모양(engine-b 읽기 화면과 공유):
       필드            data[fieldId] = 값 (number 는 숫자, bool 은 true/false, multi·people 은 문자열 배열, photo 는 파일 id)
       표              data[sectionId] = [{ _k: 행키, <colId>: 값, … }]
       체크리스트      data[sectionId] = { <itemCode>: { r: '양호'|'주의'|'불량'|'해당없음', note, photo } }
       사진 묶음       data[sectionId] = [{ file: 파일id, label, at }]
       서명            data[sectionId] = { 'r:<역할>'|'p:<이름>': { img: 파일id, paper: true, at, by } } */
  var G = (typeof window !== 'undefined') ? window : globalThis;
  var App = G.App = G.App || {};
