<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>HDS 안전장부</title>
<style>
/* 업무용 데스크톱 앱: 왼쪽 메뉴 + 상단 바 + 본문. 인터넷 없이 동작하도록 시스템 글꼴만 사용 */
:root {
  --bg: #f4f6fb; --surface: #ffffff; --sunk: #eef1fa; --hover: #e6eaf6;
  --ink: #161b3d; --body: #3d4260; --muted: #686e8e; --line: #e2e5f0; --line2: #d3d8ea;
  --navy: #223289; --navy2: #4254c0; --navy-soft: #e8ebf8;
  --red: #c8281d; --red-soft: #fdeeec; --amber: #9a5f08; --amber-soft: #fdf3e1;
  --green: #187a4c; --green-soft: #e5f4ec; --gray-soft: #eef0f4;
  --font: "Pretendard", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --mono: "D2Coding", Consolas, "SFMono-Regular", Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--body); font-family: var(--font); font-size: 14px; line-height: 1.55; word-break: keep-all; overflow-wrap: anywhere; }
h1, h2, h3, h4 { color: var(--ink); margin: 0; letter-spacing: -.01em; }
p { margin: 0; }
a { color: var(--navy2); }
button, input, select, textarea { font: inherit; color: inherit; }
code, .mono { font-family: var(--mono); font-size: .92em; }
:focus-visible { outline: 2px solid var(--navy2); outline-offset: 1px; }

#app { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 100vh; }
#side { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.logo { padding: 18px 18px 14px; border-bottom: 1px solid var(--line); }
.logo b { font-size: 19px; color: var(--navy); letter-spacing: .02em; }
.logo span { display: block; font-size: 12px; color: var(--muted); }
#nav { padding: 10px; display: grid; gap: 2px; overflow-y: auto; flex: 1; align-content: start; }
#nav a { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; color: var(--body); text-decoration: none; font-weight: 500; }
#nav a:hover { background: var(--sunk); }
#nav a.on { background: var(--navy-soft); color: var(--navy); font-weight: 700; }
#nav a .ct { margin-left: auto; font-size: 11.5px; background: var(--red); color: #fff; border-radius: 999px; padding: 0 7px; font-weight: 700; }
#nav .sep { height: 1px; background: var(--line); margin: 8px 6px; }
.side-foot { padding: 12px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }

#main { min-width: 0; display: flex; flex-direction: column; }
#top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 10px 24px; }
.badge-mode { font-size: 12.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--navy); color: #fff; white-space: nowrap; }
.badge-mode.site { background: var(--green); }
#search { flex: 1; max-width: 420px; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; background: var(--bg); }
#savestate { margin-left: auto; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
#banner:empty { display: none; }
.band { padding: 8px 24px; font-size: 13px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.band.demo { background: var(--amber-soft); color: var(--amber); }
.band.err { background: var(--red-soft); color: var(--red); }
#view { padding: 22px 24px 60px; display: grid; gap: 18px; align-content: start; max-width: 1480px; width: 100%; }

.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-head h1 { font-size: 22px; }
.page-head p { color: var(--muted); font-size: 13px; margin-top: 2px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.card > .hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.card > .hd h3 { font-size: 15px; }
.card > .bd { padding: 14px 16px; }
.card > .bd.flush { padding: 0; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; display: grid; gap: 2px; }
.tile span { font-size: 12.5px; color: var(--muted); }
.tile b { font-size: 26px; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.25; }
.tile i { font-style: normal; font-size: 12px; color: var(--muted); }
.tile.bad b { color: var(--red); }
.cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }

.btn { border: 1px solid var(--navy); background: var(--navy); color: #fff; border-radius: 8px; padding: 7px 14px; font-weight: 600; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: #1a2770; }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line2); }
.btn.ghost:hover { background: var(--sunk); }
.btn.danger { background: var(--red); border-color: var(--red); }
.btn.sm { padding: 4px 10px; font-size: 12.5px; }
.btn.lg { padding: 11px 20px; font-size: 15px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--navy2); cursor: pointer; font-weight: 600; text-align: left; }

table.t { border-collapse: collapse; width: 100%; font-size: 13px; }
table.t th, table.t td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--surface); position: sticky; top: 0; white-space: nowrap; }
table.t tbody tr:hover { background: #fafbff; }
table.t tr.click { cursor: pointer; }
table.t td.num, table.t th.num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow: auto; }
.scroll.max { max-height: 560px; }
.chip { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--gray-soft); color: var(--body); white-space: nowrap; }
.chip.red { background: var(--red-soft); color: var(--red); }
.chip.amber { background: var(--amber-soft); color: var(--amber); }
.chip.green { background: var(--green-soft); color: var(--green); }
.chip.navy { background: var(--navy-soft); color: var(--navy); }
.dot { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.dot::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--green); flex: none; }
.dot.warn::before { background: #d08a12; } .dot.bad::before { background: var(--red); } .dot.none::before { background: var(--line2); }
.empty { padding: 22px 16px; color: var(--muted); text-align: center; }

.formcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
.fcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; cursor: pointer; text-align: left; }
.fcard:hover { border-color: var(--navy2); box-shadow: 0 2px 10px rgba(34, 50, 137, .08); }
.fcard .no { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.fcard b { font-size: 15px; color: var(--ink); }
.fcard .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }

/* 양식 편집 */
.editor { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
.side-panel { position: sticky; top: 70px; display: grid; gap: 12px; }
.sec { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.sec > .sh { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sec > .sh h3 { font-size: 15px; }
.sec > .sh .muted { font-size: 12.5px; }
.sec > .sb { padding: 14px 16px; display: grid; gap: 12px; }
.sec.locked { opacity: .55; pointer-events: none; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 14px; }
.fld { display: grid; gap: 4px; align-content: start; min-width: 0; }
.fld > label, .fld > .lb { font-size: 12.5px; font-weight: 600; color: var(--ink); }
.fld .req { color: var(--red); margin-left: 2px; }
.fld .hint { font-size: 11.5px; color: var(--muted); line-height: 1.45; }
.fld input[type=text], .fld input[type=number], .fld input[type=date], .fld input[type=time], .fld input[type=datetime-local], .fld select, .fld textarea, .cell input, .cell select, .cell textarea {
  width: 100%; border: 1px solid var(--line2); background: #fff; border-radius: 7px; padding: 6px 9px; min-height: 34px;
}
.fld textarea { min-height: 64px; resize: vertical; }
.fld .unitwrap { display: flex; align-items: center; gap: 6px; }
.fld .unitwrap span { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.fld.err input, .fld.err select, .fld.err textarea, .fld.err .multi { border-color: var(--red); background: #fff8f7; }
.fld .errmsg { font-size: 11.5px; color: var(--red); font-weight: 600; }
.computed { background: var(--sunk); border-radius: 7px; padding: 6px 9px; min-height: 34px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.multi { display: flex; flex-wrap: wrap; gap: 6px; border: 1px solid transparent; border-radius: 7px; }
.multi label { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line2); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; background: #fff; }
.multi label.on { background: var(--navy-soft); border-color: var(--navy2); color: var(--navy); font-weight: 600; }
.multi input { display: none; }
.notice { border-radius: 10px; padding: 10px 14px; font-size: 13px; line-height: 1.6; background: var(--navy-soft); color: var(--ink); }
.notice.warn { background: var(--amber-soft); color: #5f3c05; }
.chk-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chk-group { font-size: 12.5px; font-weight: 700; color: var(--navy); padding: 6px 0 2px; border-bottom: 1px solid var(--line); }
.chk-item { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.chk-item:last-child { border-bottom: 0; }
.chk-item .code { font-family: var(--mono); font-size: 12px; color: var(--muted); padding-top: 6px; }
.chk-item .txt { padding-top: 5px; color: var(--ink); }
.chk-item .basis { font-size: 11.5px; color: var(--muted); }
.chk-item .more { grid-column: 2 / 4; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.chk-item .more textarea { width: 100%; min-height: 40px; border: 1px solid var(--line2); border-radius: 7px; padding: 6px 9px; }
.chk-item.err .more textarea { border-color: var(--red); background: #fff8f7; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-right: 1px solid var(--line2); background: #fff; padding: 5px 10px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--body); white-space: nowrap; }
.seg button:last-child { border-right: 0; }
.seg button.on.v0 { background: var(--green-soft); color: var(--green); }
.seg button.on.v1 { background: var(--amber-soft); color: var(--amber); }
.seg button.on.v2 { background: var(--red-soft); color: var(--red); }
.seg button.on.v3 { background: var(--gray-soft); color: var(--ink); }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table.edit { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.edit th { background: var(--sunk); color: var(--ink); font-weight: 600; padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.edit td { padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.edit td.rn { color: var(--muted); font-family: var(--mono); text-align: center; padding-top: 10px; width: 34px; }
table.edit td.ops { width: 64px; white-space: nowrap; padding-top: 7px; }
.cell { min-width: 110px; }
.cell.w2 { min-width: 180px; } .cell.w3 { min-width: 240px; } .cell.w4 { min-width: 300px; }
.cell textarea { min-height: 34px; resize: vertical; }
.cell .computed { min-width: 60px; }
.cell.err input, .cell.err select, .cell.err textarea { border-color: var(--red); background: #fff8f7; }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.thumb { position: relative; width: 96px; height: 72px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: var(--sunk); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .x { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,.6); color: #fff; border: 0; border-radius: 4px; font-size: 11px; cursor: pointer; padding: 0 5px; }
.thumb .cap { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(22,27,61,.7); color: #fff; font-size: 10.5px; padding: 1px 4px; }
.upl { display: inline-flex; align-items: center; gap: 6px; border: 1px dashed var(--muted); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; cursor: pointer; background: #fff; color: var(--ink); font-weight: 600; white-space: nowrap; }
.upl input { display: none; }
.sigs { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.sig { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: grid; gap: 6px; background: #fff; }
.sig .who { font-size: 12.5px; font-weight: 600; color: var(--ink); }
.sig .box { height: 58px; border-radius: 6px; background: var(--sunk); display: grid; place-items: center; overflow: hidden; }
.sig .box img { max-height: 58px; max-width: 100%; }
.sig .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.stagebar { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.stagebar button { flex: 1; border: 0; border-right: 1px solid var(--line); background: var(--surface); padding: 9px 10px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--muted); text-align: left; }
.stagebar button:last-child { border-right: 0; }
.stagebar button.on { background: var(--navy-soft); color: var(--navy); }
.stagebar button.done::before { content: "✓ "; color: var(--green); }
.stagebar small { display: block; font-weight: 400; font-size: 11.5px; }
.panel-box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
.panel-box h4 { font-size: 13.5px; }
.prog { height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--navy2); }
.errlist { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; max-height: 240px; overflow-y: auto; }
.errlist button { background: none; border: 0; padding: 2px 0; color: var(--red); text-align: left; cursor: pointer; font-size: 12.5px; }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 4px 10px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; color: var(--ink); min-width: 0; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters select, .filters input { border: 1px solid var(--line2); border-radius: 7px; padding: 6px 9px; background: #fff; }
.hec td.c { text-align: center; font-size: 12px; font-weight: 700; min-width: 64px; cursor: pointer; }
.hec td.g { background: var(--green-soft); color: var(--green); }
.hec td.y { background: var(--amber-soft); color: var(--amber); }
.hec td.r { background: var(--red-soft); color: var(--red); }
.hec td.n { background: var(--gray-soft); color: var(--muted); }
.hec th.sticky, .hec td.sticky { position: sticky; left: 0; background: var(--surface); z-index: 1; min-width: 260px; }
.sched td.c { text-align: center; white-space: nowrap; font-size: 12px; }
.help h3 { font-size: 16px; margin-top: 6px; }
.help ol, .help ul { margin: 6px 0; padding-left: 22px; display: grid; gap: 4px; }
.flowline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.flowline div { background: var(--sunk); border-radius: 10px; padding: 12px; }
.flowline b { display: block; color: var(--navy); }
dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(720px, calc(100vw - 40px)); max-height: calc(100vh - 60px); background: var(--surface); color: var(--body); }
dialog::backdrop { background: rgba(10, 14, 40, .45); }
dialog .dh { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 2; }
dialog .db { padding: 16px 18px; display: grid; gap: 12px; }
dialog .df { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; position: sticky; bottom: 0; background: var(--surface); }
canvas.sigpad { width: 100%; height: 180px; border: 1px solid var(--line2); border-radius: 8px; background: #fff; touch-action: none; }
#toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13.5px; z-index: 100; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
.setup { max-width: 860px; margin: 40px auto; display: grid; gap: 18px; }
.setup .opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.setup .opt { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 8px; align-content: start; }
.setup .opt b { font-size: 16px; color: var(--ink); }
.ac-badge { font-family: var(--mono); font-size: 12px; }
@media (max-width: 1100px) { .editor { grid-template-columns: 1fr; } .side-panel { position: static; } .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 820px) { #app { grid-template-columns: 1fr; } #side { position: static; height: auto; } #nav { grid-auto-flow: column; overflow-x: auto; } .side-foot { display: none; } .setup .opts { grid-template-columns: 1fr; } .flowline { grid-template-columns: 1fr 1fr; } }

/* 인쇄: 화면은 숨기고 출력 전용 영역만 */
#print-root { display: none; }
@media print {
  @page { size: A4; margin: 12mm 11mm; }
  body { background: #fff; font-size: 10pt; }
  #app, dialog, #toast { display: none !important; }
  #print-root { display: block; }
  .pdoc { page-break-after: always; color: #000; }
  .pdoc:last-child { page-break-after: auto; }
}
.pdoc { font-size: 10pt; color: #111; }
.pdoc .ph { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start; border-bottom: 2px solid #223289; padding-bottom: 6px; margin-bottom: 8px; }
.pdoc .ph .brand { font-weight: 800; color: #223289; font-size: 10pt; letter-spacing: .04em; }
.pdoc .ph h1 { font-size: 16pt; color: #111; margin: 2px 0; }
.pdoc .ph .docno { font-size: 8.5pt; color: #444; }
.pdoc table.appr { border-collapse: collapse; }
.pdoc table.appr td { border: 1px solid #555; width: 19mm; text-align: center; font-size: 8pt; padding: 2px; }
.pdoc table.appr tr.s td { height: 13mm; font-size: 7.5pt; vertical-align: bottom; }
.pdoc h2 { font-size: 11pt; margin: 9px 0 4px; color: #223289; }
.pdoc table.pt { border-collapse: collapse; width: 100%; margin-bottom: 4px; }
.pdoc table.pt th, .pdoc table.pt td { border: 1px solid #888; padding: 3px 5px; vertical-align: top; text-align: left; font-size: 9pt; }
.pdoc table.pt th { background: #eef1fa; font-weight: 700; }
.pdoc table.kvp th { width: 24%; }
.pdoc .pimgs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.pdoc .pimgs figure { margin: 0; border: 1px solid #aaa; padding: 3px; page-break-inside: avoid; }
.pdoc .pimgs img { width: 100%; height: 62mm; object-fit: contain; display: block; }
.pdoc .pimgs figcaption { font-size: 8pt; text-align: center; }
.pdoc .psigs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.pdoc .psigs div { border: 1px solid #aaa; padding: 3px; font-size: 8pt; text-align: center; page-break-inside: avoid; }
.pdoc .psigs img { height: 12mm; max-width: 100%; object-fit: contain; display: block; margin: 0 auto; }
.pdoc .pf { margin-top: 8px; border-top: 1px solid #999; padding-top: 3px; font-size: 7.5pt; color: #444; display: flex; justify-content: space-between; }
.screen-print #app { display: none; }

}},{"id":"actions","label":"시정 조치","calc":"countRows","args":{"table":"sec_corrective"}}]},{"code":"F06","no":"6","title":"하절기 폭염 대응 점검(체계점검)","short":"폭염점검","docNo":"HDS-SHP-15","version":"v2.0","category":"checklist","idPrefix":"IH","frequency":{"type":"season","seasonMonths":[4,5,6,7,8,9],"due":"4월: 시즌 전 점검 1회(4월 말일까지). 5~9월: 매월 1회(해당 월 말일까지, 권장 매월 10일 이전). 폭염특보가 나오면 수시 점검을 추가(마감 없음)","dueRule":{"kind":"periodEndPlusDays","days":0}},"fillBy":"현장 안전보건 담당자(점검자) → 현장책임자 확인 → 본사 검토","approvals":["점검","현장책임자 확인","본사 검토"],"basis":["산업안전보건법 제39조 제1항(보건조치 — 고온, 폭염·한파 작업에 의한 건강장해 예방)","산업안전보건기준에 관한 규칙 제3편 제9장(온도·습도에 의한 건강장해의 예방)과 2025년 개정 폭염작업 조항(체감온도 31℃ 이상 폭염작업, 33℃ 이상이면 2시간 이내마다 20분 이상 휴식)","산업안전보건법 제128조의2(휴게시설의 설치), 같은 법 시행령 제96조의2, 시행규칙 별표 21의2(휴게시설 설치·관리기준)","산업안전보건법 제63조·제64조 제1항 제6호(도급인의 안전·보건조치, 위생시설 설치·이용 협조)","중대재해 처벌 등에 관한 법률 시행령 제4조 제3호(유해·위험요인 확인·개선 절차)·별표 1(직업성 질병: 열사병)","고용노동부 온열질환 예방 가이드 — 5대 기본수칙(물·그늘(바람)·휴식·보냉장구·응급조치)과 체감온도 단계(31·33·35·38℃)별 조치","고객사(HEC) 안전평가 B2-2 점검 결과 개선·조치"],"hec":["B2-2"],"purpose":"하절기(4~9월) 사업장의 폭염 대응 체계(물·그늘·휴게시설·휴식·보냉장구·응급체계·교육·고객사 협조)를 월 1회 점검하고 미흡 항목은 조치(ACT)로 넘깁니다. 매일 확인하는 체감온도·휴식 부여는 일일 안전보건 점검(F07)에 적습니다.","header":[{"id":"inspType","label":"점검 구분","type":"select","required":true,"width":2,"options":["시즌 전 점검(4월)","월 정기 점검(5~9월)","폭염특보 시 수시 점검"],"hint":"4월 기록은 시즌 전 점검, 5~9월은 매월 1회입니다. 폭염특보가 나오면 수시 점검을 한 건 더 씁니다."},{"id":"alert","label":"폭염특보","type":"select","required":true,"width":1,"options":["없음","폭염주의보","폭염경보"],"hint":"기상청 기준: 주의보는 일 최고 체감온도 33℃ 이상, 경보는 35℃ 이상이 2일 이상 이어질 것으로 예상될 때"},{"id":"weather","label":"날씨","type":"select","width":1,"options":["맑음","구름 많음","흐림","비","눈","안개·황사"]},{"id":"tempAir","label":"기온","type":"number","unit":"℃","min":-10,"max":50,"width":1,"hint":"확인한 값만 적습니다. 모르면 비워 둡니다(0을 넣지 마세요)."},{"id":"feelsLike","label":"체감온도(점검 때 실측)","type":"number","unit":"℃","min":0,"max":55,"width":1,"hint":"가장 더운 근무지에서 온습도계로 잰 값. 실측할 수 없으면 기상청 체감온도를 적습니다."},{"id":"measuredAt","label":"측정 시각","type":"time","width":1}],"sections":[{"id":"sec_notice_stage","type":"notice","tone":"info","text":"체감온도 단계와 조치 기준(근무지 실측값으로 판단하고, 실측이 어려우면 기상청 체감온도를 씁니다)\n· 관심 31℃ 이상: 폭염작업(법정 기준). 물·그늘(냉방)·휴식을 준비하고 근무자 건강상태를 확인하며 당일 단계를 공유합니다.\n· 주의 33℃ 이상: 2시간 이내마다 20분 이상 휴식(법정 최소). 권고: 매시간 10분 휴식, 무더위 시간대(14~17시) 옥외 순찰·대기 단축·조정.\n· 경고 35℃ 이상: 권고: 매시간 15분 휴식, 14~17시 옥외 근무 중지(불가피하면 휴식을 늘리고 2인 1조).\n· 위험 38℃ 이상: 권고: 매시간 15분 이상 휴식, 14~17시 긴급 업무 외 옥외 근무 중지, 근무자 상태 수시 확인.\n'법정'은 산업안전보건기준에 관한 규칙(2025년 개정)의 의무이고, '권고'는 고용노동부 온열질환 예방 가이드의 기준입니다. 온열질환 위험이 급박하면 근로자는 작업을 멈추고 대피할 수 있으며, 이를 이유로 불이익을 주지 않습니다(산업안전보건법 제52조). 본사는 매년 시즌 전에 최신 기준으로 이 안내를 고칩니다."},{"id":"sec_notice_privacy","type":"notice","tone":"warn","text":"취약자(고령·기저질환·신규·복귀자)는 인원수만 적습니다. 이름·병명·복약 같은 건강정보는 이 기록의 비고·사진에도 남기지 마세요(개인정보보호법 제23조 민감정보). 온열질환이 의심되면(의식이 흐림, 체온이 높음) 즉시 119에 신고하고 F04 재해사고 보고를 씁니다. 열사병은 중대재해처벌법상 직업성 질병입니다."},{"id":"sec_status","title":"현황(인원수만)","type":"fields","hint":"이 사업장 HDS 근무자 기준 실인원입니다.","fields":[{"id":"workers","label":"근무 인원","type":"number","required":true,"unit":"명","min":0,"max":999,"width":1},{"id":"outdoorWorkers","label":"옥외·폭염 노출 근무 인원","type":"number","required":true,"unit":"명","min":0,"max":999,"width":1,"hint":"출입구·차량 통제·주차 유도·외곽 순찰·옥외 청소 등","validate":[{"rule":"lte","field":"workers","message":"옥외 근무 인원은 근무 인원보다 많을 수 없습니다"}]},{"id":"outdoorPosts","label":"옥외 고정 근무 위치","type":"number","unit":"개소","min":0,"max":99,"width":1},{"id":"highRiskCount","label":"온열질환 취약자","type":"number","required":true,"unit":"명","min":0,"max":999,"width":1,"hint":"고령·기저질환(본인 신고)·신규·복귀(투입 7일 이내) 인원수만. 이름·병명은 적지 않습니다.","validate":[{"rule":"lte","field":"workers","message":"취약자 수는 근무 인원보다 많을 수 없습니다"}]},{"id":"highRiskCared","label":"취약자 근무 배려 인원","type":"number","unit":"명","min":0,"max":999,"width":1,"hint":"실내·그늘 배치, 휴식 추가, 순찰 조정 등을 한 인원","validate":[{"rule":"lte","field":"highRiskCount","message":"배려 인원은 취약자 수보다 많을 수 없습니다"}]},{"id":"heatIllness","label":"온열질환 의심자(지난 점검 이후)","type":"number","required":true,"unit":"명","min":0,"max":999,"width":1},{"id":"ems119","label":"119 이송(지난 점검 이후)","type":"number","unit":"건","min":0,"max":99,"width":1,"validate":[{"rule":"lte","field":"heatIllness","message":"119 이송 건수는 온열질환 의심자 수보다 많을 수 없습니다"}]},{"id":"illnessRef","label":"재해사고 보고 연결","type":"ref","refForms":["F04"],"width":1,"hint":"의심자가 있었으면 F04 기록을 연결합니다."}]},{"id":"sec_items","title":"폭염 대응 체계 점검","type":"checklist","scale":["양호","주의","불량","해당없음"],"defaultAll":"양호","noteRequiredOn":["주의","불량","해당없음"],"photoOn":["주의","불량"],"act":{"on":{"불량":"높음","주의":"보통"}},"groups":["계획·기록","물","그늘·냉방","휴게시설","휴식·근무조정","보냉장구·복장","건강관리","응급체계","교육·전파","고객사 협조"],"items":[{"code":"H01","group":"계획·기록","text":"폭염 대응계획(체감온도 단계별 휴식·근무조정·응급대응, 관리 책임자·연락체계 포함)을 세우고 근무자에게 알림","basis":"고용노동부 온열질환 예방 가이드(폭염 대비 계획·관리자 지정), 중대재해 처벌 등에 관한 법률 시행령 제4조 제3호"},{"code":"H02","group":"계획·기록","text":"초소·옥외 근무지에 온습도계를 두고 근무 중 체감온도를 실측함","basis":"산업안전보건기준에 관한 규칙(2025년 개정) 폭염작업 기준(체감온도 31℃ 이상), 고용노동부 온열질환 예방 가이드"},{"code":"H03","group":"계획·기록","text":"일일 안전보건 점검(F07)에 체감온도 단계·실측값·휴식 부여가 근무조마다 빠짐없이 기록됨","basis":"중대재해 처벌 등에 관한 법률 시행령 제4조 제3호(유해·위험요인 확인·개선 절차)"},{"code":"H04","group":"물","text":"초소·출입통제소·순찰 동선 가까이에 시원하고 깨끗한 물이 충분해 근무 중 언제든 마실 수 있고, 땀을 많이 흘리는 근무에는 이온음료·식염포도당 등 염분 보충수단이 있음","basis":"산업안전보건기준에 관한 규칙 제571조(소금과 음료수 등의 비치), 온열질환 예방 5대 기본수칙(물)"},{"code":"H05","group":"그늘·냉방","text":"초소 냉방·통풍장치(에어컨·선풍기·냉풍기)가 정상 작동함","basis":"산업안전보건기준에 관한 규칙 제560조(온도·습도 조절), 온열질환 예방 5대 기본수칙(그늘·바람)"},{"code":"H06","group":"그늘·냉방","text":"출입구·차량 통제 등 옥외 고정 근무 위치에 그늘막·파라솔 등 그늘이 있음","basis":"온열질환 예방 5대 기본수칙(그늘)"},{"code":"H07","group":"휴게시설","text":"근무자가 실제로 쓸 수 있는 그늘·냉방 휴게공간이 근무지 가까이 있고, 휴게공간·식수·화장실까지 가는 동선이 안전함","basis":"산업안전보건법 제128조의2(휴게시설의 설치), 산업안전보건기준에 관한 규칙 제567조(휴게시설의 설치)"},{"code":"H08","group":"휴게시설","text":"휴게시설이 설치·관리기준을 충족함(바닥 6㎡·천장 2.1m 이상, 온도 18~28℃, 조명 100~200럭스, 환기, 식수·의자 비치, 휴게시설 표지, 청소·관리 담당 지정, 물건 적치 없음)","basis":"산업안전보건법 제128조의2, 같은 법 시행령 제96조의2(건물 경비원·청소원 사업장 포함), 시행규칙 별표 21의2(휴게시설 설치·관리기준)"},{"code":"H09","group":"휴식·근무조정","text":"체감온도 33℃ 이상이면 2시간 이내마다 20분 이상 휴식을 주고 근무표에 반영함(단독 근무자는 대체·순환 인력으로)","basis":"산업안전보건기준에 관한 규칙 제566조(휴식 등)와 2025년 개정 폭염작업 휴식 기준"},{"code":"H10","group":"휴식·근무조정","text":"무더위 시간대(14~17시)에는 옥외 순찰·대기 시간을 줄이거나 나누고, 장시간 도보·계단·외곽 순찰을 무리하게 시키지 않음","basis":"고용노동부 온열질환 예방 가이드(체감온도 단계별 작업시간 조정)"},{"code":"H11","group":"휴식·근무조정","text":"체감온도 38℃ 이상(위험)이면 긴급 업무 외 옥외 근무를 멈추는 기준이 있고, 고객사와 대체 업무를 협의해 둠","basis":"고용노동부 온열질환 예방 가이드(위험 단계 옥외작업 중지), 산업안전보건법 제51조(사업주의 작업중지)·제52조(근로자의 작업중지)"},{"code":"H12","group":"보냉장구·복장","text":"옥외 근무자에게 보냉장구(쿨토시·냉감조끼·아이스팩·햇빛가림 모자)를 지급하고 지급 기록(F08A)을 남김","basis":"온열질환 예방 5대 기본수칙(보냉장구)"},{"code":"H13","group":"보냉장구·복장","text":"하계 근무복(밝은 색·통풍 소재)을 허용·지급하고, 열이 차는 복장이나 불필요한 장비 착용이 없음","basis":"고용노동부 온열질환 예방 가이드(작업복·보냉장구)"},{"code":"H14","group":"건강관리","text":"온열질환 취약자(고령·기저질환·신규·복귀자)를 인원수로 파악해 근무를 배려하고, 신규·복귀자는 첫 주 옥외 근무를 단계적으로 늘림(열순응)","basis":"고용노동부 온열질환 예방 가이드(고위험군 관리·열순응), 산업안전보건법 제39조 제1항(보건조치)"},{"code":"H15","group":"건강관리","text":"어지러움·두통·메스꺼움·근육경련 등 이상증상을 근무 중 확인하고, 증상이 있으면 즉시 보고하고 쉬게 하는 절차가 있음","basis":"고용노동부 온열질환 예방 가이드(건강상태 확인)"},{"code":"H16","group":"응급체계","text":"온열질환 의심 시 119 신고 방법·현장 주소(출동 위치)와 비상연락망(고객사·HDS 관리자·본사)이 초소에 게시됨","basis":"중대재해 처벌 등에 관한 법률 시행령 제4조 제8호(급박한 위험 대비 매뉴얼), 온열질환 예방 5대 기본수칙(응급조치)"},{"code":"H17","group":"응급체계","text":"체온계·아이스팩(냉찜질팩)·응급키트가 비치돼 있고 근무자가 보관 위치를 앎","basis":"온열질환 예방 5대 기본수칙(응급조치)"},{"code":"H18","group":"교육·전파","text":"폭염 기본수칙(물·그늘·휴식·보냉장구·응급조치)과 온열질환 증상·응급조치를 교육함(고령·외국인 근무자는 쉬운 안내문·그림 자료로, 교육 기록은 N1)","basis":"산업안전보건법 제29조(근로자 안전보건교육), 고용노동부 온열질환 예방 가이드"},{"code":"H19","group":"교육·전파","text":"TBM·인수인계 때 당일 체감온도 단계·휴식 장소·연락 방법을 교대 근무자에게 전달함","basis":"고용노동부 온열질환 예방 가이드(작업 전 안전점검회의)"},{"code":"H20","group":"고객사 협조","text":"고객사(도급인)에 휴게공간·냉방·식수·그늘막·비상대응 협조를 요청했고 그 결과를 기록함","basis":"산업안전보건법 제63조(도급인의 안전조치 및 보건조치)·제64조 제1항 제6호(위생시설 설치·이용 협조)"}]},{"id":"sec_client","title":"고객사 협조 기록","type":"fields","hint":"항목별 미흡은 조치(ACT)에서 '고객사 이관'으로 관리하고, 여기에는 협의한 사실만 적습니다.","fields":[{"id":"clientDate","label":"고객사 협의일","type": nit":"건","width":1,"hint":"F05 안전수칙 위반 보고"},{"id":"stopWork","label":"작업중지권 행사 건수 [A06]","type":"computed","calc":"autoMonthly","args":{"metric":"stopWork"},"unit":"건","width":1,"hint":"F10 작업중지권 행사 보고. 건수가 많고 적음으로 좋고 나쁨을 판단하지 않습니다."},{"id":"noMissing","label":"보고월의 재해·아차사고·안전수칙 위반·작업중지권 행사를 빠짐없이 기록했음을 확인합니다","type":"bool","required":true,"width":4,"hint":"일일점검(F07)에 적은 사고·아차사고 건수와 위 숫자를 대조했습니다. 빠진 건이 있으면 먼저 등록한 뒤 체크합니다.","validate":[{"rule":"eq","value":true,"message":"빠진 사고·사건이 없는지 확인하고 체크해야 제출할 수 있습니다. 빠진 건이 있으면 F04·F02·F05·F10에 먼저 등록하세요"}]}]},{"id":"sec_acts","title":"조치(ACT) 현황","type":"fields","hint":"조치대장에서 이 사업장의 조치를 센 값입니다. 전월 미결·월말 미결 건수는 본사가 조치대장에서 계산합니다(이월 작업 없음).","fields":[{"id":"actsOpened","label":"당월 신규 조치 [C02]","type":"computed","calc":"autoMonthly","args":{"metric":"actsOpened"},"unit":"건","width":1,"hint":"보고월에 등록된 조치(점검 이상, 사고 대책, 제안 채택, 고객사 지적 등)"},{"id":"actsClosed","label":"당월 완료 조치 [C03]","type":"computed","calc":"autoMonthly","args":{"metric":"actsClosed"},"unit":"건","width":1,"hint":"보고월에 완료된 조치(전월 이월분 포함)"},{"id":"actsOverdue","label":"기한경과 미결 조치 [C05]","type":"computed","calc":"autoMonthly","args":{"metric":"actsOverdue"},"unit":"건","width":1,"hint":"보고월 말 기준 기한이 지났는데 완료되지 않은 조치"},{"id":"overdueNote","label":"기한경과 조치 사유·완료 계획","type":"textarea","width":4,"hint":"기한경과 조치가 있으면 조치번호별로 사유와 완료 예정일을 적습니다. 예: ACT-S001-2610-003 고객사 승인 대기 — 11/15 완료 예정"}]},{"id":"sec_activity","title":"점검·교육·훈련·허가 실적","type":"fields","hint":"모두 보고월의 기록을 센 값입니다.","fields":[{"id":"dailyExpected","label":"일일점검 제출 기대 건수 [I01]","type":"computed","calc":"autoMonthly","args":{"metric":"dailyExpected"},"unit":"건","width":1,"hint":"보고월 근무일 × 근무조 수(사업장 설정·개설일 기준)"},{"id":"dailySubmitted","label":"일일점검 제출 건수 [I02]","type":"computed","calc":"autoMonthly","args":{"metric":"dailySubmitted"},"unit":"건","width":1,"hint":"F07 일일 안전보건 점검 제출 건수"},{"id":"dailyRate","label":"일일점검 제출률 [R02]","type":"computed","calc":"ratio","args":{"num":"dailySubmitted","den":"dailyExpected"},"unit":"%","width":2},{"id":"eduSessions","label":"안전보건교육 실시 횟수 [E05]","type":"computed","calc":"autoMonthly","args":{"metric":"eduSessions"},"unit":"회","width":1,"hint":"N1 안전보건교육 실시 기록 수(과정별 내역과 개인별 이수시간은 N1에서 확인)"},{"id":"eduAttendees","label":"교육 참석 연인원 [E06]","type":"computed","calc":"autoMonthly","args":{"metric":"eduAttendees"},"unit":"명","width":1,"hint":"N1 교육 참석자 수의 합(같은 사람이 두 번 참석하면 2명)"},{"id":"drills","label":"비상대응훈련 실시 [D01]","type":"computed","calc":"autoMonthly","args":{"metric":"drills"},"unit":"회","width":1,"hint":"N2 비상대응훈련 결과 기록. 반기마다 1회 이상 필요합니다."},{"id":"voices","label":"소통센터 접수 [V01]","type":"computed","calc":"autoMonthly","args":{"metric":"voices"},"unit":"건","width":1,"hint":"F02 열린안전소통센터 접수(아차사고·위험요인 발굴·개선 제안·의견). 아차사고는 A03에도 들어갑니다."},{"id":"ptw","label":"사전작업 허가서 발행 [T01]","type":"computed","calc":"autoMonthly","args":{"metric":"ptw"},"unit":"건","width":1,"hint":"N3 사전작업 허가서 발행 건수"},{"id":"ptwTargetWork","label":"보고월에 HDS 근무자가 한 허가 대상 작업(고소·전기·화기·밀폐공간·중량물 등)","type":"select","required":true,"width":3,"options":["없음","있음 — 모두 사전작업 허가서(N3)를 발행함","있음 — 허가서 없이 한 작업이 있음"],"hint":"'없음' 확인은 고객사 평가에서 작업허가 항목 '대상 작업 없음'의 근거가 됩니다."},{"id":"ptwMissingNote","label":"허가서 없이 한 작업의 날짜·내용·사유","type":"textarea","width":4,"showIf":{"field":"ptwTargetWork","in":["있음 — 허가서 없이 한 작업이 있음"]},"hint":"날짜, 작업 내용, 누가 지시했는지. 다시 생기지 않도록 본사가 확인합니다.","validate":[{"rule":"requiredIf","field":"ptwTargetWork","value":"있음 — 허가서 없이 한 작업이 있음","message":"허가서 없이 한 작업이 있으면 날짜·내용·사유를 적어야 합니다"}]}]},{"id":"sec_chem","title":"MSDS·건강진단 (직접 입력)","type":"fields","hint":"건강진단은 인원수만 적습니다. 이름·결과·병명은 적지 않습니다.","fields":[{"id":"msdsTarget","label":"MSDS 관리대상 제품 수 [S01]","type":"number","required":true,"unit":"종","min":0,"max":999,"width":1,"hint":"월말 현재 쓰는 세정제·약품·연료(제설기 휘발유 등) 가운데 MSDS 대상 제품 수(제품명 기준). 없으면 0."},{"id":"msdsHave","label":"MSDS 확보·비치 제품 수 [S02]","type":"number","required":true,"unit":"종","min":0,"max":999,"width":1,"hint":"S01 중 MSDS를 작업장에서 바로 볼 수 있게 비치·게시한 제품 수","validate":[{"rule":"lte","field":"msdsTarget","message":"MSDS 확보 제품 수는 관리대상 제품 수보다 많을 수 없습니다"}]},{"id":"msdsRate","label":"MSDS 확보율 [R05]","type":"computed","calc":"ratio","args":{"num":"msdsHave","den":"msdsTarget"},"unit":"%","width":2},{"id":"healthTarget","label":"당월 건강진단 대상인원 [W01]","type":"number","required":true,"unit":"명","min":0,"max":9999,"width":1,"hint":"건강진단 계획상 보고월에 받아야 하는 실인원(일반·특수(야간작업)·배치 전. 종류가 겹쳐도 1명)"},{"id":"healthDone","label":"건강진단 실시인원 [W02]","type":"number","required":true,"unit":"명","min":0,"max":9999,"width":1,"hint":"W01 중 월말까지 진단을 받은 실인원","validate":[{"rule":"lte","field":"healthTarget","message":"건강진단 실시인원은 대상인원보다 많을 수 없습니다"}]},{"id":"healthRate","label":"건강진단 실시율 [R06]","type":"computed","calc":"ratio","args":{"num":"healthDone","den":"healthTarget"},"unit":"%","width":2}]},{"id":"sec_focus_info","title":"업무별 중점점검","type":"fields","hint":"이 사업장 업무구성(보안·안내·주차·미화·시설)에 해당하는 항목과 공통 항목만 보입니다. 보고월에 실제로 확인한 결과로 하나씩 판정합니다('전부 양호' 버튼 없음). 양호(○) = 문제 없음, 주의(△) = 작은 문제로 바로 고칠 수 있음, 불량(X) = 위험이 있어 조치가 필요함, 해당없음 = 이 사업장에 그 작업·시설이 없음(사유 필수). 주의·불량은 내용·즉시조치를 비고에 적고 사진을 붙이면 조치(ACT)가 자동으로 생깁니다. 점검하지 못한 항목은 비워 두고 아래 '미점검 항목' 표에 적습니다.","fields":[{"id":"focusDate","label":"점검일(주로 점검한 날)","type":"date","required":true,"width":1,"hint":"보고월 안의 날짜. 여러 날 나눠 점검했으면 마지막 날을 적고, 다른 날 본 항목은 비고에 날짜를 남깁니다."},{"id":"focusInspectors","label":"점검자","type":"people","required":true,"width":3,"hint":"실제로 현장을 확인한 사람(관리감독자 포함)"}]},{"id":"sec_focus","title":"중점 위험요인 점검","type":"checklist","scale":["양호","주의","불량","해당없음"],"noteRequiredOn":["주의","불량","해당없음"],"photoOn":["주의","불량"],"act":{"on":{"불량":"높음","주의":"보통"}},"groups":["공통","보안","안내","주차","미화","시설"],"items":[{"code":"CK06","group":"공통","text":"화재·비상대응 — 피난통로·비상구가 물건으로 막혀 있지 않고, 소화기·소화전 앞이 비어 있으며, 근무지 비상연락망이 최신임","basis":"산업안전보건기준에 관한 규칙 제17조(비상구의 설치), 중대재해 처벌 등에 관한 법률 시행령 제4조 제8호(급박한 위험 대비 매뉴얼)","hec":"D1-5"},{"code":"CK19","group":"공통","text":"폭염·한랭 — 더위·추위에 노출되는 근무에 물(음료), 냉난방 휴게공간, 휴식 시간, 보냉·방한 용품이 갖춰져 있음(5~9월 상세 점검은 F06)","basis":"산업안전보건법 제39조(보건조치), 산업안전보건기준에 관한 규칙 제566조(휴식 등)·제571조(소금과 음료수 등의 비치)"},{"code":"CK20","group":"공통","text":"보호구 — 직무에 맞는 보호구(반사조끼, 베임방지 장갑, 미끄럼 방지 신발, 우의·방한용품 등)가 지급돼 있고 손상 없이 착용되고 있음(지급·반납 기록은 F08A)","basis":"산업안전보건기준에 관한 규칙 제32조(보호구의 지급 등)","hec":"D1-10"},{"code":"CK21","group":"공통","text":"협력 작업 — 고객사·다른 업체가 같은 장소에서 작업할 때 작업 일정과 위험 구역을 미리 공유받고, 간섭 위험이 있으면 출입 통제·우회 조치를 함","basis":"산업안전보건법 제64조(도급에 따른 산업재해 예방조치)"},{"code":"CK22","group":"공통","text":"신규 투입자 안내 — 보고월에 새로 투입된 근무자에게 근무 위치의 위험요인, 비상연락 방법, 보호구 사용법을 투입 전에 알려 줌(교육 기록은 N1, 신규 투입이 없으면 해당없음)","basis":"산업안전보건법 제29조 제2항(채용 시·작업내용 변경 시 교육)","hec":"B1-3"},{"code":"CK24","group":"공통","text":"휴게시설 — 근무자가 휴게시설에 쉽게 갈 수 있고, 청결하며 온도(18~28℃)·환기·조명이 적정함","basis":"산업안전보건법 제128조의2(휴게시설의 설치), 같은 법 시행규칙 별표 21의2(휴게시설 설치·관리기준)"},{"code":"CK28","group":"공통","text":"업무 범위 밖 위험작업 — 계약 업무가 아닌 위험작업(전구 교체, 사다리·고소 작업, 설비 조작, 중량물 운반 등)을 지시받아 한 일이 없고, 그런 지시를 받으면 거절하고 소장·본사에 알리는 방법을 근무자가 알고 있음","basis":"중대재해 처벌 등에 관한 법률 시행령 제4조 제3호(유해·위험요인 확인·개선 절차), 산업안전보건법 제52조(근로자의 작업중지)"},{"code":"CK01","group":"보안","text":"야간·단독근무 — 순찰 경로의 조명이 충분하고, 무전기·휴대폰 등 연락수단과 정해진 시간 안부확인·지원 요청 체계가 작동함","basis":"산업안전보건기준에 관한 규칙 제21조(통로의 조명), 중대재해 처벌 등에 관한 법률 시행령 제4조 제8호(급박한 위험 대비 보고·연락 체계)","hec":"D1-11","showIf":{"siteTag":"보안"}},{"code":"CK02","group":"보안","text":"순찰 중 넘어짐 — 순찰로의 계단·경사로·옥외 통로에 장애물·미끄럼·결빙·단차 위험이 없고, 위험 구간은 표시하거나 우회함","basis":"산업안전보건기준에 관한 규칙 제3조(전도의 방지)·제22조(통로의 설치)","hec":"D1-2","showIf":{"siteTag":"보안"}},{"code":"CK03","group":"보안","text":"차량 출입 통제 — 차량 출입구에서 보행자와 차량 동선이 구분되고, 근무자가 반사조끼를 입고 차량 진로 밖 안전한 위치에서 신호·통제함","basis":"산업안전보건법 제38조(안전조치)","hec":"D1-3","showIf":{"siteTag":"보안"}},{"code":"CK04","group":"보안","text":"고객 응대·폭력 — 폭언·폭행·난동이 생기면 자리를 피하고 지원을 요청하는 절차(연락망, 업무 일시중단·교대)를 근무자 모두 알고 있음","basis":"산업안전보건법 제41조(고객의 폭언등으로 인한 건강장해 발생 등에 대한 조치)","hec":"B5-5","showIf":{"siteTag":"보안"}},{"code":"CK13","group":"안내","text":"장시간 서서 근무 — 안내 데스크의 교대·휴식이 운영되고, 때때로 앉을 수 있는 의자와 발판 등 서 있는 부담을 줄이는 수단이 있음","basis":"산업안전보건기준에 관한 규칙 제80조(의자의 비치)","hec":"B5-3","showIf":{"siteTag":"안내"}},{"code":"CK14","group":"안내","text":"고객 폭언·폭행 — 고객응대 보호 조치(보호 문구 게시, 응대 중단·교대, 지원 요청 수단, 피할 장소)가 갖춰져 있고 근무자가 알고 있음","basis":"산업안전보건법 제41조(고객의 폭언등으로 인한 건강장해 발생 등에 대한 조치)","hec":"B5-5","showIf":{"siteTag":"안내"}},{"code":"CK15","group":"안내","text":"혼잡·충돌 — 방문객 동선과 대기 구역이 정리돼 있고, 자동문·회전문·출입게이트에 끼임·부딪힘 위험이 없음","basis":"산업안전보건기준에 관한 규칙 제11조(작업장의 출입구)","hec":"D1-3","showIf":{"siteTag":"안내"}},{"code":"CK16","group":"안내","text":"중량물·반복작업 — 택배·물품은 대차 등 운반도구로 옮기고, 반복 입력·전화 응대 자세가 무리하지 않도록 모니터·의자 높이를 맞춤","basis":"산업안전보건기준에 관한 규칙 제663조(중량물의 제한)·제666조(작업자세 등)","hec":"B5-3","showIf":{"siteTag":"안내"}},{"code":"CK17","group":"안내","text":"감염·위생 — 공용 물품(전화기·필기구·출입카드 등)을 정기적으로 소독하고, 손 세정제와 환기 여건이 갖춰져 있음","basis":"산업안전보건법 제39조(보건조치)","showIf":{"siteTag":"안내"}},{"code":"CK18","group":"안내","text":"비상 안내 — 근무자가 피난 동선·비상구·집결지를 알고 있고, 장애인·노약자 등 도움이 필요한 방문객의 대피 지원·연락 절차가 있음","basis":"산업안전보건기준에 관한 규칙 제17조(비상구의 설치), 중대재해 처벌 등에 관한 법률 시행령 제4조 제8호(급박한 위험 대비 매뉴얼)","hec":"A5-1","showIf":{"siteTag":"안내"}},{"code":"CK25","group":"주차","text":"주차 유도·정산 — 유도·정산 근무 위치가 차량 진로 밖에 있고, 반사조끼·경광봉을 쓰며 후진·회전 차량의 뒤나 차량 사이에 서지 않음","basis":"산업안전보건법 제38조(안전조치)","hec":"D1-3","showIf":{"siteTag":"주차"}},{"code":"CK26","group":"주차","text":"주차장 근무 환경 — 지하주차장 등 근무 구역의 조명(통로 75럭스 이상)과 환기가 적정하고, 램프·경사로 미끄럼과 기둥·모서리 충돌 위험 구간이 표시돼 있음","basis":"산업안전보건기준에 관한 규칙 제21조(통로의 조명)·제3조(전도의 방지)","hec":"D1-2","showIf":{"siteTag":"주차"}},{"code":"CK27","group":"주차","text":"주차 설비 — 차단기·기계식 주차설비·정산기 주변에 끼임·충돌 위험이 없고, 고장 나면 근무자가 직접 고치지 않고 관리 주체(고객사·설비 업체)에 연락함","basis":"산업안전보건법 제38조(안전조치)","hec":"D1-7","showIf":{"siteTag":"주차"}},{"code":"CK07","group":"미화","text":"젖은 바닥 — 청소 중 젖은 바닥은 바로 물기를 없애고, 작업 구역 통제와 미끄럼 주의 표지를 세움","basis":"산업안전보건기준에 관한 규칙 제3조(전도의 방지)","hec":"D1-2","showIf":{"siteTag":"미화"}},{"code":"CK08","group":"미화","text":"세정제·화학제품 — 세정제·약품 용기에 경고표지가 붙어 있고 MSDS를 작업장에서 바로 볼 수 있으며, 다른 세정제와 섞지 않고 환기하며 사용함","basis":"산업안전보건법 제114조(물질안전보건자료의 게시 및 교육)·제115조(물질안전보건자료대상물질 용기 등의 경고표시)","hec":"D1-9","showIf":{"siteTag":"미화"}},{"code":"CK09","group":"미화","text":"근골격계 부담 — 무거운 물건·쓰레기는 대차·카트로 옮기고, 반복작업·불편한 자세가 줄도록 작업 방법·순서를 조정함","basis":"산업안전보건기준에 관한 규칙 제657조(유해요인 조사)·제663조(중량물의 제한)","hec":"B5-3","showIf":{"siteTag":"미화"}},{"code":"CK10","group":"미화","text":"날카로운 폐기물 — 깨진 유리·캔·바늘 등 날카로운 폐기물을 따로 모으고, 분리수거장에 집게와 베임방지 장갑을 갖추고 착용함","basis":"산업안전보건기준에 관한 규칙 제32조(보호구의 지급 등)","hec":"D1-10","showIf":{"siteTag":"미화"}},{"code":"CK11","group":"미화","text":"사다리·추락 — 높은 곳 청소는 긴 자루 도구를 먼저 쓰고, 사다리·작업발판은 미끄럼·넘어짐 방지가 되는 것만 쓰며 최상단에 올라서지 않음","basis":"산업안전보건기준에 관한 규칙 제42조(추락의 방지)","hec":"D1-1","showIf":{"siteTag":"미화"}},{"code":"CK12","group":"미화","text":"청소장비 — 바닥 세척기·청소기 등의 전선·플러그 손상이 없고, 누전차단기가 있는 콘센트를 쓰며, 회전부 덮개가 제자리에 있음","basis":"산업안전보건기준에 관한 규칙 제304조(누전차단기에 의한 감전방지)·제313조(배선 등의 절연피복 등)·제87조(원동기·회전축 등의 위험 방지)","hec":"D1-4","showIf":{"siteTag":"미화"}},{"code":"CK05","group":"시설","text":"고소·전기작업 — 사다리·고소(1.8m 이상)·전기 작업 전에 작업 범위와 권한, 위험을 확인하고, 필요한 보호구(안전모·절연장갑 등)와 사전작업 허가서(N3)를 갖춘 뒤 작업함","basis":"산업안전보건기준에 관한 규칙 제42조(추락의 방지)·제319조(정전전로에서의 전기작업)","hec":"D1-1","showIf":{"siteTag":"시설"}},{"code":"CK23","group":"시설","text":"기계·기구 — 쓰는 기계·기구(전동공구, 예초기, 고압세척기 등)의 방호덮개·방호장치가 제자리에 있고, 사용 전 점검에서 이상이 있으면 사용을 멈추고 표시함(안전검사·인증 기한은 본사 관리)","basis":"산업안전보건법 제80조(유해하거나 위험한 기계·기구에 대한 방호조치), 산업안전보건기준에 관한 규칙 제87조(원동기·회전축 등의 위험 방지)","hec":"D1-7","showIf":{"siteTag":"시설"}}]},{"id":"sec_unchecked","title":"미점검 항목","type":"table","minRows":0,"maxRows":30,"columns":[{"id":"item","label":"미점검 항목","type":"select","required":true,"width":2,"options":["CK06 화재·비상대응 미점검","CK19 폭염·한랭 미점검","CK20 보호구 미점검","CK21 협력 작업 미점검","CK22 신규 투입자 안내 미점검","CK24 휴게시설 미점검","CK28 업무 범위 밖 위험작업 미점검","CK01 야간·단독근무 미점검","CK02 순찰 중 넘어짐 미점검","CK03 차량 출입 통제 미점검","CK04 고객 응대·폭력 미점검","CK13 장시간 서서 근무 미점검","CK14 고객 폭언·폭행 미점검","CK15 혼잡·충돌 미점검","CK16 중량물·반복작업 미점검","CK17 감염·위생 미점검","CK18 비상 안내 미점검","CK25 주차 유도·정산 미점검","CK26 주차장 근무 환경 미점검","CK27 주차 설비 미점검","CK07 젖은 바닥 미점검","CK08 세정제·화학제품 미점검","CK09 근골격계 부담 미점검","CK10 날카로운 폐기물 미점검","CK11 사다리·추락 미점검","CK12 청소장비 미점검","C 관리감독자등의 필요한 조치 ④ 믿을 만한 합리적인 이유가 있으면 해고나 그 밖의 불리한 처우 금지","산업안전보건법 제41조 제2·3항, 시행령 제41조(고객 등 제3자의 폭언등 — 업무의 일시적 중단 또는 전환 등, 요구를 이유로 한 불리한 처우 금지)","산업안전보건법 제51조(사업주의 작업중지 — 급박한 위험 시 즉시 작업중지·대피)","산업안전보건법 제54조(중대재해 발생 시 작업중지·지체 없는 고용노동부 보고) — 중대재해는 재해·사고 보고서(F04)로","중대재해 처벌 등에 관한 법률 시행령 제4조 제8호(급박한 위험 대비 매뉴얼 마련·반기 1회 이상 점검)","HEC A5-3 근로자 작업중지권 확보 및 근로자 인지 여부"],"hec":["A5-3"],"purpose":"급박한 위험으로 작업을 멈추고 대피한 일(또는 고객 폭언·폭행으로 업무를 중단한 일)을 즉시보고 → 조치·재개 → 사후관리 → 30일 뒤 불리한 처우 확인까지 한 기록으로 남깁니다.","header":[],"sections":[{"id":"sec_notice_sw","type":"notice","tone":"warn","text":"불리한 처우 금지 — 급박한 위험이 있다고 믿을 만한 합리적인 이유가 있어 작업을 멈추고 대피한 근무자에게 해고나 그 밖의 불리한 처우를 할 수 없습니다(산업안전보건법 제52조 제4항). 고객 폭언·폭행으로 업무 중단·전환을 요구한 근무자도 같습니다(제41조 제3항). 나중에 위험이 없었던 것으로 밝혀져도 마찬가지이며, 고객사가 근무자 교체를 요구해도 이를 이유로 교체·징계·평가 불이익을 주지 않습니다 — 그런 요구를 받으면 바로 안전경영지원실에 알리세요. 화재·흉기·중상자처럼 인명 위험이 급박하면 이 기록보다 112·119 신고와 대피가 먼저입니다. HDS 근무자는 흉기 소지자를 직접 제압하거나 연기 속으로 들어가지 않습니다."},{"id":"sec_notice_flow","type":"notice","tone":"info","text":"순서: ① 전화·무전으로 관리감독자에게 먼저 보고 ② 상황이 안정되면 당일 1차 즉시보고 입력 ③ 관리감독자가 조치·재개 입력(행사자에게 설명하고 확인 서명) ④ 본사가 사후관리 ⑤ 행사일 30일 뒤 본사가 행사자에게 직접 불리한 처우 여부 확인. 사망·중상 등 중대재해가 났으면 재해·사고 보고서(F04)를 즉시 함께 작성합니다(산업안전보건법 제54조). 행사자 이름은 자물쇠(민감정보) 칸에만 적히며, 고객사 공유본에는 직무만 나갑니다."},{"id":"sec_report","title":"1차 즉시보고","type":"fields","fields":[{"id":"swType","label":"구분","type":"select","required":true,"width":4,"options":["제52조 근로자 작업중지·대피","제41조 고객응대 업무 일시중단·전환","제51조 사업주(관리감독자) 작업중지"],"hint":"제52조: 근무자가 급박한 위험을 느껴 스스로 멈추고 대피함(권리 행사 — 대부분 이것) · 제41조: 고객·방문객 등 제3자의 폭언·폭행으로 업무를 잠시 멈추거나 다른 업무로 바꿈 · 제51조: 관리감독자·회사가 위험을 판단해 작업을 중지시킴. 기본값은 없습니다 — 실제 일어난 것을 고르세요."},{"id":"exerciser","label":"행사자(멈춘 사람)","type":"person","required":true,"width":1,"sensitive":true,"hint":"제51조이면 중지를 지시한 관리감독자"},{"id":"exerciserJob","label":"행사자 직무","type":"select","required":true,"width":1,"options":["보안","안내","주차","미화","시설","사무"],"hint":"고객사 공유본에는 이 칸만 나갑니다"},{"id":"reporterRole","label":"작성자 구분","type":"select","required":true,"width":1,"options":[ ate","required":true,"width":1},{"id":"periodTo","label":"점검 대상 기간 종료","type":"date","required":true,"width":1,"validate":[{"rule":"gte","field":"periodFrom","message":"종료일은 시작일보다 빠를 수 없습니다"}]},{"id":"inspectorType","label":"점검 주체","type":"select","required":true,"width":1,"options":["현장 자체점검(관리감독자)","본사 점검","지사·MU 점검"]},{"id":"supervisor","label":"관리감독자","type":"person","required":true,"width":2},{"id":"siteChief","label":"현장책임자(소장)","type":"person","width":2}]},{"id":"sec_a53","title":"작업중지권 인지·행사 현황","type":"fields","fields":[{"id":"interviewN","label":"인터뷰 인원","type":"number","required":true,"unit":"명","min":1,"max":99,"width":1,"hint":"무작위 2명 이상. 질문 예: '근무 중 위험하면 어떻게 하나요?', '멈추면 불이익이 있나요?'"},{"id":"awareN","label":"제대로 답한 인원","type":"number","required":true,"unit":"명","min":0,"max":99,"width":1,"hint":"멈추고·대피하고·보고한다, 불이익이 없다를 둘 다 말한 사람","validate":[{"rule":"lte","field":"interviewN","message":"인지 인원은 인터뷰 인원보다 많을 수 없습니다"}]},{"id":"awareRate","label":"인지율","type":"computed","calc":"ratio","args":{"num":"awareN","den":"interviewN"},"unit":"%","width":2},{"id":"swCount","label":"이번 반기 작업중지 행사","type":"number","required":true,"unit":"건","min":0,"max":999,"width":1,"hint":"기록 조회에서 작업중지권 행사 보고서(F10) 이번 반기 건수"},{"id":"swResumed","label":"조치·재개(종료) 완료","type":"number","unit":"건","min":0,"max":999,"width":1,"validate":[{"rule":"lte","field":"swCount","message":"완료 건수는 행사 건수보다 많을 수 없습니다"}]},{"id":"swD30","label":"불리한 처우 확인(D+30) 완료","type":"number","unit":"건","min":0,"max":999,"width":2,"validate":[{"rule":"lte","field":"swCount","message":"확인 완료 건수는 행사 건수보다 많을 수 없습니다"}]}]},{"id":"sec_items","title":"점검 항목","type":"checklist","scale":["양호","주의","불량","해당없음"],"noteRequiredOn":["주의","불량","해당없음"],"photoOn":["주의","불량"],"act":{"on":{"불량":"높음","주의":"보통"}},"groups":["게시·인지","절차·교육","보고·재개","위험별 대응","근로자 보호","기록·개선"],"items":[{"code":"IS01","group":"게시·인지","text":"작업중지권 포스터·안내물을 근무자가 늘 보는 곳(초소·안내데스크·휴게실)에 최신본으로 게시함 — 아래 게시 사진 필수","basis":"HEC A5-3(○: 작업중지권 부여 및 관련 정보물 게시)","hec":"A5-3"},{"code":"IS02","group":"게시·인지","text":"무작위로 고른 근무자가 '위험하면 멈추고, 대피하고, 보고한다'와 '멈춰도 불이익이 없다'를 설명할 수 있음(인원은 위 인지 현황 칸)","basis":"HEC A5-3(△: 게시했으나 임의 직원 인터뷰에서 인지 부족)","hec":"A5-3"},{"code":"IS03","group":"절차·교육","text":"이번 반기에 작업중지 절차(중지 → 대피 → 보고 → 조치 확인 → 재개) 교육을 하고 교육 자료·참석 서명·사진이 남아 있음","basis":"중대재해처벌법 시행령 제4조 제8호, HEC A5-3(X: 포스터·교육 등 증빙 부재)","hec":"A5-3"},{"code":"IS04","group":"절차·교육","text":"급박한 위험 판단 기준을 안내함: 대표 사례(폭행·흉기, 화재·연기, 감전, 추락, 차량 충돌, 폭염·한파·태풍)와 '애매하면 먼저 멈추고 보고한다' 원칙","basis":"산업안전보건법 제52조 제1항"},{"code":"IS05","group":"보고·재개","text":"보고 연락망(관리감독자·소장·안전경영지원실·112·119)이 최신이고 초소·안내데스크에 비치돼 있음","basis":"산업안전보건법 제52조 제2항(지체 없이 보고)"},{"code":"IS06","group":"보고·재개","text":"작업 재개 기준(일반위험: 관리감독자 현장 확인 / 고위험: 고객사·안전경영지원실 확인 / 재개 전 행사자에게 설명)을 고객사·협력사와 공유함","basis":"산업안전보건법 제52조 제3항"},{"code":"IS07","group":"위험별 대응","text":"고객 폭언·폭행 시 업무 일시중단·전환, 안전거리 확보, 112 신고 절차를 고객응대 근무자에게 알림","basis":"산업안전보건법 제41조 제2항, 시행령 제41조, 시행규칙 제41조","hec":"B5-5"},{"code":"IS08","group":"위험별 대응","text":"야간·단독 근무자의 위험 대응 기준(정기 무전·통화 확인, 위험 장소 단독 진입 금지, 지원 요청 후 대기)을 정해 알림 — 야간·단독 근무가 없으면 해당없음","basis":"중대재해처벌법 시행령 제4조 제8호 가목"},{"code":"IS09","group":"위험별 대응","text":"고소·전기·화기·중량물 등 중대위험 작업은 작업 전 허가(사전작업 허가서)와 작업중지 기준을 적용함","basis":"산업안전보건법 제51조","showIf":{"siteTag":"시설"}},{"code":"IS10","group":"위험별 대응","text":"중대산업재해 대비 비상조치(작업중지·대피, 다친 사람 구호, 추가 피해 방지, 현장 보존) 절차가 비상대응계획에 있고 근무자가 알고 있음","basis":"중대재해처벌법 시행령 제4조 제8호 가~다목, HEC A5-1","hec":"A5-1"},{"code":"IS11","group":"근로자 보호","text":"작업중지·업무중단을 한 근무자에게 불리한 처우가 없었음(해고·징계, 평가·급여·연장근로 배제, 공개 비난, 민원 전가, 고객사 요구에 따른 근무지 교체 등) — 행사 건이 없으면 해당없음","basis":"산업안전보건법 제52조 제4항, 제41조 제3항"},{"code":"IS12","group":"기록·개선","text":"이번 반기 작업중지 행사 건이 모두 행사 보고서(F10)로 기록되고 조치·재개·불리한 처우 확인(D+30)까지 마무리됨 — 행사 건이 없으면 해당없음","basis":"중대재해처벌법 시행령 제4조 제8호(매뉴얼에 따라 조치하는지 점검)"},{"code":"IS13","group":"기록·개선","text":"직전 반기 점검의 미흡사항이 개선 완료됨(조치대장 확인) — 직전 점검이 없거나 미흡이 없었으면 해당없음","basis":"중대재해처벌법 시행령 제4조 제8호"}]},{"id":"sec_poster","title":"작업중지권 게시 사진","type":"photos"," 책임자 등에 대한 직무교육 — 신규·보수교육)","산업안전보건법 제114조 제3항·시행규칙 제169조(물질안전보건자료 교육 — 배치 시·새 물질 도입·정보 변경 시 실시, 그 시간만큼 안전보건교육을 한 것으로 봄, 시간·내용 기록 보존)","산업안전보건법 제41조·시행규칙 제41조(고객의 폭언등 건강장해 예방 — 고객응대업무 매뉴얼의 내용과 건강장해 예방 교육)","사업장 위험성평가에 관한 지침(고용노동부 고시) 제13조(위험성평가 결과 공유 — 필수 4개 내용, 중대 위험요인은 TBM 등으로 상시 주지)","산업안전보건법 제52조(근로자의 작업중지 — 작업중지권 교육)","중대재해 처벌 등에 관한 법률 시행령 제4조 제8호(급박한 위험·중대산업재해 대비 매뉴얼 — 비상대응 교육)","경비업법 제13조(경비원의 교육) — 산업안전보건법 교육과 따로 기록하고 시간에 넣지 않음","고객사(HEC) 안전평가 A2-1·A2-4(위험성평가 담당자 사전교육·결과교육), A5-2·A5-3, B1-1~B1-7(안전보건교육), B5-5(고객응대 교육), C1-1(안전보건관리계획서 라. 교육 계획·아. 실적관리)"],"hec":["A2-1","A2-4","A5-2","A5-3","B1-1","B1-2","B1-3","B1-4","B1-5","B1-6","B1-7","B5-5","C1-1"],"purpose":"안전보건교육 1회를 계획 → 실시 결과(시각·장소·강사·교재·내용·참석자 서명·사진) → 미참석자 보충교육까지 한 기록으로 남겨, 법정 교육시간과 고객사 평가 교육 증빙을 함께 맞춥니다.","header":[],"sections":[{"id":"sec_n1_guide","type":"notice","tone":"info","text":"교육 1회 = 기록 1건입니다. ① 계획: 과정·예정일·계획 시간·대상 인원을 등록합니다. 반기 초에 그 반기 교육을 미리 등록해 두면 계획 대비 실적(예정일 대비 지연, 참석률)이 자동으로 비교됩니다. 채용 시·작업내용 변경 시처럼 갑자기 생긴 교육은 '계획 없이 바로 실시'를 고르고 바로 다음 단계로 넘어갑니다. ② 실시 결과: 실제 시각·장소·강사·교재·내용, 참석자 서명, 사진 2장 이상을 남깁니다. ③ 보충교육·마감: 빠진 대상자마다 보충교육 일자와 서명을 받습니다. 매일 하는 TBM 인원은 일일점검(F07)에 숫자로 적고, 서명·사진을 남겨야 하는 TBM(위험성평가 결과 공유, 위험작업 전 교육)만 여기에 기록합니다. 차수를 나눠 같은 교육을 여러 번 했으면 차수마다 1건씩 씁니다."},{"id":"sec_n1_hours","type":"notice","tone":"info","text":"법정 교육시간(산업안전보건법 시행규칙 별표 4 — 개정 여부는 본사가 매년 확인): 근로자 정기교육 — 사무직·판매직 매반기 6시간 이상, 그 밖의 근로자(보안·안내·주차·미화·시설 등) 매반기 12시간 이상 · 관리감독자 정기교육 — 연간 16시간 이상 · 채용 시 교육 — 일용직·1주 이하 기간제 1시간, 1주 초과~1개월 이하 기간제 4시간, 그 밖 8시간 이상(작업 배치 전) · 작업내용 변경 시 교육 — 일용직·1주 이하 기간제 1시간, 그 밖 2시간 이상 · 특별교육 — 16시간 이상(최초 작업 전 4시간, 나머지 12시간은 3개월 안에 나눠서), 단기간·간헐 작업이나 일용직·1주 이하 기간제는 2시간 이상. 고객사(HEC) 평가에서는 대상자가 1명이라도 빠지거나 시간이 모자라면 X입니다."},{"id":"sec_plan","title":"1. 교육 계획","type":"fields","hint":"반기 초에 그 반기 교육을 미리 등록하거나, 교육 직전에 등록합니다.","fields":[{"id":"planType","label":"등록 구분","type":"select","required":true,"width":2,"options":["사전 계획","계획 없이 바로 실시(채용 시·작업내용 변경 시 등)"],"hint":"'계획 없이 바로 실시'면 예정일에 실제 교육일을 적고 바로 2단 ","category":"plan","idPrefix":"DR","frequency":{"type":"half","due":"반기(1~6월, 7~12월)마다 1회 이상 실시. 반기 초에 계획(1단계)을 등록하고, 결과는 훈련 후 7일 이내 입력, 미참여자 전달교육은 다음 근무일 안에 권장. 마감: 반기 끝 + 7일(7월 7일·1월 7일). 밀폐공간 작업이 있는 사업장은 밀폐공간 긴급구조훈련을 6개월마다 따로 1건","dueRule":{"kind":"periodEndPlusDays","days":7}},"fillBy":"사업장 안전보건 담당자(계획·결과 입력) · 훈련 책임자와 평가자(진행 시각·수행 평가) → 소장(확인) → 본사 검토","approvals":["작성","소장 확인","본사 검토"],"basis":["중대재해 처벌 등에 관한 법률 시행령 제4조 제8호(중대산업재해가 발생하거나 발생할 급박한 위험에 대비한 매뉴얼 — 가. 작업중지·근로자 대피·위험요인 제거 등 대응조치 나. 다친 사람 구호조치 다. 추가 피해방지 조치, 매뉴얼에 따른 조치 여부 반기 1회 이상 점검)","산업안전보건법 제51조(사업주의 작업중지)·제52조(근로자의 작업중지 — 급박한 위험 시 대피)","산업안전보건기준에 관한 규칙 제640조(밀폐공간 긴급 구조훈련 — 비상연락체계 운영, 구조용 장비 사용, 공기호흡기·송기마스크 착용, 응급조치를 6개월에 1회 이상 훈련하고 결과 기록·보존)","화재의 예방 및 안전관리에 관한 법률 제37조(소방안전관리대상물 근무자 등에 대한 소방훈련 — 건물 소방훈련은 고객사(관계인) 주관이며, HDS는 합동 참여 때도 자체 기록을 남김)","고객사(HEC) 안전평가 A5-1 비상상황 대비대응 계획 수립 및 사무실 비치, A5-2 비상상황 대비 훈련 또는 교육 여부, A5-3 근로자 작업중지권 확보 및 인지, B4-2 밀폐공간작업 프로그램(긴급구조훈련), C1-1 안전보건관리계획서(사. 비상사태 대비·대응)"],"hec":["A5-1","A5-2","A5-3","B4-2","C1-1"],"purpose":"반기 비상대응훈련을 계획 → 실시(비상대응계획서 확인·진행 시각·수행 평가·참여자 서명·사진) → 효과성 평가·미흡사항 조치·미참여자 전달교육까지 한 기록으로 남깁니다.","header":[],"sections":[{"id":"sec_n2_guide","type":"notice","tone":"info","text":"훈련 1회 = 기록 1건입니다. ① 계획: 반기 초에 시나리오·예정일·목표를 등록합니다. ② 실시: 훈련 전에 비상대응계획서를 확인하고, 평가자가 진행 시각과 수행 결과를 적고, 참여자 서명과 사진(2장 이상)을 남깁니다. ③ 평가·후속: 효과성 평가, 미흡사항(조치대장 자동 등록), 미참여자 전달교육. 반기(1~6월, 7~12월)마다 1회 이상 해야 하며, 고객사·HEC 합동 훈련도 이 기록을 따로 남겨야 인정됩니다(고객사 평가 A5-2). 같은 시나리오를 2회 연속 반복하지 말고 사업장 위험에 맞게 바꿔 가며 합니다. 실제 소화기 방사·연막·승강기 정지·비상방송은 고객사 시설 담당과 미리 협의하고, 훈련 중 실제 비상이 생기면 훈련을 즉시 멈춥니다."},{"id":"sec_dplan","title":"1. 훈련 계획","type":"fields","fields":[{"id":"drillTitle","label":"훈련명","type":"text","required":true,"width":4,"hint":"예: 2027년 상반기 지하주차장 전기차 화재 대응 훈련"},{"id":"scenario","label":"시나리오","type":"select","required":true,"width":2,"options":["화재","전기차 화재","지진","정전·승강기 갇힘","폭언·난동","응급환자(AED·온열질환)","중대재해 발생(추락·끼임 등 중상·사망)","가스누출","폭발물·테러 의심","침수","밀폐공간 긴급구조훈련(해당 사업장만)","기타"],"hint":"사업장 위험에 맞게 고릅니다. 지하주차장·충전시설이 있으면 전기차 화재, 안내데스크·민원 창구는 폭언·난동, 여름철은 응급환자(온열질환). 밀폐공간 긴급구조훈련은 밀폐공간 작업이 있는 사업장만(6개월에 1회, 고객사 평가 B4-2로 따로 봄)."},{"id":"scenarioEtc","label":"기타 시나리오","type":"text","width":2,"showIf":{"field":"scenario","in":["기타"]},"validate":[{"rule":"requiredIf","field":"scenario","value":"기타","message":"기타 시나리오 내용을 적어야 합니다"}]},{"id":"drillType","label":"훈련 유형","type":"select","required":true,"width":1,"options":["자체 훈련","고객사 합동","HEC 합동"]},{"id":"drillMode","label":"훈련 방식","type":"select","required":true,"width":1,"options":["실제 행동 훈련","도상(탁상) 훈련","혼합"],"hint":"근무 중 전원 대피가 어려우면 도상 훈련 + 핵심 역할 행동 훈련(혼합)"},{"id":"partner","label":"합동 주관·참여 부서","type":"text","width":2,"showIf":{"field":"drillType","in":["고객사 합동","HEC 합동"]},"hint":"예: 고객사 방재센터, 관할 소방서. 사람 이름·연락처는 적지 않습니다."},{"id":"planDate","label":"예정일","type":"date","required":true,"width":1},{"id":"planTime","label":"예정 시각","type":"time","width":1},{"id":"planPlace","label":"장소·범위","type":"text","required":true,"width":2,"hint":"예: 지하2층 전기차 충전구역 ~ 집결지(정문 앞 광장)"},{"id":"leader","label":"훈련 책임자","type":"person","required":true,"width":2,"hint":"훈련을 지휘하는 사람(소장 또는 관리감독자)"},{"id":"targetScope","label":"참여 대상","type":"multi","required":true,"width":2,"options":["전 근무자","주간조","야간조","보안","안내","주차","미화","시설","사무","관리감독자"]},{"id":"goal","label":"훈련 목표","type":"textarea","required":true,"width":3,"hint":"확인할 수 있는 목표 1~3개. 예: 최초 전파 1분 안, 집결지 인원 확인 5분 안, 근무자 전원 소화기·AED 위치 숙지"},{"id":"targetCount","label":"참여 대상 인원","type":"number","required":true,"unit":"명","min":1,"max":999,"width":1,"hint":"이 비상상황과 관련된 근무자 실인원"},{"id":"repeatCheck","label":"시나리오 반복 확인","type":"select","required":true,"width":2,"options":["첫 훈련","직전 2회와 다른 시나리오","직전 2회와 같은 시나리오"],"hint":"고객사 평가: 한 가지 비상상황 훈련만 2회 연속 하면 권고 사유"},{"id":"prevRef","label":"직전 훈련 기록","type":"ref","refForms":["N2"],"width":2,"hint":"지난 반기 훈련 기록을 연결해 시나리오를 비교합니다"},{"id":"repeatReason","label":"같은 시나리오를 반복하는 이유","type":"textarea","width":4,"showIf":{"field":"repeatCheck","in":["직전 2회와 같은 시나리오"]},"hint":"예: 직전 훈련에서 대피 유도가 미흡해 재훈련, 고객사 요청","validate":[{"rule":"requiredIf","field":"repeatCheck","value":"직전 2회와 같은 시나리오","message":"같은 시나리오를 반복하면 이유를 적어야 합니다"}]}]},{"id":"sec_run","title":"2. 훈련 실시","type":"fields","fields":[{"id":"drillDate","label":"훈련일","type":"date","required":true,"width":1},{"id":"place","label":"장소·범위","type":"text","required":true,"width":2},{"id":"evaluator","label":"평가자(관찰자)","type":"person","width":1,"hint":"훈련에 직접 참여하지 않고 시각·수행을 기록하는 사람(소장·관리감독자·본사)"},{"id":"confinedItems","label":"밀폐공간 구조훈련 내용","type":"multi","width":4,"showIf":{"field":"scenario","in":["밀폐공간 긴급구조훈련(해당 사업장만)"]},"options":["비상연락체계 운영","구조용 장비 사용","공기호흡기·송기마스크 착용","응급조치"],"hint":"안전보건규칙 제640조: 4가지를 훈련하고 결과를 기록·보존합니다.","validate":[{"rule":"requiredIf","field":"scenario","value":"밀폐공간 긴급구조훈련(해당 사업장만)","message":"밀폐공간 구조훈련은 훈련한 내용을 체크해야 합니다"}]}]},{"id":"sec_evplan","title":"훈련 전 확인 — 비상대응계획서","type":"fields","hint":"고객사 평가 A5-1: 계획이 없거나 PC에만 보관하면 X. 계획서는 본사 배포본에 이 사업장의 조직도·연락망·집결지를 채운 것입니다.","fields":[{"id":"planPhoto","label":"계획서 비치 사진","type":"photo","width":2,"hint":"비치 위치(초소·사무실)와 계획서 표지가 함께 보이게"},{"id":"planRevDate","label":"계획서 최종 개정일","type":"date","width":1}]},{"id":"sec_evcheck","title":"비상대응계획서 확인 항목","type":"checklist","scale":["양호","주의","불량","해당없음"],"defaultAll":"양호","noteRequiredOn":["주의","불량","해당없음"],"photoOn":["주의","불량"],"act":{"on":{"불량":"높음","주의":"보통"}},"items":[{"code":"E01","text":"비상대응계획서가 사무실·초소에 비치돼 근무자가 바로 열어 볼 수 있음(PC에만 보관하지 않음)","basis":"중대재해 처벌 등에 관한 법률 시행령 제4조 제8호, HEC A5-1(X: PC에만 보관)","hec":"A5-1"},{"code":"E02","text":"계획서의 비상조직도·비상연락망이 현재 근무 인원으로 고쳐져 있음(인원 변경 후 1개월 안에 반영)","basis":"HEC A5-1(△: 계획서 내 조직도 최신화 미흡)","hec":"A5-1"},{"code":"E03","text":"비상상황별 집결지가 정해져 있고, 위치가 안전하며 실제로 갈 수 있음","basis":"HEC A5-1(△: 비상상황별 집결지 정보 미포함·안전하지 않거나 비현실적)","hec":"A5-1"},{"code":"E04","text":"사업장 여건에 맞는 비상상황이 빠짐없이 들어 있음(전기차 충전시설이 있으면 전기차 화재 포함)","basis":"HEC A5-1(△: 현장 상황에 따른 비상상황 누락, 전기차 화재 포함 여부)","hec":"A5-1"},{"code":"E05","text":"계획서에 중대재해 대응 단기 설치","freq":1,"sev":3,"measure":"통로 바닥에 이동 전선을 깔지 않는다. 습윤한 장소에서는 절연 성능이 충분한 이동 전선과 방수형 접속기구(콘센트·플러그)를 쓰고 누전차단기를 경유한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"COM-008","job":"공통","jobs":["보안","안내","주차","미화","시설","사무"],"step":"작업실시","category":"전기적 요인","accType":"감전","hazard":"통로에 깔린 이동 전선이 밟히거나 끌려 피복이 손상돼 감전될 위험","current":"누전차단기 경유","freq":1,"sev":3,"measure":"통로의 이동 전선은 전선 덮개(몰드)를 씌우거나 통행이 없는 곳으로 옮긴다. 피복이 손상된 전선은 바로 교체한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"COM-009","job":"공통","jobs":["보안","안내","주차","미화","시설","사무"],"step":"작업실시","category":"전기적 요인","accType":"화재·폭발","hazard":"멀티탭 과다 연결·문어발식 사용(휴게실 등)으로 허용 전류를 넘어 과열·화재가 날 위험","current":"접지, 차단기 경유 회로 구성","freq":2,"sev":2,"measure":"멀티탭 하나에 연결한 기기의 전류 합이 허용 전류(대부분 16A)를 넘지 않게 한다. 문어발식 연결을 금지하고 사용 후 플러그를 뽑는다. 차단기가 자주 떨어지면 사용 기기와 허용 전류를 점검한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"COM-010","job":"공통","jobs":["보안","안내","주차","미화","시설","사무"],"step":"작업실시","category":"작업특성 요인","accType":"화재·폭발","hazard":"비상 대응 훈련 미참여·누락으로 화재 시 초기 대응이 늦어질 위험","current":"비상 대응 훈련","freq":1,"sev":3,"measure":"화재 대비 비상 대응 훈련을 반기 1회 이상 실시하고 미참여자는 전달교육을 한다. 소화기·유도등·비상조명의 위치와 작동 상태를 근무자가 알게 하고, 유도등은 정전 시에도 일정 시간 켜지도록 관리한다.","freqAfter":1,"sevAfter":3,"origin":"라이브러리"},{"id":"COM-011","job":"공통","jobs":["보안","안내","주차","미화","시설","사무"],"step":"작업실시","category":"작업환경 요인","accType":"물체에 맞음","hazard":"휴게실 사물함 위에 올려 둔 물품·뜨거운 음료가 떨어져 맞거나 화상을 입을 위험","current":"주의 지도","freq":2,"sev":2,"measure":"사물함 등 높은 곳 위에 물품, 특히 뜨거운 음료를 올려 두지 않게 지도한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"COM-012","job":"공통","jobs":["보안","안내","주차","미화","시설","사무"],"step":"작업종료","category":"전기적 요인","accType":"화재·폭발","hazard":"퇴근·자리 비움 시 선풍기·전열기 전원을 끄지 않아 과열로 화재가 날 위험","current":"주의 지도","freq":2,"sev":2,"measure":"퇴근 등 오래 자리를 비울 때 선풍기·전열기 등의 전원을 끄고 꺼졌는지 확인하게 지도한다. 고객사가 허용하지 않은 전열기구는 쓰지 않는다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"SEC-001","job":"보안","jobs":["보안","주차"],"step":"작업실시","category":"전기적 요인","accType":"감전","hazard":"초소 내 누수·누전으로 전등·전기기구 사용 중 감전될 위험","current":"안전교육","freq":2,"sev":2,"measure":"초소 전기기구는 누전차단기와 접지를 경유해 쓰고, 누전차단기 시험 버튼을 월 1회 이상 눌러 작동을 확인한다. 누수 부위는 고객사(시설 관리)에 보수를 요청하고 보수 전까지 해당 콘센트를 쓰지 않는다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"SEC-002","job":"보안","jobs":["보안"],"step":"작업실시","category":"전기적 요인","accType":"감전","hazard":"내초(실내 초소)에서 쓰는 전기기구의 파손·접지 누락으로 감전되거나 전기 화재가 날 위험","current":"소화기 비치","freq":2,"sev":2,"measure":"내초 전기기구는 누전차단기를 경유하고 접지해 쓴다. 파손된 기구는 사용을 멈추고 교체한다. 소화기 작동 상태를 점검하고 근무자에게 사용법을 교육한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"SEC-003","job":"보안","jobs":["보안","안내","주차"],"step":"작업실시","category":"작업특성 요인","accType":"근골격계 질환","hazard":"장시간 같은 자세(착석·입식)로 근무해 요통 등 근골격계 질환이 생길 위험","current":"휴식 시간 부여, 순환 근무","freq":2,"sev":2,"measure":"근무 투입 전 건강 상태를 확인하고, 순환 근무와 휴식 시간 중 스트레칭을 하게 한다. 자세를 바꿀 수 있도록 의자·발받침 등을 갖춘다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"SEC-004","job":"보안","jobs":["보안"],"step":"작업실시","category":"기계적 요인","accType":"끼임","hazard":"보안검색대 컨베이어 작동 중 이물질을 꺼내다 손이 끼일 위험","current":"비상정지장치","freq":2,"sev":2,"measure":"이물질은 반드시 전원을 끈 뒤 꺼낸다. 근무자에게 비상정지장치 위치와 사용법을 교육한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리","cond":"보안검색대(컨베이어) 운영 사업장"},{"id":"SEC-005","job":"보안","jobs":["보안"],"step":"작업실시","category":"기계적 요인","accType":"끼임","hazard":"보안검색대 컨베이어 벨트와 드럼 사이에 손·옷자락이 말려 들어갈 위험","current":"비상정지장치","freq":2,"sev":2,"measure":"소매·넥타이 등이 말려 들지 않게 복장을 단정히 하도록 관리한다. 설비에 '끼임 주의' 안전보건표지를 붙인다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리","cond":"보안검색대(컨베이어) 운영 사업장"},{"id":"SEC-006","job":"보안","jobs":["보안","주차"],"step":"작업실시","category":"작업환경 요인","accType":"기타","hazard":"좁은 초소에서 장시간 근무해 직무 스트레스가 쌓일 위험","current":"관리감독자 지도","freq":2,"sev":2,"measure":"주기적으로 스트레칭과 환기를 하고 휴식 시간을 적절히 나눈다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"SEC-007","job":"보안","jobs":["보안"],"step":"작업실시","category":"작업특성 요인","accType":"근골격계 질환","hazard":"장시간 CCTV 모니터링으로 목·어깨 등 근골격계 질환이 생길 위험","current":"관리감독자 지도","freq":2,"sev":2,"measure":"모니터링 전·중·후 목·어깨 스트레칭을 하고, 모니터를 눈높이에 맞춘다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"SEC-008","job":"보안","jobs":["보안","주차"],"step":"작업실시","category":"작업환경 요인","accType":"넘어짐(미끄러짐·걸림 포함)","hazard":"야간 순찰 중 휴대용 조명을 쓰지 않아 장애물·돌출 구조물에 부딪히거나 걸려 넘어질 위험","current":"휴대용 조명 지급","freq":2,"sev":2,"measure":"순찰 전 휴대용 조명의 작동 상태와 배터리를 점검하고 순찰 중 반드시 켜고 다닌다. 주변을 살피며 이동한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"SEC-009","job":"보안","jobs":["보안"],"step":"작업실시","category":"기계적 요인","accType":"물체에 맞음","hazard":"과적 화물차를 확인하다 떨어지는 적재물에 맞을 위험","current":"","freq":2,"sev":2,"measure":"과적 차량은 가까이 붙지 말고 안전거리를 둔 채 확인한다. 적재가 불안정한 차량에는 접근하지 않도록 계속 교육한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리","cond":"화물차 출입 통제 사업장"},{"id":"SEC-010","job":"보안","jobs":["보안","주차"],"step":"작업실시","category":"화학적 요인","accType":"화학물질 누출·접촉","hazard":"차량 점검·출입 통제 중 배기가스·분진에 노출돼 건강 장해가 생길 위험","current":"마스크 지급","freq":2,"sev":2,"measure":"보호 마스크를 지급하고 차량 점검·장시간 체류 시 쓰게 한다. 착용 여부를 수시로 확인하고 교육한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"SEC-011","job":"보안","jobs":["보안"],"step":"작업실시","category":"작업특성 요인","accType":"넘어짐(미끄러짐·걸림 포함)","hazard":"순찰 중 계단에서 휴대폰 사용·뛰기 등 불안전 행동으로 넘어질 위험","current":"관리감독자 지도","freq":2,"sev":2,"measure":"계단에서는 휴대폰을 쓰지 않고 뛰지 않으며 안전 난간을 잡고 이동하도록 교육한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"SEC-012","job":"보안","jobs":["보안","주차"],"step":"작업실시","category":"작업환경 요인","accType":"넘어짐(미끄러짐·걸림 포함)","hazard":"야간 순찰 중 조명이 부족한 장소에서 넘어지거나 차량에 부딪힐 위험","current":"안전교육","freq":2,"sev":2,"measure":"조명·시야가 확보되지 않는 순찰 구간을 파악해 고객사(관계 부서)에 조명·반사경 설치를 요청한다. 개선 전까지 반사조끼와 휴대용 조명을 쓴다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"SEC-013","job":"보안","jobs":["보안"],"step":"작업실시","category":"기계적 요인","accType":"사업장 내 교통사고","hazard":"순찰 차량 운행 중 과속·전방 미주시로 교통사고가 날 위험","current":"안전교육, 안전띠 착용","freq":2,"sev":2,"measure":"순찰 차량은 과속하지 않고 전방을 주시하며 교통 법규를 지킨다. 안전띠를 맨다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리","cond":"차량 순찰 운영 사업장"},{"id":"SEC-014","job":"보안","jobs":["보안"],"step":"작업실시","category":"기계적 요인","accType":"물체에 맞음","hazard":"차량 순찰 중 화물차에 가까이 가다 떨어지는 화물에 맞을 위험","current":"안전거리 확보, 경광등 설치","freq":2,"sev":2,"measure":"화물차와 안전거리를 유지하고 전조등·경광등을 켜고 운행한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리","cond":"차량 순찰·화물차 출입 사업장"},{"id":"SEC-015","job":"보안","jobs":["보안"],"step":"작업실시","category":"작업환경 요인","accType":"사업장 내 교통사고","hazard":"차량 순찰 중 노면 낙하물(스크랩 등)로 미끄러지거나 부딪힐 위험","current":"안전교육","freq":2,"sev":2,"measure":"순찰 차량은 서행하며 전방을 주시한다. 노면 낙하물을 발견하면 관계 부서에 알려 치우게 한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리","cond":"공장·물류 사업장(차량 순찰)"},{"id":"SEC-016","job":"보안","jobs":["보안","주차"],"step":"작업실시","category":"기계적 요인","accType":"사업장 내 교통사고","hazard":"출차 차량이 정지·교통 신호를 무시하고 진행해 근무자와 부딪힐 위험","current":"관리감독자 지도","freq":2,"sev":2,"measure":"초소 근무자는 주변 차량 움직임을 계속 살피고 차량 진로 밖 안전한 위치에서 신호한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"SEC-017","job":"보안","jobs":["보안"],"step":"작업실시","category":"작업특성 요인","accType":"화재·폭발","hazard":"출입문을 소화기로 고여 두어 화재 시 소화기를 찾지 못하는 등 초기 대응이 어려워질 위험","current":"관리감독자 지도","freq":2,"sev":2,"measure":"출입문을 열어 둘 때 소화기를 고임목으로 쓰지 않고 전용 고임목(도어스토퍼)을 쓴다. 소화기는 정해진 위치에 둔다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"SEC-018","job":"보안","jobs":["보안"],"step":"작업실시","category":"작업환경 요인","accType":"끼임","hazard":"돌풍에 초소 출입문이 갑자기 닫혀 손이 끼일 위험","current":"출입문 고임목 사용","freq":2,"sev":2,"measure":"출입문을 열 때 전용 고임목으로 고정하고, 문틈에 손을 대지 않도록 주기적으로 교육한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"SEC-019","job":"보안","jobs":["보안"],"step":"작업실시","category":"기계적 요인","accType":"물체에 맞음","hazard":"화물 반출입 초소 근무 중 화물차에서 날아오는 적재물(스크랩 등)에 맞을 위험","current":"안전교육","freq":2,"sev":2,"measure":"해당 초소 근무자에게 안전모·보안경 등 보호구를 지급하고 쓰게 한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리","cond":"화물·스크랩 반출입 초소가 있는 사업장"},{"id":"SEC-020","job":"보안","jobs":["보안"],"step":"작업실시","category":"기계적 요인","accType":"물체에 맞음","hazard":"화물 반출입 차량을 통제하다 떨어지는 운반물에 맞을 위험","current":"안전교육","freq":2,"sev":2,"measure":"차량 통제 시 안전거리를 확보하고 식별조끼를 입는다. 차량이 완전히 멈춘 것을 확인한 뒤 다가간다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리","cond":"화물·스크랩 반출입 초소가 있는 사업장"},{"id":"SEC-021","job":"보안","jobs":["보안","주차"],"step":"작업실시","category":"작업환경 요인","accType":"기타","hazard":"환절기 기온 차로 감기 등 건강 이상이 생길 위험","current":"안전교육","freq":2,"sev":2,"measure":"근무 전 건강 상태를 확인하고, 외투를 지급해 필요할 때 입게 한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"SEC-022","job":"보안","jobs":["보안"],"step":"작업실시","category":"작업환경 요인","accType":"넘어짐(미끄러짐·걸림 포함)","hazard":"우천 시 초소 출입부의 젖은 그레이팅·철판에서 미끄러질 위험","current":"안전교육","freq":2,"sev":2,"measure":"그레이팅·철판에 미끄럼 방지 조치(테이프·매트 등)를 한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"SEC-023","job":"보안","jobs":["보안","주차"],"step":"작업실시","category":"기계적 요인","accType":"끼임","hazard":"차량 통제 중 안전거리를 확보하지 않아 차량 바퀴에 발등이 깔릴 위험","current":"안전화 착용","freq":2,"sev":2,"measure":"차량 통제 시 안전거리를 확보하고 안전화를 신는다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"SEC-024","job":"보안","jobs":["보안","주차"],"step":"작업실시","category":"작업환경 요인","accType":"온열질환","hazard":"폭염기 옥외(외초)·고온 초소 근무 중 열사병 등 온열질환이 생길 위험","current":"초소 냉난방기 설치","freq":3,"sev":2,"measure":"물·그늘·휴식 기본 수칙을 지킨다. 초소 냉방기 가동 상태와 근무 전 건강 상태를 확인하고 물을 충분히 마시게 한다. 체감온도 33℃ 이상이면 2시간마다 20분 이상 쉬게 하고, 35℃ 이상이면 무더위 시간대(14~17시) 옥외 근무를 줄이거나 조정한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"SEC-025","job":"보안","jobs":["보안"],"step":"작업실시","category":"작업환경 요인","accType":"폭력행위(고객·방문객 등)","hazard":"보안 업무 중 돌발 상황(폭언·폭행·난동)에 제대로 대응하지 못해 완력 등으로 다칠 위험","current":"상황별 대처 방법 교육","freq":2,"sev":2,"measure":"돌발 상황별 대응 시나리오를 만들어 숙지시키고, 위험하면 업무를 멈추고 대피·신고하도록 교육한다(작업중지권). 사고가 나면 피해를 줄일 수 있게 보고·지원 체계를 갖춘다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"SEC-026","job":"보안","jobs":["보안","주차"],"step":"작업실시","category":"기계적 요인","accType":"사업장 내 교통사고","hazard":"차량 검문 중 차량이 갑자기 출발해 부딪히거나 발이 깔릴 위험","current":"안전거리 유지","freq":1,"sev":3,"measure":"검문 시 차량 정면·바퀴 옆에 서지 않고 안전거리를 확보한다. 차량이 정차한 것을 확인한 뒤 다가간다.","freqAfter":1,"sevAfter":3,"origin":"라이브러리"},{"id":"SEC-027","job":"보안","jobs":["보안","주차"],"step":"작업실시","category":"기계적 요인","accType":"사업장 내 교통사고","hazard":"외초 근무 중 출입 통제 과정에서 진·출입 차량과 부딪힐 위험","current":"식별조끼 착용, 경고표지판 설치","freq":2,"sev":2,"measure":"식별조끼 등 눈에 잘 띄는 복장을 입고 안전지대에서 기다리다 차량이 정차한 뒤 다가간다. 경고표지판 상태를 유지한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"SEC-028","job":"보안","jobs":["보안"],"step":"작업실시","category":"전기적 요인","accType":"감전","hazard":"경광등 등 전기기구의 절연 피복이 닳아 누설 전류로 감전될 위험","current":"차단기 설치","freq":1,"sev":3,"measure":"부하별로 누전차단기를 경유해 쓰고 접지 상태를 점검한다. 피복이 닳은 기구는 교체한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"SEC-029","job":"보안","jobs":["보안","주차"],"step":"작업실시","category":"기계적 요인","accType":"사업장 내 교통사고","hazard":"장마철 노면 물 고임으로 차량 제동이 늦어져 근무자와 부딪힐 위험","current":"","freq":2,"sev":2,"measure":"포트홀 등 물 고임 장소의 평탄화 보수를 고객사에 요청하고, 차량 진·출입 시 안전거리를 유지한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"SEC-030","job":"보안","jobs":["보안"],"step":"작업실시","category":"작업환경 요인","accType":"넘어짐(미끄러짐·걸림 포함)","hazard":"우천 시 외초 주변 결로·물 고임 장소에서 미끄러져 넘어질 위험","current":"안전교육","freq":2,"sev":2,"measure":"물 고임 장소는 바닥 평탄화를 요청하고, 개선 전까지 미끄럼 방지 매트를 깔거나 우회 동선을 정한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"PRK-001","job":"주차","jobs":["주차","보안"],"step":"작업실시","category":"기계적 요인","accType":"사업장 내 교통사고","hazard":"좁은 공간에서 차량을 안내·유도하다 차량에 부딪힐 위험","current":"관리감독자 지도","freq":2,"sev":2,"measure":"차량 안내·유도는 차량 진로 밖의 안전한 위치에서 하고, 차량과 안전거리를 유지하도록 반복 교육한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"PRK-002","job":"주차","jobs":["주차","보안"],"step":"작업실시","category":"기계적 요인","accType":"사업장 내 교통사고","hazard":"행사 등으로 차량이 몰릴 때 안내·유도 중 차량에 부딪힐 위험","current":"관리감독자 지도","freq":2,"sev":2,"measure":"행사 전 근무자에게 유도 위치·신호 방법을 안전교육하고 안전한 위치에서 안내하게 한다. 필요하면 유도 인원을 늘리고 경광봉·반사조끼를 쓴다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"PRK-003","job":"주차","jobs":["주차","보안","미화"],"step":"작업실시","category":"기계적 요인","accType":"사업장 내 교통사고","hazard":"주차장 램프(경사로) 구간을 순찰·보행하다 진·출입 차량에 부딪힐 위험","current":"","freq":2,"sev":3,"measure":"램프 구간은 도보 순찰 구간에서 빼거나 차량 통행이 적은 시간에만 순찰한다. 반사경·경고등·보행자 주의 표지 설치를 고객사에 요청하고, 램프를 걸을 때는 반사조끼를 입고 벽 쪽으로 붙어 이동한다.","freqAfter":1,"sevAfter":3,"origin":"라이브러리"},{"id":"PRK-004","job":"주차","jobs":["주차","보안"],"step":"작업실시","category":"기계적 요인","accType":"사업장 내 교통사고","hazard":"주차장 출구 안전펜스·차량 방호시설이 파손·노후해 차량이 근무 위치로 들어올 위험","current":"","freq":1,"sev":3,"measure":"파손·노후 안전펜스는 튼튼한 재질로 교체하도록 고객사에 요청한다. 교체 전까지 근무 위치를 펜스 뒤 안전지대로 옮긴다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"PRK-005","job":"주차","jobs":["주차","보안"],"step":"작업실시","category":"기계적 요인","accType":"부딪힘","hazard":"주차 차단기(바)가 내려오며 머리·어깨에 부딪힐 위험","current":"","freq":2,"sev":2,"measure":"차단기 작동 범위 안에 서지 않는다. 수동 조작 시 차량이 지나가고 바가 완전히 내려간 것을 확인한 뒤 이동한다. 오작동은 바로 관리 주체에 수리를 요청한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"PRK-006","job":"주차","jobs":["주차","보안","미화"],"step":"작업실시","category":"화학적 요인","accType":"화학물질 누출·접촉","hazard":"지하주차장 장시간 근무 중 차량 배기가스(일산화탄소 등)에 노출될 위험","current":"환기설비 가동","freq":2,"sev":2,"measure":"지하주차장 환기설비 가동 상태를 확인하고, 정산소·근무 위치는 환기가 잘 되는 곳에 둔다. 교대·휴식으로 노출 시간을 줄이고, 두통·어지러움이 있으면 바로 환기된 곳으로 옮긴다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리","cond":"지하주차장이 있는 사업장"},{"id":"RCP-001","job":"안내","jobs":["안내","사무"],"step":"작업실시","category":"작업특성 요인","accType":"근골격계 질환","hazard":"안내데스크에서 장시간 서 있거나 하이힐을 신고 근무해 다리 혈액 순환 장애가 생길 위험","current":"스트레칭 지도","freq":2,"sev":2,"measure":"장시간 선 자세로 일하지 않게 의자·발받침을 갖추고 교대로 앉게 한다. 하이힐은 필요한 짧은 시간만 신도록 지도한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"RCP-002","job":"안내","jobs":["안내","보안","주차"],"step":"작업실시","category":"작업환경 요인","accType":"폭력행위(고객·방문객 등)","hazard":"방문객·고객의 폭언·폭행 등으로 고객응대 중 정신적 스트레스를 받거나 다칠 위험","current":"고객응대 매뉴얼 비치","freq":2,"sev":2,"measure":"폭언 등을 하지 말아 달라는 안내 문구를 게시하고 고객응대 매뉴얼을 교육한다. 폭언·폭행이 있으면 업무를 일시 중단·전환하고 관리자에게 보고하며, 휴게·상담 등 필요한 조치를 한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"RCP-003","job":"안내","jobs":["안내","사무"],"step":"작업실시","category":"작업특성 요인","accType":"불균형·무리한 동작","hazard":"택배·우편물 등 무거운 물품을 접수·운반하다 허리를 다칠 위험","current":"","freq":2,"sev":2,"measure":"무거운 물품은 대차를 쓰거나 2인이 함께 들고, 허리 대신 무릎을 굽혀 든다. 무거운 물품은 허리 높이 선반에 보관한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"OFF-001","job":"사무","jobs":["사무","안내"],"step":"작업실시","category":"작업특성 요인","accType":"넘어짐(미끄러짐·걸림 포함)","hazard":"계단에서 안전 난간을 잡지 않아 넘어질 위험","current":"안전 난간","freq":2,"sev":2,"measure":"계단에서는 안전 난간을 잡고 이동하도록 주기적으로 교육하고 '넘어짐 주의'·'계단 주의' 표지를 붙인다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"OFF-002","job":"사무","jobs":["사무","안내"],"step":"작업실시","category":"기계적 요인","accType":"끼임","hazard":"세단기 종이 걸림·이물을 전원을 끄지 않고 빼다 손·넥타이 등이 말려 들어갈 위험","current":"전원 스위치, 관리감독자 지도","freq":2,"sev":2,"measure":"종이가 걸리거나 이상이 있으면 반드시 전원을 끄고 플러그를 뺀 뒤 처리한다. 넥타이·긴 머리 등이 말려 들지 않게 복장을 단정히 하고, 세단기에 '걸림 시 전원 차단' 안내 표지를 붙인다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"OFF-003","job":"사무","jobs":["사무"],"step":"작업실시","category":"작업특성 요인","accType":"절단·베임·찔림","hazard":"서랍 속 날카로운 사무용품을 꺼내다 찔리거나 베일 위험","current":"주의 지도","freq":2,"sev":2,"measure":"끝이 날카로운 물품은 뚜껑을 씌워 보관하고, 꺼낼 때는 서랍을 끝까지 열어 눈으로 확인하게 지도한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"OFF-004","job":"사무","jobs":["사무","안내"],"step":"작업실시","category":"작업특성 요인","accType":"근골격계 질환","hazard":"전화 수화기를 어깨에 끼고 PC 작업을 함께 해 목·어깨 근골격계 질환이 생길 위험","current":"스트레칭 지도, 바른 작업 자세 유지","freq":2,"sev":2,"measure":"두 손을 쓰면서 통화해야 하면 헤드셋 등을 쓰게 한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"OFF-005","job":"사무","jobs":["사무","안내"],"step":"작업실시","category":"작업특성 요인","accType":"근골격계 질환","hazard":"키보드 뒤쪽 받침을 세워 써서 손목이 과도하게 꺾여 근골격계 질환이 생길 위험","current":"손목 마사지 지도","freq":2,"sev":2,"measure":"키보드 뒤쪽 받침은 세우지 않고, 앞쪽에 손목 받침대를 쓴다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"OFF-006","job":"사무","jobs":["사무","안내","보안"],"step":"작업실시","category":"작업특성 요인","accType":"근골격계 질환","hazard":"장시간 PC 입력 작업으로 결림 등 근골격계 질환이 생길 위험","current":"스트레칭 지도","freq":2,"sev":2,"measure":"오래 같은 자세로 일하지 않게 하고, 쉬는 시간에 손가락·손목·팔 스트레칭을 해 부담이 쌓이지 않게 지도한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"OFF-007","job":"사무","jobs":["사무"],"step":"작업실시","category":"작업특성 요인","accType":"절단·베임·찔림","hazard":"자와 칼로 자르는 작업 중 부주의로 베일 위험","current":"주의 지도","freq":2,"sev":2,"measure":"자의 경사면이 아닌 직각 면에 칼을 대게 하고, 직각 면이 철재로 보강된 자를 쓴다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"OFF-008","job":"사무","jobs":["사무","안내"],"step":"작업실시","category":"작업특성 요인","accType":"이상온도·물체 접촉(화상 등)","hazard":"코팅기 등 뜨거운 기기를 쓰다 화상을 입을 위험","current":"주의 지도","freq":2,"sev":2,"measure":"사용 전 기기 온도를 확인하고 사용 후 충분히 식힌 뒤 전원 코드를 뽑는다. 기기 주변에 '고온 주의' 표지를 붙인다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"OFF-009","job":"사무","jobs":["사무","안내"],"step":"작업실시","category":"작업특성 요인","accType":"이상온도·물체 접촉(화상 등)","hazard":"뜨거운 음료를 나르다 쏟아 화상을 입을 위험","current":"주의 지도","freq":2,"sev":2,"measure":"뜨거운 음료는 열이 잘 전달되지 않는 컵에 담고, 2잔 이상은 쟁반으로 나르며 전방을 주시하게 지도한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"FAC-001","job":"시설","jobs":["시설"],"step":"작업실시","category":"기계적 요인","accType":"떨어짐","hazard":"이동식 사다리 단독 작업 중 발을 헛디뎌 떨어질 위험","current":"안전교육","freq":2,"sev":2,"measure":"이동식 사다리 단독 작업을 금지하고(2인 1조) 넘어짐 방지 조치를 한 뒤 쓴다. 최상부 발판에서는 작업하지 않는다. 발판이 파손·변형·노후된 사다리는 폐기·교체한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"FAC-002","job":"시설","jobs":["시설"],"step":"작업실시","category":"전기적 요인","accType":"감전","hazard":"전기 작업 계획 없이 또는 안전 작업 공간을 확보하지 않고 전기를 다루다 감전될 위험","current":"안전교육, 절연 보호구 착용","freq":2,"sev":2,"measure":"전기 작업자에게 특별 안전교육을 하고 전기 작업 계획서를 작성·준수한다. 작업 전 전로를 차단하고 잠금·표지를 한 뒤 작업하며, 사전작업 허가(N3)를 받는다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리","cond":"전기 작업을 하는 사업장"},{"id":"FAC-003","job":"시설","jobs":["시설"],"step":"작업실시","category":"기계적 요인","accType":"끼임","hazard":"고소작업대를 점검하지 않고 써 비상시 끼일 위험","current":"안전대 착용","freq":2,"sev":2,"measure":"고소작업 전 방호장치 등을 점검하고 이상이 있으면 조치한 뒤 작업한다. 고객사(도급인)의 작업 허가 절차를 따른다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리","cond":"고소작업대를 쓰는 사업장"},{"id":"FAC-004","job":"시설","jobs":["시설"],"step":"작업실시","category":"기계적 요인","accType":"떨어짐","hazard":"평평하지 않은 곳에 사다리를 세워 작업하다 사다리가 넘어지며 떨어질 위험","current":"보호구 착용","freq":2,"sev":2,"measure":"사다리는 평평하고 단단한 바닥에 세우고 아웃트리거 등 넘어짐 방지 조치를 한 뒤 작업한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"FAC-005","job":"시설","jobs":["시설"],"step":"작업실시","category":"전기적 요인","accType":"감전","hazard":"충전부가 노출된 곳에서 사다리 작업 중 감전될 위험","current":"누전차단기 경유","freq":1,"sev":3,"measure":"감전 우려가 있는 곳은 작업 전 해당 전로를 차단하고 절차에 따라 작업한다. 사다리 대신 작업 발판을 쓰는 등 추락 방지 조치를 하고 절연 보호구를 착용한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"FAC-006","job":"시설","jobs":["시설"],"step":"작업실시","category":"작업특성 요인","accType":"불균형·무리한 동작","hazard":"보호구 등 지급 물품을 무리하게 들어 옮기다 근골격계 질환이 생길 위험","current":"안전교육","freq":2,"sev":2,"measure":"운반 보조 기구(대차)를 쓰고, 상자를 올리고 내릴 때는 2인 1조로 한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"FAC-007","job":"시설","jobs":["시설"],"step":"작업실시","category":"작업특성 요인","accType":"불균형·무리한 동작","hazard":"무거운 책상을 옮기다 요통 등 근골격계 질환이 생길 위험","current":"관리감독자 지도","freq":2,"sev":2,"measure":"무거운 책상은 2인 이상이 신호를 맞춰 함께 옮긴다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"FAC-008","job":"시설","jobs":["시설","사무","안내"],"step":"작업실시","category":"작업특성 요인","accType":"불균형·무리한 동작","hazard":"냉온수기 생수통을 교체하며 무거운 물통을 잘못된 자세로 들어 요통 등 근골격계 질환이 생길 위험","current":"스트레칭 지도","freq":2,"sev":2,"measure":"교체 전 허리 중심 스트레칭을 한다. 체격이 작은 근로자의 교체 작업을 제한하고 운반 기구를 쓴다. 물통 무게·무게중심 안내 표지를 붙인다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"FAC-009","job":"시설","jobs":["시설"],"step":"작업실시","category":"작업특성 요인","accType":"부딪힘","hazard":"대차를 끌며 이동하다 대차에 발뒤꿈치(아킬레스건)를 다칠 위험","current":"주의 지도","freq":2,"sev":2,"measure":"대차는 끌지 말고 밀어서 옮긴다. 출입문은 몸으로 밀어 연 채 끌고 지나가지 말고, 문을 고정한 뒤 이동한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"CLN-001","job":"미화","jobs":["미화"],"step":"작업실시","category":"작업환경 요인","accType":"넘어짐(미끄러짐·걸림 포함)","hazard":"젖은 바닥에서 작업자·보행자가 미끄러질 위험","current":"주의 표지판 설치","freq":2,"sev":2,"measure":"바닥 청소 시 '미끄럼 주의' 표지판을 세우고 작업 구역 통행을 막는다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"CLN-002","job":"미화","jobs":["미화"],"step":"작업실시","category":"작업환경 요인","accType":"넘어짐(미끄러짐·걸림 포함)","hazard":"통로에 쌓아 둔 물품에 걸려 넘어질 위험","current":"정리정돈 지도","freq":2,"sev":2,"measure":"통로의 장애물을 치우고 작업 후 정리정돈한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"CLN-003","job":"미화","jobs":["미화"],"step":"작업실시","category":"작업특성 요인","accType":"넘어짐(미끄러짐·걸림 포함)","hazard":"계단 이동 중 발을 헛디뎌 넘어질 위험","current":"안전 난간 설치","freq":2,"sev":2,"measure":"계단에서는 안전 난간을 잡고 이동하도록 교육한다. 청소 도구를 들고 계단을 오르내릴 때는 한 손을 비운다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"CLN-004","job":"미화","jobs":["미화"],"step":"작업실시","category":"작업특성 요인","accType":"근골격계 질환","hazard":"반복적인 빗자루질·걸레질로 근골격계 질환이 생길 위험","current":"안전교육","freq":2,"sev":2,"measure":"같은 작업을 오래 하지 않게 작업을 바꿔 가며 하고 스트레칭을 한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"CLN-005","job":"미화","jobs":["미화"],"step":"작업실시","category":"작업특성 요인","accType":"근골격계 질환","hazard":"오래 허리를 굽혀 작업해 요통이 생길 위험","current":"관리감독자 지도","freq":2,"sev":2,"measure":"작업 전 스트레칭을 하고 바른 작업 자세를 교육한다. 자루가 긴 청소 도구를 쓴다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"CLN-006","job":"미화","jobs":["미화"],"step":"작업실시","category":"작업특성 요인","accType":"절단·베임·찔림","hazard":"쓰레기 수거 중 날카로운 물체에 찔리거나 베일 위험","current":"보호장갑 지급","freq":2,"sev":2,"measure":"폐기물 수거 시 베임방지 장갑을 끼고 내용물을 확인한 뒤 수거한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"CLN-007","job":"미화","jobs":["미화"],"step":"작업실시","category":"생물학적 요인","accType":"기타","hazard":"쓰레기봉투가 터져 오염물에 노출될 위험","current":"보호구 지급","freq":2,"sev":2,"measure":"폐기물 봉투 상태를 확인한 뒤 옮기고, 보호장갑을 낀다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"CLN-008","job":"미화","jobs":["미화"],"step":"작업실시","category":"작업특성 요인","accType":"불균형·무리한 동작","hazard":"무거운 쓰레기를 옮기다 허리를 다칠 위험","current":"안전교육","freq":2,"sev":2,"measure":"무거운 쓰레기는 대차로 옮기거나 2인이 함께 옮긴다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"CLN-009","job":"미화","jobs":["미화"],"step":"작업실시","category":"기계적 요인","accType":"끼임","hazard":"대차 이동 중 발이 끼이거나 발등을 부딪힐 위험","current":"관리감독자 지도, 안전화 지급","freq":2,"sev":2,"measure":"대차는 끌지 말고 밀어서 이동하고, 작업 중 안전화를 신는다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"CLN-010","job":"미화","jobs":["미화"],"step":"작업실시","category":"화학적 요인","accType":"화학물질 누출·접촉","hazard":"화학 세제 사용 중 피부 자극·화학물질 노출 위험","current":"보호장갑 지급","freq":2,"sev":2,"measure":"세제 사용 시 보호장갑을 끼고 환기한다. 락스와 산성 세제를 섞지 않는다(유해가스 발생). 사용 전 MSDS를 확인한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"CLN-011","job":"미화","jobs":["미화"],"step":"작업실시","category":"작업환경 요인","accType":"넘어짐(미끄러짐·걸림 포함)","hazard":"화장실 바닥 물기로 미끄러질 위험","current":"주의 표지판 설치","freq":2,"sev":2,"measure":"청소 중에는 출입을 막고 물기를 바로 닦는다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"CLN-012","job":"미화","jobs":["미화"],"step":"작업실시","category":"화학적 요인","accType":"화학물질 누출·접촉","hazard":"환기가 잘 안 되는 좁은 공간(창고·화장실 등) 청소 중 악취·세제 가스에 노출될 위험","current":"환기","freq":2,"sev":2,"measure":"청소 전·중 충분히 환기한다. 정화조·집수정·맨홀 등 법정 밀폐공간에는 들어가지 않으며, 작업이 필요하면 사전작업 허가(N3)를 받고 산소·유해가스 농도 측정과 감시인 배치 후 작업한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"CLN-013","job":"미화","jobs":["미화"],"step":"작업실시","category":"기계적 요인","accType":"절단·베임·찔림","hazard":"유리창 청소 중 유리가 깨져 베일 위험","current":"보호장갑 지급","freq":2,"sev":2,"measure":"작업 전 유리 상태(금·파손)를 확인하고 베임방지 장갑을 낀다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"CLN-014","job":"미화","jobs":["미화"],"step":"작업실시","category":"기계적 요인","accType":"떨어짐","hazard":"사다리 작업 중 균형을 잃거나 사다리가 넘어져 떨어질 위험","current":"안전교육, 관리감독자 지도","freq":2,"sev":2,"measure":"사다리는 넘어짐 방지 조치를 하고 2인 1조로 작업한다. 최상부 발판에서는 작업하지 않는다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"CLN-015","job":"미화","jobs":["미화"],"step":"작업실시","category":"전기적 요인","accType":"감전","hazard":"전기 청소기 사용 중 누전으로 감전될 위험","current":"누전차단기 설치","freq":1,"sev":3,"measure":"청소기 사용 전 전선·플러그 상태를 점검하고 손상된 것은 쓰지 않는다.","freqAfter":1,"sevAfter":3,"origin":"라이브러리"},{"id":"CLN-016","job":"미화","jobs":["미화"],"step":"작업실시","category":"작업환경 요인","accType":"넘어짐(미끄러짐·걸림 포함)","hazard":"청소 장비 전선에 걸려 넘어질 위험","current":"정리정돈 지도","freq":2,"sev":2,"measure":"전선을 정리한 뒤 작업한다.","freqAfter":1,"sevAfter":2,"origin":"라이브러리"},{"id":"CLN-017","job":"미
