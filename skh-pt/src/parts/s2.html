<!-- s2: 목차. 이 파일만 편집. 스타일은 #s2 로 범위를 한정 -->
<style>
/* 격자: 카드 5개 + 묶음 안 간격 20 + 묶음 사이 간격 64(화살표 자리)
   높이 = 묶음 머리 40 + 간격 28 + 카드 464 = 532 → 본문 세로 가운데보다 살짝 위 */
#s2 .s2-grid { position: absolute; left: 0; right: 0; top: calc(50% - 300px); height: 532px; display: grid;
  grid-template-columns: 1fr 20px 1fr 64px 1fr 20px 1fr 64px 1fr; grid-template-rows: 40px 464px; row-gap: 28px; }

/* 묶음 머리: 문제 / 해결 / 의미 */
#s2 .gh { display: flex; align-items: center; gap: 16px; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; color: var(--navy); white-space: nowrap; }
#s2 .gh::after { content: ""; flex: 1; height: 2px; border-radius: 1px; background: var(--navy); }
#s2 .gh.c1 { grid-column: 1 / 4; } #s2 .gh.c2 { grid-column: 5 / 8; } #s2 .gh.c3 { grid-column: 9 / 10; }
#s2 .go { grid-row: 1; display: grid; place-items: center; }
#s2 .go.a1 { grid-column: 4; } #s2 .go.a2 { grid-column: 8; }
#s2 .go svg { width: 28px; height: 28px; }

/* 장 카드: 위(번호·장 이름) + 아래 띠(이 장이 답하는 질문) */
#s2 .ch { grid-row: 2; display: flex; flex-direction: column; border-radius: var(--radius); background: var(--surface); }
#s2 .ch.k1 { grid-column: 1; } #s2 .ch.k2 { grid-column: 3; } #s2 .ch.k3 { grid-column: 5; } #s2 .ch.k4 { grid-column: 7; } #s2 .ch.k5 { grid-column: 9; }
#s2 .ch .hd2 { flex: 1; display: flex; flex-direction: column; padding: 44px 28px 32px 32px; }
#s2 .ch .top { display: flex; align-items: flex-start; justify-content: space-between; }
#s2 .ch .n { font-size: 64px; font-weight: 800; line-height: 1; letter-spacing: -0.03em; color: var(--navy); font-variant-numeric: tabular-nums; }
#s2 .ch .top svg { width: 40px; height: 40px; }
#s2 .ch .ic { fill: none; stroke: var(--navy-2); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#s2 .ch .bar { margin-top: 32px; width: 32px; height: 3px; border-radius: 2px; background: var(--navy); }
#s2 .ch .t { margin-top: 24px; font-size: 30px; font-weight: 800; line-height: 1.32; letter-spacing: -0.035em; color: var(--navy); }
#s2 .ch .q { flex: none; height: 144px; padding: 32px 28px 0 32px; border-radius: 0 0 var(--radius) var(--radius); background: var(--navy-tint); }
#s2 .ch .q p { font-size: 22px; font-weight: 600; line-height: 1.45; letter-spacing: -0.02em; color: var(--ink-2); }

/* 의미(05): 네이비 카드 = 발표의 도착점 */
#s2 .ch.k5 { background: var(--navy); }
#s2 .ch.k5 .n, #s2 .ch.k5 .t { color: #fff; }
#s2 .ch.k5 .bar { background: #9FB0C8; }
#s2 .ch.k5 .ic { stroke: #9FB0C8; }
#s2 .ch.k5 .q { background: #213D63; }
#s2 .ch.k5 .q p { color: #E3E9F2; }
</style>

  <p class="gh c2">해결</p>
