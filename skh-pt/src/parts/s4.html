<!-- s4: 이 파일만 편집. 스타일은 #s4 로 범위를 한정 -->
<style>
/* 세로 배치: 흐름 패널 0–408 · 연결선 · 문제 카드 468–619 · 핵심 메시지 652–744 */
#s4 .s4-flow { position: absolute; left: 0; top: 0; width: 1728px; height: 408px; }
#s4 .s4-panel { position: absolute; top: 0; width: 640px; height: 408px; background: var(--surface); border-radius: var(--radius); }
#s4 .s4-panel.in { left: 0; }
#s4 .s4-panel.out { left: 1088px; }
#s4 .s4-pt { position: absolute; left: 32px; top: 32px; font-size: var(--fs-h3); font-weight: 800; letter-spacing: -0.035em; color: var(--navy); line-height: 1.2; }

/* 도면 묶음 (패널 안쪽 여백 32에 맞춤) */
#s4 .s4-stack { position: absolute; top: 92px; width: 256px; height: 256px; }
#s4 .s4-sheet { position: absolute; width: 216px; height: 216px; background: var(--paper); border: 1.5px solid var(--line-2); border-radius: 6px; overflow: hidden; box-shadow: 0 6px 16px rgba(16, 42, 76, .10); }
#s4 .s4-sheet img { width: 100%; height: 100%; object-fit: cover; }
#s4 .s4-sheet.b3 { left: 40px; top: 0; }
#s4 .s4-sheet.b2 { left: 20px; top: 20px; }
#s4 .s4-sheet.b1 { left: 0; top: 40px; }
#s4 .s4-sl { position: absolute; top: 364px; width: 256px; text-align: center; font-size: 19px; font-weight: 700; color: var(--ink-2); line-height: 1; white-space: nowrap; }

/* 결과 BIM */
#s4 .s4-fig { position: absolute; left: 96px; top: 92px; width: 448px; height: 256px; box-shadow: 0 6px 16px rgba(16, 42, 76, .10); border-color: var(--line-2); }
#s4 .s4-fig img { width: 100%; height: 100%; object-fit: contain; }
#s4 .s4-cap { position: absolute; left: 0; right: 0; top: 364px; text-align: center; font-size: 19px; font-weight: 700; color: var(--ink-2); line-height: 1; }

/* 가운데: 사람이 직접 모델링 */
#s4 .s4-mid { position: absolute; left: 704px; top: 0; width: 320px; height: 408px; }
#s4 .s4-mid svg { position: absolute; left: 0; top: 0; }
#s4 .s4-hand { position: absolute; left: 88px; top: 136px; width: 144px; height: 144px; border-radius: 50%; background: var(--navy); }
#s4 .s4-mt { position: absolute; left: 0; right: 0; top: 300px; text-align: center; font-size: 23px; font-weight: 800; letter-spacing: -0.035em; color: var(--navy); line-height: 1.4; }
#s4 .s4-arrow { position: absolute; top: 0; }

/* 연결선 + 문제 카드 (열 544 × 3, 간격 48 → 카드 중심 272 · 864 · 1456) */
#s4 .s4-links { position: absolute; left: 0; top: 0; }
#s4 .s4-cards { position: absolute; left: 0; top: 468px; width: 1728px; display: grid; grid-template-columns: repeat(3, 544px); column-gap: 48px; }
#s4 .s4-card { position: relative; background: var(--paper); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 32px; box-shadow: 0 2px 6px rgba(16, 42, 76, .04); }
#s4 .s4-ch { display: flex; align-items: center; gap: 14px; }
#s4 .s4-ch h3 { font-size: var(--fs-h3); font-weight: 800; letter-spacing: -0.035em; color: var(--navy); line-height: 1.3; }
#s4 .s4-ch svg { margin-left: auto; flex: none; }
#s4 .s4-card p { margin-top: 14px; font-size: var(--fs-body); font-weight: 500; line-height: 1.5; color: var(--ink-2); letter-spacing: -0.025em; }

#s4 .s4-key { position: absolute; left: 0; right: 0; top: 652px; }
</style>
