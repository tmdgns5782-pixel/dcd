<!-- landscape 2: 이 파일만 편집. 스타일은 #p2 로 범위를 한정 -->
<style>
#p2 .p2 { display: flex; flex-direction: column; height: calc(100% - 12px); }

/* 정체성 한 줄 */
#p2 .p2-id { display: flex; align-items: center; gap: 18px; height: 34px; font-size: var(--fs-small); font-weight: 600; color: var(--ink-2); letter-spacing: -0.02em; }
#p2 .p2-id .p2-tag { display: flex; align-items: center; gap: 12px; font-size: var(--fs-eyebrow); font-weight: 700; color: var(--sky-2); letter-spacing: 0.04em; }
#p2 .p2-id .p2-tag::after { content: ""; width: 28px; height: 2px; background: var(--line-2); }
#p2 .p2-id em { color: var(--hec-blue); font-weight: 800; background: var(--tint-blue); padding: 1px 4px 2px 6px; margin: 0 -4px 0 -2px; border-radius: 8px; }

/* 등식: [우리] + [기술] */
#p2 .p2-eq { flex: 1; min-height: 0; margin-top: 18px; display: grid; grid-template-columns: 1fr 112px 1fr; }
#p2 .p2-panel { position: relative; display: flex; flex-direction: column; padding: 24px 30px 20px; border: 2px solid var(--line); border-radius: var(--radius); background: var(--paper); }
#p2 .p2-hd { display: flex; align-items: center; gap: 18px; height: 56px; }
#p2 .p2-word { font-size: 52px; font-weight: 800; line-height: 1; letter-spacing: -0.04em; }
#p2 .p2-word.g { color: var(--hec-green); }
#p2 .p2-word.b { color: var(--hec-blue); }
#p2 .p2-def { font-size: var(--fs-h3); font-weight: 700; color: var(--navy); letter-spacing: -0.03em; }
#p2 .p2-mini { display: flex; align-items: center; }
#p2 .p2-mini i { width: 10px; height: 10px; border-radius: 50%; display: block; }
#p2 .p2-mini b { width: 22px; height: 2px; display: block; background: var(--line-2); }

#p2 .p2-dia { position: relative; width: 744px; height: 352px; margin: auto 0 0; }
#p2 .p2-svg { position: absolute; left: 0; top: 0; }
#p2 .p2-n { position: absolute; transform: translate(-50%, -50%); }
#p2 .p2-dia .chip { justify-content: center; }
#p2 .p2-dia .chip .dot { width: 10px; height: 10px; }

#p2 .p2-orbit { fill: none; stroke: var(--line-2); stroke-width: 2; stroke-dasharray: 1 9; stroke-linecap: round; }
#p2 .p2-halo.g { fill: var(--tint-green); }
#p2 .p2-halo.y { fill: var(--tint-yellow); }
#p2 .p2-jd { stroke: #fff; stroke-width: 3; }
#p2 .p2-jd.g { fill: var(--hec-green); }
#p2 .p2-jd.b { fill: var(--hec-blue); }
#p2 .p2-jd.y { fill: var(--hec-yellow); }
#p2 .p2-flowln path, #p2 .p2-flowln line, #p2 .p2-convln path, #p2 .p2-convln line { fill: none; stroke-width: 3; stroke-linecap: round; }

#p2 .p2-goal { width: 168px; height: 168px; text-align: center; align-content: center; }
#p2 .p2-goal small, #p2 .p2-field small { display: block; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
#p2 .p2-goal small { color: var(--hec-green); }
#p2 .p2-field small { color: var(--ink-3); }
#p2 .p2-goal strong, #p2 .p2-field strong { display: block; margin-top: 4px; font-size: 30px; font-weight: 800; line-height: 1.15; color: var(--navy); letter-spacing: -0.04em; }
#p2 .p2-field { width: 168px; height: 168px; text-align: center; align-content: center; }
#p2 .p2-tchip { width: 144px; }
#p2 .p2-ochip { width: 144px; }

/* 연산자 */
#p2 .p2-op { display: flex; justify-content: center; align-items: flex-start; padding-top: 244px; }
#p2 .p2-op .ring { width: 80px; height: 80px; }
#p2 .p2-op svg, #p2 .p2-eqop svg { display: block; }

/* 합류 → = → KEY */
#p2 .p2-conv { position: relative; height: 96px; flex: none; }
#p2 .p2-eqop { position: absolute; left: 864px; top: 44px; width: 64px; height: 64px; transform: translate(-50%, -50%); }
#p2 .key { flex: none; }
#p2 .key .key-label { font-size: var(--fs-small); letter-spacing: 0.01em; }
#p2 .p2-hd .eyebrow { margin-left: auto; }
#p2 .p2-hd .eyebrow.g { color: var(--hec-green); }
#p2 .p2-hd .eyebrow.b { color: var(--hec-blue); }
</style>

        <span class="p2-n chip people" style="left:86.7px;top:141.2px"><i class="dot people"></i>협력업체</span>
        <div class="p2-n ring p2-goal" style="left:372px;top:190px"><small>하나의 목표</small><strong>프로젝트<br>완수</strong></div>
